l_russian
 LPR_capture_SBU: "Захват здания СБУ"
 LPR_capture_sbu: "Точка невозврата пройдена. Толпа у ворот больше не собирается просто скандировать лозунги, пришло время действовать. Захват здания СБУ и оружейных комнат внутри него превратит стихийный протест в организованное сопротивление. В наших руках окажутся не только автоматы, но и списки личного состава, оперативные архивы и карты. С этого момента мы больше не митингующие. Мы сила, с которой придется считаться."
 LPR_create_coordination_center: "Создание Координационного центра"
 LPR_create_coordination_center_desc: "Стихийный протест выполнил свою задачу, но теперь нам нужна структура. Без единого управления и связи наши отряды останутся просто разрозненными группами бандитов. Нам жизненно необходим штаб, который возьмет на себя логистику, распределение трофейного оружия и наладит связь между баррикадами. Только объединив усилия под единым началом, мы сможем выстоять в грядущем столкновении."
 LPR_distribute_weapons: "Вооружить ополчение"
 LPR_distribute_weapons: "Из за надвигающей угрозы со стороны Украины, мы вынуждены отложить жесткие подготовки в армию, и играть в ассиметричную войну на успех и истерзание нашего врага. Мы вооружим ополчение которое будет защищать свою родину в Луганске,Алчевске и в других городах будущей Луганской Народной Республики."
 LPR_set_checkpoints: "Организация блокпостов"
 LPR_set_checkpoints_desc: "Киевская хунта уже стягивает войска и натравливает на нас свои карательные батальоны. Мы не дадим им застать нас врасплох и зайти в наши города. На всех ключевых дорогах, перекрестках и въездах в регион должны вырасти бетонные блоки, мешки с песком и противотанковые ежи. Каждый рубеж станет для украинских карателей непреодолимой преградой. С этого дня ни одна вражеская колонна не пройдет по нашей земле безнаказанно."
 LPR_peoples_druzhina: "Формирование Народной дружины"
 LPR_peoples_druzhina_desc: "Пока наши бойцы держат фронт на блокпостах, украинские спецслужбы и засланные диверсанты пытаются взорвать наш тыл изнутри. Киевские агенты и сочувствующие хунте радикалы надеются посеять панику в наших городах, но мы этого не допустим. Народная дружина берет под жесткий контроль улицы, стратегические объекты и инфраструктуру. Отныне любой шпион, провокатор или пособник киевского режима будет немедленно выявлен и обезврежен. В нашем тылу врагу пощады не будет."
 LPR_luhansk_castle: "Луганский замок"
 LPR_luhansk_castle_desc: "Наш главный укрепрайон готов к большой войне. Мы превратили бывшую цитадель СБУ и прилегающие кварталы в неприступный бастион, о который разобьется любое наступление противника. Каждое здание здесь станет огневой точкой, каждая улица — смертельной ловушкой для украинских карателей. Наши бойцы знают, что отстуза каждый метр родной земли. Пусть киевские генералы умоются кровью, пытаясь штурмовать наши позиции."
 LPR_vehicle_confiscation: "Конфискация транспорта для нужд фронта"
 LPR_vehicle_confiscation_desc: "Для победы, нам нужна высокая мобильность, а армейских грузовиков катастрофически не хватает. У нас нет времени ждать поставок, поэтому мы заберем транспорт у всех, кто пытается отсидеться в стороне или сбежать на подконтрольную Киеву территорию. Все тяжелые грузовики, внедорожники и автобусы местных предприятий отныне переходят в распоряжение ополчения. Мы наварим на них броню, установим пулеметы и бросим в бой. Сейчас все должно служить фронту."
 LPR_act_on_sovereignty: "Провозглашение Акта о суверенитете"
 LPR_act_on_sovereignty_desc: "Терпению нашего народа пришел конец. Мы больше не намерены подчиняться преступным приказам киевской хунты, которая захватила власть в ходе вооруженного переворота и развязала террор против собственных граждан. Провозглашая Акт о суверенитете, мы навсегда разрываем любые связи с неонацистским режимом в Киеве. Отныне на нашей земле законными являются только решения народной власти. Мы берем свою судьбу в собственные руки, мы готовы с оружием в руках защищать нашу свободу от любых посягательств."
 LPR_resource_mobilization: "Мобилизация ресурсов"
 LPR_resource_mobilization_desc: "Сейчас фронту нужно все и немедленно, мы должны брать под жесткий контроль все имеющиеся запасы оружия,снаряжения,бронетехники. Местные заводы и ремонтные мастерские должны работать круглые сутки, собирая самодельные броневики и восстанавливая поврежденное оружие. Нам противостоит регулярная украинская армия, превосходящая нас в снабжении, поэтому каждый добытый грамм сырья и каждая рабочая смена должны приближать нашу победу. Все для фронта, все для обороны."
 LPR_republic_of_bolotov: "Республика Болотова"
 LPR_republic_of_bolotov_desc: "В условиях войны и хаоса коллегиальное управление ведет к гибели. Нам нужна единая воля и твердая рука, способная сплотить регион и дать отпор киевским войскам. Валерий Болотов берет на себя всю полноту власти и ответственность за судьбу республики. Любые попытки оспорить приказы руководства, саботаж или политиканство внутри нашего движения будут расцениваться как предательство и жестко пресекаться. Только строгая дисциплина, централизация и беспрекословное подчинение лидеру позволят нам выстоять и построить сильное государство."
 LPR_Introduction_of_a_state_emergency: "Введение чрезвычайного положения"
 LPR_Introduction_of_a_state_emergency_desc: "Война пришла на порог наших домов, и законы мирного времени больше не действуют. Мы объявляем режим чрезвычайного положения на всей территории республики. На улицах вводится жесткий комендантский час, стратегические объекты берутся под круглосуточную охрану, а любые митинги и забастовки оказываются под запретом. Киевский режим надеется раскачать ситуацию в нашем тылу с помощью своих диверсантов и паникеров, но мы ответим на это железным порядком. Каждый, кто нарушит новые правила, будет немедленно задержан по законам военного времени."
 LPR_preparing_for_may_11: "Подготовка к Референдуму"
 LPR_preparing_for_may_11_desc: "В ближайшие дни и недели наш народ должен сделать свой главный исторический выбор. Украинские войска и радикалы уже стягиваются к нашим границам, угрожая залить города кровью за одну лишь попытку проголосовать. Нам нужно проделать колоссальную работу в кратчайшие сроки: напечатать бюллетени, организовать избирательные участки и, главное, обеспечить их надежную вооруженную охрану. Каждый активист на счету, каждый блокпост усилен. Мы дадим людям высказать свою волю, чего бы нам это ни стоило."
 LPR_full_mobilization: "Объявление полной мобилизации"
 LPR_full_mobilization_desc: "Киевский режим бросил против нас всю свою военную машину: авиацию, артиллерию и тяжелую бронетехнику. Полумерами эту войну не выиграть, под угрозой само существование нашей республики. Мы объявляем полную мобилизацию всех сил и ресурсов. В строй должны встать все, кто способен держать в руках автомат — шахтеры, рабочие, вчерашние студенты. Мы забираем последние резервы ради одной цели. Отсидеться в стороне не удастся никому, ведь если украинские каратели прорвут фронт, они не пощадят никого. Наша единственная альтернатива победе — это тотальное уничтожение."
 LPR_negotiations_with_mozgovoy: "Переговоры с Мозговым"
 LPR_negotiations_with_mozgovoy_desc: "На севере республики, в Северодонецке и Лисичанске, поднялось мощное восстание под руководством Алексея Мозгового. Его отряды сильны и преданы своему командиру, но действуют обособленно от Луганска. В условиях, когда украинские войска пытаются зажать нас в клещи, такое разделение сил смертельно опасно. Нам необходимо сесть за стол переговоров и убедить Мозгового войти в единую структуру управления. Северодонецкая республика должна стать неотъемлемой частью ЛНР. Только объединив наши ресурсы и фронты, мы сможем сдержать натиск общего врага."
 LPR_peoples_court_of_novorossiya: "Учреждение Народного суда Новороссии"
 LPR_peoples_court_of_novorossiya_desc: "В условиях тотальной войны старая судейская система мертва, а либеральное крючкотворство ведет лишь к хаосу и безнаказанности. Враг стоит у ворот, в тылу орудуют украинские наводчики, а мародеры и насильники подрывают веру людей в нашу правду. Пришло время народной справедливости. Мы вводим военно-полевые суды, где приговоры будут выноситься быстро и открыто перед лицом граждан. За измену, шпионаж в пользу Киева и тяжкие преступления против мирных жителей отныне предусмотрена только одна мера — смертная казнь через расстрел. Страх перед народным трибуналом должен выжечь любую заразу в нашем тылу."
 LPR_referendum: "Проведение всенародного референдума"
 LPR_referendum_desc: "Этот день настал, вопреки всем угрозам киевской хунты и грохоту артиллерии на наших рубежах. Жители Луганщины выстроились в огромные очереди к избирательным участкам, чтобы раз и навсегда определить свою судьбу. Никакие карательные операции Киева, ни паника, раздуваемая украинскими СМИ, не смогли сломить волю нашего народа. Голосуя за независимость, мы официально подводим черту под прошлым. С этого момента Луганская Народная Республика — суверенное государство, и мы защитим этот выбор любой ценой."