l_russian:
 LPR_capture_SBU: "Захват здания СБУ"
 LPR_capture_sbu_desc: "Точка невозврата пройдена. Толпа у ворот больше не собирается просто скандировать лозунги — пришло время действовать. Захват здания СБУ и находящихся внутри оружейных комнат превратит стихийный протест в организованное сопротивление. В наших руках окажутся не только автоматы, но и списки личного состава, оперативные архивы и карты. С этого момента мы больше не просто протестующие. Мы — сила, с которой придётся считаться."
 LPR_capture_SBU_desc: "Точка невозврата пройдена. Толпа у ворот больше не собирается просто скандировать лозунги, пришло время действовать. Захват здания СБУ и оружейных комнат внутри него превратит стихийный протест в организованное сопротивление. В наших руках окажутся не только автоматы, но и списки личного состава, оперативные архивы и карты. С этого момента мы больше не митингующие. Мы сила, с которой придется считаться."
 LPR_create_coordination_center: "Создание Координационного центра"
 LPR_create_coordination_center_desc: "Стихийный протест выполнил свою задачу, но теперь нам нужна структура. Без единого управления и связи наши отряды останутся просто разрозненными группами бандитов. Нам жизненно необходим штаб, который возьмет на себя логистику, распределение трофейного оружия и наладит связь между баррикадами. Только объединив усилия под единым началом, мы сможем выстоять в грядущем столкновении."
 LPR_distribute_weapons: "Вооружить ополчение"
 LPR_distribute_weapons_desc: "Из-за надвигающейся угрозы со стороны Украины мы вынуждены отказаться от жёсткой армейской подготовки и перейти к асимметричной войне на истощение противника. Мы вооружим ополчение, которое будет защищать свою родину в Луганске, Алчевске и других городах будущей Луганской Народной Республики."
 LPR_set_checkpoints: "Организация блокпостов"
 LPR_set_checkpoints_desc: "Киевская хунта уже стягивает войска и натравливает на нас свои карательные батальоны. Мы не дадим им застать нас врасплох и зайти в наши города. На всех ключевых дорогах, перекрестках и въездах в регион должны вырасти бетонные блоки, мешки с песком и противотанковые ежи. Каждый рубеж станет для украинских карателей непреодолимой преградой. С этого дня ни одна вражеская колонна не пройдет по нашей земле безнаказанно."
 LPR_peoples_druzhina: "Формирование Народной дружины"
 LPR_peoples_druzhina_desc: "Пока наши бойцы держат фронт на блокпостах, украинские спецслужбы и засланные диверсанты пытаются взорвать наш тыл изнутри. Киевские агенты и сочувствующие хунте радикалы надеются посеять панику в наших городах, но мы этого не допустим. Народная дружина берет под жесткий контроль улицы, стратегические объекты и инфраструктуру. Отныне любой шпион, провокатор или пособник киевского режима будет немедленно выявлен и обезврежен. В нашем тылу врагу пощады не будет."
 LPR_luhansk_castle: "Луганский замок"
 LPR_luhansk_castle_desc: "Наш главный укрепрайон готов к большой войне. Мы превратили бывшую цитадель СБУ и прилегающие кварталы в неприступный бастион, о который разобьется любое наступление противника. Каждое здание здесь станет огневой точкой, каждая улица — смертельной ловушкой для украинских карателей. Наши бойцы знают, что отстоят каждый метр родной земли. Пусть киевские генералы умоются кровью, пытаясь штурмовать наши позиции."
 LPR_vehicle_confiscation: "Конфискация транспорта для нужд фронта"
 LPR_vehicle_confiscation_desc: "Для победы, нам нужна высокая мобильность, а армейских грузовиков катастрофически не хватает. У нас нет времени ждать поставок, поэтому мы заберем транспорт у всех, кто пытается отсидеться в стороне или сбежать на подконтрольную Киеву территорию. Все тяжелые грузовики, внедорожники и автобусы местных предприятий отныне переходят в распоряжение ополчения. Мы наварим на них броню, установим пулеметы и бросим в бой. Сейчас все должно служить фронту."
 LPR_act_on_sovereignty: "Провозглашение Акта о суверенитете"
 LPR_act_on_sovereignty_desc: "Терпению нашего народа пришел конец. Мы больше не намерены подчиняться преступным приказам киевской хунты, которая захватила власть в ходе вооруженного переворота и развязала террор против собственных граждан. Провозглашая Акт о суверенитете, мы навсегда разрываем любые связи с неонацистским режимом в Киеве. Отныне на нашей земле законными являются только решения народной власти. Мы берем свою судьбу в собственные руки, мы готовы с оружием в руках защищать нашу свободу от любых посягательств."
 LPR_resource_mobilization: "Мобилизация ресурсов"
 LPR_resource_mobilization_desc: "Сейчас фронту нужно все и немедленно, мы должны брать под жесткий контроль все имеющиеся запасы оружия, снаряжения и бронетехники. Местные заводы и ремонтные мастерские должны работать круглые сутки, собирая самодельные броневики и восстанавливая поврежденное оружие. Нам противостоит регулярная украинская армия, превосходящая нас в снабжении, поэтому каждый добытый грамм сырья и каждая рабочая смена должны приближать нашу победу. Все для фронта, все для обороны."
 LPR_republic_of_bolotov: "Республика Болотова"
 LPR_republic_of_bolotov_desc: "В условиях войны и хаоса коллегиальное управление ведет к гибели. Нам нужна единая воля и твердая рука, способная сплотить регион и дать отпор киевским войскам. Валерий Болотов берет на себя всю полноту власти и ответственность за судьбу республики. Любые попытки оспорить приказы руководства, саботаж или политиканство внутри нашего движения будут расцениваться как предательство и жестко пресекаться. Только строгая дисциплина, централизация и беспрекословное подчинение лидеру позволят нам выстоять и построить сильное государство."
 LPR_Introduction_of_a_state_emergency: "Введение чрезвычайного положения"
 LPR_Introduction_of_a_state_emergency_desc: "Война пришла на порог наших домов, и законы мирного времени больше не действуют. Мы объявляем режим чрезвычайного положения на всей территории республики. На улицах вводится жесткий комендантский час, стратегические объекты берутся под круглосуточную охрану, а любые митинги и забастовки оказываются под запретом. Киевский режим надеется раскачать ситуацию в нашем тылу с помощью своих диверсантов и паникеров, но мы ответим на это железным порядком. Каждый, кто нарушит новые правила, будет немедленно задержан по законам военного времени."
 LPR_preparing_for_may_11: "Подготовка к Референдуму"
 LPR_preparing_for_may_11_desc: "В ближайшие дни и недели наш народ должен сделать свой главный исторический выбор. Украинские войска и радикалы уже стягиваются к нашим границам, угрожая залить города кровью за одну лишь попытку проголосовать. Нам нужно проделать колоссальную работу в кратчайшие сроки: напечатать бюллетени, организовать избирательные участки и, главное, обеспечить их надежную вооруженную охрану. Каждый активист на счету, каждый блокпост усилен. Мы дадим людям высказать свою волю, чего бы нам это ни стоило."
 LPR_full_mobilization: "Объявление полной мобилизации"
 LPR_full_mobilization_desc: "Киевский режим бросил против нас всю свою военную машину: авиацию, артиллерию и тяжелую бронетехнику. Полумерами эту войну не выиграть, под угрозой само существование нашей республики. Мы объявляем полную мобилизацию всех сил и ресурсов. В строй должны встать все, кто способен держать в руках автомат — шахтеры, рабочие, вчерашние студенты. Мы забираем последние резервы ради одной цели. Отсидеться в стороне не удастся никому, ведь если украинские каратели прорвут фронт, они не пощадят никого. Наша единственная альтернатива победе — это тотальное уничтожение."
 LPR_negotiations_with_mozgovoy: "Переговоры с Мозговым"
 LPR_negotiations_with_mozgovoy_desc: "На севере республики, в Северодонецке и Лисичанске, поднялось мощное восстание под руководством Алексея Мозгового. Его отряды сильны и преданы своему командиру, но действуют обособленно от Луганска. В условиях, когда украинские войска пытаются зажать нас в клещи, такое разделение сил смертельно опасно. Нам необходимо сесть за стол переговоров и убедить Мозгового войти в единую структуру управления. Северодонецкая республика должна стать неотъемлемой частью ЛНР. Только объединив наши ресурсы и фронты, мы сможем сдержать натиск общего врага."
 LPR_peoples_court_of_novorossiya: "Учреждение Народного суда Новороссии"
 LPR_peoples_court_of_novorossiya_desc: "В условиях тотальной войны старая судейская система мертва, а либеральное крючкотворство ведет лишь к хаосу и безнаказанности. Враг стоит у ворот, в тылу орудуют украинские наводчики, а мародеры и насильники подрывают веру людей в нашу правду. Пришло время народной справедливости. Мы вводим военно-полевые суды, где приговоры будут выноситься быстро и открыто перед лицом граждан. За измену, шпионаж в пользу Киева и тяжкие преступления против мирных жителей отныне предусмотрена только одна мера — смертная казнь через расстрел. Страх перед народным трибуналом должен выжечь любую заразу в нашем тылу."
 LPR_referendum: "Проведение всенародного референдума"
 LPR_referendum_desc: "Этот день настал, вопреки всем угрозам киевской хунты и грохоту артиллерии на наших рубежах. Жители Луганщины выстроились в огромные очереди к избирательным участкам, чтобы раз и навсегда определить свою судьбу. Никакие карательные операции Киева, ни паника, раздуваемая украинскими СМИ, не смогли сломить волю нашего народа. Голосуя за независимость, мы официально подводим черту под прошлым. С этого момента Луганская Народная Республика — суверенное государство, и мы защитим этот выбор любой ценой."
 LPR_experts_from_russia_in_government: "Российские советники в правительстве"
 LPR_experts_from_russia_in_government_desc: "Для выстраивания эффективной государственной системы и преодоления управленческого кризиса нам необходим опыт старших братьев. Привлечение российских специалистов позволит наладить работу министерств и стабилизировать внутреннюю ситуацию в республике в условиях военного времени."
 LPR_seek_recognition: "Курс на международное признание"
 LPR_seek_recognition_desc: "Провозглашение независимости должно быть подкреплено дипломатическими шагами. Мы обязаны заявить о себе на мировой арене, начать активные переговоры с потенциальными союзниками и добиваться признания суверенитета ЛНР ради обеспечения безопасности наших граждан."
 LPR_strengthen_mobilization: "Усиление мобилизационных мер"
 LPR_strengthen_mobilization_desc: "Натиск со стороны вооруженных сил Украины усиливается, и полумер больше недостаточно. Мы должны упорядочить призыв, централизовать распределение ресурсов и призвать под знамена республики всех, кто способен держать оружие, чтобы сдержать наступление противника."
 LPR_republic_of_plotnicky: "Республика Плотницкого"
 LPR_republic_of_plotnicky_desc: "Период двоевластия и стихийного сопротивления подошел к концу. Возглавляемая Игорем Плотницким вертикаль власти призвана навести жесткий порядок, объединить разрозненные силы и направить республику по пути централизации и дисциплины."
 LPR_elections_2014: "Всеобщие выборы 2014 года"
 LPR_elections_2014_desc: "Народ Луганщины должен сам определить свою судьбу. Проведение легитимных выборов главы и Народного Совета продемонстрирует всему миру наше стремление к демократическому самоопределению и окончательно сформирует законные органы власти."
 LPR_disarm_illegal_formations: "Разоружение незаконных формирований"
 LPR_disarm_illegal_formations_desc: "Настало время навести внутренний порядок. Все военизированные отряды, не желающие подчиняться единому командованию и присягать республике, должны сложить оружие. В тылу не может быть места анархии и самоволию, оружие должно служить только защите ЛНР."
 LPR_fight_with_traitors: "Борьба с предателями и диверсантами"
 LPR_fight_with_traitors_desc: "Украинские спецслужбы и их пособники пытаются подорвать республику изнутри. Мы усилим работу органов государственной безопасности, чтобы выявить шпионов, ликвидировать диверсионные группы в тылу и пресечь любые попытки саботажа."
 LPR_The_situation_has_stabilized: "Обстановка стабилизировалась"
 LPR_The_situation_has_stabilized_desc: "Благодаря стойкости наших бойцов и слаженным действиям командования, фронт удалось удержать. Первый и самый опасный этап кризиса позади — теперь мы можем немного перевести дух и закрепить достигнутые успехи."
 LPR_start_solving_the_republics_problems: "Решение внутренних проблем республики"
 LPR_start_solving_the_republics_problems_desc: "Военная угроза частично отступила, и настало время заняться тылом. Нам необходимо восстановить разрушенную инфраструктуру, наладить снабжение городов, запустить социальные выплаты и вернуть мирную жизнь в освобожденные районы Луганщины."
 LPR_social_tension: "Социальное напряжение"
 LPR_social_tension_desc: "Война и экономическая блокада со стороны Киева подорвали привычный уклад жизни. Рост цен, нехватка продуктов и общая неопределенность создают опасную почву для внутренних волнений. Мы должны немедленно отреагировать, чтобы не допустить взрыва в обществе."
 LPR_provide_assistance_to_those_in_need: "Помощь нуждающимся"
 LPR_provide_assistance_to_those_in_need_desc: "В условиях гуманитарного кризиса республика берет на себя заботу о гражданах. Организация раздачи бесплатных обедов, распределение гуманитарных грузов и обеспечение базовыми медикаментами помогут людям пережить самое тяжелое время."
 LPR_Support_for_vulnerable_populations: "Поддержка незащищенных слоев населения"
 LPR_Support_for_vulnerable_populations_desc: "Многодетные семьи, инвалиды и одинокие старики оказались в наиболее уязвимом положении. Государство обязано предоставить им адресную материальную и социальную помощь, защитив их от тягот военного времени."
 LPR_start_paying_pensions: "Начало выплаты пенсий"
 LPR_start_paying_pensions_desc: "Украина полностью прекратила выполнение своих социальных обязательств перед нашими пенсионерами. Вопреки блокаде, мы начинаем самостоятельные регулярные выплаты пенсий, чтобы обеспечить пожилым людям заслуженную и стабильную поддержку."
 LPR_establishing_new_workplaces: "Создание новых рабочих мест"
 LPR_establishing_new_workplaces_desc: "Из-за остановки многих предприятий тысячи людей остались без средств к существованию. Запуск программ общественных работ, восстановление инфраструктуры и поддержка малого бизнеса позволят вернуть людей на рабочие места и оживить экономику."
 LPR_psychological_rehabilitation: "Психологическая реабилитация"
 LPR_psychological_rehabilitation_desc: "Постоянные обстрелы и ужасы войны оставили глубокий след в душах мирных жителей и ополченцев. Открытие центров психологической помощи и реабилитации поможет людям справиться с посттравматическим синдромом и вернуться к мирной жизни."
 LPR_info_war_and_propa_ganda: "Информационная война и пропаганда"
 LPR_info_war_and_propa_ganda_desc: "Противник ведет против нас агрессивную кампанию по дезинформации, пытаясь сломить наш дух. Мы должны развернуть мощный ответный информационный фронт, чтобы доносить правду о событиях на Донбассе и поддерживать высокий моральный дух граждан."
 LPR_creating_own_media: "Создание собственных СМИ"
 LPR_creating_own_media_desc: "Для эффективного противодействия лжи нам необходимы независимые каналы коммуникации. Запуск республиканских газет, радиостанций и телеканалов позволит формировать собственную повестку и оперативно информировать население."
 LPR_disconnect_from_ukrainian_media: "Отключение украинских СМИ"
 LPR_disconnect_from_ukrainian_media_desc: "Вещание украинских телеканалов и радиостанций на территории республики нацелено на сеяние паники и вражды. Прекращение трансляции этих ресурсов обезопасит наше информационное пространство от деструктивного влияния."
 LPR_public_engagement: "Взаимодействие с общественностью"
 LPR_public_engagement_desc: "Власть должна быть открыта для народа. Проведение регулярных встреч с гражданами, создание общественных движений и привлечение активистов к управлению республикой укрепят доверие к государственным институтам."
 LPR_invite_international_reporters: "Приглашение иностранных журналистов"
 LPR_invite_international_reporters_desc: "Мировые медиа часто транслируют лишь одну точку зрения. Приглашая независимых иностранных репортеров и военкоров, мы даем им возможность лично увидеть последствия обстрелов наших городов и рассказать правду всему миру."
 LPR_humanitarian_catastrophe: "Гуманитарная катастрофа"
 LPR_humanitarian_catastrophe_desc: "Боевые действия поставили регион на грань выживания. Разрушенные дома, отсутствие медикаментов и дефицит базовых продуктов питания требуют от нас экстренных действий. Мы обязаны мобилизовать все ресурсы, чтобы спасти жизни наших граждан."
 LPR_humanitarian_aid: "Гуманитарная помощь"
 LPR_humanitarian_aid_desc: "Для предотвращения массового голода и эпидемий республика разворачивает сеть пунктов выдачи продовольствия и товаров первой необходимости. Организованный сбор и распределение помощи станут нашей главной задачей на ближайшее время."
 LPR_fair_aid_distribution: "Справедливое распределение помощи"
 LPR_fair_aid_distribution_desc: "Каждый нуждающийся должен получить поддержку, а любые попытки наживы на чужом горе будут жестко пресекаться. Мы создадим строгую систему контроля и учета, чтобы гуманитарные грузы доходили непосредственно до простых людей."
 LPR_engaging_international_aid: "Привлечение международной помощи"
 LPR_engaging_international_aid_desc: "Масштаб кризиса требует поддержки извне. Мы готовы сотрудничать с любыми международными организациями и фондами, которые искренне хотят помочь мирному населению Донбасса и облегчить последствия блокады."
 LPR_accept_aid_from_private_funds: "Прием помощи от частных фондов"
 LPR_accept_aid_from_private_funds_desc: "Многие неравнодушные меценаты и общественные организации предлагают свою поддержку. Нам следует наладить официальные каналы для работы с частными благотворителями, готовыми поставлять медикаменты и одежду."
 LPR_restoration_of_social_infrastructure: "Восстановление социальной инфраструктуры"
 LPR_restoration_of_social_infrastructure_desc: "Обстрелы нанесли огромный ущерб общественным объектам. Нам необходимо оперативно отремонтировать поврежденные больницы, школы и детские сады, чтобы вернуть городам базовые условия для нормальной жизни."
 LPR_supplying_social_facilities: "Снабжение социальных объектов"
 LPR_supplying_social_facilities_desc: "Мало просто восстановить стены, нужно обеспечить полноценную работу учреждений. Мы организуем первоочередную доставку угля, генераторов, медикаментов и учебных материалов в школы и больницы."
 LPR_shattered_electric_power: "Разрушенная энергетика"
 LPR_shattered_electric_power_desc: "Удары по критической инфраструктуре оставили без света целые районы. Полное обесточивание грозит остановкой водоканалов и предприятий, поэтому восстановление энергосистемы становится вопросом выживания республики."
 LPR_start_restoring_power_supply: "Начало восстановления энергоснабжения"
 LPR_start_restoring_power_supply_desc: "Наши ремонтные бригады готовы приступить к работе в сложнейших фронтовых условиях. Мы начнем поэтапный ремонт поврежденных подстанций и линий электропередач, чтобы вернуть свет в дома граждан."
 LPR_restore_lugansk_tec: "Восстановление Луганской ТЭС"
 LPR_restore_lugansk_tec_desc: "Луганская теплоэлектростанция является ключевым узлом всей энергосистемы региона. Несмотря на близость к линии соприкосновения, мы должны приложить все усилия для ремонта ее мощностей и стабилизации подачи электричества."
 LPR_convert_lugansk_thermal_power_plant_to_gas: "Перевод Луганской ТЭС на газ"
 LPR_convert_lugansk_thermal_power_plant_to_gas_desc: "Из-за угольной блокады и проблем с логистикой нам нужен альтернативный источник топлива. Модернизация и перевод оборудования ТЭС на использование природного газа обеспечат независимость и стабильность генерации."
 LPR_connect_to_shchastynska_tec: "Подключение к Счастьинской ТЭС"
 LPR_connect_to_shchastynska_tec_desc: "Для интеграции оставшихся мощностей и создания резервных путей снабжения нам необходимо восстановить узлы распределения, связывающие нас со станцией в Счастье, и наладить переток энергии."
 LPR_energy_independence_from_ukr: "Энергетическая независимость от Украины"
 LPR_energy_independence_from_ukr_desc: "Киев регулярно использует рубильник как инструмент политического давления. Наш единственный верный путь заключается в полном переподключении сетей и достижении абсолютной энергетической независимости от украинской стороны."
 LPR_restoring_other_tec: "Восстановление остальных ТЭЦ"
 LPR_restoring_other_tec_desc: "Помимо крупных узлов, в республике есть и локальные теплоэлектроцентрали. Ремонт малых станций позволит распределить нагрузку и гарантированно обеспечить теплом и светом даже удаленные районы."
 LPR_economic_collapse: "Экономический коллапс"
 LPR_economic_collapse_desc: "Разрыв производственных цепочек, закрытие шахт и финансовая блокада со стороны Киева поставили экономику Донбасса на грань полной остановки. Без срочного государственного вмешательства республика рискует остаться без средств к существованию."
 LPR_restore_trade_links: "Восстановление торговых связей"
 LPR_restore_trade_links_desc: "Прежние рынки сбыта заблокированы, поэтому нам необходимо срочно переориентировать торговлю. Налаживание прямых экономических контактов с российскими регионами позволит спасти наши предприятия от изоляции."
 LPR_financial_system_issue: "Проблема финансовой системы"
 LPR_financial_system_issue_desc: "Отключение украинских банков оставило республику без безналичного расчета и возможности нормально проводить платежи. Отсутствие собственной валютной и кассовой системы парализует оборот капитала."
 LPR_creating_a_banking_system: "Создание банковской системы"
 LPR_creating_a_banking_system_desc: "Нам необходим собственный финансовый инструмент. Учреждение Государственного банка ЛНР позволит упорядочить сбор налогов, начать выдачу зарплат в тылу и обеспечить стабильный оборот наличных средств."
 LPR_reviving_idle_factories: "Оживление простаивающих заводов"
 LPR_reviving_idle_factories_desc: "Крупная промышленность Луганщины не должна превратиться в металлолом. Государство берет под контроль временно заброшенные и простаивающие заводы, чтобы подготовить их к перезапуску под новым руководством."
 LPR_restore_supply_chains: "Восстановление цепочек поставок"
 LPR_restore_supply_chains_desc: "Заводам необходимы сырье и комплектующие, которые раньше шли из других областей. Мы перестроим логистику внутри подконтрольных территорий и найдем новых поставщиков, чтобы восстановить производственный цикл."
 LPR_get_enterprises_back_online: "Возвращение предприятий к работе"
 LPR_get_enterprises_back_online_desc: "Первые цеха готовы к запуску. Возврат рабочих на заводы и начало выпуска готовой продукции докажут, что промышленный потенциал Донбасса невозможно сломить никакой блокадой."
 LPR_agricultural_development: "Развитие сельского хозяйства"
 LPR_agricultural_development_desc: "Продовольственная безопасность республики зависит от наших полей. Поддержка местных фермеров, обеспечение их топливом для посевной и организация централизованных закупок зерна спасут города от дефицита еды."
