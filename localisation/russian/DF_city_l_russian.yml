l_russian:

city.201.t: "Народная милиция взяла [307.GetName]"
city.201.d: "В ходе боёв за [307.GetName], решающими оказались высоты и переправы через Северский Донец. Украинские части ещё держат отдельные кварталы и старые промышленные площадки."
city.201.ukr: "Лисичанские высоты ещё могут сменить хозяина."
city.201.rus: "Западный берег открыт."
city.201.world: "Бои уходят от Северского Донца."

city.202.t: "Российские войска вошли в [307.GetName]"
city.202.d: "Российские войска вошли в [307.GetName]. В результати ударов артиллерии и самолетов по переправам, складам и маршрутам отхода оборона ВСУ была сломлена. Старый промышленный район, содовый завод и подъёмы над рекой несколько дней оставались последними точками сопротивления но после их потери украинским подразделениям пришлось отходить западнее, не дожидаясь окружения."
city.202.ukr: "Отойти — не значит забыть."
city.202.rus: "Высоты над рекой взяты."
city.202.world: "Украина теряет крупный рубеж."

city.203.t: "Украина вернулась на высоты [307.GetName]а"
city.203.d: "Здесь основные бои велись за высоты вокруг [307.GetName]а, их потеря делала дальнейшую оборону города тяжёлой и бессмысленной. На западном берегу Северского Донца снова появляются украинские наблюдательные пункты."
city.203.ukr: "Мы снова на высотах."
city.203.rus: "Берег удержать не удалось."
city.203.world: "Украина снова видит Северский Донец с высоты."

city.204.t: "Повстанцы вошли в [304.GetName]"
city.204.d: "Повстанцы вошли в [304.GetName] через кварталы у химических предприятий. Район завода Азот стал местом, где продвижение шло особенно медленно: бетонные корпуса, подвалы, трубы и железнодорожные ветки мешали быстро зачистить территорию. Украинские подразделения отходили группами, прикрывая тех, кто ещё оставался в промзоне."
city.204.ukr: "Северодонецк ещё долго будут вспоминать."
city.204.rus: "Северодонецк наш."
city.204.world: "Северодонецк потерял прежнюю роль."

city.205.t: "Российские части взяли [304.GetName]"
city.205.d: "С 2014 года [304.GetName] фактически заменял Луганск для украинской администрации области. Но неудачное расположение города сделало его удобной целью для российских войск. ВСУ удалося закрепиться на заводе «Азот», который подвергся интенсивным обстрелам. На его территории также укрывались около 500 мирных жителей, включая 40 детей. Чтобы избежать окружения, украинские войска отступили, подорвав оставшиеся мосты на пути отхода."
city.205.ukr: "Северодонецк ещё не вычеркнут."
city.205.rus: "Один из центров Луганщины взят."
city.205.world: "После 2014 года это звучит особенно громко."

city.206.t: "[304.GetName] снова под контролем Украины"
city.206.d: "Украинские подразделения вернулись в город [304.GetName] через районы, где раньше шли самые тяжёлые бои. Сначала проверяли подвалы и заводские корпуса, затем — административные здания и мостовые подходы. Для Украины это возвращение места, которое несколько лет было политическим центром подконтрольной части Луганщины."
city.206.ukr: "Наш флаг снова над администрацией."
city.206.rus: "Луганское направление просело."
city.206.world: "Украина возвращает своё."

city.207.t: "Боевики закрепились в [370.GetName]е"
city.207.d: "Местные сепаратисты закрепились в городе [370.GetName]. Здесь всё крутится вокруг металлургии, поэтому бои быстро перешли к металлургическим заводам. Несколько украинских групп вышли заранее, остальные оставили позиции уже после потери железнодорожных подходов."
city.207.ukr: "Заводы будут работать против нас."
city.207.rus: "Заводы будут работать на нас."
city.207.world: "Металлургический Донбасс снова в сводках."

city.208.t: "Российские войска вошли в [370.GetName]"
city.208.d: "В город [370.GetName] вошли российские части. Ценность этого места в связке между Луганском, Северодонецком и Горловкой а также металлургических заводах. Металлургический комбинат сразу начали осматривать группы инженеров как ценный трофей."
city.208.ukr: "Алчевск не исчезает с карты войны."
city.208.rus: "Тыл стал плотнее."
city.208.world: "Заводские города снова решают больше, чем столицы."

city.209.t: "Украинская армия отбила [370.GetName]"
city.209.d: "ВСУ вошли в город [370.GetName]. Несколько складов были брошены почти целыми. Возвращение этого района бьёт по связке между промышленными городами Луганщины."
city.209.ukr: "Алчевск снова наш."
city.209.rus: "Заводской тыл порвался."
city.209.world: "Украина заходит глубже в старый промышленный пояс."

city.210.t: "Ополченцы захватили [347.GetName]"
city.210.d: "Ополченцы вошли в город [347.GetName] после долгих боёв за частный сектор и кварталы на западе. Несколько улиц меняли руки по два-три раза, а артиллерия разбила район вокруг старых дорог к соляным шахтам и Часову Яру. К моменту входа штурмовых групп центр уже мало напоминал довоенный город."
city.210.ukr: "[347.GetName] держался долго."
city.210.rus: "Ура! Ура! Ура!"
city.210.world: "[347.GetName] стал отдельной главой войны."

city.211.t: "Российские войска взяли [347.GetName]"
city.211.d: "После месяцев штурмов, артиллерии и боёв российские войска вмести с подразделениями ЧВК «Вагнер» заняли город [347.GetName]. Вскоре после сообщения о захвате города в [347.GetName] прибыл Евгений Пригожин, он сделал ряд заявлений на фоне флагов России, ЧВК «Вагнер» и руин города. До войны город вспоминали из-за завода игристых вин и соляных шахт поблизости, теперь — как §Rад§!."
city.211.ukr: "[347.GetName] не является стратегически важным объектом."
city.211.rus: "Музыканты на месте."
city.211.world: "Взяли руины, не Берлин."

city.212.t: "[347.GetName] снова украинский"
city.212.d: "Украинские войска вернули город [347.GetName]. Для обороняющихся это потеря трофея, ради которого было потрачено слишком много сил."
city.212.ukr: "[347.GetName] снова под нашим флагом."
city.212.rus: "Главный трофей ушёл."
city.212.world: "Руины снова сменили сторону."

city.213.t: "Украина потеряла [359.GetName]"
city.213.d: "Украина потеряла [359.GetName]. После потери нескольких выездов украинским подразделениям пришлось уходить а технику уводить обходными маршрутами."
city.213.ukr: "Константиновка прикрывала больше, чем казалось."
city.213.rus: "До Краматорска стало ближе."
city.213.world: "Малозаметный город внезапно стал важным."

city.214.t: "[359.GetName] в руках РФ"
city.214.d: "СМИ сообщают о взятии силами ВС РФ [359.GetName]. Сразу после захвата города ВС РФ начали разворачивать технику у выездов на соседние направления. Для украинской стороны главной проблемой стали не сам город, а потеря удобного пересечения маршрутов. Резервы теперь приходится вести длиннее, а это значит больше времени под ударами."
city.214.ukr: "Новая линия будет западнее."
city.214.rus: "Маршрут на Краматорск открыт."
city.214.world: "На Донбасса снова спорят за дороги."

city.215.t: "Над [359.GetName] снова украинский флаг"
city.215.d: "ВСУ вернули [359.GetName] и быстро заняли вокзал, выезды и несколько кварталов у главных трасс. Для Украины это возвращение места, через которое можно снова связывать соседние участки фронта."
city.215.ukr: "Вокзал снова работает на нас."
city.215.rus: "Продвижение к Краматорску сорвалось."
city.215.world: "Точка на карте для европейца."

city.216.t: "Народная милиция захватила [398.GetName]"
city.216.d: "Народная милиция захватила [398.GetName]. Шахтные посёлки, металлургические площадки и дороги к Горловке сделали оборону плотной, но неравномерной: в одних районах ВСУ быстро потерпели поражение, в других сражались днями без снабжения."
city.216.ukr: "Шахтёры в неволе."
city.216.rus: "Шахтёры освобождены."
city.216.world: "Почему нельзя жить мирно."

city.217.t: "Украина отступает из [398.GetName]"
city.217.d: "Неожиданные новости: ВСУ без боя отступают из [398.GetName]."
city.217.ukr: "Где наши войска?"
city.217.rus: "Где ВСУ?"
city.217.world: "Без ВСУ?"

city.218.t: "Украинские части вернули [398.GetName]"
city.218.d: "Украинские войска вернули город [398.GetName]. Под их контроль снова переходят шахтные районы, заводские подъезды и дороги, которыми пользовались российские части между Донецком и Горловкой. В нескольких местах нашли брошенные боеприпасы и недостроенные укрепления."
city.218.ukr: "Шахтные районы снова наши."
city.218.rus: "Ой-ой."
city.218.world: "Украина возвращается."

city.219.t: "Ополченцы взяли [318.GetName]"
city.219.d: "Ополченцы вошли в город [318.GetName]. Теперь тревога в сторону Краматорска и ожидание, где остановится следующая линия."
city.219.ukr: "Эх, Славянск."
city.219.rus: "Слава Гиркину."
city.219.world: "Символ 2014."

city.220.t: "Российские войска заняли [318.GetName]"
city.220.d: "Сегодня, в утренней сводке ВС РФ, было сообщено о взятии [318.GetName]а. Место, с которого в 2014 году всё началось теперь, как и другие города Донбасса, лежит в руинах. Украинские части отходят к соседним рубежам, стараясь не потерять связь между Краматорском и Дружковкой."
city.220.ukr: "Мы уже возвращали Славянск."
city.220.rus: "Возвращение к началу состоялось."
city.220.world: "Город 2014 года снова в центре новостей."

city.221.t: "[318.GetName] снова под контролем Украины"
city.221.d: "Украинские войска освободили город [318.GetName]. Первые подразделения вошли через въезды, где ещё недавно стояли блокпосты, а затем начали зачистку административных зданий и дорог к Краматорску."
city.221.ukr: "Славянск снова доказал своё."
city.221.rus: "Славянск уже переживал это."
city.221.world: "Интересно."

city.222.t: "Сепаратисты вошли в [327.GetName]"
city.222.d: "Сепаратисты вошли в [327.GetName]. Машиностроительные предприятия, железнодорожный узел и административные здания сделали его одной из главных целей на севере Донецкой области. Теперь боевикам нужно не только удержать кварталы, но и прикрыть длинные подъезды, по которым пойдут топливо, боеприпасы и подккрепления."
city.222.ukr: "[327.GetName] был сердцем этого участка."
city.222.rus: "Административный центр взят."
city.222.world: "Север Донецкой области теряет штаб."

city.223.t: "ВС РФ захватили [327.GetName]"
city.223.d: "Российские войска заняли город [327.GetName]. После 2014 года здесь держалась украинская администрация северной части Донецкой области: штабы, службы, вокзал, предприятия и склады. При отходе часть документов и оборудования успели вывезти, но сам факт потери такого центра сразу ударил по управлению всего Донбасса"
city.223.ukr: "Краматорск ещё не последняя точка."
city.223.rus: "Крупнейшая цель на севере взята."
city.223.world: "Краматорск важен."

city.224.t: "Украина вернула [327.GetName]"
city.224.d: "Украина вернула [327.GetName]. Вместе с ним Украина получает назад вокзал, административный центр и площадку, откуда можно держать север Донецкой области."
city.224.ukr: "Северный Донбасс снова держится."
city.224.rus: "Удержать область стало труднее."
city.224.world: "Краматорск возвращается под украинский флаг."

city.225.t: "Сепаратисты заняли [381.GetName]"
city.225.d: "Местные формирования заняли [381.GetName]. Шахты, заводские районы и химическое предприятие Стирол делают его неудобным для быстрого штурма: слишком много промышленных заборов, дворов и подъездов. После входа новых сил северный край донецкой агломерации стал для республик спокойнее, хотя зачистка отдельных районов продолжалась ещё несколько дней."
city.225.ukr: "Горловка слишком близко к Донецку."
city.225.rus: "Северный щит удержан."
city.225.world: "Горловская промзона снова в деле."

city.226.t: "Падение [381.GetName]"
city.226.d: "Поступают сообщения о потери украинской стороной города [381.GetName]. В штабе его ценят за шахтные посёлки, дороги к Донецку и возможность держать северный край агломерации. Плотная застройка помогает обороне, но требует большого гарнизона: без которых кварталы быстро превращаются в проходные дворы для диверсионных групп."
city.226.ukr: "Мы теряем Донбасс."
city.226.rus: "Мы освобом Донбасс."
city.226.world: "Донбасс в огне."

city.227.t: "Украинская армия вошла в [381.GetName]"
city.227.d: "Украинские войска вернули город [381.GetName]. Вместе с ним под контроль ВСУ переходят шахтные посёлки, промзоны и дороги, которые раньше прикрывали север Донецка."
city.227.ukr: "Донецк ближе."
city.227.rus: "Ни шагу назад."
city.227.world: "Украина пробивает промышленное кольцо."

city.228.t: "Ополченцы захватили [526.GetName]"
city.228.d: "Крупнейший город на Азовском море [526.GetName] переходит под контроль самопровозглашенной республики. Порт, металлургические предприятия и широкие проспекты быстро превратились в отдельные участки обороны. Новые силы получили выход к Азовскому морю, но вместе с ним — разрушенную инфраструктуру, которую ещё придётся восстанавливать."
city.228.ukr: "Азов ещё не потерян."
city.228.rus: "Нацисты прогнаны."
city.228.world: "Мариуполь в огне."

city.229.t: "Россия сумела взять [526.GetName]"
city.229.d: "После долгой осады Российские войска установили контроль над городом [526.GetName]. Бои шли за порт, жилые районы, комбинат имени Ильича и Азовсталь. Когда ресурсы защитников закончились, дальнейшая оборона стала невозможной и обороняющимся пришлось сдаться. В ходе боев 90% города было уничтожено, а число погибших мирных жителей превысило десять тысяч."
city.229.ukr: "Нацисты."
city.229.rus: "Мы освободили их от нацизма."
city.229.world: "Город Марии."

city.230.t: "Полк Азов освобождает [526.GetName]"
city.230.d: "Для освобождения [526.GetName] были задействованы силы НГУ и полка «Азов». Рано утром украинские силы вошли в город с нескольких направлений. Основной удар был направлен на штаб оккупантов, располагавшийся в здании на улице Греческой."
city.230.ukr: "Героям слава!"
city.230.rus: "Нацисты."
city.230.world: "Украинские герои."
