 DF_economy_help_button: "Как бороться с экономическами кризисами? Существует несколько макроэкономических теорий и течений при помощи которых можно найти выход из экономических кризисов. \n\n\n§YМонетаризм§!\nС точки зрения монетаризма кризисы вызываются резким падением денежной массы. Деньги необходимы как средство расчетов и платежей в экономике. Если их недостаточно, то экономические агенты не могут совершать сделки, а кредит становится слишком дорогим. Растущие процентные ставки делают инвестиции более дорогими и в конечном счете замедляют рост. При этом избыток денег, согласно Милтону Фридману, не может ускорить экономический рост, так как ведет только к инфляции, которая всегда является чисто монетарным феноменом. Выводы Фридмана о невозможности стимулирования экономики опирались на гипотезу о NAIRU — существовании естественного уровня занятости, который нельзя снизить стимулирующими мерами. Так как нельзя повысить занятость выше этого уровня, то нельзя и увеличить выпуск выше некоторого естественного уровня.§Y Поэтому все, что могут сделать правительство и центральный банк — это не мешать экономике. В частности, единственной задачей центрального банка должно быть равномерное увеличение денежной массы в соответствии с темпами роста экономики.§!\n\n\n§YТеория реального делового цикла(новая классическая теория)§!\nВ теории реального делового цикла спады и подъёмы объясняются воздействием реальных факторов, действующих со стороны предложения. В индустриальных странах этими факторами могут быть колебания общей факторной производительности (включая появление новых технологий), изменение цен на сырье и т.п. В аграрных странах — урожай или неурожай. Также толчком к переменам могут стать форс-мажорные ситуации (война, революция, стихийные бедствия). Предвидя изменение экономической обстановки в худшую или лучшую сторону, домохозяйства и фирмы массово начинают экономить или больше тратить. В результате сокращается или возрастает совокупный спрос, уменьшается или увеличивается оборот розничной торговли. Фирмы получают меньше или больше заказов на изготовление продукции, соответственно меняется объём производства, занятость. Меняется деловая активность: фирмы начинают сокращать ассортимент выпускаемой продукции или наоборот запускают новые проекты, берут кредиты на их осуществление. То есть, вся экономика колеблется, стремясь прийти в равновесие. Кроме колебаний совокупного спроса существуют и другие факторы, влияющие на фазы экономического цикла: изменения, зависящие от смены времен года в сельском хозяйстве, строительстве, автомобильной промышленности, сезонность розничной торговли, вековые тенденции экономического развития страны, зависящие от ресурсной базы, численности и структуры населения, правильного управления. §YС точки зрения новых классиков стимулировать совокупный спрос бесполезно, так как такие меры приведут к инфляции. Поэтому политика государства должна быть нацелена на стимулирование инвестиционной активности фирм, которая расширяет производственные возможности экономики.§!\n\n\n§YНовая кейнсианская теория§!\nНовая кейнсианская теория, как и ранняя, объясняет цикл в основном колебаниями совокупного спроса, а также несовершенством рыночного механизма, включающим в себя жёсткость цен и заработных плат. Однако новые кейнсианцы исходят из того, что спрос доминирует только в краткосрочном периоде (на горизонте примерно в 1,5-2 года). В долгосрочном периоде новая кейнсианская теория во многом совпадает с новой классической и монетаристской. Она также исходит из предположения о долгосрочной гибкости цен и определяющего влияния стороны предложения. Поэтому в рамках новой кейнсианской теории могут анализироваться и колебания совокупного спроса, и колебания совокупного предложения. Изменения спроса могут быть связаны с колебаниями цен на экспортные товары, изменение предпочтений потребителей и инвесторов, а также с политикой государства. §YНовые кейнсианцы согласны с гипотезой о существовании естественного уровня занятости NAIRU и считают, что все стимулирующие меры носят краткосрочный характер. В долгосрочной перспективе экономика неизбежно вернется к естественному уровню занятости и выпуска. Поэтому действия центрального банка должны быть нацелены не на стимулирование долгосрочного роста, а на стабилизацию его темпов около естественного уровня.§!\nМожно сказать, что новая кейнсианская теория объединила в себе многие идеи классиков, ранних кейнсианцев и монетаристов. Начиная с 90-х годов экономисты стали говорить о Новом макроэкономическом консенсусе"


