 russia.17.t: "Подготовка ко Дню Победы"
 russia.17.d: "Начинается подготовка к празднованию 9 мая.Стоит выбор: провести День Победы с большим размахом, превратив его в масштабную демонстрацию силы, или ограничиться более скромным форматом без лишнего пафоса."
 russia.17.a: "Провести День Победы с размахом"
 russia.17.b: "Провести без лишнего пафоса"
 russia.18.t: "Парад Победы в Москве"
 russia.18.d: "9 мая в Москве на Красной площади прошёл масштабный военный парад, посвящённый подвигу советского народа и победе над нацизмом. В мероприятии приняли участие тысячи военнослужащих, новейшая военная техника и авиация Воздушно-космических сил России. Впервые широкой публике были представлены современные образцы вооружения, включая танк Т-14 «Армата». Во многих городах страны прошли акции памяти, шествия «Бессмертного полка» и праздничные концерты."
 russia.18.a: "Впечатляющее зрелище"
 russia.19.t: "Парад удался на славу"
 russia.19.d: "Празднование Дня Победы прошло с большим успехом. Масштабный парад вызвал широкий общественный резонанс и усилил патриотические настроения."
 russia.19.a: "Отличный результат"
 RUS_victory_day_preparations: "Подготовка к масштабному параду"
 RUS_victory_day_preparations_desc: "Часть промышленных и организационных ресурсов временно направлена на подготовку масштабного празднования Дня Победы."


