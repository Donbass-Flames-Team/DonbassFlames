l_russian:
 RUS_sochi_olympics: "Олимпиада в Сочи"
 RUS_sochi_olympics_desc: "На этот год в Сочи запланированы долгожданные Олимпийские игры. Это вторые по счету Олимпийские игры на территории России, и первые конкретно зимние Олимпийские игры в России. Открытием Олимпиады будет заниматься лично Президент Владимир Путин, по официальной информации участвовать будут более 88 стран, а суммарное число спортсменов составляет 2800 людей, само мероприятие будет проходить с 7 февраля по 23 февраля. Организаторы обещают что Олимпиада запомнится великолепно, и будет настоящей гордостью города Сочи. "
 RUS_conceal_internal_problems: "Скрыть внутренние проблемы"
 RUS_conceal_internal_problems_desc: "Россия несомненно пережила основной трудный период с которым она столкнулась в 90-х годах, сложные времена для нашей страны остались позади, и с началом нулевых годов мы успели решить множество проблем. Но часть этих проблем осталась по сей день, по крайней мере высокая степень коррупции,  олигархия, кумовство, устарелые социальные институты, некоторые экономические проблемы и в целом не лучший уровень жизни о котором мы можем мечтать. Эти все факторы портят наш имидж как и на международной арене, так и среди нашего народа, и по хорошему было бы скрыть эти проблемы, или же преуменьшить их значение."
 RUS_law_from_roskomnadzor: "Законопроект от Роскомнадзора"
 RUS_law_from_roskomnadzor_desc: "Роскомнадзор предложил проект который закрепляет обязанность для владельцев сайтов и страниц в интернете с ежедневной посещаемостью более 3 тысяч человек регистрироваться в реестре Роскомнадзора и нести ответственность за размещаемую информацию. Данное предложение столкнулось с наплывом критики, некоторые считают это ограничением прав граждан с целью контролировать людей силовыми структурами и в интернете, а некоторые считают это вынужденной мерой для достижения безопасного интернета."
 RUS_suppress_pro_ukrainian_citizens: "Присечь про-украинских граждан"
 RUS_suppress_pro_ukrainian_citizens_desc: "В России имеется достаточно много людей которые выражают сочувствие украинцам, хвалят их за Майдан и мечтают повторить подобное и на родине. Таких людей у нас много, Немцов, Новодворская, Явлинский, так и жаждут пролить кровь на улицах России, и продать нашу державу западным элитам, вернуть нас в 90-х вкратце говоря. Несомненно это оппозиционный настрой с целью подорвать стабильность в нашей стране, и таких людей нужно присечь за их деятельность. Чтобы не повторить украинский сценарий и в России."
 RUS_coup_in_ukraine: "Переворот на Украине"
 RUS_transfer_of_contingent_to_sevastopol: "Отправить армейский контингент в Севастополь"
 RUS_transfer_of_contingent_to_sevastopol_desc: "Прошел период с 1991 года, день когда распался Советский Союз. Мы запомнили 1954, год в который Крым отдали Украине, нынче ситуация в Украине позволяет нам вернуть наши законные земли. Мы отправим в Севастополь наш контингент чтобы проведать ситуацию в Крыму."
 RUS_terminate_kharkov_accords: "Денонсировать Харьковский договор"
 RUS_terminate_kharkov_accords_desc: "Харьковский договор был подписан в 2010 году, который соглашал вопросы по пребываниям нашего флота на территории Украины. Нынче ситуация в Украине заставляет нас денонсировать этот договор, из-за разделения политических направлений и предыдущих ситуаций с Порошенко."
 RUS_return_to_home_port: "Крым вернулся в родную гавань"
 RUS_return_to_home_port_desc: "Наконец, когда Крымский народ угнетал под Киевской властью, мы вернули его, вернули его с честью и так называемым достоинством. Следующая цель для нас освободить Одессу, Донецк, Луганск, все земли где проживает пророссийское население. Теперь Крым будет в нашей родной гавани."
 RUS_russian_spring_in_the_east: "Русская весна на западе"
 RUS_russian_spring_in_the_east_desc: "Русская весна наступила, теперь мы готовы показать что означает Русский дух, дух который может быть даже на землях чужой страны. За работу ребята! У нас очень много задач на новый 2014-ый!"
 RUS_task_for_fsb: "Поставить задачи ФСБ"
 RUS_task_for_fsb_desc: "Имея наши цели, мы должны иметь прикрытие, нашу опору, которая поможет с ситуации внутри государства. Наши государственных службы о этих целях позаботятся, в нынешний момент мы должны поставить задачи для ФСБ что-бы удержать власть над страной."
 RUS_support_prorussians_protests: "Поддержать пророссийские протесты"
 RUS_support_prorussians_protests_desc: "Нынче на Украине, в юго-восточных городах, такие как: Харьков, Донецк, Луганск и другие происходят митинги русских против прозападной власти. Мы их полностью понимаем, и мы готовы предоставить то что они захотят. Еще один ход от наших геополитических политиков."
 RUS_help_to_new_republics: "Отправить помощь к новым республикам"
 RUS_help_to_new_republics_desc: "Мы отправим помощь новым появившимся пророссийским республикам, нашим сородичам оказавшимся в очень плохой ситуации. Ныне ситуация внутри Крыма неплоха, мы провели там референдум, по которому 96% людей выбрали нашу власть а не Украину. Следующий ход нашей страны."
 RUS_fight_with_proukranians_citizens: "Начать борьбу с проукраинскими жителями"
 RUS_fight_with_proukranians_citizens_desc: "В наши дни ситуация на внутреннем фронте нормальная, но мы должны высечь предателей из Украины на нашей родине, которые дезорганизируют правительство в Севастополе, Симферополе, Керче и других городов."
 RUS_task_for_strelkov: "Поставить задачу для стрелков на Донбассе"
 RUS_task_for_strelkov_desc: "Мы дружим с нашей республикой в Донецке(как и с другими народными республиками), мы поставим для них задачи, которые помогут сосредоточиться на внешнем фронте с украиной. Стрелки в Донецке правда показывают хорошие результаты, это вдоохновляет нас, мы покажем чудный Русский мир нашему народу на донбассе который все еще под руками Украины и их правых националистов."
 RUS_volunteers_on_donbass: "Волонтерские части на Донбассе"
 RUS_volunteers_on_donbass_desc: "Пришло время играть по крупному, киевская хунта разогнала свою армию до предела, провела частичную мобилизацию, привела добровольцев к нашим республикам чтобы они уничтожали российских мирных жителей. Мы готовы предоставить народным республикам наши подразделения, поиметь опыт современной войны, в конце концов привести победу республикам (и нам тоже)."
 RUS_ammunition_supply: "Поставки боеприпасов республикам"
 RUS_ammunition_supply_desc: "Чисто и просто, поставки боеприпасы нашим народным республикам. Отправляя их, мы будем помогать привести войска наших ребят к победе."
 RUS_machinery_supply: "Поставки механизированого вооружения республикам"
 RUS_machinery_supply_desc: "Чисто и просто, поставки механизированого вооружения будут приходить к нашим русским союзникам, помогая  привести их к победе."
 RUS_arms_supply: "Отправка армейского вооружения республикам"
 RUS_arms_supply_desc: "Чисто и просто, мы будем поставлять армейское вооружение нашим русским ребятам на донбассе, и не только на донбассе. Помогая этим мы приведем их к победе."
 RUS_russian_regulars_on_donbass: "Отправить регулярные части на Донбасс"
 RUS_russian_regulars_on_donbass_desc: "Увидев некоторые провалы на фронте наших союзников, наш Генштаб решился на отчаянную помощь: отправить не добровольцев, а сразу регулярные части. Мы скрытно введем наши регулярные части и застанем врага врасплох".
 RUS_show_kyivs_war_crimes: "Показать военные преступления Киевской хунты"
 RUS_show_kyivs_war_crimes_desc: "Мы уже накопили много видео и фоток, как солдаты киевской хунты истребляют наших ребят на донбассе. Мы покажем что означает быть нацистами, и покажем что с ними будет в другом случае. Слава России!"
 RUS_open_invasion: "Операция «Северный ветер»"
 RUS_open_invasion_desc: "Времени нету, надо действовать. Наш генштаб решил что время настало, время, когда можно уже поднять эскалацию, и ввести полностью войска на территорию донбасса. Стрелки из ДНР, будут этому очень рады. Героям слава!"
 RUS_the_war_has_stalled: "Война была замороженна"
 RUS_the_war_has_stalled_desc: "Никто не смог определиться, кто всё-таки победил в войне. Наши республики на Донбассе подписали мирный договор «Минский протокол», по которому Донецк, Луганск и прибрежные территории переходят к нашим народным республикам к направлению России. Теперь настало время, когда мы можем спокойно развиваться, не опасаясь удара."
 RUS_victory_of_republics: "Победа народных республик"
 RUS_victory_of_republics_desc: "Да наконец-то! Спустя довольно огромное время, мы смогли победить Киевскую хунту, поделив всю Новороссию на народные республики. Слава России!"
 RUS_defeat_of_the_republics: "Проигрыш народных республик"
 RUS_defeat_of_the_republics_desc: "Мы сомневались что это произойдет, но это произошло. Мы проиграли. Наши солдаты доблестно сражаясь за независимость Донбасса, но все равно отступили из Донецка и дальнейших городов. Это конец."
 RUS_support_the_import_substitution_policy: "Поддержать идеи политики импортозамещения"
 RUS_introduction_of_anti_sanctions: "Введение антисанкций"
 RUS_coup_in_ukraine_desc: "Из Украины пришли плохие новости, нам стало известно о успешном государственном перевороте на Украине, сторонники майдана все же добились своего, и свергли легитимного президента Украины Виктора Януковича. Пока неизвестно как мы отреагируем на данную новость, и что будем предпринимать в ближайшее время, Виктор Янукович сейчас в безопасном месте в Ростове-на-Дону, на связи с правительством России. Но не смотря на то что протестующие все же и достигли своей цели, это не означает что на Украине политический кризис завершился. В городах юго-востока, а конкретно в основном в Донецке, Севастополе, Одессе и Харькове набирают темпов митинги против майдана, митинги в поддержку Януковича, часть из которых являются пророссийскими."
 RUS_threat_to_the_regime_yanukovych: "Угроза режиму Януковича"
 RUS_threat_to_the_regime_yanukovych_desc: "На Украине продолжается политический кризис, и риск падения правительства Януковича стает все выше, и нам не в коем случае не выгодно чтобы лояльный нам человек ушел с поста президента Украины, а на замену ему пришли бы прозападные политики. Появляется информация о том что украинская оппозиция и правительство Януковича готовят новые переговоры по решению кризиса, и вероятно как минимум они потребуют от Януковича пойти на уступки, а как максимум, потребуют уйти в отставку. Второго Ющенка на Украине нам не нужно, и если мы не предпримем какие то меры, то возможно Украина окончательно уйдет с нашей сферы влияния."
 RUS_meeting_in_the_kremlin: "Собрание в Кремле"
 RUS_meeting_in_the_kremlin_desc: "Президент Российской Федерации Владимир Путин срочным образом созвал Совет Безопасности РФ, где судя по всему будет обсуждаться напряженная обстановка на Украине, и возможное принятие вынужденных мер для защиты национальных интересов России. Вероятно нам придется задействовать силовые структуры или даже вооруженные силы для решения эскалации, но в любом случае, ситуация остается опасной как для правительства Януковича так и для нас в будущем, и требует каких то оперативных решений пока не стало поздно."
 RUS_assistance_in_organizing_anti_Maidan: "Помощь в организации анти-майдана"
 RUS_assistance_in_organizing_anti_Maidan_desc: "Чтобы сторонникам Майдана не дать взять полную инициативу на Украине, нам нужно помочь организовать Анти-Майдан. Профинансировать митинги в поддержку правительства Януковича по всем городам Украины, где население лояльно к Партии Регионов. Возможно такой шаг стабилизирует ситуацию и даст Виктору Януковичу число сторонников и общественную поддержку."
 RUS_convene_csto_council: "Собрать совет ОДКБ"
 RUS_convene_csto_council_desc: "Мы соберем сессию ОДКБ, рассмотрев вопросы обеспечения коллективной безопасности в сложной международной обстановке. Будет проведено совместное заседание министров иностранных дел, обороны и секретарей советов безопасности государств-членов ОДКБ, на котором будут рассмотрены важные вопросы."
 RUS_coordination_of_ukrainian_security_with_ours: "Координация силовиков Украины с нашими"
 RUS_coordination_of_ukrainian_security_with_ours_desc: "Необходимо помочь нашим друзьям из Украины в этот трудный период в разгар уличных беспорядков. К сожалению украинские силовики не способны в одиночку разобраться со столь крупным беспределом на улицах Киева, в связи с этим мы должны скоординироваться и принимать совместные решения чтобы обезопасить обстановку в столице. И возможно тогда получится угомонить сторонников Майдана и вернуть прежний порядок."
 RUS_deploy_security_forces_to_ukraine: "Отправить силовые структуры в Украину"
 RUS_deploy_security_forces_to_ukraine_desc: "Видно что МВД Украины не справляется со всем хаосом и насилием на улицах Киева который устроили сторонники Майдана. Протестующие перешли все черты и рамки, захватывают правительственные здания, захватывают оружия, возводят баррикады, убивают людей. Уже известно о числе погибших среди «Беркутовцев» на Майдане, если мы это не остановим, то только Бог знает к чему это может привести, но в любом случае мы должны вмешаться пока есть время. Правительство Украины официально запросили нас помочь им, мы согласовали это предложение и готовы подать руку помощи нашим друзьям."
 RUS_import_titushki: "Завоз титушек"
 RUS_import_titushki_desc: "На Украине существует такой чудный феномен как «Титушки», вкратце говоря это маргиналы которые готовы за пару сотен гривен стать буйным звеном на любом протесте. Биться с силовиками и с оппонентами, в первых рядах митингующих кричать громче всех и первее всех. Именно так званные титушки способны продвинуть пророссийские митинги и довести их до успеха. Мы можем нанять подобных людей в Ростове-на-Дону или в условном Белгороде, и завозить их в города юго-востока Украины."
 RUS_support_our_regions: "Поддержка «наших» регионов"
 RUS_support_our_regions_desc: "Харьков, Донецк, Одесса, Крым, Луганск - города и регионы где до сих пор бытует русская культура, на любой улице слышна русская речь, на магазинах русские надписи, а в школах читают русских писателей. Бесспорно многие жители юго-востока Украины с теплом относятся к России, и мы должны дать им понять, что Россия в том числе с теплом относится к ним. И что именно Россия в любой момент готова будет протянуть руку помощи русскоговорящему населению Украины."
 RUS_support_pro_kremlin_media_in_ukraine: "Создание прокремлёвских медиа в Украине"
 RUS_support_pro_kremlin_media_in_ukraine_desc: "В современном мире не менее важным является такой феномен как информационная война, война между средствами массовой информации, война пропагандистов, журналистов, военкоров и блогеров. Людям неведомо что происходит в сотнях километрах от них где то на горячей точке или в закрытых кабинетах политиков, и рассказать об этом им могут только СМИ. Но у каждого своя правда, в том числе и у нас, чтобы добиться лояльности украинского народа, мы можем тайно финансировать близкие нам медиа, такие как «112 Украина», «NewsOne», «ZIK» и другие украинские телеканалы."
 RUS_support_the_party_of_regions: "Поддержка «партии» Регионов"
 RUS_support_the_party_of_regions_desc: "Партия Регионов одна из немногих пророссийских партий на Украине, и несомненно самая крупная из них. Чтобы сохранить наше влияние на Украине, нам нужно поощрять Партию Регионов и надеется на то что они будут держать верх в рейтингах на популярность среди украинцев. Через Партию Регионов мы можем влиять на политику Украины, словно тянув за ниточки политиков как кукол, которые безмолвно будут выполнять наши приказы."
 RUS_PMC: "Создать ЧВК"
 sevastopol: "Захватить Севастополь"
 RUS_support_independent_crimea: "Поддержать независимость Крыма"
 RUS_support_independent_crimea_desc: "Нынче в Крыме патовая ситуация для Киева, после переворота Януковича на улицах Крыма вышли пророссийские сторонники. Мы, как государство поддерживающие население Крыма, поддержим их митинги.Теперь настал наш черед возращать наши утраченные земли, мы начнем операцию в Крыму."
 RUS_referendum_in_crimea: "Провести референдум в Крыму"
 RUS_regain_global_influence: "Восстановление глобального влияния"
 RUS_regain_global_influence_desc: "Возвращение России роли ключевой мировой державы требует активного дипломатического, экономического и военного присутствия в стратегических регионах."
 RUS_influence_in_africa: "Влияние в Африке"
 RUS_influence_in_africa_desc: "Расширение экономического сотрудничества и партнерств в сфере безопасности с африканскими странами открывает новые рынки."
 RUS_influence_in_syria: "Влияние в Сирии"
 RUS_influence_in_syria_desc: "Участие в сирийском конфликте позволяет защитить государственную инфраструктуру, опробовать боевую доктрину и укрепить позиции на Ближнем Востоке."
 RUS_pmc_redut: "ЧВК Редут"
 RUS_pmc_redut_desc: "Использование частных военных компаний обеспечивает оперативную гибкость и точечное решение задач в стратегических зонах."
 RUS_agricultural_subsidies: "Субсидии сельскому хозяйству"
 RUS_agricultural_subsidies_desc: "Крупные инвестиции в отечественное агропромышленное производство обеспечивают продовольственную независимость в условиях санкций."
 RUS_information_war_with_europe: "Информационная война с Европой"
 RUS_information_war_with_europe_desc: "Противодействие информационному давлению Запада требует активного вещания медиа и проведения защитных цифровых кампаний."
 RUS_interfere_in_elections: "Вмешательство в выборы"
 RUS_interfere_in_elections_desc: "Проведение информационных операций направлено на влияние на политические процессы в конкурирующих странах и ослабление оппонентов."
 RUS_north_pipeline_two: "Северный поток 2"
 RUS_north_pipeline_two_desc: "Строительство прямого газопровода по дну Балтийского моря в Европу гарантирует безопасность экспорта энергоносителей."
 RUS_turkish_pipeline: "Турецкий поток"
 RUS_turkish_pipeline_desc: "Прокладка южного маршрута транспортировки газа создает надежные каналы поставки в Южную Европу и укрепляет экономические связи."
 RUS_get_closer_to_china: "Сближение с Китаем"
 RUS_get_closer_to_china_desc: "Формирование всеобъемлющего стратегического партнерства с Пекином открывает емкий восточный рынок и сближает приоритеты."
 RUS_the_power_of_siberia_pipeline: "Газопровод Сила Сибири"
 RUS_the_power_of_siberia_pipeline_desc: "Подключение сибирских месторождений напрямую к китайскому рынку диверсифицирует экспорт и стимулирует развитие регионов."
 RUS_ultimatum_to_the_west: "Ультиматум Западу"
 RUS_ultimatum_to_the_west_desc: "Требование юридических гарантий безопасности и прекращения расширения военных блоков у наших границ заставляет оппонентов считаться с красными линиями."
 RUS_russia_of_putin: "Россия Путина"
 RUS_russia_of_putin_desc: "Консолидация государственной власти вокруг Президента обеспечивает политическую преемственность, внутреннюю стабильность и твердый внешний курс."
 RUS_domestic_policy: "Внутренняя политика"
 RUS_domestic_policy_desc: "Фокус на повышении эффективности государственного управления и социально экономической стабильности укрепляет систему изнутри."
 RUS_create_EAEU: "Создание ЕАЭС"
 RUS_create_EAEU_desc: "Формирование единого экономического пространства с союзниками обеспечивает свободное движение товаров, капиталов и рабочей силы."
 RUS_development_of_the_digital_economy: "Развитие цифровой экономики"
 RUS_development_of_the_digital_economy_desc: "Цифровизация финансовых, промышленных и административных сервисов модернизирует инфраструктуру и ускоряет рост."
 RUS_Improve_internet_infrastructure: "Улучшение интернет инфраструктуры"
 RUS_Improve_internet_infrastructure_desc: "Модернизация высокоскоростных сетей связи в регионах гарантирует надежный обмен данными и доступность сервисов."
 RUS_development_of_digital_government_services: "Развитие госуслуг"
 RUS_development_of_digital_government_services_desc: "Расширение единого портала государственных услуг снижает бюрократические задержки и упрощает взаимодействие граждан с властью."
 RUS_fight_against_bureaucracy: "Борьба с бюрократией"
 RUS_fight_against_bureaucracy_desc: "Оптимизация административных регламентов и сокращение избыточных проверок снижает издержки для отечественного бизнеса."
 RUS_support_etatism: "Поддержка этатизма"
 RUS_support_etatism_desc: "Усиление прямой роли государства в стратегических отраслях экономики гарантирует суверенитет и защищает ключевые предприятия."
 RUS_nationalization_of_elites: "Национализация элит"
 RUS_nationalization_of_elites_desc: "Запрет государственным служащим иметь иностранные счета и активы гарантирует национальную лояльность и исключает внешнее влияние."
 RUS_state_media_monopoly: "Монополия государственных СМИ"
 RUS_state_media_monopoly_desc: "Консолидация вещательных активов под управлением государства обеспечивает единую информационную повестку и внутреннюю безопасность."
 RUS_law_on_undesirable_organizations: "Закон нежелательных организациях"
 RUS_law_on_undesirable_organizations_desc: "Ограничение деятельности иностранных неправительственных структур защищает внутреннюю политику от вмешательства извне."
 RUS_yarovaya_package: "Пакет Яровой"
 RUS_yarovaya_package_desc: "Принятие комплекса антитеррористических законов расширяет требования к хранению данных и усиливает контроль над экстремистскими сетями."
 RUS_expand_the_law_on_foreign_agents: "Расширение закона об иноагентах"
 RUS_expand_the_law_on_foreign_agents_desc: "Ужесточение требований к финансируемым из за рубежа организациям обеспечивает прозрачность и пресекает деструктивную деятельность."
 RUS_rosgvardia: "Создание Росгвардии"
 RUS_rosgvardia_desc: "Формирование Федеральной службы войск национальной гвардии обеспечивает общественную безопасность и охрану важных объектов."
 RUS_propaganda_of_traditional_values: "Пропаганда традиционных ценностей"
 RUS_propaganda_of_traditional_values_desc: "Продвижение традиционных духовно нравственных ориентиров укрепляет единство общества и противостоит чуждым идеологиям."
 RUS_family_values_protection: "Защита семейных ценностей"
 RUS_family_values_protection_desc: "Государственная поддержка семьи и демографические программы стимулируют рост населения и сохраняют социальные устои."
 RUS_yunarmy: "Движение Юнармия"
 RUS_yunarmy_desc: "Создание всероссийского детско юношеского военно патриотического движения воспитывает ответственность и готовит будущих защитников."
 RUS_cultural_sovereignty: "Культурный суверенитет"
 RUS_cultural_sovereignty_desc: "Защита национальной истории и наследия от попыток фальсификации укрепляет самосознание и историческую память."
 RUS_investments_in_crimea: "Инвестиции в Крым"
 RUS_investments_in_crimea_desc: "Выделение масштабных федеральных средств на инфраструктуру полуострова ускоряет его интеграцию и экономический рост."
 RUS_construction_of_the_crimean_bridge: "Строительство Крымского моста"
 RUS_construction_of_the_crimean_bridge_desc: "Возведение транспортного перехода через Керченский пролив напрямую связывает полуостров с транспортной сетью страны."
 RUS_send_settlers_to_crimea: "Привлечение специалистов в Крым"
 RUS_send_settlers_to_crimea_desc: "Стимулирование переезда квалифицированных кадров и госслужащих укрепляет местное управление и социальную сферу."
 RUS_fight_with_crimean_tatar_separatism: "Борьба с крымскотатарским сепаратизмом"
 RUS_fight_with_crimean_tatar_separatism_desc: "Нейтрализация радикализированных ячеек и интеграция населения обеспечивают стабильность и порядок на полуострове."
 RUS_elections_2018: "Президентские выборы 2018"
 RUS_elections_2018_desc: "Проведение общенациональных выборов Президента подтверждает мандат доверия действующему политическому курсу."
 RUS_national_projects: "Национальные проекты"
 RUS_national_projects_desc: "Запуск масштабных федеральных программ в сфере здравоохранения, образования и инфраструктуры обеспечит комплексное развитие."
 RUS_the_sovereign_internet_act: "Закон о суверенном интернете"
 RUS_the_sovereign_internet_act_desc: "Создание автономной национальной системы маршрутизации гарантирует устойчивую работу сети при киберугрозах."
 RUS_raise_the_retirement_age: "Повышение пенсионного возраста"
 RUS_raise_the_retirement_age_desc: "Реформирование пенсионных параметров сбалансирует бюджет и адаптирует систему к долгосрочным демографическим изменениям."
 RUS_renew_the_cabinet_of_ministers: "Обновление Кабинета Министров"
 RUS_renew_the_cabinet_of_ministers_desc: "Переформирование состава правительства повышает оперативность управления и дает новый импульс экономическим задачам."
 RUS_constitutional_amendments: "Поправки в Конституцию"
 RUS_constitutional_amendments_desc: "Внесение изменений в Основной закон укрепляет государственный суверенитет, закрепляет социальные гарантии и обнуляет сроки."
 RUS_status_quo_on_the_peninsula: "Статус кво на полуострове"
 RUS_status_quo_on_the_peninsula_desc: "Сохранение существующего административного порядка в Крыму обеспечивает стабильное функционирование региональных служб."
 RUS_republic_of_sailors: "Город моряков"
 RUS_republic_of_sailors_desc: "Развитие и укрепление военно морской базы Севастополя гарантирует стратегический контроль над акваторией Черного моря."
 RUS_form_an_orchestra: "Создание Музыкантов"
 RUS_form_an_orchestra_desc: "Формирование подготовленных экспедиционных подразделений обеспечивает эффективное содействие союзникам на дальних рубежах."
 RUS_development_of_armed_forces: "Развитие Вооруженных Сил"
 RUS_development_of_armed_forces_desc: "Системное перевооружение и оптимизация организационно штатной структуры армии повышают ее постоянную готовность."
 RUS_establish_aerospace_forces: "Создание Воздушно космических сил"
 RUS_establish_aerospace_forces_desc: "Объединение сил ВВС, войск ПВО и Космических войск в единый вид обеспечивает господство в воздушно космическом пространстве."
 RUS_expand_military_export: "Расширение экспорта вооружений"
 RUS_expand_military_export_desc: "Поставки современной военной техники за рубеж приносят доходы в бюджет и укрепляют военно технические связи."
 RUS_increase_contracts_in_army: "Увеличение контрактной службы"
 RUS_increase_contracts_in_army_desc: "Постепенный переход к преимущественно профессиональной армии повышает выучку войск и готовность к сложным операциям."
 RUS_aircraft_modernization: "Модернизация авиапарка"
 RUS_aircraft_modernization_desc: "Оснащение боевых самолетов и вертолетов новыми радарами, авионикой и средствами поражения повышает их боевой потенциал."
 RUS_new_types_of_missiles: "Новые типы ракетного оружия"
 RUS_new_types_of_missiles_desc: "Разработка гиперзвуковых и высокоточных ракетных комплексов гарантирует стратегическое сдерживание любой противоракетной обороны."
 RUS_modernization_of_tanks: "Модернизация бронетехники"
 RUS_modernization_of_tanks_desc: "Установка современной динамической защиты, прицельных комплексов и систем управления огнем сохраняет превосходство сухопутных сил."
 RUS_establish_bars: "Создание системы БАРС"
 RUS_establish_bars_desc: "Формирование подготовленного Боевого Армейского Резерва Страны обеспечивает быструю мобилизацию и доукомплектование частей."
 RUS_minsk_protocols: "Минские протоколы"
 RUS_minsk_protocols_desc: "Подписание первых соглашений о прекращении огня для фиксации линии соприкосновения и дипломатической заморозки активных боев."
 RUS_ukraine_is_violating_protocols: "Украина нарушает протоколы"
 RUS_ukraine_is_violating_protocols_desc: "Фиксация артиллерийских обстрелов и локальных атак со стороны противника для обоснования наших дальнейших ответных шагов."
 RUS_sign_minsk_two: "Подписание Минска 2"
 RUS_sign_minsk_two_desc: "Заключение нового комплекса мер в Минске по итогам зимних боев для закрепления новой линии фронта и политических условий."
 RUS_cooperation_with_people_republics: "Сотрудничество с народными республиками"
 RUS_cooperation_with_people_republics_desc: "Углубление политической, гуманитарной и административной поддержки республик Донбасса для удержания их внутреннего порядка."
 RUS_increase_unrest_in_ukraine: "Усиление дестабилизации в Украине"
 RUS_increase_unrest_in_ukraine_desc: "Использование политических рычагов и социального напряжения в соседних областях для связывания сил противника."
 RUS_support_the_ukrainian_democratic_republic: "Поддержка альтернативных оппозиционных сил"
 RUS_support_the_ukrainian_democratic_republic_desc: "Оказание организационной и информационной помощи дружественным политическим фигурам для создания альтернативного центра силы."
 RUS_recognize_peoples_passports: "Признание паспортов ЛДНР"
 RUS_recognize_peoples_passports_desc: "Официальное признание документов выдаваемых республиками на нашей территории для упрощения передвижения и гражданских прав."
 RUS_economic_cooperation_with_ldpr: "Экономическое сотрудничество с ЛДНР"
 RUS_economic_cooperation_with_ldpr_desc: "Встраивание промышленного потенциала регионов в наши производственные цепочки и наладка прямых торговых связей."
 RUS_distribute_russian_passports: "Выдача российских паспортов"
 RUS_distribute_russian_passports_desc: "Запуск программы упрощенного получения гражданства для жителей региона с целью распространения правовой защиты."
 RUS_full_control_over_donbass: "Полный контроль над Донбассом"
 RUS_full_control_over_donbass_desc: "Установление полного административного и военного контроля над всеми территориями региона для гарантии долгосрочной стабильности."

