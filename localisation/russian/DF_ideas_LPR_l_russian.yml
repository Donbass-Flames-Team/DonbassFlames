l_russian:
 LPR_republic_without_power: "Республика без власти"
 LPR_republic_without_power_desc: "Формально есть правительство, но на местах царит хаос и самоуправство."
 LPR_power_of_gun: "Власть ствола"
 LPR_power_of_gun_desc: "Сила держится через оружие; группы на местах контролируют районы, решения принимаются по силе, а не закону."
 LPR_fragmented_gangs: "Разрозненные банды"
 LPR_fragmented_gangs_desc: "Территории поделены между локальными вооружёнными группировками; каждый квартал живёт по своим правилам, грабежи и контроль ресурсов обычны."
 LPR_eastern_intervention: "Вмешательство с Востока"
 LPR_eastern_intervention_desc: "Скрытая поддержка извне: техника, советники, регулярные силы, решающие исход боёв в тени."
 LPR_unauthorized_commanders: "Самовольные командиры"
 LPR_unauthorized_commanders_desc: "На местах появляются свои лидеры, которые сами решают, как действовать. Каждый отряд ведёт себя независимо, выполняя свои цели, не считаясь с формальными приказами республики. Решения часто принимаются импульсивно, а конфликты между группами усиливают хаос."
 LPR_mercenaries_and_supporters: "Наёмники и сторонники"
 LPR_mercenaries_and_supporters_desc: "В регионе действуют наёмники и советники извне, формируя боевые группы и поддерживая хаос на линии фронта."
 DPR_russian_spring_idea: "Русская весна"
 LPR_cooperative_attack_of_druzhina: "Кооперативная атака союзной дружины"
 LPR_introduction_of_a_state_of_emergency: "Введение чрезвычайного положения"
 LPR_mobilization_shock: "Шок мобилизации"
 LPR_harsh_courts: "Жесткие суды"
 LPR_improvement_of_working_conditions: "Создание и улучшение рабочих мест"
 LPR_Stabilization_of_pension_payments: "Стабилизация выплат пенсий"
 LPR_ruined_factories: "Уничтоженные заводы"
 LPR_partially_destroyed_factories: "Частично разрушенные заводы"
 LPR_agrarian_reform: "Аграрные реформы"
 LPR_dependent_electric_power: "Коллапс электроэнергии"
 LPR_dependent_electric_power_1: "Частые перебои с электроэнергией"
 LPR_dependent_electric_power_2: "Перебои электроэнергии"
 LPR_dependent_electric_power_3: "Некоторые проблемы с электроэнергией"
 LPR_support_for_displaced_persons: "Поддержка вынужденных переселенцев"
 LPR_rapid_response_units: "Отряды быстрого реагирования"
 LPR_aid_from_russia: "Помощь со стороны России"
 LPR_influential_propaganda: "Влиятельная пропаганда"
 LPR_influential_propaganda_desc: "После референдума народ поддержал новую республику. Информационная работа помогает укрепить легитимность власти и сплотить людей вокруг общих целей."
 LPR_influential_propaganda_1: "Усиленная агитация"
 LPR_influential_propaganda_1_desc: "Пропагандистский аппарат работает на полную мощность - листовки, радио, митинги. Население все больше верит в правильность выбранного пути."
 LPR_influential_propaganda_2: "Народная поддержка"
 LPR_influential_propaganda_2_desc: "Идеи республики прочно укоренились в сознании людей. Общество едино, моральный дух высок, готовность защищать свою землю растет."
 LPR_negotations_with_mozgovoy: "Переговоры с Мозговым"
 LPR_negotations_with_mozgovoy_desc: "Алексей Мозговой и его бригада "Призрак" — одна из самых авторитетных, но в то же время своенравных сил в регионе. Его идеи народной справедливости и жесткий идейный позиционизм пользуются огромной поддержкой среди бойцов и мирного населения, однако его независимость создает трения с центральным командованием. Мы не можем позволить себе раскол в условиях внешнего давления. Пришло время сесть за стол переговоров, найти компромисс и официально включить его структуры в единую систему обороны. Выстроить диалог с комбригом — значит обеспечить тыл и укрепить дух всей Республики."
 LPR_info_war_and_propaganda: "Информационная война и пропаганда"
 LPR_info_war_and_propaganda: "Сражение идет не только на линии фронта, но и в умах миллиона людей. Пока вражеские медиа пытаются деморализовать наше население и посеять панику, мы должны взять под полный контроль информационное пространство. Создание единого медиахолдинга, глушение сигналов противника, выпуск агитационных листовок и регулярные сводки с передовой помогут сохранить высокий боевой дух граждан. Истина и грамотная пропаганда — наше главное оружие в борьбе за умы и сердца жителей Донбасса."