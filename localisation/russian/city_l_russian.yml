l_russian:

city.201.t:0 "Народная милиция входит в город [307.GetName]"
city.201.d:0 "Когда народная милиция вошла в город [307.GetName], решающими оказались высоты и переправы через Северский Донец. Украинские части ещё держали отдельные кварталы и старые промышленные площадки, но подвоз через разбитые маршруты становился всё труднее. К вечеру бои сместились к окраинам, а в центре уже появились первые патрули новых сил."
city.201.ukr:0 "Лисичанские высоты ещё могут сменить хозяина."
city.201.rus:0 "Западный берег почти открыт."
city.201.world:0 "Бои уходят от Северского Донца."

city.202.t:0 "[307.GetName]: высоты потеряны"
city.202.d:0 "Российские войска заняли город [307.GetName] после ударов по переправам, складам и маршрутам отхода. Старый промышленный район, содовый завод и подъёмы над рекой несколько дней оставались последними точками сопротивления. После их потери украинским подразделениям пришлось отходить западнее, не дожидаясь окружения."
city.202.ukr:0 "Отойти — не значит забыть."
city.202.rus:0 "Высоты над рекой взяты."
city.202.world:0 "Луганщина теряет последний крупный рубеж."

city.203.t:0 "ЗСУ возвращают город [307.GetName]"
city.203.d:0 "ЗСУ вернули город [307.GetName] не одним броском, а через серию боёв за окраины, подъёмы и промышленные кварталы. Российские части оставили несколько оборудованных точек, но удержать высоты уже не смогли. На западном берегу Северского Донца снова появляются украинские наблюдательные пункты."
city.203.ukr:0 "Мы снова на высотах."
city.203.rus:0 "Берег удержать не удалось."
city.203.world:0 "Украина снова видит Северский Донец с высоты."

city.204.t:0 "Бои у Азота в [304.GetName]"
city.204.d:0 "Республиканские силы вошли в город [304.GetName] через кварталы у химических предприятий. Район завода Азот стал местом, где продвижение шло особенно медленно: бетонные корпуса, подвалы, трубы и железнодорожные ветки мешали быстро зачистить территорию. Украинские подразделения отходили группами, прикрывая тех, кто ещё оставался в промзоне."
city.204.ukr:0 "Азот ещё долго будут вспоминать."
city.204.rus:0 "Промышленная зона взята."
city.204.world:0 "Северодонецк потерял прежнюю роль."

city.205.t:0 "[304.GetName] взят российскими войсками"
city.205.d:0 "Российские войска заняли город [304.GetName] после боёв за мосты, кварталы и заводские территории. С 2014 года этот город фактически заменял Луганск для украинской администрации области, поэтому новость ударила не только по военным сводкам. На левом берегу остались разрушенные переправы, пустые учреждения и промзона, через которую ещё недавно шёл отход."
city.205.ukr:0 "Северодонецк ещё не вычеркнут."
city.205.rus:0 "Один из центров Луганщины взят."
city.205.world:0 "После 2014 года это звучит особенно громко."

city.206.t:0 "ЗСУ снова в городе [304.GetName]"
city.206.d:0 "Украинские подразделения вернулись в город [304.GetName] через районы, где раньше шли самые тяжёлые бои. Сначала проверяли подвалы и заводские корпуса, затем — административные здания и мостовые подходы. Для Украины это возвращение места, которое несколько лет было политическим центром подконтрольной части Луганщины."
city.206.ukr:0 "Флаг снова над администрацией."
city.206.rus:0 "Луганское направление просело."
city.206.world:0 "Украина возвращает себе старый центр управления."

city.207.t:0 "[370.GetName]: заводской район взят"
city.207.d:0 "Местные вооружённые формирования закрепились в городе [370.GetName]. Здесь всё крутится вокруг металлургии, подъездных путей и рабочих посёлков, поэтому бои быстро перешли к складам, развязкам и заводским окраинам. Несколько украинских групп вышли заранее, остальные оставили позиции уже после потери железнодорожных подходов."
city.207.ukr:0 "Заводы ещё могут работать против них."
city.207.rus:0 "Алчевский пояс удержан."
city.207.world:0 "Металлургический Донбасс снова в сводках."

city.208.t:0 "Российские войска входят в город [370.GetName]"
city.208.d:0 "В город [370.GetName] вошли российские части. Для них ценность этого места не в названии, а в заводских площадках, складах и связке между Луганском, Перевальском и донецким направлением. Металлургический комбинат и подъездные пути сразу начали осматривать инженерные группы."
city.208.ukr:0 "Алчевск не исчезает с карты войны."
city.208.rus:0 "Тыл стал плотнее."
city.208.world:0 "Заводские города снова решают больше, чем столицы."

city.209.t:0 "ЗСУ вернули город [370.GetName]"
city.209.d:0 "ЗСУ вошли в город [370.GetName] после короткой, но нервной обороны российских частей на заводских окраинах. Несколько складов были брошены почти целыми, часть техники ушла в сторону соседних посёлков. Возвращение этого района бьёт по связке между промышленными городами Луганщины."
city.209.ukr:0 "Алчевский узел снова наш."
city.209.rus:0 "Заводской тыл порвался."
city.209.world:0 "Украина заходит глубже в старый промышленный пояс."

city.210.t:0 "Ополченцы входят в город [347.GetName]"
city.210.d:0 "Ополченцы вошли в город [347.GetName] после долгих боёв за частный сектор и кварталы на западе. Несколько улиц меняли руки по два-три раза, а артиллерия разбила район вокруг старых дорог к соляным шахтам и Часову Яру. К моменту входа штурмовых групп центр уже мало напоминал довоенный город."
city.210.ukr:0 "Бахмут держался слишком долго, чтобы стать точкой."
city.210.rus:0 "Взяли руины, не парад."
city.210.world:0 "Бахмут стал отдельной главой войны."

city.211.t:0 "[347.GetName] пал"
city.211.d:0 "Российские войска заняли город [347.GetName] после месяцев штурмов, артиллерии и боёв за кварталы. До войны его вспоминали из-за завода игристых вин и соляных шахт поблизости, теперь — из-за разрушенных улиц и огромных потерь. Дальше остаются Часов Яр и новые украинские линии, поэтому сама победа не превращается в лёгкое продвижение."
city.211.ukr:0 "Эта история не закрыта."
city.211.rus:0 "Дальше будет не легче."
city.211.world:0 "Месяцы штурмов закончились пустым городом."

city.212.t:0 "Украина возвращает город [347.GetName]"
city.212.d:0 "Украинские войска вернули город [347.GetName]. Первые группы заходили через районы, где ещё недавно стояли российские укрепления, и почти сразу начали искать уцелевшие подвалы, склады и проходы между разрушенными кварталами. Для России это потеря трофея, ради которого было потрачено слишком много сил."
city.212.ukr:0 "Бахмут снова под нашим флагом."
city.212.rus:0 "Главный трофей ушёл."
city.212.world:0 "Руины Бахмута снова сменили сторону."

city.213.t:0 "Силы республик заходят в город [359.GetName]"
city.213.d:0 "Силы республик заняли город [359.GetName]. Здесь всё решали не громкие заявления, а развязки на Бахмут, Дружковку и Краматорск. После потери нескольких выездов украинским подразделениям пришлось уводить технику обходными маршрутами, а часть тыла переносить дальше от железной дороги."
city.213.ukr:0 "Константиновка прикрывала больше, чем казалось."
city.213.rus:0 "До Краматорска стало ближе."
city.213.world:0 "Малозаметный город внезапно стал важным."

city.214.t:0 "[359.GetName] занят российскими войсками"
city.214.d:0 "Российские войска закрепились в городе [359.GetName] и сразу начали разворачивать технику у выездов на соседние направления. Для украинской стороны главной проблемой стали не сами кварталы, а потеря удобного пересечения маршрутов. Резервы теперь приходится вести длиннее, а это значит больше времени под ударами."
city.214.ukr:0 "Новая линия будет западнее."
city.214.rus:0 "Маршрут на Краматорск открыт."
city.214.world:0 "На севере Донбасса снова спорят за дороги."

city.215.t:0 "ЗСУ входят в город [359.GetName]"
city.215.d:0 "ЗСУ вернули город [359.GetName] и быстро заняли вокзал, выезды и несколько кварталов у главных трасс. Российским частям пришлось уводить склады и ремонтные группы ближе к тылу. Для Украины это возвращение места, через которое можно снова связывать соседние участки фронта."
city.215.ukr:0 "Вокзал снова работает на нас."
city.215.rus:0 "Продвижение к Краматорску сорвалось."
city.215.world:0 "Константиновка снова закрывает проход."

city.216.t:0 "Народная милиция заняла город [398.GetName]"
city.216.d:0 "Народная милиция заняла город [398.GetName]. Шахтные посёлки, металлургические площадки и дороги к Горловке сделали оборону плотной, но неравномерной: в одних районах украинские части ушли быстро, в других ещё держались отдельные группы. Новые силы сразу начали проверять подъездные пути и склады возле промышленных зон."
city.216.ukr:0 "Енакиево ещё появится в украинских сводках."
city.216.rus:0 "Старый шахтёрский район удержан."
city.216.world:0 "Рабочие кварталы Донбасса снова стали военными."

city.217.t:0 "[398.GetName] перешёл под контроль России"
city.217.d:0 "Российские части закрепились в городе [398.GetName]. Его положение между Донецком и Горловкой даёт удобный участок для переброски людей, топлива и техники. В городе сразу усилили охрану заводских окраин и дорог к соседним посёлкам, потому что именно там украинские группы чаще всего пытаются прощупать оборону."
city.217.ukr:0 "Промзона не вечна."
city.217.rus:0 "Связка с Горловкой стала прочнее."
city.217.world:0 "Енакиево усиливает донецкую агломерацию."

city.218.t:0 "ЗСУ вернули город [398.GetName]"
city.218.d:0 "Украинские войска вернули город [398.GetName]. Под их контроль снова переходят шахтные районы, заводские подъезды и дороги, которыми пользовались российские части между Донецком и Горловкой. В нескольких местах нашли брошенные боеприпасы и недостроенные укрепления."
city.218.ukr:0 "Шахтные районы снова наши."
city.218.rus:0 "Опора у Горловки потеряна."
city.218.world:0 "Украина возвращает часть промышленного кольца."

city.219.t:0 "Ополченцы снова в городе [318.GetName]"
city.219.d:0 "Ополченцы вошли в город [318.GetName], и это сразу вернуло в память 2014 год. Тогда здесь появились блокпосты, захваченные здания и первые большие сводки с Донбасса. Теперь повторяется похожая картина: быстрые заявления, проверки на въездах, тревога в сторону Краматорска и ожидание, где остановится следующая линия."
city.219.ukr:0 "Мы уже возвращали Славянск."
city.219.rus:0 "Символ 2014 года снова взят."
city.219.world:0 "Славянск опять звучит как начало."

city.220.t:0 "[318.GetName] пал"
city.220.d:0 "Российские войска заняли город [318.GetName]. Для них это не только маршрут на Краматорск и север Донецкой области, но и сильный образ: место, с которого в 2014 году началась большая донбасская история. Украинские части отходят к соседним рубежам, стараясь не потерять связь между Краматорском и Дружковкой."
city.220.ukr:0 "Славянск уже переживал это."
city.220.rus:0 "Возвращение к началу состоялось."
city.220.world:0 "Город 2014 года снова в центре новостей."

city.221.t:0 "Город [318.GetName] освобождён"
city.221.d:0 "Украинские войска освободили город [318.GetName]. В 2014 году он уже возвращался под контроль Украины, и новая операция сразу получила политический вес. Первые подразделения вошли через въезды, где ещё недавно стояли блокпосты, а затем начали зачистку административных зданий и дорог к Краматорску."
city.221.ukr:0 "Славянск снова доказал своё."
city.221.rus:0 "Символический удар слишком заметен."
city.221.world:0 "Украина повторяет историю 2014 года."

city.222.t:0 "Республиканские силы вошли в город [327.GetName]"
city.222.d:0 "Республиканские силы вошли в город [327.GetName]. После 2014 года здесь держалась украинская администрация северной части Донецкой области: штабы, службы, вокзал, предприятия и склады. При отходе часть документов и оборудования успели вывезти, но сам факт потери такого центра сразу ударил по управлению соседними районами."
city.222.ukr:0 "Краматорск был сердцем этого участка."
city.222.rus:0 "Административный центр взят."
city.222.world:0 "Север Донецкой области теряет штаб."

city.223.t:0 "[327.GetName] пал"
city.223.d:0 "Российские войска заняли город [327.GetName]. Машиностроительные предприятия, железнодорожный узел и административные здания сделали его одной из главных целей на севере Донецкой области. Теперь российским частям нужно не только удержать кварталы, но и прикрыть длинные подъезды, по которым пойдут топливо, ремонтные бригады и новые подразделения."
city.223.ukr:0 "Краматорск ещё не последняя точка."
city.223.rus:0 "Крупнейшая цель на севере взята."
city.223.world:0 "Краматорск резко меняет вес кампании."

city.224.t:0 "ЗСУ вернули город [327.GetName]"
city.224.d:0 "ЗСУ вернули город [327.GetName]. Вместе с ним Украина получает назад вокзал, административный центр и площадку, откуда можно держать север Донецкой области. Российские части отходят от города, который мог стать базой для давления на Славянск, Дружковку и Константиновку."
city.224.ukr:0 "Северный Донбасс снова держится."
city.224.rus:0 "Удержать область стало труднее."
city.224.world:0 "Краматорск возвращается под украинский флаг."

city.225.t:0 "Местные формирования заняли город [381.GetName]"
city.225.d:0 "Местные формирования заняли город [381.GetName]. Шахты, заводские районы и химическое предприятие Стирол делают его неудобным для быстрого штурма: слишком много промышленных заборов, дворов и подъездов. После входа новых сил северный край донецкой агломерации стал для республик спокойнее, хотя зачистка отдельных районов продолжалась ещё несколько дней."
city.225.ukr:0 "Горловка слишком близко к Донецку."
city.225.rus:0 "Северный щит удержан."
city.225.world:0 "Горловская промзона снова в деле."

city.226.t:0 "[381.GetName] занят российскими войсками"
city.226.d:0 "Российские войска заняли город [381.GetName]. В штабе его ценят за шахтные посёлки, дороги к Донецку и возможность держать северный край агломерации. Плотная застройка помогает обороне, но требует большого гарнизона: без постоянных патрулей кварталы быстро превращаются в проходные дворы для диверсионных групп."
city.226.ukr:0 "Агломерация ещё не закрыта."
city.226.rus:0 "Донецкий фланг стал крепче."
city.226.world:0 "Горловка усиливает оборону Донецка."

city.227.t:0 "ЗСУ возвращают город [381.GetName]"
city.227.d:0 "Украинские войска вернули город [381.GetName]. Вместе с ним под контроль ЗСУ переходят шахтные посёлки, промзоны и дороги, которые раньше прикрывали север Донецка. Российским частям приходится усиливать соседние участки и выводить часть тыла глубже в агломерацию."
city.227.ukr:0 "Теперь Донецк ближе."
city.227.rus:0 "Северный фланг открыт."
city.227.world:0 "Украина пробивает промышленное кольцо."

city.228.t:0 "Силы республик входят в город [526.GetName]"
city.228.d:0 "Силы республик вошли в город [526.GetName] после боёв у побережья и заводских районов. Порт, металлургические предприятия и широкие проспекты быстро превратились в отдельные участки обороны. Новые силы получили выход к Азовскому морю, но вместе с ним — разрушенную инфраструктуру, которую ещё придётся восстанавливать."
city.228.ukr:0 "Азов ещё не потерян."
city.228.rus:0 "Порт перешёл под контроль."
city.228.world:0 "Мариуполь снова стал южным символом."

city.229.t:0 "[526.GetName] пал"
city.229.d:0 "Российские войска установили контроль над городом [526.GetName] после долгой осады. Бои шли за порт, жилые районы, комбинат имени Ильича и позиции у Азовстали. Когда ресурсы защитников закончились, дальнейшая оборона стала невозможной. Россия получила выход к Азовскому морю, Украина — одну из самых болезненных потерь всей кампании."
city.229.ukr:0 "Мариуполь помнит осаду."
city.229.rus:0 "Азовский порт наконец взят."
city.229.world:0 "Падение Мариуполя услышали далеко за фронтом."

city.230.t:0 "Украина возвращает город [526.GetName]"
city.230.d:0 "Украинские войска вернули город [526.GetName]. Первые сообщения пришли из района порта и заводских кварталов, затем — с побережья. Россия теряет место, которое связывало южную группировку с Азовским морем, а Украина снова получает политический и военный символ на юге."
city.230.ukr:0 "Азов снова ближе."
city.230.rus:0 "Южная опора рухнула."
city.230.world:0 "Мариуполь снова меняет всю южную карту."
