l_russian:
 SKR_expand_kazak_squads: "Расширение казачьих отрядов"
 SKR_expand_kazak_squads_desc: "Приток добровольцев в наши казачьи ряды требует быстрого расширения организационных структур для формирования новых боеспособных подразделений."
 SKR_spirit_of_the_cossacks: "Казачий дух"
 SKR_spirit_of_the_cossacks_desc: "Исторические казачьи традиции и боевое братство поднимают моральный дух бойцов подготавливая их к бескомпромиссной обороне родной земли."
 SKR_collect_tribute_from_local_residents: "Сбор сборов с местных жителей"
 SKR_collect_tribute_from_local_residents_desc: "Поддержание боеспособности требует постоянного снабжения поэтому введение местных сборов помогает обеспечить наши казачьи гарнизоны всем необходимым."
 SKR_catch_spies: "Поимка шпионов"
 SKR_catch_spies_desc: "Вражеские агенты и наводчики представляют прямую угрозу нашим позициям поэтому на подконтрольных территориях вводятся жесткие меры контрразведки."
 SKR_fight_against_ukrainian_supporters: "Борьба с сторонниками Украины"
 SKR_fight_against_ukrainian_supporters_desc: "Подавление проукраинского подполья необходимо для обеспечения полной безопасности нашего тыла и пресечения любых диверсий."
 SKR_traitors_in_luhansk: "Предатели в Луганске"
 SKR_traitors_in_luhansk_desc: "Напряжение в отношениях с официальным руководством в Луганске растет поэтому нам нужно проявлять бдительность в отношении политических интриг."
 SKR_start_acting: "Начало действий"
 SKR_start_acting_desc: "Время ожидания прошло и наши казачьи силы готовы взять решительную инициативу в свои руки для утверждения власти и военного контроля."