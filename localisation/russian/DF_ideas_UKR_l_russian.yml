 UKR_defence_of_cities_idea: "Оборона городов"
 UKR_defence_of_cities_idea_desc: ""
 People_republic_ATO_idea: "Давление Антитеррористической операции"
 People_republic_ATO_idea_desc: "Вооружённые силы Украины проводят Антитеррористическую операцию в регионе. Военные формирования народных республик находятся под постоянным давлением наступающих украинских сил, несут тяжёлые потери и с трудом могут перегруппироваться."
 UKR_ukrainian_navy_idea: "Военно-морские силы Украины"
 UKR_ukrainian_navy_idea_desc: "В 2013 году ВМС Украины находились в глубоком упадке: устаревшие корабли, хроническое недофинансирование и нехватка подготовленных кадров. Флот не в состоянии выполнять свои задачи в море."
 UKR_ukrainian_air_forces_idea: "Воздушные силы Украины"
 UKR_ukrainian_air_forces_idea_desc: "Воздушные силы Украины страдают от устаревшей техники, нехватки финансирования и недостаточной подготовки. Вылеты сопровождаются высокой аварийностью и низкой боевой эффективностью."
 UKR_ukrainian_economy_idea: "Экономика Украины"
 UKR_ukrainian_economy_idea_desc: "Экономика Украины в кризисе: промышленность деградирует, производство падает, а у государства не хватает ресурсов для её поддержки."
 UKR_ATO_idea: "Проведение Антитеррористической операции"
 UKR_ATO_idea_desc: "Проведение Антитеррористической операции ложится тяжёлым бременем на вооружённые силы: войска сражаются в городских условиях, несут потери и сталкиваются с трудностями снабжения и перегруппировки."
 UKR_oligarchs_idea: "Олигархи"
 UKR_oligarchs_idea_desc: "Экономика страны контролируется несколькими олигархическими группами, которые используют государство для собственного обогащения, ослабляя государственные институты и промышленность."
 UKR_oleg_lyashko_victory: "Ляшко"
 UKR_oleg_lyashko_victory_desc: "Ляшко побеждает на выборах 2014 года и становится новым президентом Украины. Никто не ожидал его победы, но словно магией он добился её."
 UKR_patriotic_war: "Отечественная война"
 UKR_patriotic_war_desc: "Война с сепаратистами на Донбасе ощущалась как война с каким то слабым «восстанием». Однако сейчас отчетливо видно что война на Донбассе - попытка России дестабилизировать нашу страну, мы должны вернуть свою территорию. В эту войну должен быть втянут каждый житель нашей страны. Мы не должны просто так отдавать свою территорию."
 UKR_national_economy: "Народная экономика"
 UKR_national_economy_desc: "Экономика страны должна работать не на олигархов и транснациональные корпорации, а на простой народ. Годы разграбления национальных богатств и попустительства крупному капиталу поставили наше государство на край пропасти. Мы наведем порядок в финансовой сфере, вернем ключевые ресурсы под контроль общества и направим государственные мощности на благо каждого гражданина. Народная экономика — это прочный фундамент, на котором мы построим сильную и самодостаточную Украину!"
 UKR_full_economic_independent_from_russia: "Полная независимость от России"
 UKR_full_economic_independent_from_russia_desc: "РФ - наш главный враг не сегодняшний момент. Мы не позволим нашей экономике зависеть от вражеской страны, что еще лучше - перестать спонсировать экономику врага, это лучшее что мы можем сделать сейчас."
 UKR_encouraging_small_businesses: "Поддержка малого бизнеса"
 UKR_encouraging_small_businesses_desc: "Наше государство обязано избавиться от олигархического устройства государства. Для борьбы с преобладанием огромных предприятий мы организуем поддержку малого бизнеса с последующим финансированием малого бизнеса."
 UKR_erasure_of_moscals: ""Москаляку на гиляку!""
 UKR_erasure_of_moscals_desc: "Хто не скаче, той москаль! Мы проведем операции по активной зачистке наших чиновников, которые подозрительно часто «посещают» Российскую Федерацию. Мы проведем крупную компанию по зачистке русских элементов в нашей стране, для стабилизации ситуации и чистки наших структур от российской агентуры."
 UKR_stabilization_of_donbass: "Стабилизация Донбасса"
 UKR_stabilization_of_donbass_desc: "Мы стабилизируем донецкую и луганскую область, для усложнения будущих потенциальных операций сепаратистов на наших территориях. Мы так же расширим подразделения полиции и СБУ, для полного контроля над Донбассом, для предотвращения удара в тыл нашим войскам. Так же наше правительство обязано организовать расширенную гуманитарную помощь и помощь жителям, потерявшим свое имущество в первой войне с сепаратизмом."
 UKR_operations_of_sbu: "Операции СБУ"
 UKR_operations_of_sbu_desc: "Мы профинансируем работу СБУ на землях ЛДНР, наши спецслужбы смогут вычислить место жительство некоторых ключевых людей в планах сепаратистов, что поможет нам вывести из строя ключевые точки опоры и на некоторое время дестабилизировать донецкое командование"
 UKR_form_people_militia: "Полная мобилизация"
 UKR_form_people_militia_desc: "Для борьбы с сепаратистами мы должны собрать все, что мы имеем. Медлить нельзя, мы обязаны быть готовы здесь и сейчас, такая огромная страна как Украина способна победить кучку сепаратистов. Либо сейчас, либо никогда."
 UKR_wipe_ot_minsk_agreements: "Подтереться Минскими соглашениями"
 UKR_wipe_ot_minsk_agreements_desc: "Мы провели быструю подготовку, ослабили сепаратисткие государства, мы обязаны победить эти «недообразования». Разговор бесполезен, кажется очевидным что русские не готовы к сдаче Донбасса просто так. Мы вернем наши территории, наших граждан, для сохранения территориальной целостности. Долой русню!"
 UKR_if_there_no_village_there_will_be_no_ukraine: "Без села - не будет Украины!"
 UKR_if_there_no_village_there_will_be_no_ukraine_desc: "Сельское хозяйство - одно из главных преимуществ Украины и важная часть нашей экономики. Мы должны использовать наши плодородные земли и поддерживать украинских фермеров, а не пытаться конкурировать с другими европейскими странами в отраслях, где Украина находится в менее выгодном положении. Развитие сельского хозяйства и поддержка села помогут укрепить нашу экономику и сделать Украину более сильной и независимой."
 UKR_search_for_new_partners: "Поиск партнёров"
 UKR_search_for_new_partners_desc: "Наши партнеры по ЕС будут только рады нашему стремлению к привязанной украинской экономике. Благодаря этому шагу мы не только приобрели лучшие условия - но и остановили спонсирования врага, что очень важно учитывая нашу ситуацию."
 UKR_social_independent_economy: "Независимая социальная экономика"
 UKR_social_independent_economy_desc: "Мы совершили невероятный скачек благодаря нашим реформам, мы построили хорошую экономику, с элементами поддержки населению, независимой от врагов экономикой, и с потенциальным цветениям нашего государства словно цветы. Сильная Украина - Сильная экономика."
 