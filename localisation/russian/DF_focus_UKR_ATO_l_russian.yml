l_russian:
 UKR_government_in_anarchy: "Анархия в правительстве"
 UKR_government_in_anarchy_desc: "Бывший президент сбежал из страны, а парламент не в состоянии взять на себя руководство. Власть парализована, институты не функционируют. Государство погружается в политический хаос, и на улицах Киева царит безвластие. Никто не контролирует ситуацию, и каждый решает, как ему действовать."
 UKR_start_of_ato: "Начало Антитеррористической операции"
 UKR_start_of_ato_desc: "Мы столкнулись с вооружённой угрозой, ставящей под сомнение суверенитет и порядок. Правительство принимает решение начать масштабную Антитеррористическую операцию. Операция будет запущена после указа главы государства и решения Совета национальной безопасности и обороны."
 UKR_new_parliament_composition: "Новый состав парламента"
 UKR_new_parliament_composition_desc: "Сформирован новый парламент после бегства Януковича. Начинается новый этап в управлении страной."
 UKR_mobilization_of_reservists: "Мобилизация резервистов"
 UKR_mobilization_of_reservists_desc: "Начинается мобилизация резервистов для усиления обороноспособности и подготовки к возможным столкновениям."
 UKR_deal_with_prorussians_protests: "Договор с пророссийскими протестующими"
 UKR_deal_with_prorussians_protests_desc: "Попытка договориться с пророссийскими активистами и снизить напряжённость в стране."
 UKR_recapture_part_of_donetsk_region: "Возвращение части Донецкой области"
 UKR_recapture_part_of_donetsk_region_desc: "Военные операции направлены на возвращение контроля над частью Донецкой области."
 UKR_recapture_part_of_luhansk_region: "Возвращение части Луганской области"
 UKR_recapture_part_of_luhansk_region_desc: "Военные операции направлены на возвращение контроля над частью Луганской области."
 UKR_send_additional_forces_to_odessa: "Отправка дополнительных сил в Одессу"
 UKR_send_additional_forces_to_odessa_desc: "Подкрепления направляются в Одессу для поддержки местных сил и стабилизации ситуации."
 UKR_block_the_crimea: "Блокада Крыма"
 UKR_block_the_crimea_desc: "Начинается блокада Крыма с целью ограничения движения и поставок."
 UKR_end_of_separatism: "Победа над сепаратизмом"
 UKR_end_of_separatism_desc: "Сепаратистские движения подавлены, страна возвращается к единству."
 UKR_send_militties_to_kharkov: "Отправка ополченцев в Харьков"
 UKR_send_militties_to_kharkov_desc: "Местные ополченцы направляются в Харьков для поддержки порядка и безопасности."
 UKR_crush_kharkov_people_republic: "Разгром Харьковской народной республики"
 UKR_crush_kharkov_people_republic_desc: "Военные действия направлены на ликвидацию самопровозглашённой Харьковской народной республики."
 UKR_humanitarion_help_to_people: "Гуманитарная помощь населению"
 UKR_humanitarion_help_to_people_desc: "Организация помощи гражданскому населению в зонах конфликта."
 UKR_strengthen_slavyansk: "Укрепление Славянска"
 UKR_strengthen_slavyansk_desc: "Усиление обороны и безопасности в Славянске."
 UKR_strengthen_kramatorsk: "Укрепление Краматорска"
 UKR_strengthen_kramatorsk_desc: "Усиление обороны и безопасности в Краматорске."
 UKR_emergency_redeployment_of_troops: "Чрезвычайное перебазирование войск"
 UKR_emergency_redeployment_of_troops_desc: "Быстрая переброска войск для реагирования на кризисные ситуации."
 UKR_organize_frontline: "Формирование линии фронта"
 UKR_organize_frontline_desc: "Меры по стабилизации и созданию линии фронта в зоне АТО."
 UKR_organize_defense: "Организация обороны"
 UKR_organize_defense_desc: "Меры по организации и укреплению обороны страны."
 UKR_prepare_the_defense_of_cities: "Подготовка обороны городов"
 UKR_prepare_the_defense_of_cities_desc: "Подготовка и укрепление оборонительных позиций в ключевых городах."
 UKR_launch_counterattacks: "Начало контрнаступлений"
 UKR_launch_counterattacks_desc: "Проведение контрнаступательных операций против мятежников."
 UKR_volunteer_battalions: "Добровольческие батальоны"
 UKR_volunteer_battalions_desc: "Формирование добровольческих батальонов для поддержки армии."
 UKR_volunteer_battalion_azov: "Батальон «Азов»"
 UKR_volunteer_battalion_azov_desc: "Создание и развертывание батальона «Азов» для борьбы с сепаратистами."
 UKR_volunteer_battalions_of_mvd: "Добровольческие батальоны МВД"
 UKR_volunteer_battalions_of_mvd_desc: "Формирование добровольческих батальонов при Министерстве внутренних дел."
 UKR_turn_to_the_west_for_help: "Обращение к Западу за помощью"
 UKR_new_foreign_policy: "Новый внешний курс"
 UKR_new_foreign_policy_desc: "Старые геополитические ориентиры окончательно ушли в прошлое. Нам нужно чётко зафиксировать новый вектор внешней политики страны."
 UKR_integration_with_nato: "Интеграция с НАТО"
 UKR_integration_with_nato_desc: "Чтобы укрепить обороноспособность страны, нам следует планомерно переводить армию на стандарты Североатлантического альянса."
 UKR_sign_the_association_agreement_with_eu: "Подписание Соглашения об ассоциации с ЕС"
 UKR_sign_the_association_agreement_with_eu_desc: "Подписание соглашения станет мощным фундаментом для глубоких экономических и политических реформ."
 UKR_cooperation_with_turkey: "Сотрудничество с Турцией"
 UKR_cooperation_with_turkey_desc: "Закупка современных беспилотников и расширение военно-технического партнёрства с Анкарой значительно усилят наш потенциал."
 UKR_millitary_exercises_with_nato: "Военные учения с НАТО"
 UKR_millitary_exercises_with_nato_desc: "Регулярные совместные маневры позволят бойцам обменяться опытом и до автоматизма отработать координацию с союзниками."
 UKR_visa_free_travel_with_the_eu: "Безвизовый режим с ЕС"
 UKR_visa_free_travel_with_the_eu_desc: "Выполнение всех требований еврокомиссии откроет гражданам возможность свободных поездок в страны Европы."
 UKR_trade_with_the_eu: "Торговля с ЕС"
 UKR_trade_with_the_eu_desc: "Полноценный запуск зоны свободной торговли с Евросоюзом даст нашей экономике мощный импульс."
 UKR_join_to_the_nato: "Вступление в НАТО"
 UKR_join_to_the_nato_desc: "Мы выполнили основные критерии альянса и готовы подать официальную заявку на полноправное членство."
 UKR_macro_financial_assistance_from_the_eu: "Макрофинансовая помощь ЕС"
 UKR_macro_financial_assistance_from_the_eu_desc: "Получение льготных траншей и кредитных программ от Европы позволит стабилизировать финансовую систему."
 UKR_lublin_triangle: "Люблинский треугольник"
 UKR_lublin_triangle_desc: "Создание регионального альянса с Польшей и Литвой укрепит безопасность и сотрудничество в Центрально-Восточной Европе."
 UKR_the_breadbasket_of_europe: "Житница Европы"
 UKR_the_breadbasket_of_europe_desc: "Модернизация аграрного сектора и выходы на европейские рынки сделают нас одним из главных поставщиков продовольствия в регион."
 UKR_associated_trio: "Ассоциированное трио"
 UKR_associated_trio_desc: "Координация усилий с Грузией и Молдавией позволит нам совместно продвигать идею вступления в Европейский союз."
 UKR_join_to_the_eu: "Вступление в ЕС"
 UKR_join_to_the_eu_desc: "Завершив все ключевые реформы, страна окончательно закрепляет свой вектор развития в составе Европейского союза."
 UKR_turn_to_the_west_for_help_desc: "В условиях нарастающего кризиса и внешней угрозы национальная безопасность страны напрямую зависит от поддержки международных партнеров. Прямой диалог с лидерами западного мира и руководством НАТО открывает возможности для получения критически важной финансовой, технической и консультативной поддержки. Координация совместных усилий позволит не только укрепить обороноспособность государства, но и стабилизировать внутреннюю ситуацию, послав четкий сигнал о том, что мы не одни в этой борьбе. Заручившись гарантиями союзников, мы сможем эффективнее противостоять вызовам и уверенно защищать свой суверенитет."
