 UKR_trio_tt: "§HЭффекты евроинтеграции:§!\n  • Скорость исследований: §G+5%§!\n  • Прирост политической власти: §G+5%§!"
 UKR_join_eu_tt: "§HПодача заявки на полноправное членство в ЕС§!\n\n§YВ случае одобрения заявки Брюсселем:§!\n  • Стабильность: §G+15%§!\n  • Потребительские товары: §G-3%§!\n  • Скорость исследований: §G+5%§!\n  • Скорость строительства: §G+5%§!\n  • Прирост политической власти: §G+5%§!\n  • Эффективность фабрик: §G+5%§!\n  • Прирост населения в месяц: §R-5%§!\n§R⚠️ Отток населения выйдет на максимальный уровень!§!"
 UKR_integration_with_nato_tt: "§HМодернизация ВСУ:§!\n  • Организация армии: §G+5%§!\n  • Скорость планирования: §G+5%§!"
