 UKR_strengthening_of_antimaidan_laws:0 "Усиление анти-майдановских законов"
 UKR_prevent_civil_war:0 "Предотвращение гражданской войны"
 UKR_prevent_civil_war_desc:0 "Ситуация в стране нагрелась до предела и грозит перерасти в полномасштабное силовое противостояние. Чтобы избежать масштабного кровопролития и полной катастрофы, правительство должно пойти на экстренные шаги и зафиксировать мирный диалог со всеми сторонами."
 UKR_restoring_the_image_in_the_west:0 "Восстановление имиджа на Западе"
 UKR_restoring_the_image_in_the_west_desc:0 "Западные партнеры и международные организации крайне обеспокоены происходящим на улицах Киева. Нам необходимо восстановить плотный контакт с европейскими дипломатами и наглядно доказать что официальное руководство страны держит ситуацию под контролем."
 UKR_a_step_towards_the_protesters:0 "Шаг навстречу протестующим"
 UKR_a_step_towards_the_protesters_desc:0 "Улица продолжает требовать кардинальных изменений и дальше игнорировать эти требования становится просто опасно. Власти вынуждены идти на прямые уступки гражданам чтобы снизить критический градус напряжения в обществе."
 UKR_declaration_of_a_political_thaw:0 "Объявление политической оттепели"
 UKR_declaration_of_a_political_thaw_desc:0 "Для существенного снижения риска дальнейшей эскалации насилие правительство официально объявляет курс на политическое послабление. Это включает в себя готовность мириться с системной оппозицией и искать новые пути взаимодействия."
 UKR_return_to_the_2004_constitution:0 "Возврат к конституции 2004 года"
 UKR_return_to_the_2004_constitution_desc:0 "Возвращение к парламентско президентской форме правления становится ключевым компромиссом в переговорах. Перераспределение полномочий между ветвями власти позволит снять острый политический кризис и удовлетворить оппонентов."
 UKR_returning_to_the_eurointegration:0 "Возвращение к евроинтеграции"
 UKR_returning_to_the_eurointegration_desc:0 "Внезапная пауза в подготовке к подписанию договора с ЕС выставила власть в невыгодном свете и вызвала бурю. Официальное возобновление переговоров с Брюсселем поможет частично вернуть доверие со стороны населения."
 UKR_relax_repressive_laws:0 "Смягчение жестких законов"
 UKR_relax_repressive_laws_desc:0 "Нормативные акты принятые в середине января вызвали колоссальную волну возмущения среди граждан. Быстрая отмена наиболее строгих статей покажет реальную готовность властей к диалогу и сгладит углы."
 UKR_reform_of_berkut:0 "Реформа Беркута"
 UKR_reform_of_berkut_desc:0 "Спецподразделение подвергается жесточайшей критике за свои действия при разгонах. Проведение глубокой реформы и введение жесткого регламента работы позволит сохранить подготовленный спецназ но полностью сменить его подход к работе."
 UKR_liqudation_of_berkut:0 "Ликвидация Беркута"
 UKR_liqudation_of_berkut_desc:0 "Полное расформирование подразделения станет главным символическим шагом со стороны государства. Именно этого решения до сих пор принципиально добиваются протестующие для окончательного примирения сторон."
 UKR_severance_of_economic_ties_with_russia:0 "Разрыв экономических связей с Россией"
 UKR_severance_of_economic_ties_with_russia_desc:0 "Решительный поворот в сторону Европы неизбежно требует пересмотра старых экономических договоренностей с Востоком. Это приведет к ощутимым финансовым рискам для нашей промышленности но зафиксирует новый вектор."
 UKR_sign_an_association_agreement_with_the_eu:0 "Подписание соглашения об ассоциации с ЕС"
 UKR_sign_an_association_agreement_with_the_eu_desc:0 "Логический финал длительного политического противостояния внутри страны. Подписание исторического документа с Европейским союзом окончательно закрепит международный статус государства на ближайшие годы."
