l_russian:
 UKR_government_in_anarchy:0 "Анархия в правительстве"
 UKR_government_in_anarchy_desc:0 "Бывший президент сбежал из страны, а парламент не в состоянии взять на себя руководство. Власть парализована, институты не функционируют. Государство погружается в политический хаос, и на улицах Киева царит безвластие. Никто не контролирует ситуацию, и каждый решает, как ему действовать."
 UKR_start_of_ato:0 "Начало Антитеррористической операции"
 UKR_start_of_ato_desc:0 "Мы столкнулись с вооружённой угрозой, ставящей под сомнение суверенитет и порядок. Правительство принимает решение начать масштабную Антитеррористическую операцию. Операция будет запущена после указа главы государства и решения Совета национальной безопасности и обороны."
 UKR_new_parliament_composition:0 "Новый состав парламента"
 UKR_new_parliament_composition_desc:0 "Сформирован новый парламент после бегства Януковича. Начинается новый этап в управлении страной."
 UKR_mobilization_of_reservists:0 "Мобилизация резервистов"
 UKR_mobilization_of_reservists_desc:0 "Начинается мобилизация резервистов для усиления обороноспособности и подготовки к возможным столкновениям."
 UKR_deal_with_prorussians_protests:0 "Договор с пророссийскими протестующими"
 UKR_deal_with_prorussians_protests_desc:0 "Попытка договориться с пророссийскими активистами и снизить напряжённость в стране."
 UKR_recapture_part_of_donetsk_region:0 "Возвращение части Донецкой области"
 UKR_recapture_part_of_donetsk_region_desc:0 "Военные операции направлены на возвращение контроля над частью Донецкой области."
 UKR_recapture_part_of_luhansk_region:0 "Возвращение части Луганской области"
 UKR_recapture_part_of_luhansk_region_desc:0 "Военные операции направлены на возвращение контроля над частью Луганской области."
 UKR_send_additional_forces_to_odessa:0 "Отправка дополнительных сил в Одессу"
 UKR_send_additional_forces_to_odessa_desc:0 "Подкрепления направляются в Одессу для поддержки местных сил и стабилизации ситуации."
 UKR_block_the_crimea:0 "Блокада Крыма"
 UKR_block_the_crimea_desc:0 "Начинается блокада Крыма с целью ограничения движения и поставок."
 UKR_end_of_separatism:0 "Победа над сепаратизмом"
 UKR_end_of_separatism_desc:0 "Сепаратистские движения подавлены, страна возвращается к единству."
 UKR_send_militties_to_kharkov:0 "Отправка ополченцев в Харьков"
 UKR_send_militties_to_kharkov_desc:0 "Местные ополченцы направляются в Харьков для поддержки порядка и безопасности."
 UKR_crush_kharkov_people_republic:0 "Разгром Харьковской народной республики"
 UKR_crush_kharkov_people_republic_desc:0 "Военные действия направлены на ликвидацию самопровозглашённой Харьковской народной республики."
 UKR_humanitarion_help_to_people:0 "Гуманитарная помощь населению"
 UKR_humanitarion_help_to_people_desc:0 "Организация помощи гражданскому населению в зонах конфликта."
 UKR_strengthen_slavyansk:0 "Укрепление Славянска"
 UKR_strengthen_slavyansk_desc:0 "Усиление обороны и безопасности в Славянске."
 UKR_strengthen_kramatorsk:0 "Укрепление Краматорска"
 UKR_strengthen_kramatorsk_desc:0 "Усиление обороны и безопасности в Краматорске."
 UKR_emergency_redeployment_of_troops:0 "Чрезвычайное перебазирование войск"
 UKR_emergency_redeployment_of_troops_desc:0 "Быстрая переброска войск для реагирования на кризисные ситуации."
 UKR_organize_frontline:0 "Формирование линии фронта"
 UKR_organize_frontline_desc:0 "Меры по стабилизации и созданию линии фронта в зоне АТО."
 UKR_organize_defense:0 "Организация обороны"
 UKR_organize_defense_desc:0 "Меры по организации и укреплению обороны страны."
 UKR_prepare_the_defense_of_cities:0 "Подготовка обороны городов"
 UKR_prepare_the_defense_of_cities_desc:0 "Подготовка и укрепление оборонительных позиций в ключевых городах."
 UKR_launch_counterattacks:0 "Начало контрнаступлений"
 UKR_launch_counterattacks_desc:0 "Проведение контрнаступательных операций против мятежников."
 UKR_volunteer_battalions:0 "Добровольческие батальоны"
 UKR_volunteer_battalions_desc:0 "Формирование добровольческих батальонов для поддержки армии."
 UKR_volunteer_battalion_azov:0 "Батальон «Азов»"
 UKR_volunteer_battalion_azov_desc:0 "Создание и развертывание батальона «Азов» для борьбы с сепаратистами."
 UKR_volunteer_battalions_of_mvd:0 "Добровольческие батальоны МВД"
 UKR_volunteer_battalions_of_mvd_desc:0 "Формирование добровольческих батальонов при Министерстве внутренних дел."
 UKR_turn_to_the_west_for_help:0 "Обращение к Западу за помощью"
 UKR_new_foreign_policy:0 "Новый внешний курс"
 UKR_new_foreign_policy_desc:0 "Старые геополитические ориентиры окончательно ушли в прошлое. Нам нужно чётко зафиксировать новый вектор внешней политики страны."
 UKR_integration_with_nato:0 "Интеграция с НАТО"
 UKR_integration_with_nato_desc:0 "Чтобы укрепить обороноспособность страны, нам следует планомерно переводить армию на стандарты Североатлантического альянса."
 UKR_sign_the_association_agreement_with_eu:0 "Подписание Соглашения об ассоциации с ЕС"
 UKR_sign_the_association_agreement_with_eu_desc:0 "Подписание соглашения станет мощным фундаментом для глубоких экономических и политических реформ."
 UKR_cooperation_with_turkey:0 "Сотрудничество с Турцией"
 UKR_cooperation_with_turkey_desc:0 "Закупка современных беспилотников и расширение военно-технического партнёрства с Анкарой значительно усилят наш потенциал."
 UKR_millitary_exercises_with_nato:0 "Военные учения с НАТО"
 UKR_millitary_exercises_with_nato_desc:0 "Регулярные совместные маневры позволят бойцам обменяться опытом и до автоматизма отработать координацию с союзниками."
 UKR_visa_free_travel_with_the_eu:0 "Безвизовый режим с ЕС"
 UKR_visa_free_travel_with_the_eu_desc:0 "Выполнение всех требований еврокомиссии откроет гражданам возможность свободных поездок в страны Европы."
 UKR_trade_with_the_eu:0 "Торговля с ЕС"
 UKR_trade_with_the_eu_desc:0 "Полноценный запуск зоны свободной торговли с Евросоюзом даст нашей экономике мощный импульс."
 UKR_join_to_the_nato:0 "Вступление в НАТО"
 UKR_join_to_the_nato_desc:0 "Мы выполнили основные критерии альянса и готовы подать официальную заявку на полноправное членство."
 UKR_macro_financial_assistance_from_the_eu:0 "Макрофинансовая помощь ЕС"
 UKR_macro_financial_assistance_from_the_eu_desc:0 "Получение льготных траншей и кредитных программ от Европы позволит стабилизировать финансовую систему."
 UKR_lublin_triangle:0 "Люблинский треугольник"
 UKR_lublin_triangle_desc:0 "Создание регионального альянса с Польшей и Литвой укрепит безопасность и сотрудничество в Центрально-Восточной Европе."
 UKR_the_breadbasket_of_europe:0 "Житница Европы"
 UKR_the_breadbasket_of_europe_desc:0 "Модернизация аграрного сектора и выходы на европейские рынки сделают нас одним из главных поставщиков продовольствия в регион."
 UKR_associated_trio:0 "Ассоциированное трио"
 UKR_associated_trio_desc:0 "Координация усилий с Грузией и Молдавией позволит нам совместно продвигать идею вступления в Европейский союз."
 UKR_join_to_the_eu:0 "Вступление в ЕС"
 UKR_join_to_the_eu_desc:0 "Завершив все ключевые реформы, страна окончательно закрепляет свой вектор развития в составе Европейского союза."
 UKR_turn_to_the_west_for_help_desc:0 "Запрос международной поддержки и помощи в борьбе с внутренними угрозами."
