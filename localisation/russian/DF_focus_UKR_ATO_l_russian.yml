 UKR_snap_presidential_elections: "Президентские выборы 2014"
 UKR_poroshenko_victory: "Порошенко"
 UKR_poroshenko_victory_desc: "Успешное завершение избирательной кампании 2014 года закладывает фундамент для новой государственной политики. Петр Порошенко принимает присягу в качестве Президента Украины в один из самых драматичных моментов современной истории страны. Перед новой администрацией стоит колоссальный вызов: остановить углубление экономического кризиса, запустить масштабные реформы государственного сектора и стабилизировать ситуацию на восточных рубежах. Борьба за суверенитет и европейский вектор развития отныне становятся ключевыми приоритетами национальной повестки."
