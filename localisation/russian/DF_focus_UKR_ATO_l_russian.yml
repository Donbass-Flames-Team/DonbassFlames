 UKR_millitary_exercises_with_nato_tt: "§HМодернизация ВСУ:§!\n  • Атака армии: §G+5%§!\n  • Защита армии: §G+5%§!"
 UKR_join_to_the_nato_tt: "§HПодача заявки на вступление в НАТО§!\n\n§YВ случае одобрения заявки альянсом:§!\n  • Стабильность: §G+10%§!\n  • Поддержка войны: §G+10%§!\n  • Атака армии: §G+5%§!\n  • Защита армии: §G+5%§!\n  • Организация армии: §G+5%§!"
 UKR_the_end_of_the_yanukovych_regime: "Конец режима Януковича"
 UKR_the_end_of_the_yanukovych_regime_desc: "Бегство Виктора Януковича положило конец прежнему политическому порядку. Теперь Украина должна окончательно демонтировать остатки его системы и начать строительство нового государства."
 UKR_army_language_faith: "Армія Мова Віра"
 UKR_army_language_faith_desc: "Сильная армия, защищённый государственный язык и независимая украинская церковь станут опорами нашей государственности и национального единства."
 UKR_support_ukranian_language: "Поддержать украинский язык"
 UKR_support_ukranian_language_desc: "Украинский язык должен занять достойное место во всех сферах общественной жизни. Государственная поддержка укрепит его позиции в образовании, культуре, средствах массовой информации и работе государственных учреждений."
 UKR_healthcare_reform: "Реформа здравоохранения"
 UKR_healthcare_reform_desc: "Устаревшая система здравоохранения страдает от бюрократии, коррупции и хронического недостатка финансирования. Новые стандарты и принцип финансирования медицинских услуг в интересах пациента сделают лечение доступнее и эффективнее."
 UKR_police_reform: "Реформировать полицию"
 UKR_police_reform_desc: "Старая советская милиция больше не соответствует требованиям демократического государства. Мы создадим профессиональную Национальную полицию, которая будет служить гражданам и пользоваться их доверием."
 UKR_education_reform: "Реформа образования"
 UKR_education_reform_desc: "Украинское образование нуждается в современных учебных программах, новых стандартах преподавания и большей самостоятельности учебных заведений. Эти изменения подготовят молодое поколение к жизни в современной европейской стране."
 UKR_form_kord: "Сформировать КОРД"
 UKR_form_kord_desc: "Организованная преступность, терроризм и вооружённое сопротивление требуют создания специально подготовленного подразделения. КОРД станет элитной силой быстрого реагирования Национальной полиции Украины."
 UKR_groysman_govenrement: "Правительство Гройсмана"
 UKR_groysman_govenrement_desc: "Новое правительство во главе с Владимиром Гройсманом должно продолжить начатые преобразования, стабилизировать экономику и ускорить проведение реформ, необходимых для европейского будущего Украины."
 UKR_anti_raider_law: "Антирейдерский закон"
 UKR_anti_raider_law_desc: "Незаконные захваты предприятий, земли и собственности подрывают доверие к государству и мешают развитию экономики. Новый закон усилит защиту владельцев, государственных реестров и законного права собственности."
 UKR_ministry_of_information_policy_of_ukraine: "Министерство информационной политики Украины"
 UKR_ministry_of_information_policy_of_ukraine_desc: "Российская пропаганда и дезинформация угрожают национальной безопасности Украины. Новое министерство будет координировать государственные коммуникации, защищать информационное пространство и противодействовать враждебному влиянию."
 UKR_independent_church: "Православная церковь Украины"
 UKR_independent_church_desc: "Украинские православные общины должны объединиться в единую поместную церковь, независимую от Москвы. Создание Православной церкви Украины укрепит духовную самостоятельность и национальное единство страны."
 UKR_take_tomos: "Томос"
 UKR_take_tomos_desc: "Получение Томоса от Вселенского патриархата официально закрепит автокефалию Православной церкви Украины и подтвердит её независимый статус в православном мире."

 UKR_military_reforms_afu: "Военные реформы ВСУ"
 UKR_military_reforms_afu_desc: "События 2014-2015 годов выявили критические слабости украинской армии. Минские соглашения дали нам передышку, которую необходимо использовать для глубокой модернизации Вооруженных сил. Пришло время превратить ВСУ в современную боеспособную армию европейского образца."

 UKR_western_instructors: "Западные инструкторы"
 UKR_western_instructors_desc: "Опыт армий стран НАТО бесценен для наших военных. Приглашение западных инструкторов позволит внедрить передовые методы подготовки, тактику ведения боя и стандарты профессиональной подготовки, которые кардинально изменят уровень нашей армии."

 UKR_cooperation_with_volunteers: "Сотрудничество с добровольцами"
 UKR_cooperation_with_volunteers_desc: "Добровольческие батальоны показали высокую мотивацию и эффективность в боевых действиях. Необходимо наладить их интеграцию в структуру регулярных вооруженных сил, сохранив при этом их боевой дух и инициативность."

 UKR_ukranian_mic: "Украинский ВПК"
 UKR_ukranian_mic_desc: "Зависимость от импорта вооружений делает нас уязвимыми. Развитие собственного военно-промышленного комплекса обеспечит армию необходимой техникой и создаст тысячи рабочих мест в оборонной промышленности."

 UKR_new_communication_systems: "Новые системы связи"
 UKR_new_communication_systems_desc: "Устаревшие советские системы связи легко перехватываются и глушатся противником. Внедрение современных защищенных цифровых систем командования и управления критически важно для координации войск на поле боя."

 UKR_reliance_on_decentralized_command: "Опора на децентрализованное командование"
 UKR_reliance_on_decentralized_command_desc: "Западный опыт показывает эффективность децентрализованного управления, где младшие командиры имеют больше полномочий для принятия решений. Это повышает гибкость и инициативность подразделений в боевых условиях."

 UKR_reliance_on_centralized_command: "Опора на централизованное командование"
 UKR_reliance_on_centralized_command_desc: "Жесткая вертикаль командования обеспечивает четкую координацию действий и исполнение приказов. Централизованное управление позволяет эффективно планировать крупномасштабные операции и избегать хаоса на поле боя."

 UKR_mlrs_vilkha: "РСЗО «Вільха»"
 UKR_mlrs_vilkha_desc: "Разработка собственной реактивной системы залпового огня «Вільха» даст нам современное высокоточное оружие дальнего поражения. Эта система станет мощным средством огневой поддержки наших войск."

 UKR_investments_in_armored_vehicles: "Инвестиции в бронетехнику"
 UKR_investments_in_armored_vehicles_desc: "Модернизация существующих танков и БМП, а также разработка новых образцов бронетехники повысит защищенность и огневую мощь наших механизированных подразделений."

 UKR_new_infantry_equipment: "Новое снаряжение пехоты"
 UKR_new_infantry_equipment_desc: "Современная экипировка, бронежилеты, каски, приборы ночного видения и новое стрелковое оружие значительно повысят боеспособность и выживаемость наших солдат на поле боя."

 UKR_missionary_command: "Миссионерское командование"
 UKR_missionary_command_desc: "Внедрение института миссионерского командования, основанного на западном опыте, укрепит моральный дух войск и обеспечит духовную поддержку военнослужащих в сложных боевых условиях."

 UKR_deosovetization_of_army: "Десоветизация армии"
 UKR_deosovetization_of_army_desc: "Необходимо окончательно избавиться от советских традиций в армии: устаревших уставов, дедовщины и коррупции. Создание новой военной культуры, основанной на европейских ценностях и профессионализме."

 UKR_expand_the_general_staff: "Расширение генерального штаба"
 UKR_expand_the_general_staff_desc: "Генеральный штаб нуждается в усилении аналитическими, разведывательными и планирующими подразделениями. Это улучшит качество оперативного планирования и координацию всех видов вооруженных сил."

 UKR_creation_of_sso: "Создание ССО"
 UKR_creation_of_sso_desc: "Силы специальных операций станут элитным подразделением для выполнения сложнейших задач: разведки, диверсий, контртеррористических операций и специальных миссий за линией фронта."

 UKR_modernization_of_airfields: "Модернизация аэродромов"
 UKR_modernization_of_airfields_desc: "Восстановление и модернизация военных аэродромов позволит разместить современную авиацию, улучшить системы ПВО и обеспечить надежную базу для воздушных операций."

 UKR_modernization_of_odessa_ports: "Модернизация одесских портов"
 UKR_modernization_of_odessa_ports_desc: "Порты Одессы имеют стратегическое значение для снабжения и логистики. Их модернизация позволит принимать военные грузы, укрепить береговую оборону и улучшить взаимодействие с военно-морскими силами союзников."

 UKR_hur_operations: "Операции ГУР"
 UKR_hur_operations_desc: "Главное управление разведки должно активизировать специальные операции на временно оккупированных территориях и в глубоком тылу противника для сбора разведданных и проведения диверсионных акций."

 UKR_expansion_of_sso_training_centers: "Расширение учебных центров ССО"
 UKR_expansion_of_sso_training_centers_desc: "Создание современных тренировочных баз для сил специальных операций с использованием западных стандартов подготовки обеспечит постоянный приток высококвалифицированных бойцов."

 UKR_joint_flight_exercises_with_the_west: "Совместные летные учения с Западом"
 UKR_joint_flight_exercises_with_the_west_desc: "Регулярные совместные учения с ВВС стран НАТО повысят уровень подготовки наших летчиков, улучшат взаимодействие и позволят освоить передовую тактику воздушного боя."

 UKR_marine_infantry_reform: "Реформа морской пехоты"
 UKR_marine_infantry_reform_desc: "После потери Крыма морская пехота нуждается в полной перестройке. Создание новых подразделений, современное вооружение и подготовка по стандартам НАТО превратят их в элитную ударную силу."

 UKR_expand_ammunition_plants: "Расширение заводов боеприпасов"
 UKR_expand_ammunition_plants_desc: "Опыт боевых действий показал огромный расход боеприпасов. Расширение мощностей заводов обеспечит армию достаточным количеством снарядов, патронов и ракет для длительных операций."

 UKR_reform_of_the_sergeant_corps: "Реформа сержантского корпуса"
 UKR_reform_of_the_sergeant_corps_desc: "Профессиональный сержантский корпус — основа любой современной армии. Создание института профессиональных сержантов по западному образцу улучшит подготовку солдат и качество управления подразделениями."

 UKR_creation_of_a_reserve_corps: "Создание корпуса резерва"
 UKR_creation_of_a_reserve_corps_desc: "Формирование мобильного резервного корпуса позволит быстро реагировать на прорывы противника и усиливать критические участки фронта в случае эскалации конфликта."

 UKR_strengthen_general_staff_planning: "Усиление планирования генштаба"
 UKR_strengthen_general_staff_planning_desc: "Внедрение современных методов оперативного планирования, аналитики и моделирования боевых операций значительно повысит эффективность работы генерального штаба."

 UKR_expand_military_factories: "Расширение военных заводов"
 UKR_expand_military_factories_desc: "Строительство новых и модернизация существующих военных заводов обеспечит производство современного вооружения, техники и снаряжения для растущих нужд армии."

 UKR_reform_of_dshv: "Реформа ДШВ"
 UKR_reform_of_dshv_desc: "Десантно-штурмовые войска должны стать высокомобильными элитными подразделениями быстрого реагирования. Новое вооружение, техника и интенсивная подготовка превратят их в грозную ударную силу."

 UKR_reform_of_tro: "Реформа ТРО"
 UKR_reform_of_tro_desc: "Территориальная оборона нуждается в профессионализации и четкой структуре. Реформа превратит ТРО в эффективную силу для защиты тыловых районов, освобождая регулярные войска для наступательных операций."

 UKR_command_of_the_logistics_forces_afu: "Командование сил логистики ВСУ"
 UKR_command_of_the_logistics_forces_afu_desc: "Создание единого командования логистики решит проблемы снабжения войск. Централизованное управление материально-техническим обеспечением повысит эффективность доставки ресурсов на фронт."

 UKR_increase_the_number_of_contract_soldiers: "Увеличение числа контрактников"
 UKR_increase_the_number_of_contract_soldiers_desc: "Переход от призывной армии к профессиональной контрактной службе повысит качество личного состава, мотивацию бойцов и общую боеспособность вооруженных сил."

 UKR_nato_standard_army: "Армия стандарта НАТО"
 UKR_nato_standard_army_desc: "Полный переход на стандарты НАТО завершит трансформацию ВСУ. Совместимость вооружений, единые процедуры и взаимодействие с альянсом сделают украинскую армию полноправным партнером западных союзников."
 UKR_Zelensky: "Зеленский"
 UKR_information_war: "Информационная война"
 UKR_information_war_desc: "Современное противостояние разворачивается не только на полях сражений, но и в медийном пространстве. Социальные сети и новостные ресурсы наводнены скоординированными сетями российских ботов и фабриками троллей, распространяющими фейки для дестабилизации ситуации внутри страны. Контроль над информационными потоками, пресечение вражеских манипуляций и защита цифровой инфраструктуры становятся вопросами выживания. Масштабная контрпропаганда и блокировка ботнетов позволят защитить умы граждан от паники, укрепить веру в государственные институты и обеспечить надежный тыл для наших войск."
 UKR_ban_russian_social_network: "Блокировка российских сервисов"
 UKR_ban_russian_social_network_desc: "Использование популярных платформ, таких как «ВКонтакте», «Одноклассники» и сервисов «Яндекс», наносит прямой ущерб безопасности государства в условиях гибридной войны. Данные ресурсы активно используются спецслужбами противника для сбора персональных данных граждан, координации подрывной деятельности и массового распространения дезинформации. Решительный запрет на их работу в национальном цифровом пространстве позволит перекрыть ключевые каналы враждебного влияния. Ограничив доступ к этим площадкам, мы защитим информационное поле страны и сделаем важный шаг к укреплению кибербезопасности и внутренней стабильности."
 