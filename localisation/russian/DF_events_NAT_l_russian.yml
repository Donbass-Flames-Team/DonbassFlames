 NAT.1.t:0 "Черногория вступает в НАТО"
 NAT.1.d:0 "Черногория официально стала 29-м государством — членом НАТО 5 июня 2017 года. Процесс вступления начался после получения приглашения на саммите Альянса в декабре 2015 года и завершился после ратификации протокола всеми государствами-членами. Вступление Черногории завершило процесс расширения НАТО на побережье Адриатического моря. После завершения процедуры Черногория получила все права и обязанности государства — члена альянса. Незадолго до вступления отношения между Подгорицей и Москвой значительно ухудшились на фоне обвинений в попытке организации государственного переворота в 2016 году также Сербия выступала против присоединения страны к НАТО, рассматривая этот шаг как угрозу своей безопасности. Примечательно, что менее чем двумя десятилетиями ранее Черногория подвергалась авиаударам НАТО в ходе операции против Союзной Республики Югославии."
 NAT.1.a:0 "Балканы меняются"

 NAT.2.t:0 "Северная Македония вступает в НАТО"
 NAT.2.d:0 "Северная Македония официально стала 30-м государством — членом НАТО 27 марта 2020 года. Вступление стало возможным после урегулирования спора с Грецией о названии страны и подписания Преспанского соглашения, по которому государство изменило название с Македонии на Северную Македонию. Протокол о присоединении был подписан в 2019 году и затем ратифицирован всеми странами — членами Альянса. Для правительства в Скопье членство рассматривалось как гарантия безопасности и шаг к дальнейшей евроатлантической интеграции. Россия критиковала расширение НАТО, рассматривая его как усиление западного влияния в регионе."
 NAT.2.a:0 "Альянс расширяется"

 NAT.3.t:0 "Финляндия вступает в НАТО"
 NAT.3.d:0 "Финляндия официально стала членом НАТО. Процесса присоединения значительно ускорился вследствие полномасштабной войны в Украине. Война в Украине привела к пересмотру финской политики военного нейтралитета, сохранявшейся на протяжении десятилетий. Решение о вступлении получило широкую поддержку среди населения и большинства политических партий страны. После завершения процедуры Финляндия стала полноправным участником Североатлантического альянса. Присоединение увеличило общую протяжённость сухопутной границы НАТО с Россией с 1 215 км до 2 555 км. Вступление Финляндии стало одним из наиболее значимых последствий изменения европейской безопасности после начала войны в Украине."
 NAT.3.a:0 "Не расширение нато..."

 NAT.4.t:0 "Швеция вступает в НАТО"
 NAT.4.d:0 "Швеция официально стала членом НАТО, сделав один из самых значительных поворотов в своей внешней политике за последние два столетия. Государство, сохранявшее военный нейтралитет более 200 лет, приняло решение присоединиться к Альянсу на фоне войны в Украине и присоединению перед этим Финляндии. Вступление Швеции значительно усилило позиции НАТО в Балтийском регионе."
 NAT.4.a:0 "НАТО становится крепче"