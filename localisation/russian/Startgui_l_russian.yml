 start_gui_map_optimize_desc: "При нажатии на галочку на карте будут объединены Литва, Польша, Словакия, Венгрия и Румыния в единую страну НАТО чтобы увеличить FPS и игра шла быстрее.\n(Это действие невозвратно)"
 mod_dev_status_title: "МОДИФИКАЦИЯ НАХОДИТСЯ В СТАДИИ\nОТКРЫТОГО АЛЬФА-ТЕСТИРОВАНИЯ"
 mod_dev_status_desc: "НАША КОМАНДА ЕЖЕДНЕВНО ТРУДИТСЯ НАД РАСШИРЕНИЕМ ИГРОВЫХ ВОЗМОЖНОСТЕЙ И ПРОРАБОТКОЙ КОНТЕНТА.\nТЕКУЩАЯ ВЕРСИЯ МОДА МОЖЕТ СОДЕРЖАТЬ ОШИБКИ,\nНО ИМЕННО ВАШЕ УЧАСТИЕ В ТЕСТИРОВАНИИ ПОМОГАЕТ НАМ ДЕЛАТЬ МОДИФИКАЦИЮ ЛУЧШЕ, СТАБИЛЬНЕЕ И КАЧЕСТВЕННЕЕ С КАЖДЫМ ОБНОВЛЕНИЕМ."
 mod_dev_status_footer: "СПАСИБО ЗА ВАШ ИНТЕРЕС К МОДУ\nПРИЯТНОЙ ИГРЫ!"

 patch_notes_text: "Новый исторический и альтернативно-исторический контент.\nНовые древа фокусов ЛНР и ДНР.\nГражданская война в Украине.\nКонтент для Днепропетровской администрации, Днепропетровской Народной Республики, Северодонецкой группировки, Автономной Республики Крым\nНовые фокусы Украине.\nДрева технологий Украины, Российской Федерации и Народных Республик.\nНовые страны - НАТО, ЧВК «Вагнер», Запорожская Народная Республика, Херсонская Народная Республика, Николаевская Народная Республика, Бессарабская Народная Республика, Днепропетровская Народная Республика, Днепропетровская Администрация, Казачья национальная гвардия Всевеликого войска Донского, Северодонецкое ополчение, Украинская Военная Держава, Украинская Демократическая Республика, Украинская Соборная Держава, Пятая Украинская Республика, Подкарпатская Русь.\nПолная перерисовка провинций в Луганской области. Перерисовка следующих городов и территорий рядом с ними - Днепр, Харьков, Одесса, Николаев.\nУлучшение механики захвата Крыма.\nВ механике выборов в Украине проработаны: Петр Порошенко, Юлия Тимошенко, Олег Ляшко, Михаил Добкин, Дарт Алексеевич Вейдер\nУлучшение восстаний.\nУлучшение баланса.\nЛидеры в ЛНР от марта 2014 года до 2026 года.\nВсе лидеры с портретами.\nНовые цвета стран на карте.\nНовые генералы в Народных Республиках с портретами.\nИконки для фокусов Украины, ДНР, ЛНР и Днепропетровской администрации.\nБолее доработанный интерфейс.\nРежим стримера в настройках партии.\nОптимизация файлов мода.\n44 новых фона загрузки."
