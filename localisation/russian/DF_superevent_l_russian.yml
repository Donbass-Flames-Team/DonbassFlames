l_russian:
 sp_event_UKR_start_of_ato_title: "Начало АТО"
 sp_event_UKR_start_of_ato_quote: "«Враги Украины пытаются разыграть крымский сценарий, но мы этого\n не допустим. Против тех, кто взял в руки оружие, будут проводиться антитеррористические мероприятия» \n- §YАлександр Турчинов§!"
 sp_event_UKR_start_of_ato_remark: "Україна буде єдиною!"

 sp_event_special_military_operation_title: "Специальная Военная Операция"
 sp_event_special_military_operation_quote: "«Мы продолжаем бороться. У нас нет другого выбора, кроме как продолжать бороться за нашу свободу» \n- §YВладимир Зеленский§!"
 sp_event_special_military_operation_remark: "Начало конца..."

 sp_event_separatist_victory_title: "Победа сепаратистов"
 sp_event_separatist_victory_quote: "«Настанет время, когда один скажет Слава ДНР, а миллионы ответят ему Героям слава» \n- §YДенис Пушилин§!"
 sp_event_separatist_victory_remark: "Донбасс никто не ставил на колени!"

 sp_event_ukraine_victory_against_separatists_title: "Поражение сепаратистов"
 sp_event_ukraine_victory_against_separatists_quote: "«Любые попытки дестабилизации внутри страны будут жёстко пресекаться» \n- §YРуслан Хомчак§!"
 sp_event_ukraine_victory_against_separatists_remark: "Слава Украине!"

 sp_event_yanukovich_overthrow_title: "Победа Майдана"
 sp_event_yanukovich_overthrow_quote: "«Режим, построенный на страхе и коррупции, рухнул за считанные дни» \n- §YАлександр Турчинов§!"
 sp_event_yanukovich_overthrow_remark: "Украина — это Европа!"


 sp_event_start_of_civil_war_in_ukraine_title: "Гражданская война в Украине"
 sp_event_start_of_civil_war_in_ukraine_quote: "Страна на самом деле, которая называется Украина, она разрушена, она распадется ни на какие то куски да там, или на большие там части, она распадется на тысячу маленьких княжеств, больше двух десятков точно»\n- §YАлександр Захарченко§!"
 sp_event_start_of_civil_war_in_ukraine_remark: "Конец Украины"
