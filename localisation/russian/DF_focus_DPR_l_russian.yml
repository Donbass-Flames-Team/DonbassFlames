 DPR_shaky_peace_on_donbass: "Хрупкий мир на Донбассе"
 DPR_shaky_peace_on_donbass_desc: "Активные бои временно утихли но обстановка остается предельно напряженной. Нам нужно использовать эту передышку для укрепления государственных органов и восстановления разрушенной инфраструктуры."
 DPR_fight_with_banditry: "Борьба с бандитизмом"
 DPR_fight_with_banditry_desc: "Неподконтрольные вооруженные группы внутри республики угрожают общественному порядку. Требуются жесткие меры по разоружению самоуправцев и наведению закона."
 DPR_disarm_safonov: "Разоружение Сафонова"
 DPR_disarm_safonov_desc: "Полевой командир Сафонов отказывается подчиняться центральному командованию. Нейтрализация его группы позволит укрепить вертикаль власти и навести порядок в рядах."
 DPR_foreign_policy_of_the_dpr: "Внешняя политика ДНР"
 DPR_foreign_policy_of_the_dpr_desc: "Установление международных связей и поиск признания жизненно необходимы для молодой республики. Мы должны наладить устойчивые дипломатические каналы с ключевыми союзниками."
 DPR_restore_rail_links_with_the_lpr: "Восстановление жд сообщения с ЛНР"
 DPR_restore_rail_links_with_the_lpr_desc: "Возобновление железнодорожного сообщения с Луганском ускорит торговлю и улучшит военную логистику между дружественными республиками."
 DPR_get_rid_of_the_customs_border: "Ликвидация таможенной границы"
 DPR_get_rid_of_the_customs_border_desc: "Снятие таможенных барьеров с соседней республикой создаст единое экономическое пространство и упростит перевозку грузов."
 DPR_economy_of_donetsk: "Экономика Донецка"
 DPR_economy_of_donetsk_desc: "Промышленный потенциал Донбасса требует централизованного управления. Нам нужно восстановить работу заводов и обеспечить стабильные выплаты трудящимся."
 DPR_central_republican_bank_of_the_dpr: "Центральный Республиканский Банк ДНР"
 DPR_central_republican_bank_of_the_dpr_desc: "Создание собственной финансовой системы и центрального банка необходимо для стабилизации денежного обращения и сбора налогов."
 DPR_restore_production: "Восстановление производства"
 DPR_restore_production_desc: "Запуск поврежденных фабрик и промышленных предприятий позволит обеспечить вооруженные силы имуществом и создать рабочие места."
 DPR_the_mining_issue: "Шахтерский вопрос"
 DPR_the_mining_issue_desc: "Угольная отрасль составляет основу нашей экономики. Решение вопросов снабжения и выплат шахтерам гарантирует социальную стабильность."
 DPR_reforms_of_dpr_army: "Реформа армии ДНР"
 DPR_reforms_of_dpr_army_desc: "Переход от разрозненных отрядов ополчения к дисциплинированной регулярной армии критически важен для долгосрочной обороноспособности."
 DPR_marine_infantry_of_dpr: "Морская пехота ДНР"
 DPR_marine_infantry_of_dpr_desc: "Формирование специализированных подразделений морской пехоты позволит прикрыть прибрежные участки и повысит гибкость на южном фланге."
 DPR_instructors_from_russia: "Инструкторы из России"
 DPR_instructors_from_russia_desc: "Привлечение опытных военных специалистов повысит качество подготовки офицерского состава и улучшит выучку войск."
 DPR_donetsk_higher_combined_arms_command_school: "Донецкое высшее общевойсковое командное училище"
 DPR_donetsk_higher_combined_arms_command_school_desc: "Создание военного училища обеспечит постоянный приток квалифицированных командиров для наших растущих вооруженных сил."
 DPR_expansion_of_the_dpr_elite: "Расширение элитных частей ДНР"
 DPR_expansion_of_the_dpr_elite_desc: "Опытные добровольческие батальоны доказали свою эффективность. Увеличение элитных отрядов создаст надежный ударный кулак на ключевых направлениях."
 DPR_first_army_corp_of_dpr: "1ый Армейский корпус ДНР"
 DPR_first_army_corp_of_dpr_desc: "Объединение отдельных батальонов в единый армейский корпус упростит управление войсками и улучшит координацию на фронте."
 DPR_republican_guardia_of_dpr: "Республиканская гвардия ДНР"
 DPR_republican_guardia_of_dpr_desc: "Формирование особого резерва под прямым государственным управлением гарантирует внутреннюю безопасность и оперативную гибкость."
 DPR_hold_referendum_on_independence: "Проведение референдума о независимости"
 DPR_hold_referendum_on_independence_desc: "Предоставление гражданам возможности проголосовать за государственный суверенитет легитимизирует наш политический путь."
 DPR_accept_constitution: "Принятие конституции"
 DPR_accept_constitution_desc: "Основной закон необходим для закрепления структуры власти гарантии прав и окончательного оформления независимости."
 DPR_nationalization_of_assets: "Национализация активов"
 DPR_nationalization_of_assets_desc: "Перевод ключевых промышленных объектов и брошенного имущества под контроль государства обеспечит ресурсы для обороны."
 DPR_create_donetsk_mvd: "Создание МВД ДНР"
 DPR_create_donetsk_mvd_desc: "Формирование органов внутренних дел обеспечит правопорядок в городах борьбу с преступностью и защиту инфраструктуры."
 DPR_set_up_production: "Организация военного производства"
 DPR_set_up_production_desc: "Переоборудование местное мастерских и цехов под выпуск боеприпасов и снаряжения снизит зависимость от внешних поставок."
 DPR_reopening_of_captured_ukrainian_warehouses: "Вскрытие захваченных складов"
 DPR_reopening_of_captured_ukrainian_warehouses_desc: "Инвентаризация и распределение трофейных запасов позволит оперативно снабдить передовые части амуницией и оружием."
 DPR_organize_defense_in_donetsk: "Организация обороны Донецка"
 DPR_organize_defense_in_donetsk_desc: "Укрепление въездов в город и создание оборонительных рубежей в городских кварталах превратит столицу в неприступную крепость."
 DPR_centralize_donetsk_groups: "Централизация донецких отрядов"
 DPR_centralize_donetsk_groups_desc: "Сведение разрозненных групп ополчения под единое штабное руководство избавит от хаоса и повысит управляемость."
 DPR_strelkovs_resignation: "Отставка Стрелкова"
 DPR_strelkovs_resignation_desc: "Перестановки в военном руководстве открывают путь к дипломатическим маневрам и новой структуре командования."
 DPR_cooperation_with_lpr: "Сотрудничество с ЛНР"
 DPR_cooperation_with_lpr_desc: "Согласование военных и экономических решений с луганскими соратниками укрепляет наши общие позиции перед лицом общей угрозы."
 DPR_novorossiya_project: "Проект Новороссия"
 DPR_novorossiya_project_desc: "Развитие концепции конфедерации закладывает основу для политического и военного единства регионов Донбасса."
 DPR_united_parliament: "Объединенный парламент"
 DPR_united_parliament_desc: "Формирование общего законодательного органа позволит координировать законы и решения на совместных территориях."
 DPR_form_novorossiya: "Провозглашение Новороссии"
 DPR_form_novorossiya_desc: "Окончательное оформление политического союза создает единое государственное образование способное защищать свой суверенитет."
 DPR_set_up_ambushes: "Организация засад"
 DPR_set_up_ambushes_desc: "Использование знания местности для подготовки скрытых засад на маршрутах снабжения противника нанесет ему серьезный урон."
 DPR_annex_makeevka: "Интеграция Макеевки"
 DPR_annex_makeevka_desc: "Установление полного административного контроля над Макеевкой обеспечит безопасность важного промышленного узла."
 DPR_annex_horlivka: "Интеграция Горловки"
 DPR_annex_horlivka_desc: "Закрепление за горловским сектором стабилизирует линию фронта на северных подступах и защитит важные производства."
