 UKR_prevent_civil_war: "Предотвращение гражданской войны"
 UKR_prevent_civil_war_desc: "Ситуация в стране нагрелась до предела и грозит перерасти в полномасштабное силовое противостояние. Чтобы избежать масштабного кровопролития и полной катастрофы, правительство должно пойти на экстренные шаги и зафиксировать мирный диалог со всеми сторонами."
 UKR_restoring_the_image_in_the_west: "Восстановление имиджа на Западе"
 UKR_restoring_the_image_in_the_west_desc: "Западные партнеры и международные организации крайне обеспокоены происходящим на улицах Киева. Нам необходимо восстановить плотный контакт с европейскими дипломатами и наглядно доказать что официальное руководство страны держит ситуацию под контролем."
 UKR_a_step_towards_the_protesters: "Шаг навстречу протестующим"
 UKR_a_step_towards_the_protesters_desc: "Улица продолжает требовать кардинальных изменений и дальше игнорировать эти требования становится просто опасно. Власти вынуждены идти на прямые уступки гражданам чтобы снизить критический градус напряжения в обществе."
 UKR_declaration_of_a_political_thaw: "Объявление политической оттепели"
 UKR_declaration_of_a_political_thaw_desc: "Для существенного снижения риска дальнейшей эскалации насилие правительство официально объявляет курс на политическое послабление. Это включает в себя готовность мириться с системной оппозицией и искать новые пути взаимодействия."
 UKR_return_to_the_2004_constitution: "Возврат к конституции 2004 года"
 UKR_return_to_the_2004_constitution_desc: "Возвращение к парламентско президентской форме правления становится ключевым компромиссом в переговорах. Перераспределение полномочий между ветвями власти позволит снять острый политический кризис и удовлетворить оппонентов."
 UKR_returning_to_the_eurointegration: "Возвращение к евроинтеграции"
 UKR_returning_to_the_eurointegration_desc: "Внезапная пауза в подготовке к подписанию договора с ЕС выставила власть в невыгодном свете и вызвала бурю. Официальное возобновление переговоров с Брюсселем поможет частично вернуть доверие со стороны населения."
 UKR_relax_repressive_laws: "Смягчение жестких законов"
 UKR_relax_repressive_laws_desc: "Нормативные акты принятые в середине января вызвали колоссальную волну возмущения среди граждан. Быстрая отмена наиболее строгих статей покажет реальную готовность властей к диалогу и сгладит углы."
 UKR_reform_of_berkut: "Реформа Беркута"
 UKR_reform_of_berkut_desc: "Спецподразделение подвергается жесточайшей критике за свои действия при разгонах. Проведение глубокой реформы и введение жесткого регламента работы позволит сохранить подготовленный спецназ но полностью сменить его подход к работе."
 UKR_liqudation_of_berkut: "Ликвидация Беркута"
 UKR_liqudation_of_berkut_desc: "Полное расформирование подразделения станет главным символическим шагом со стороны государства. Именно этого решения до сих пор принципиально добиваются протестующие для окончательного примирения сторон."
 UKR_severance_of_economic_ties_with_russia: "Разрыв экономических связей с Россией"
 UKR_severance_of_economic_ties_with_russia_desc: "Решительный поворот в сторону Европы неизбежно требует пересмотра старых экономических договоренностей с Востоком. Это приведет к ощутимым финансовым рискам для нашей промышленности но зафиксирует новый вектор."
 UKR_sign_an_association_agreement_with_the_eu: "Подписание соглашения об ассоциации с ЕС"
 UKR_sign_an_association_agreement_with_the_eu_desc: "Логический финал длительного политического противостояния внутри страны. Подписание исторического документа с Европейским союзом окончательно закрепит международный статус государства на ближайшие годы."
