l_russian:
 # Идеи внутренней политики России

 RUS_yunarmy_spirit_idea: "Юнармия"
 RUS_yunarmy_spirit_idea_desc: "Государство запустило всероссийское молодёжное движение. Школьники учатся стрелять, маршировать и уважать армию. Патриотическое воспитание идёт в массы, и это работает."

 RUS_etatism_spirit_idea: "Государство как хозяин"
 RUS_etatism_spirit_idea_desc: "Крупный бизнес и элиты всё плотнее завязаны на государство. Частные интересы уступают место государственным. Промышленность работает надёжнее, но инициатива снизу почти исчезла."

 RUS_rosgvardia_spirit_idea: "Росгвардия"
 RUS_rosgvardia_spirit_idea_desc: "Создана новая силовая структура напрямую подчинённая президенту. Внутренний порядок под контролем, любые беспорядки будут давиться быстро и жёстко."

 RUS_yarovaya_package_spirit_idea: "Пакет Яровой"
 RUS_yarovaya_package_spirit_idea_desc: "Новые законы обязывают хранить переписку и звонки граждан, расширяют полномочия спецслужб. Государство знает о своих гражданах больше, чем когда-либо."

 RUS_foreign_agents_spirit_idea: "Закон об иностранных агентах"
 RUS_foreign_agents_spirit_idea_desc: "НКО, получающие деньги из-за рубежа, обязаны регистрироваться как иностранные агенты. Западное влияние внутри страны поставлено под жёсткий контроль."

 RUS_digital_economy_spirit_idea: "Цифровая экономика"
 RUS_digital_economy_spirit_idea_desc: "Государство вложилось в IT, цифровые сервисы и электронное правительство. Технологии идут вперёд, но денег уходит немало и не всё окупается быстро."

 RUS_national_projects_spirit_idea: "Национальные проекты"
 RUS_national_projects_spirit_idea_desc: "Триллионы рублей направлены в дороги, больницы, школы и жильё. Стройки идут по всей стране, но расходы ощутимо давят на бюджет."

 RUS_sovereign_internet_spirit_idea: "Суверенный интернет"
 RUS_sovereign_internet_spirit_idea_desc: "Россия строит собственную инфраструктуру для отключения от глобальной сети. Рунет под контролем государства, но технологический обмен с миром заметно осложнился."

 RUS_pension_reform_spirit_idea: "Пенсионная реформа"
 RUS_pension_reform_spirit_idea_desc: "Возраст выхода на пенсию повышен. Государство получило финансовый ресурс и смогло вложить его в производство, но люди на улице этим очень недовольны."

 RUS_cabinet_renewal_spirit_idea: "Обновление кабинета министров"
 RUS_cabinet_renewal_spirit_idea_desc: "Правительство обновилось. Пришли новые лица с новыми подходами, политические решения принимаются чуть быстрее и увереннее."

 RUS_constitutional_amendments_spirit_idea: "Поправки в Конституцию"
 RUS_constitutional_amendments_spirit_idea_desc: "Конституция изменена. Закреплены новые ценности, расширены полномочия исполнительной власти. Общество проголосовало «за», и власть укрепилась."

 RUS_crimea_development_spirit_idea: "Развитие Крыма"
 RUS_crimea_development_spirit_idea_desc: "Полуостров получает масштабные инвестиции: дороги, мост, жильё, туризм. Крым постепенно становится частью России не только на бумаге, но и в жизни."

 RUS_tatar_resistance_spirit_idea: "Крымскотатарское сопротивление"
 RUS_tatar_resistance_spirit_idea_desc: "Крымские татары не приняли присоединение к России. Активисты задержаны, Меджлис запрещён, напряжение не спадает. Полуостров спокойным назвать сложно."

 # Временные идеи
 RUS_active_propaganda_idea: "Активная пропаганда"
 RUS_active_propaganda_idea_desc: "Государственные СМИ работают в усиленном режиме. Россия говорит одним голосом, и этот голос слышен везде."

 RUS_vertical_of_power_idea: "Вертикаль власти"
 RUS_vertical_of_power_idea_desc: "Управление выстроено сверху вниз. Регионы выполняют решения центра, инициатива снизу не приветствуется, зато порядок есть."

 RUS_fears_of_protests_idea: "Страх перед протестами"
 RUS_fears_of_protests_idea_desc: "Народное недовольство выплёскивается на улицы. Власть нервничает и вынуждена оглядываться на настроения в обществе."

 RUS_corruption_and_oligarchy_idea: "Коррупция и олигархи"
 RUS_corruption_and_oligarchy_idea_desc: "Приближённые к власти используют своё положение для личного обогащения. Деньги утекают мимо реальных нужд страны."

 # Tooltip-ы событий
 RUS_strict_control_tt: "Жёсткий контроль над информацией введён. Силовики получили широкие полномочия слежки."
 RUS_soft_control_tt: "Контроль введён в ограниченном объёме. Ситуация управляема, но давление на гражданское общество есть."
 RUS_pension_hard_tt: "Пенсионный возраст повышен в полном объёме. Бюджет получил средства, но общество злится."
 RUS_pension_soft_tt: "Реформа смягчена. Общество успокоилось, но финансовой выгоды меньше."
 RUS_national_projects_tt: "По всей стране запущены стройки и программы развития. Деньги идут в регионы."
