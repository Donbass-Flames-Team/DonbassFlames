 AZV_form_first_batalion: "Сформировать первый батальон"
 AZV_form_first_batalion_desc: "Добровольцы стекаются под знамёна нового батальона. Из разрозненных групп патриотов, готовых с оружием в руках защищать Украину, мы создадим дисциплинированное воинское подразделение, способное противостоять ополчению на юго-востоке."
 AZV_liberate_mariupol: "Освободить Мариуполь"
 AZV_liberate_mariupol_desc: "Мариуполь — ключевой порт Приазовья оказался в руках сепаратистов. Освобождение города станет первым серьёзным испытанием для батальона и продемонстрирует всему миру, что украинская армия способна вернуть контроль над захваченными территориями."
