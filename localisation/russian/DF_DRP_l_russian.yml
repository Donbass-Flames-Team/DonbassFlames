l_russian:
 DRP_introduce_martial_law: "Ввести военное положение"
 DRP_introduce_martial_law_desc: "Ситуация в восточных регионах накалена до предела. Чтобы купировать угрозу захвата административных зданий и координировать действия силовиков, мы наделяем администрацию чрезвычайными полномочиями. Формальный режим АТО позволит задействовать армию и спецподразделения для наведения порядка в области."
 DRP_mobilization_of_mvd: "Мобилизовать силовых структур"
 DRP_mobilization_of_mvd_desc: "Старая правоохранительная система парализована политическим кризисом. Нам необходимо провести жесткую проверку личного состава МВД и СБУ в регионе на верность присяге. Те, кто останется с нами, станут фундаментом новой системы безопасности Приднепровья."
 DRP_barricades: "Соурудить блокпосты"
 DRP_barricades_desc: "Днепропетровск — это логистический ключ к югу и центру Украины. Мы должны превратить область в крепость, перекрыв основные магистрали бетонными укреплениями. Контроль дорог позволит пресечь передвижение диверсионных групп и подвоз оружия со стороны охваченного беспорядками Донбасса."
 DRP_mobilization_of_activists: "Призвать активистов"
 DRP_mobilization_of_activists_desc: "Революционная энергия улиц должна быть упорядочена. Мы создаем Штаб национальной защиты, куда войдут активисты Майдана и добровольцы. Это позволит быстро сформировать мотивированные отряды самообороны, готовые заменить деморализованную милицию в критический момент."
 DRP_expand_the_company_10000: "Расширить компанию 10000 долларов"
 DRP_expand_the_company_10000_desc: "Для борьбы с профессиональными наемниками нужны нестандартные методы. Мы объявляем о выплате солидных денежных вознаграждений за каждого задержанного диверсанта и каждую единицу сданного оружия. Пусть финансовая выгода станет дополнительным стимулом для нейтрализации врага."
 DRP_liberate_the_dnieper_from_the_separatists: "Освободить Днепропетровск от сепаратистов"
 DRP_liberate_the_dnieper_from_the_separatists_desc: "Двоевластие в регионе недопустимо. Объединенные силы милиции и новосозданных добровольческих формирований должны окончательно ликвидировать очаги пророссийских протестов. Днепропетровская область должна остаться стабильным тылом и опорой для дальнейших операций."
 DRP_future_of_dnieper: "Што дальше?"
 DRP_future_of_dnieper_desc: "Што дальше?"
 
 Dnieper_kolomoysky.1.t: "Будущее днепра"
 Dnieper_kolomoysky.1.d: "После разгрома сепаратистов в Днепропетровской области необходимость в нашей помощи отпала, вследствие чего встал вопрос: что дальше? Самым разумным решением было бы прекратить нашу кампанию и передать всё Украине. Но уверены ли мы, что украинская власть справится без нас?"
 Dnieper_kolomoysky.1.a: "Можно уходить на пенсию"
 Dnieper_kolomoysky.1.b: "Эти дураки не справятся"
 Dnieper_kolomoysky.1.c: "Порошенко является образованным узурпатором"
 
 Dnieper_kolomoysky.2.t: "Переименовать Днепропетровск"
 Dnieper_kolomoysky.2.d: "За всю свою историю Днепропетровск неоднократно менял своё имя. Сначала город назывался Екатеринославом — с 1776 года. Затем, с 1796 по 1802 год, он носил название Новороссийск. После этого городу снова вернули имя Екатеринослав, а в 1926 году он был переименован в Днепропетровск. Каждый раз его название было связано не с самим городом и его народом, а с чужой властью — имперскими правителями, колониальными проектами и советскими деятелями. Настало время вернуть городу достоинство и дать ему имя…"
 Dnieper_kolomoysky.2.a: "Сичеслав"
 Dnieper_kolomoysky.2.b: "Днепр"
 Dnieper_kolomoysky.2.c: "Днепроколомойск"
 
