l_russian:
LOADING_TIP_0: "«А сегодня в завтрашний день не все могут смотреть. Вернее, смотреть могут не только лишь все, мало кто может это делать»\n— Виталий Кличко"
LOADING_TIP_1: "«У меня есть два заместителя, четыре из которых уже месяц лежат в Кабмине»\n— Виталий Кличко"
LOADING_TIP_2: "«Единственное, есть такой господин Вакаров, если он когда-нибудь соизволит вернуться на родину, а не остаться в Российской Федерации, я бы с удовольствием показал ему, как вырываются кадыки. Лёгким. Элегантным. Движением. Правой. Руки. Или левой...»\n— Дмитрий Гордон"
LOADING_TIP_3: "«Ха-ха-ха-ха, лысый парик, а там шевелюра... Интересная мысль, кто-то меня разоблачил»\n— Дмитрий Гордон, в ответ Владимиру Соловьёву"
LOADING_TIP_4: "«Я не вижу запаха»\n— Виталий Кличко"
LOADING_TIP_5: "«Гордо встану грудью за спиной Украины»\n— Виталий Кличко"
LOADING_TIP_6: "«Что плохого в том, что я поддерживал этих страусов? Что плохого в этом? Они просто жили там»\n— Виктор Янукович"
LOADING_TIP_7: "«Наши дети пойдут в школы и детские сады, а их дети будут сидеть в подвалах!»\n— Пётр Порошенко"
LOADING_TIP_8: "«Циничные бандеры... бандиты с оружием в руках»\n— Пётр Порошенко, оговорился в выступлении"
LOADING_TIP_9: "«Остановитесь!»\n— Виктор Янукович"
LOADING_TIP_10: "«Выйди отсюда, разбойник! Плохо слышишь? Иди гуляй»\n— Владимир Зеленский"
LOADING_TIP_11: "«Я не лох какой-то, я президент этой страны»\n— Владимир Зеленский"
LOADING_TIP_12: "«Ха-ха-ха-ха, это вообще новое что-то, «нацистский поскрёбыш», надо записать»\n— Дмитрий Гордон, отреагировавший на новое сочетание оскорбительных слов Владимира Соловьёва"
LOADING_TIP_13: "«Ну согласитесь, ну если до Майдана нас грабили бандиты, то щас это делают красавцы! Хорошо воспитанные, одетые и причёсанные люди»\n— Владимир Зеленский, на концерте «Вечерний Квартал» в 2016 году"
LOADING_TIP_14: "«Спусковой крючок войны всё-таки нажал я»\n— Игорь Гиркин (Стрелков)"
LOADING_TIP_15: "«Я сейчас не говорю Киев. На самом деле нужно брать даже не Берлин. Нужно его пройти и взять Британию всю как таковую»\n— Александр Захарченко"
LOADING_TIP_16: "«В случае ядерной войны не все мы умрём»\n— Максим Кац"
LOADING_TIP_17: "«Называй не «Головожопый», это уже не смешно, называй «Жопоголовый», так будет по-новому»\n— Дмитрий Гордон, в ответ на оскорбление Владимира Соловьёва"
LOADING_TIP_18: "«Ну что, Владимир Рудольфович Соловьёв, он же Володя, он же Гога, он же Гоша, я думаю, что втайне, ночами, ты на меня дрочишь, иначе чем ещё объяснить, что ты так часто показываешь и так много обо мне говоришь»\n— Дмитрий Гордон"
LOADING_TIP_19: "«Дорогие украинцы, я обещаю вам пойти в президенты Украины и сразу выполняю: я иду в президенты Украины! Давайте сделаем это вместе. С Новым годом, с новым слугой народа!»\n— Владимир Зеленский в новогоднем обращении 31.12.2018 на канале «1+1»"
LOADING_TIP_20: "«Если вы не понимаете — мы быстро идём к катастрофе»\n— Игорь Стрелков"
LOADING_TIP_21: "«Мне нужно оружие, а не такси»\n— Владимир Зеленский"
LOADING_TIP_22: "«Жыве Беларуссе, жыве! Жыве Беларуссе! Трактор Беларусь»\n— Глад Валакас"
LOADING_TIP_23: "«Ополчение Боинг не сбивало»\n— Игорь Гиркин (Стрелков), в интервью у Дмитрия Гордона"
LOADING_TIP_24: "«Без общения с умными людьми, пусть даже врагами, развитие невозможно»\n— Игорь Гиркин (Стрелков)"
LOADING_TIP_25: "«Хоть в России все хуёво, Украину мочит Вова, и, торгуя «русским миром», он продаст родную мать, Соловьёв ужасно мутен, это понял даже Путин, но такого пиздабола очень сложно отыскать»\n— Дмитрий Гордон в своей песне о Владимире Соловьёве «Итальянский партизан»"
LOADING_TIP_26: "«Во-первых, я — не ваш оппонент, я — ваш приговор»\n— Владимир Зеленский, во время дебатов с Петром Порошенко"
LOADING_TIP_27: "«Ты мне не попадайся на глаза, я тебе кадык вырву, сука! Ты кому сказал сдохнуть? Мне сказал сдохнуть? Приедь сюда, скажи мне в глаза это, если у тебя смелости хватит»\n— Дмитрий Гордон в ответ на слова Игоря Степуры"
LOADING_TIP_28: "«Все жители Брянска, которые снимали прилёты и жаловались, что ПВО не работала — это твари, и они должны сидеть в тюрьме»\n— Владимир Соловьёв"
LOADING_TIP_29: "«Да, Вов, ты был полковником, ты и поёшь лучше, я тебе скажу по секрету, у тебя и писька больше, лишь бы не плакал»\n— Дмитрий Гордон, в ответ на слова Владимира Соловьёва"
LOADING_TIP_30: "«Я хочу сказать российской армии: пиздуйте нахуй отсюда, ёбаные пид...сы!»\n— Дмитрий Гордон в интервью телеканалу «Дождь»"
LOADING_TIP_31: "«Русский военный корабль, иди нахуй!»\n— Роман Грибов, пограничник с острова Змеиный, в ответ на ультиматум крейсера «Москва» о сдаче в плен, 24 февраля 2022 года"
LOADING_TIP_32: "«Добрый день, мы из ДНР!»\n— Локальный TikTok-тренд весны 2022 года"
LOADING_TIP_33: "«Я отправляю тебе конфеты, кружку и мой пламенный привет, не забывай обо мне, и я не забуду о тебе»\n— Дмитрий Гордон, обращение к Владимиру Соловьёву"
LOADING_TIP_34: "«Президент тут. Мы все тут. Защищаем нашу независимость»\n— Владимир Зеленский (25 февраля 2022)"
LOADING_TIP_35: "«Без света или без вас? Без вас»\n— Владимир Зеленский"
LOADING_TIP_36: "«Вам нічого не видно без контактних лінз, вас боронить шкіра адвокатських валіз, капітани пліз, не потрібно сліз, розкажи мені потім, що таке лібералізм»\n— Сергей Жадан в своей песне «Сомалі»"
LOADING_TIP_37: "«Як це чому? А тому, що я дебіл! Ти розумієш — дебіл! А дебілів у армію не беруть! Навіть в нашу, українську!»\n— Сергей Жадан в своей песне «Воєнкомат» в 2008 году"
LOADING_TIP_38: "«Вот для белорусов есть у нас подарок украинцам и Европе — перекроем газ»\n— Владимир Соловьёв, выступавший на концерте в 2008 году"
LOADING_TIP_39: "«А теперь слушайте меня, сука, блять, это чьи-то, блять, отцы и чьи-то сыновья, и те мрази, которые не дают нам боеприпасы, сука, будут в аду жрать их потроха, блять! Пид...сы. У нас нехватка боеприпасов 70%. Шойгу, Герасимов, где, сука, боеприпасы? Посмотрите на них, сука!»\n— Евгений Пригожин"
LOADING_TIP_40: "«Нравится, не нравится — терпи, моя красавица»\n— Владимир Путин"
LOADING_TIP_41: "«Мы ещё всерьёз и не начинали»\n— Владимир Путин"
LOADING_TIP_42: "«Российские войска стоят на границе, просто украинскую границу немножко отодвигают вперёд»\n— Владимир Зеленский, в юмористической программе «Чисто NEWS» в 2014 году"
LOADING_TIP_43: "«Спецоперация идёт строго по плану»\n— Игорь Конашенков"
LOADING_TIP_44: "«Понимаете, мы не можем быть против русского народа в принципе, потому что это один и тот же народ»\n— Владимир Зеленский"
LOADING_TIP_45: "«Кстати, меня рассмешила эта бледная спирохета, этот человек — использованный гондон»\n— Владимир Соловьёв"
LOADING_TIP_46: "«Всегда можно снова начать войну и объявить, что это не эпическая ярость, а теперь — «Тотальная ярость». Ну или там «Эпическая ярость 2», «Эпическая ярость: Возрождение Легенды», и снова 60 дней эпически воевать»\n— Максим Кац"
LOADING_TIP_47: "«Це Ляшко, доброго дня, а ми в ліфті застряли, як харашо?! Слиш, він каже харашо»\n— Олег Ляшко"
LOADING_TIP_48: "«В Донецкой Народной Республике проведение выборов Президента Украины, соседней страны, по закону невозможно»\n— Владимир Макович"
LOADING_TIP_49: "«Россия не заканчивается нигде»\n— Владимир Путин"
LOADING_TIP_50: "«Ну чего, уроды конченые, довольны? Взяли, суки, Киев? С НАТО хорошо повоевали? Поделили Европу с Америкой? Кучка старых фантазеров, у которых ничего, кроме понтов, за душой нет. Что ж вам, мрази, на жопе ровно-то не сиделось? Смотрели бы дальше свои мультики о ракетах, летящих в Майами. Куда же вы полезли?»\n— Максим Кац"
LOADING_TIP_51: "«Мы любим русский народ, многие из нас говорят на русском языке, мы любим русскую культуру»\n— Алексей Гончаренко"
LOADING_TIP_52: "«Друзья, по Красному Лиману новости тревожные. На данный момент он в полукольце. Очень неприятные новости, но мы должны смотреть трезво на ситуацию»\n— Денис Пушилин, текст из поста в Telegram-канале, за несколько часов до того, как на Красной площади закричали «Гойда»"
LOADING_TIP_53: "«Существует такое древнерусское междометие «Гойда!», означающее призыв к немедленному действию. Как же нам не хватает сейчас таких боевых кличей! Гойда, братья и сёстры, гойда! Бойся, старый мир! Бойся, мы идём! Гойда! Гойда!»\n— Иван Охлобыстин, выступление на Красной площади после референдумов, 30 сентября 2022 года"
LOADING_TIP_54: "«Вот идиотка, убери её отсюда! Убери эту проститутку, эту грязь отсюда убери! Чёрная грязь! Отвратительная баба! Блядь последняя!»\n— Владимир Жириновский, после того как Ксения Собчак плеснула в него водой из стакана на дебатах 2018 года"
LOADING_TIP_55: "«Когда пройдёт в Луганске гей-парад, это будет конец нашей цивилизации и нашему Луганску, мы превратимся в такой же Содом и Гоморру, как Западная Европа»\n— Неизвестный активист, 19 мая 2013 года на «антигей-параде» в Луганске"
LOADING_TIP_56: "«Я дуже злий, я дуже злий на Юльку»\n— Олег Ляшко"
LOADING_TIP_57: "«Задовбали, скотиняки»\n— Олег Ляшко"
LOADING_TIP_58: "«Хотите жить — бегите. Хотите жить — сдавайтесь в плен. Вы за что вообще боретесь? У вас есть только кредиты, что-то вечером пожрать и теперь мобилизация»\n— Владимир Зеленский"
LOADING_TIP_59: "«Я знал, что моя тёща выживет даже в любых условиях, даже в Драмтеатре выжила под авиаударом. Я думаю, она им ещё даст прикурить»\n— Мужчина из видео Мариупольского телевидения, начало апреля 2022 года"
LOADING_TIP_60: "«Если мы серьёзны, то мы защитим Мариуполь. Вот в чём вопрос: серьёзны мы или нет? Являемся ли мы Европой, Западом, НАТО? И одна вещь ясна — Макрон не серьёзен. Это большая проблема. Он едет и предлагает Путину «финляндизацию» Украины... это катастрофа»\n— Гюнтер Фелингер-Ян"
LOADING_TIP_61: "«9 февраля 2022 года в Мариуполе, я призывал НАТО защитить Мариуполь, но мы не смогли... Освободите Мариуполь и не продавайте его России. Любое соглашение должно включать Мариуполь в НАТО и ЕС»\n— Гюнтер Фелингер-Ян"
LOADING_TIP_62: "«Как же вы не заметили, мы же сегодня над моей Украиной дрались! А воздух другой, а небо голубее, и земля зеленее»\n— Леонид Быков"
LOADING_TIP_63: "«Будем жить!»\n— Леонид Быков"
LOADING_TIP_64: "«Как-то нам говорили: будет доллар по 45 грн при Зеленском, будет хаос, будет война — смотрите, ничего не случилось»\n— Владимир Зеленский"
LOADING_TIP_65: "«Я уже говорил не раз и ещё раз скажу: счастливый Донецк, счастливый Донбасс может быть только в единой Украине»\n— Ринат Ахметов"
LOADING_TIP_66: "«Територію нашої держави треба зробити небезпечною для життя наших громадян»\n— Виктор Янукович"
LOADING_TIP_67: "«Так, Саша, ну шо ти, налей мені соромно не було»\n— Виктор Янукович"
LOADING_TIP_68: "«Увікни, уві, увікн, увікни, вікнить»\n— Виктор Янукович"
LOADING_TIP_69: "«Задачи по освобождению Купянска выполнены в полном объёме»\n— Сергей Кузовлев, фраза из представления к награждению званием «Герой России» за «взятие» города, который на тот момент оставался под контролем ВСУ"
LOADING_TIP_70: "«Лучше убейте меня, но я не буду лгать. Я должен честно сказать: Россия стоит на грани катастрофы. И если сегодня не отрегулировать эти винтики, то самолёт рассыплется в воздухе»\n— Евгений Пригожин"
LOADING_TIP_71: "«Счастливый дедушка думает, что ему хорошо. Но что делать стране, если выяснится, что дедушка — законченный мудак?»\n— Евгений Пригожин"
LOADING_TIP_72: "«Вы хотите декоммунизацию? Ну что же, нас это вполне устраивает. Мы готовы показать вам, что значит для Украины настоящая декоммунизация»\n— Владимир Путин"
LOADING_TIP_73: "«Кто как обзывается, тот так и называется»\n— Владимир Путин"
LOADING_TIP_74: "«Мы как мученики попадём в рай, а они просто сдохнут»\n— Владимир Путин"
LOADING_TIP_75: "«Мы будем преследовать террористов везде. В аэропорту — в аэропорту. Значит, вы уж меня извините, в туалете поймаем, мы и в сортире их замочим»\n— Владимир Путин"
LOADING_TIP_76: "«(Разводит руками и улыбается)»\n— Сергей Шойгу, в ответ на вопрос журналиста телеканала «Россия 1» Евгения Попова: «Победим?»"
LOADING_TIP_77: "«Украина будет воевать с нами не больше 3-4 дней. Там некому будет против нас воевать»\n— Александр Лукашенко"
LOADING_TIP_78: "«В горячей войне мы Украину победим за два дня. Чего там её побеждать-то? Это же Украина»\n— Маргарита Симоньян"
LOADING_TIP_79: "«Питають дружину: «Де ти береш гроші?», она каже — В тумбачкє»\n— Виктор Янукович"
LOADING_TIP_80: "«Немножко текст по-дебильному написан»\n— Михаил Добкин, жалуется на сценаристов"
LOADING_TIP_81: "«Не будем говорить о плохом, а лучше сделаем»\n— Виктор Янукович"
LOADING_TIP_82: "«Любимый город может спать спокойно и видеть сны»\n— Виктор Янукович, исполняет свою любимую песню"
LOADING_TIP_83: "«Якби ви конкретезували би своє питання, може воно стосується кормов для кішок, для цуценят. Потому што кішки та цуценята чиїсь там, не могут покупати себє в кішичачих магазінах»\n— Наталия Королевская"
LOADING_TIP_84: "«Я сейчас покажу, откуда на Беларусь готовилось нападение»\n— Александр Лукашенко"
LOADING_TIP_85: "«Денег нет, но вы держитесь!»\n— Дмитрий Медведев, в разговоре с местными жителями во время визита в Крым"
LOADING_TIP_86: "«Куля в лоб — так куля в лоб»\n— Арсений Яценюк, на сцене на Майдане Независимости"
LOADING_TIP_87: "«Ці руки нічого не крали!»\n— Виктор Ющенко"
LOADING_TIP_88: "«— В каких условиях вы сидели? — Барак. — Обама. — Ну типа»\n— диалог Дмитрия Гордона и Михаила Ходорковского, ставший мемом 2020 года"
LOADING_TIP_89: "«Мы сегодня вторые в России по объёму среди предприятий микроэлектроники. Надо понимать: если мы сегодня нечаянно исчезнем, то целый ряд военных изделий прекратят своё существование»\n— Олег Данцев, генеральный директор ЗАО «Группа Кремний Эл» в интервью 2013 года"
LOADING_TIP_90: "«С боевиками, которые воюют против украинцев, их надо уничтожать, но сначала разберитесь»\n— Александр Лукашенко"
LOADING_TIP_91: "«Теперь, когда меня выгнали из офиса президента, я устроился на заправку и считаю себя счастливым человеком, потому что в это время не каждый может найти работу»\n— Алексей Арестович"
LOADING_TIP_92: "«До завтра!»\n— Максим Кац"
LOADING_TIP_93: "«Никаких абортов, никаких мигрантов, никаких геев. Всем продать пулемёты, отменить налоги для миллиардеров и добывать нефть гидроразрывным способом хоть в национальных парках, хоть под детскими садами»\n— Максим Кац"
