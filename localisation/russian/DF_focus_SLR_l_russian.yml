l_russian:
 SLR_go_to_lisichansk: "Переход в Лисичанск"
 SLR_go_to_lisichansk_desc: "Под давлением сил противника в Северодонецком узле нашим отрядам необходимо организованно сместиться в Лисичанск чтобы закрепиться на господствующих высотах и удерживать важнейший рубеж обороны."
 SLR_retreat_to_alchevsk: "Отход в Алчевск"
 SLR_retreat_to_alchevsk_desc: "Угроза окружения на Лисичанском плацдарме вынуждает наши подразделения отойти к Алчевску чтобы сохранить личный состав и выстроить плотную линию обороны в тылу."
