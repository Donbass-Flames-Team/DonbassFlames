 # --- 3. ПОДРОБНЫЕ ОПИСАНИЯ ИДЕОЛОГИЙ ---
 liberalism: "Либерализм"
 liberalism_desc: "Либеральная демократия защищает индивидуальную свободу, верховенство права и права человека как основные ценности государства. Её приоритетами являются защита свободных выборов, независимости судебной системы и свободы прессы. Эта система предполагает минимальное вмешательство государства в личную и экономическую жизнь граждан. Либеральная демократия стремится сохранять баланс между индивидуальной свободой и общим благом, активно поддерживая глобализм, расширение прав человека и прогрессизм."

 social_democracy_desc: "Социал-демократия стремится создать равноправное общество, сочетая рыночную экономику с сильными социальными гарантиями. Её основная идея заключается в перераспределении богатства для сокращения экономического неравенства и обеспечения достойных условий жизни для всех. Социал-демократы выступают за прогрессивное налогообложение, доступное здравоохранение и образование, а также за защиту трудовых прав и, зачастую, окружающей среды."

 conservatism: "Консерватизм"
 conservatism_desc: "Консервативная демократия сочетает приверженность демократическим принципам с уважением к традиционным ценностям, таким как семья, религия и порядок. Эта идеология стремится сохранить основы общества, укрепить национальный суверенитет и стабильность посредством постепенных и осторожных реформ, а не радикальных преобразований. Она поддерживает сильное государство и подчёркивает важность общих исторических и культурных корней."

 authoritarian_democracy: "Авторитарная демократия"
 authoritarian_democracy_desc: "Авторитарная демократия представляет собой компромисс между демократическими институтами и жёстким централизованным контролем. Выборы сохраняются, хотя почти всегда фальсифицируются и служат главным образом для создания видимости демократии, как и формальные принципы разделения властей. При этом деятельность оппозиции ограничивается, а права и свободы граждан часто подавляются во имя порядка и контроля. Такая система обеспечивает стабильность, но ценой политических свобод и общественного многообразия. Авторитарная демократия нередко приводит к возникновению популистской диктатуры, обычно центристской и политически оппортунистической."

 communism_desc: "Коммунизм провозглашает идеал бесклассового общества, в котором средства производства принадлежат всему народу, а ресурсы распределяются в соответствии с потребностями. Эта идеология отвергает частную собственность и рыночную экономику, заменяя их централизованным планированием. Коммунизм призывает к радикальному преобразованию общества, зачастую посредством революции, и сосредотачивается на борьбе рабочего класса против эксплуатации."

 socialism_desc: "Социализм — это идеология, стремящаяся к социальной справедливости и равенству посредством усиления роли государства в экономике. Некоторые рыночные механизмы могут сохраняться, однако все ключевые отрасли и ресурсы находятся под государственным контролем. Социализм выступает за доступность основных товаров и социальных услуг и против чрезмерной концентрации капитала в руках немногочисленных групп. Его часто рассматривают как переходный этап, предшествующий коммунизму."

 nationalism_desc: "Национализм подчёркивает интересы собственного народа и укрепление национальной идентичности. Он может принимать различные формы — от культурного единства и гражданского национализма до радикального и агрессивного превосходства одной национальности или этнической группы над другими. Эта идеология часто ставит интересы государства выше международного сотрудничества и выступает за защиту суверенитета, национальной экономики и территориальной целостности."

 fascism_ideology: "Фашизм"
 fascism_ideology_desc: "Фашизм — это радикальная тоталитарная идеология, отвергающая демократию и либерализм в пользу полного государственного контроля над гражданами во всех сферах жизни. Она основывается на культе личности, вождизме, милитаризме и радикальном национализме. Фашизм подчёркивает национальное единство посредством подавления инакомыслия, жёсткой общественной иерархии и агрессивной внешней политики, обычно направленной на территориальную экспансию."

 nazism: "Нацизм"
 nazism_desc: "Национал-социализм является крайне радикальной формой фашизма, основанной на псевдонаучных теориях расового превосходства и антисемитизме. Нацистская идеология предполагает жёсткое тоталитарное правление, стремление к завоеванию «жизненного пространства» для «высшей расы» и полное уничтожение любых форм политического или этнического инакомыслия. В отличие от классического фашизма, нацизм ставит расовую идентичность выше национальной."

