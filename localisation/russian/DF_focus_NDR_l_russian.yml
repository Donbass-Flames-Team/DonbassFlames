l_russian:
 NDR_capture_mvd:0 "Захват здания МВД"
 NDR_capture_mvd_desc:0 "Оружейные комнаты и архивы местного управления внутренних дел должны перейти под наш контроль. Это обеспечит первыми стволами формирующиеся отряды ополчения."
 NDR_distribute_weapons:0 "Раздача оружия ополченцам"
 NDR_distribute_weapons_desc:0 "Склады горотдела распечатаны. Все захваченные автоматы, пистолеты и спецсредства необходимо немедленно распределить среди добровольцев, готовых встать на защиту города."
 NDR_fight_looting:0 "Борьба с мародёрством"
 NDR_fight_looting_desc:0 "В условиях хаоса и безвластия активизировались криминальные элементы. Мы обязаны ввести жесткий патрульный режим и пресекать любые грабежи, чтобы сохранить порядок и доверие местных жителей."
 NDR_military_tribunals:0 "Военные трибуналы"
 NDR_military_tribunals_desc:0 "Законы мирного времени больше недееспособны. Для поддержания строжайшей дисциплины на передовой и борьбы с дезертирством в осаждённом городе вводятся военно-полевые суды."
 NDR_arrest_ponomarev:0 "Арест Пономарёва"
 NDR_arrest_ponomarev_desc:0 "Действия самопровозглашённого гражданского руководства начали вредить скоординированной обороне. Из-за превышения полномочий и дестабилизации обстановки бывший глава администрации должен быть изолирован."
 NDR_escape_from_slavyansk:0 "Побег из Славянска"
 NDR_escape_from_slavyansk_desc:0 "Плотное кольцо окружения не оставляет шансов на снабжение, а удержание разбитых позиций теряет военный смысл. Нам предстоит скрытный и рискованный ночной прорыв по грунтовым дорогам в сторону Краматорска и Донецка."
