l_russian:
 CRI_portests_are_going: "Протесты продолжаются"
 CRI_portests_are_going_desc: "Волна недовольства захлёстывает города Крыма. На площади выходят тысячи людей, недовольных киевской властью. Протестное движение набирает силу - вопрос лишь в том, кто направит его в нужное русло."
 CRI_support_pro_russian: "Поддержка пророссийских сил"
 CRI_support_pro_russian_desc: "Русскоязычное большинство полуострова всё громче требует сближения с Россией. Установив контакты с пророссийскими активистами и используя их поддержку, мы сможем превратить стихийные протесты в организованное движение."
 CRI_self_defense_units: "Отряды самообороны"
 CRI_self_defense_units_desc: "Стихийные пикеты у зданий администраций всё чаще перерастают в столкновения. Пришло время организовать отряды самообороны из местных жителей и ветеранов - они возьмут под контроль улицы и стратегические объекты полуострова."
 CRI_hold_a_referendum: "Провести референдум"
 CRI_hold_a_referendum_desc: "Вопрос о статусе Крыма должен быть решён самим народом. Референдум о независимости и вхождении в состав России определит судьбу полуострова - и мировое сообщество будет вынуждено считаться с волей крымчан."
 CRI_support_pro_ukranian: "Поддержка проукраинских сил"
 CRI_support_pro_ukranian_desc: "Крым остаётся частью Украины. Сплотив проукраинские организации и сторонников территориальной целостности, мы не позволим расколоть полуостров и сохраним его в составе единого государства."
