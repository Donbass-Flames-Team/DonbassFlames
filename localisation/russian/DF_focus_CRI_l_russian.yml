l_russian:
 CRI_portests_are_going:0 "Протесты продолжаются"
 CRI_portests_are_going_desc:0 "Волна недовольства захлёстывает города Крыма. На площади выходят тысячи людей, недовольных киевской властью. Протестное движение набирает силу - вопрос лишь в том, кто направит его в нужное русло."
 CRI_support_pro_russian:0 "Поддержка пророссийских сил"
 CRI_support_pro_russian_desc:0 "Русскоязычное большинство полуострова всё громче требует сближения с Россией. Установив контакты с пророссийскими активистами и используя их поддержку, мы сможем превратить стихийные протесты в организованное движение."
 CRI_self_defense_units:0 "Отряды самообороны"
 CRI_self_defense_units_desc:0 "Стихийные пикеты у зданий администраций всё чаще перерастают в столкновения. Пришло время организовать отряды самообороны из местных жителей и ветеранов - они возьмут под контроль улицы и стратегические объекты полуострова."
 CRI_hold_a_referendum:0 "Провести референдум"
 CRI_hold_a_referendum_desc:0 "Вопрос о статусе Крыма должен быть решён самим народом. Референдум о независимости и вхождении в состав России определит судьбу полуострова - и мировое сообщество будет вынуждено считаться с волей крымчан."
 CRI_support_pro_ukranian:0 "Поддержка проукраинских сил"
 CRI_support_pro_ukranian_desc:0 "Крым остаётся частью Украины. Сплотив проукраинские организации и сторонников территориальной целостности, мы не позволим расколоть полуостров и сохраним его в составе единого государства."
