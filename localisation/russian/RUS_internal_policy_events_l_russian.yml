l_russian:
 # ===== russia.36 - Пакет Яровой =====
 russia.36.t: "Пакет Яровой принят"
 russia.36.d: "Государственная дума приняла пакет законов, известный как «пакет Яровой». Отныне операторы связи обязаны хранить переписку и звонки граждан до шести месяцев, а спецслужбы получают право читать зашифрованные сообщения. Критики называют это слежкой, власть называет это безопасностью. Нам решать, как воспользоваться этим инструментом."
 russia.36.a: "Полный контроль. Государство должно знать всё."
 russia.36.b: "Пусть закон работает, но в разумных рамках."

 # ===== russia.37 - Росгвардия =====
 russia.37.t: "Создание Росгвардии"
 russia.37.d: "Указом президента создана Федеральная служба войск национальной гвардии, Росгвардия. Новая силовая структура выведена из подчинения МВД и напрямую подчинена верховному главнокомандующему. Это двести тысяч бойцов, которые будут стоять там, где скажет Кремль."
 russia.37.a: "Росгвардия под прямым президентским контролем."
 russia.37.b: "Пусть останется в структуре МВД, меньше бюрократии."

 # ===== russia.38 - Пенсионная реформа =====
 russia.38.t: "Пенсионная реформа"
 russia.38.d: "Правительство вынесло на обсуждение повышение пенсионного возраста. Мужчины будут выходить на пенсию в 65, женщины в 63. Министры говорят об экономической необходимости, на улицах уже собираются недовольные. Это решение будет стоить политических очков, но может открыть серьёзные финансовые возможности."
 russia.38.a: "Проводим реформу в полном объёме."
 russia.38.b: "Смягчаем условия, чтобы снизить социальный взрыв."

 # ===== russia.39 - Откат от жёсткой пенсионной реформы =====
 russia.39.t: "Общество отвечает на пенсионную реформу"
 russia.39.d: "Прошли месяцы после принятия реформы, но народный гнев не утихает. По стране прокатились митинги, рейтинги упали. Люди не прощают, когда у них отнимают то, на что они рассчитывали всю жизнь."
 russia.39.a: "Приходится принять этот удар."

 # ===== russia.40 - Цифровая экономика =====
 russia.40.t: "Программа «Цифровая экономика»"
 russia.40.d: "Правительство запускает масштабную программу цифровизации страны. IT-инфраструктура, электронные госуслуги, искусственный интеллект. Объём финансирования колоссальный. Вопрос в том, насколько быстро это заработает и не утонет ли в чиновничьих руках."
 russia.40.a: "Вкладываемся по максимуму, цифровое будущее уже сейчас."
 russia.40.b: "Действуем осторожно, сначала пилотные регионы."

 # ===== russia.41 - Крымскотатарское сопротивление =====
 russia.41.t: "Крымскотатарское сопротивление"
 russia.41.d: "Крымские татары открыто не признают российскую власть на полуострове. Активисты Меджлиса блокируют сотрудничество, в сёлах фиксируются случаи неповиновения. Это небольшая, но упорная сила, которая мешает полноценной интеграции Крыма."
 russia.41.a: "Жёсткие меры. Меджлис запрещён, активисты под следствием."
 russia.41.b: "Попробуем договориться. Концессии и интеграционные программы."

 # ===== russia.42 - Итог силового пути в Крыму =====
 russia.42.t: "Сопротивление подавлено"
 russia.42.d: "После жёстких мер сопротивление крымских татар фактически прекратилось. Лидеры задержаны или выехали с полуострова. Крым стал спокойнее, хотя осадок в обществе остался."
 russia.42.a: "Порядок восстановлен."

 # ===== russia.43 - Итог мирного пути в Крыму =====
 russia.43.t: "Татары интегрированы"
 russia.43.d: "Длительная работа с крымскотатарским сообществом принесла плоды. Культурные права признаны, инвестиции в татарские сёла пошли, напряжение спало. Это был долгий путь, но Крым теперь действительно спокойнее."
 russia.43.a: "Хорошая работа. Интеграция вместо конфронтации."

 # ===== russia.44 - Суверенный интернет =====
 russia.44.t: "Закон о суверенном интернете"
 russia.44.d: "Принят закон о создании суверенного российского интернета. Рунет получает собственную систему управления трафиком и может быть изолирован от глобальной сети. Технари скептичны, силовики довольны. Это большая ставка на независимость в цифровом пространстве."
 russia.44.a: "Полная изоляция при необходимости. Суверенитет превыше всего."
 russia.44.b: "Мягкий вариант. Инфраструктура есть, но рубильник не нажимаем."

 # ===== russia.45 - Обновление кабинета =====
 russia.45.t: "Обновление кабинета министров"
 russia.45.d: "Президент подписал указ о новом составе правительства. Медведев уходит, Мишустин приходит. Новые лица, новые обещания. Министерства перетасованы, задачи обновлены. Это хороший момент, чтобы перезагрузить внутреннюю повестку."
 russia.45.a: "Вперёд, с новой командой."

 # ===== russia.46 - Поправки в Конституцию =====
 russia.46.t: "Поправки в Конституцию"
 russia.46.d: "На общероссийском голосовании граждане одобрили поправки в Конституцию. Среди них: обнуление президентских сроков, закрепление традиционных ценностей, суверенитет над международными нормами. Власть получила мандат на следующие годы."
 russia.46.a: "Конституция принята. Полный ход."
 russia.46.b: "Пока отложим. Время не самое удачное."

 # ===== russia.47 - Крымская интеграция =====
 russia.47.t: "Инвестиции в Крым"
 russia.47.d: "Крым получает масштабный пакет инвестиций. Дороги, энергетика, жильё, туризм. Федеральные деньги потекли на полуостров. Москва показывает, что Крым это не просто политический проект, а реальная часть России."
 russia.47.a: "Вкладываемся. Крым должен процветать."

 # ===== russia.48 - Национальные проекты =====
 russia.48.t: "Национальные проекты"
 russia.48.d: "Президент объявил о запуске национальных проектов. Двенадцать направлений: здравоохранение, образование, жильё, дороги, экология. Суммарное финансирование в триллионах рублей. Страна должна увидеть результаты к 2024 году."
 russia.48.a: "Запускаем по всем фронтам."

 # ===== russia.49 - Этатизм и национализация элит =====
 russia.49.t: "Государство как главный хозяин"
 russia.49.d: "Перед нами стоит вопрос отношений власти и бизнеса. Олигархи и корпорации должны понять, кто в стране главный. Государство может взять под контроль ключевые отрасли и прижать к ногтю тех, кто думает, что деньги важнее Кремля."
 russia.49.a: "Полная национализация элит. Государство всегда правит."
 russia.49.b: "Договариваемся с элитами. Сотрудничество выгоднее давления."

 # ===== news_events.59-70 =====
 news_events.59.t: "Россия: «Пакет Яровой» подписан президентом"
 news_events.59.d: "Президент России подписал так называемый «Пакет Яровой», пакет законов об усилении контроля над интернетом и коммуникациями. Критики называют его угрозой приватности, власть настаивает на необходимости для борьбы с терроризмом."
 news_events.59.a: "Безопасность важнее. Правильное решение."
 news_events.59.b: "Очередной шаг к авторитаризму."
 news_events.59.c: "Внутренние дела России."

 news_events.60.t: "Россия создаёт Росгвардию"
 news_events.60.d: "В России указом президента создана Федеральная служба войск национальной гвардии. Новая структура напрямую подчинена главнокомандующему и насчитывает сотни тысяч бойцов. Аналитики видят в этом усиление личного контроля президента над силовым аппаратом."
 news_events.60.a: "Нам бы такие структуры тоже не помешали."
 news_events.60.b: "Ещё один инструмент для подавления инакомыслия."

 news_events.61.t: "Россия поднимает пенсионный возраст"
 news_events.61.d: "Российское правительство объявило о повышении пенсионного возраста. По стране прокатились акции протеста, рейтинги президента пошли вниз. Реформа вызвала острую реакцию в обществе, которое не привыкло к тому, что пенсионные обещания меняются на ходу."
 news_events.61.a: "Экономически понятный шаг, хотя и болезненный."
 news_events.61.b: "Люди вышли на улицы. Это о чём-то говорит."

 news_events.62.t: "Россия запускает программу цифровой экономики"
 news_events.62.d: "Москва объявила о масштабной программе «Цифровая экономика». Государство вкладывает триллионы в IT, искусственный интеллект и электронное правительство. Амбициозный план, но скептики сомневаются в способности бюрократии реализовать его без потерь."
 news_events.62.a: "Интересно, посмотрим как пойдёт."
 news_events.62.b: "У нас свои цифровые приоритеты."

 news_events.63.t: "Крымские татары не признают российскую власть"
 news_events.63.d: "Крымскотатарский Меджлис объявлен в России экстремистской организацией и запрещён. Тысячи татар отказываются получать российские паспорта. На полуострове растёт напряжение между русскоязычным большинством и коренным народом."
 news_events.63.a: "Крым наш, и порядок там мы наведём."
 news_events.63.b: "Это нарушение прав коренных народов."
 news_events.63.c: "Далёкая проблема."

 news_events.64.t: "Россия и крымские татары достигли договорённостей"
 news_events.64.d: "После длительных переговоров российские власти объявили о программе интеграции крымских татар. Признаны культурные права, открыты школы с крымскотатарским языком обучения. Напряжение на полуострове начинает спадать."
 news_events.64.a: "Грамотный ход. Меньше проблем внутри."
 news_events.64.b: "Дипломатия вместо репрессий. Посмотрим насколько это искренне."

 news_events.65.t: "Россия принимает закон о суверенном интернете"
 news_events.65.d: "Государственная Дума приняла закон о так называемом «суверенном интернете». Рунет получает техническую возможность отключиться от мировой сети. Западные правительства осудили закон, назвав его инструментом цензуры."
 news_events.65.a: "Каждая страна сама решает как управлять своим интернетом."
 news_events.65.b: "Это прямая угроза свободе слова."
 news_events.65.c: "Не наше дело."

 news_events.66.t: "В России сменился премьер-министр"
 news_events.66.d: "Дмитрий Медведев ушёл с поста премьер-министра России. Новым главой правительства назначен Михаил Мишустин. Эксперты связывают смену кабинета с предстоящими конституционными изменениями и перераспределением власти в стране."
 news_events.66.a: "Внутренняя перетасовка. Смотрим за развитием событий."
 news_events.66.b: "Значимое изменение в российской политике."

 news_events.67.t: "Россия изменила Конституцию"
 news_events.67.d: "По итогам общероссийского голосования в Конституцию России внесены поправки. Ключевое: президентские сроки обнуляются, что позволяет действующему лидеру оставаться у власти до 2036 года. Запад расценивает это как закрепление авторитаризма."
 news_events.67.a: "Ситуация в России нас напрямую затрагивает."
 news_events.67.b: "Закрепление власти на десятилетия вперёд. Тревожный сигнал."
 news_events.67.c: "Внутреннее дело России."

 news_events.68.t: "Крым активно интегрируется в состав России"
 news_events.68.d: "Российские власти сообщают об успехах интеграции Крыма. Новые дороги, газопроводы, Крымский мост достраивается. Москва демонстрирует, что вложения в полуостров носят долгосрочный характер."
 news_events.68.a: "Своё вернули и обустраивают. Логично."
 news_events.68.b: "Незаконная аннексия продолжает закрепляться."

 news_events.69.t: "Россия запускает национальные проекты"
 news_events.69.d: "Кремль объявил о двенадцати национальных проектах с суммарным финансированием в 25 триллионов рублей до 2024 года. Здравоохранение, образование, дороги, жильё. Амбициозные цели на фоне санкций и экономических трудностей."
 news_events.69.a: "Посмотрим на результаты."
 news_events.69.b: "Деньги есть, было бы желание их потратить правильно."

 news_events.70.t: "Россия усиливает государственный контроль над экономикой"
 news_events.70.d: "Кремль последовательно расширяет присутствие государства в ключевых секторах экономики. Крупный бизнес вынужден согласовывать решения с Москвой. Независимые олигархи уходят в прошлое. Государство становится главным хозяином."
 news_events.70.a: "Государство должно контролировать стратегические отрасли."
 news_events.70.b: "Свободный рынок задыхается под государственным давлением."
 news_events.70.c: "У нас свои экономические модели."

 # ===== Custom tooltips для dynamic modifiers =====
 RUS_governance_dynamic_modifier_tt: "Индекс управления: чем больше реформ проведено, тем выше стабильность, политическая власть и строительные мощности."
 RUS_digital_economy_dynamic_modifier_tt: "Уровень цифровизации даёт бонусы к науке, строительству и политической власти."
 RUS_bureaucracy_dynamic_modifier_tt: "Реформа бюрократии снижает потребительские товары и даёт бонус к строительству. Без реформы всё наоборот."
 RUS_crimea_integration_dynamic_modifier_tt: "Успешная интеграция Крыма даёт стабильность, строительство и снижает нагрузку на потребительские товары."
 RUS_tatar_resistance_dynamic_modifier_tt: "Пока сопротивление татар не решено, падает стабильность и лояльность населения Крыма."
 RUS_sovereign_internet_dynamic_modifier_tt: "Суверенный интернет добавляет стабильность и политическую власть, но режет скорость исследований."
 RUS_rosgvardia_dynamic_modifier_tt: "Росгвардия держит порядок внутри страны: снижает сопротивление и добавляет стабильность."
 RUS_pension_reform_dynamic_modifier_tt: "Пенсионная реформа освобождает промышленные мощности, но бьёт по стабильности и народной поддержке."
 RUS_yarovaya_dynamic_modifier_tt: "Пакет Яровой немного добавляет стабильности, но ограничивает свободный обмен информацией и замедляет науку."
