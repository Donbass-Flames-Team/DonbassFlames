 DPR_free_the_entire_donetsk_oblast: "Drive Out the Junta"
 DPR_shaky_peace_on_donbass: "Shaky Peace in Donbass"
 DPR_shaky_peace_on_donbass_desc: "Active hostilities have paused but the situation remains extremely tense. We must use this breathing room to strengthen government bodies and rebuild ruined infrastructure."
 DPR_fight_with_banditry: "Fight Against Banditry"
 DPR_fight_with_banditry_desc: "Uncontrolled armed groups inside the republic threaten public order. Strict measures are required to disarm rogue elements and establish law."
 DPR_disarm_safonov: "Disarm Safonov"
 DPR_disarm_safonov_desc: "Field commander Safonov refuses to submit to central command. Neutralizing his group will consolidate authority and clear internal ranks."
 DPR_foreign_policy_of_the_dpr: "Foreign Policy of the DPR"
 DPR_foreign_policy_of_the_dpr_desc: "Establishing international ties and seeking recognition is vital for the young republic. We must build steady diplomatic channels with key allies."
 DPR_restore_rail_links_with_the_lpr: "Restore Rail Links with the LPR"
 DPR_restore_rail_links_with_the_lpr_desc: "Reconnecting railway communication with Luhansk will speed up trade and military logistics between the friendly republics."
 DPR_get_rid_of_the_customs_border: "Abolish Customs Border"
 DPR_get_rid_of_the_customs_border_desc: "Removing customs barriers with the neighbor republic will create a unified economic space and simplify cargo transport."
 DPR_economy_of_donetsk: "Economy of Donetsk"
 DPR_economy_of_donetsk_desc: "Industrial power of Donbass needs centralized planning. We must restore factories and ensure stable pay for local workers."
 DPR_central_republican_bank_of_the_dpr: "Central Republican Bank of the DPR"
 DPR_central_republican_bank_of_the_dpr_desc: "Establishing our own financial system and central bank is necessary to stabilize circulation and collect taxes."
 DPR_restore_production: "Restore Production"
 DPR_restore_production_desc: "Reopening damaged factories and industrial plants will supply our armed forces with equipment and create essential jobs."
 DPR_the_mining_issue: "The Mining Issue"
 DPR_the_mining_issue_desc: "Coal industry forms the core of our economy. Resolving fuel supply issues and paying miners will guarantee social stability."
 DPR_reforms_of_dpr_army: "Reforms of the DPR Army"
 DPR_reforms_of_dpr_army_desc: "Transitioning from disparate militia units to a disciplined regular army is crucial for long term defense capability."
 DPR_marine_infantry_of_dpr: "Marine Infantry of the DPR"
 DPR_marine_infantry_of_dpr_desc: "Forming specialized naval infantry units will secure coastal sectors and enhance tactical flexibility on southern flanks."
 DPR_instructors_from_russia: "Instructors from Russia"
 DPR_instructors_from_russia_desc: "Inviting experienced military specialists will raise officer training standards and improve overall combat efficiency."
 DPR_donetsk_higher_combined_arms_command_school: "Donetsk Higher Combined Arms Command School"
 DPR_donetsk_higher_combined_arms_command_school_desc: "Creating an officer training academy ensures a steady supply of qualified commanders for our growing armed forces."
 DPR_expansion_of_the_dpr_elite: "Expansion of the DPR Elite Units"
 DPR_expansion_of_the_dpr_elite_desc: "Veteran volunteer units have proven their worth. Expanding elite detachments will provide strong spearhead forces for critical sectors."
 DPR_first_army_corp_of_dpr: "1st Army Corps of the DPR"
 DPR_first_army_corp_of_dpr_desc: "Unifying independent battalions into a single structured army corps will streamline command and tactical coordination."
 DPR_republican_guardia_of_dpr: "Republican Guard of the DPR"
 DPR_republican_guardia_of_dpr_desc: "Establishing a special reserve force under direct state command guarantees internal security and operational flexibility."
 DPR_hold_referendum_on_independence: "Hold Referendum on Independence"
 DPR_hold_referendum_on_independence_desc: "Giving citizens the opportunity to vote on state sovereignty legitimizes our political path and sets the future course."
 DPR_accept_constitution: "Adopt the Constitution"
 DPR_accept_constitution_desc: "A basic law is essential to define government structure, guarantee rights, and solidify our legal independence."
 DPR_nationalization_of_assets: "Nationalization of Assets"
 DPR_nationalization_of_assets_desc: "Transferring key industrial assets and abandoned properties under state control will secure resources for defense."
 DPR_create_donetsk_mvd: "Create Donetsk Ministry of Internal Affairs"
 DPR_create_donetsk_mvd_desc: "Building a dedicated police force secures order in towns, combats crime, and protects civilian infrastructure."
 DPR_set_up_production: "Set Up Military Production"
 DPR_set_up_production_desc: "Converting local workshops and plants to produce ammunition and military gear will reduce reliance on external supplies."
 DPR_reopening_of_captured_ukrainian_warehouses: "Reopen Captured Warehouses"
 DPR_reopening_of_captured_ukrainian_warehouses_desc: "Inventorying and utilizing captured stocks will immediately supply frontline units with equipment and munitions."
 DPR_organize_defense_in_donetsk: "Organize Defense in Donetsk"
 DPR_organize_defense_in_donetsk_desc: "Fortifying city entrances and preparing defense lines inside urban districts will make the capital an impenetrable stronghold."
 DPR_centralize_donetsk_groups: "Centralize Donetsk Squads"
 DPR_centralize_donetsk_groups_desc: "Integrating various local defense groups under unified headquarters avoids chaos and improves command responsiveness."
 DPR_strelkovs_resignation: "Strelkov's Resignation"
 DPR_strelkovs_resignation_desc: "Political changes in leadership lead to a command shift, opening ways for political compromise and new command structures."
 DPR_cooperation_with_lpr: "Cooperation with the LPR"
 DPR_cooperation_with_lpr_desc: "Aligning military and economic decisions with Luhansk comrades strengthens our common stance against joint threats."
 DPR_novorossiya_project: "Novorossiya Project"
 DPR_novorossiya_project_desc: "Advancing the confederation concept lays foundations for political and military unity among Donbass regions."
 DPR_united_parliament: "United Parliament"
 DPR_united_parliament_desc: "Forming a shared legislative body coordinates joint laws and policy decisions for the combined territories."
 DPR_form_novorossiya: "Form Novorossiya"
 DPR_form_novorossiya_desc: "Finalizing the political union establishes a strong united entity capable of defending its sovereignty."
 DPR_set_up_ambushes: "Set Up Ambushes"
 DPR_set_up_ambushes_desc: "Using knowledge of local terrain to prepare covert ambushes on enemy supply routes will inflict heavy attrition."
 DPR_annex_makeevka: "Integrate Makeevka"
 DPR_annex_makeevka_desc: "Establishing full administrative control over Makeevka secures critical industrial areas adjacent to the capital."
 DPR_annex_horlivka: "Integrate Horlivka"
 DPR_annex_horlivka_desc: "Securing the Horlivka sector stabilizes frontline defense on northern approaches and protects valuable industrial sites."
