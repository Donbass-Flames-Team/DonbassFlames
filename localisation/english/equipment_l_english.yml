#IFV
 infantry_fighting_vehicle: "Infantry Fighting Vehicle"
 infantry_fighting_vehicle_short: "IFV"
 infantry_fighting_vehicle_desc: "Infantry Fighting Vehicle"
 infantry_fighting_vehicle_0: "BMP-1"
 infantry_fighting_vehicle_0_short: "BMP-1"
 infantry_fighting_vehicle_0_desc: "The BMP-1 is a Soviet tracked infantry fighting vehicle armed with the 73 mm 2A28 Grom gun and an anti-tank guided missile system. It combines infantry transport, direct fire support and amphibious capability."
 infantry_fighting_vehicle_1: "BMP-2"
 infantry_fighting_vehicle_1_short: "BMP-2"
 infantry_fighting_vehicle_1_desc: "The BMP-2 is a development of the BMP-1 equipped with the 30 mm 2A42 autocannon, improved ability to engage infantry and aerial targets, and anti-tank guided missiles. It retains high mobility and amphibious capability."
 infantry_fighting_vehicle_2: "BMP-3"
 infantry_fighting_vehicle_2_short: "BMP-3"
 infantry_fighting_vehicle_2_desc: "The BMP-3 is an infantry fighting vehicle with a powerful weapons suite centered on the 100 mm 2A70 gun and 30 mm 2A72 autocannon. It combines heavy firepower, good mobility and amphibious capability."
 infantry_fighting_vehicle_3: "Infantry Fighting Vehicle IV"
 infantry_fighting_vehicle_3_short: "IFV IV"
 infantry_fighting_vehicle_3_desc: "Infantry Fighting Vehicle IV"
#apc
 apc: "Armored Personnel Carrier"
 apc_short: "APC"
 apc_desc: "Armored Personnel Carrier"
 apc_0: "BTR-60PB"
 apc_0_short: "BTR-60PB"
 apc_0_desc: "The BTR-60PB is a Soviet 8×8 wheeled armored personnel carrier designed to transport motorized infantry. It is armed with a KPVT heavy machine gun and is capable of amphibious operations."
 apc_1: "BTR-70"
 apc_1_short: "BTR-70"
 apc_1_desc: "The BTR-70 is a Soviet 8×8 wheeled armored personnel carrier developed from the BTR-60. It features an improved running gear and layout while retaining a turret-mounted 14.5 mm KPVT machine gun and amphibious capability."
 apc_2: "BTR-70"
 apc_2_short: "BTR-70"
 apc_2_desc: "The BTR-70 is a Soviet 8×8 wheeled armored personnel carrier intended for protected infantry transport and fire support. It is armed with a 14.5 mm KPVT machine gun and offers good cross-country mobility."
 apc_3: "BTR-80"
 apc_3_short: "BTR-80"
 apc_3_desc: "The BTR-80 is an 8×8 wheeled armored personnel carrier with a diesel engine, improved mobility and better troop access. It is armed with a 14.5 mm KPVT machine gun and retains amphibious capability."
 apc_4: "Armored Personnel Carrier V"
 apc_4_short: "APC V"
 apc_4_desc: "Armored Personnel Carrier V"
#acv
 airborne_combat_vehicle: "Airborne Combat Vehicle"
 airborne_combat_vehicle_short: "ACV"
 airborne_combat_vehicle_desc: "Airborne Combat Vehicle"
 airborne_combat_vehicle_0: "BMD-1"
 airborne_combat_vehicle_0_short: "BMD-1"
 airborne_combat_vehicle_0_desc: "The BMD-1 is a Soviet airborne infantry fighting vehicle designed for parachute deployment. Armed with the 73 mm 2A28 Grom gun, it provides airborne troops with mobility and direct fire support."
 airborne_combat_vehicle_1: "BMD-2"
 airborne_combat_vehicle_1_short: "BMD-2"
 airborne_combat_vehicle_1_desc: "The BMD-2 is a modernized airborne combat vehicle fitted with the 30 mm 2A42 autocannon and anti-tank guided missiles. It retains low weight, high mobility and the ability to be air-dropped."
 airborne_combat_vehicle_2: "BMP-1"
 airborne_combat_vehicle_2_short: "BMP-1"
 airborne_combat_vehicle_2_desc: "The BMP-1 is a Soviet tracked infantry fighting vehicle armed with the 73 mm 2A28 Grom gun and an anti-tank guided missile system. It is intended to transport infantry and provide direct fire support on the battlefield."
 airborne_combat_vehicle_3: "BMP-2"
 airborne_combat_vehicle_3_short: "BMP-2"
 airborne_combat_vehicle_3_desc: "The BMP-2 is a tracked infantry fighting vehicle armed with the 30 mm 2A42 autocannon and anti-tank guided missiles. Compared with the BMP-1, it is significantly more effective against infantry and light vehicles."
