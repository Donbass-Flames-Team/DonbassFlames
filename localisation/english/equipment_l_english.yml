#Ak
 infantry_equipment: "Infantry Weapons"
 infantry_equipment_desc: "Infantry Weapons"
 infantry_equipment_0: "AKM"
 infantry_equipment_0_desc: "A modernized Kalashnikov assault rifle chambered for an intermediate cartridge. Simple, reliable and suitable for mass production."
 infantry_equipment_1: "AKMS"
 infantry_equipment_1_desc: "A folding-stock version of the AKM designed for airborne troops, vehicle crews and units requiring a more compact weapon."
 infantry_equipment_2: "AKS-74U"
 infantry_equipment_2_desc: "A compact assault rifle with a shortened barrel and folding stock, intended for vehicle crews, special units and close-quarters combat."
 infantry_equipment_3: "AK-74M"
 infantry_equipment_3_desc: "A modernized version of the AK-74 featuring a folding polymer stock, improved durability and compatibility with modern sights and accessories."
 infantry_equipment_4: "AK-105"
 infantry_equipment_4_desc: "A shortened assault rifle combining the compact dimensions of a carbine with the handling and firepower of a standard infantry weapon."
 infantry_equipment_5: "AK-12"
 infantry_equipment_5_desc: "A modern assault rifle equipped with improved ergonomics, accessory rails and enhanced compatibility with optical and night sights."
 infantry_equipment_6: "AK-203"
 infantry_equipment_6_desc: "An updated assault rifle based on the proven Kalashnikov design, combining a powerful cartridge with modern furniture and accessory mounting options."
 infantry_equipment_7: "AK-12M1"
 infantry_equipment_7_desc: "A further development of the AK-12 with revised controls, improved reliability and enhanced ergonomics based on operational experience."
