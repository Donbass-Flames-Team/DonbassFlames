# Default Modern Tank Equipment
 modern_tank_equipment: "Main Battle Tank"
 modern_tank_equipment_short: "MBT"
 modern_tank_equipment_desc: "The main battle tank combines firepower, armor protection and high mobility, forming the core of modern armored forces."
 modern_tank_equipment_1: "T-54"
 modern_tank_equipment_1_short: "T-54"
 modern_tank_equipment_1_desc: "The T-54 is a post-war Soviet medium tank armed with the 100 mm D-10T gun, featuring a low silhouette and strong armor for its era. Its design became the basis for further development of Soviet main battle tanks."
 modern_tank_equipment_2: "T-55"
 modern_tank_equipment_2_short: "T-55"
 modern_tank_equipment_2_desc: "The T-55 is a major modernization of the T-54, with improved reliability, protection against weapons of mass destruction and a refined powerplant. Its simple design and high upgrade potential gave it an exceptionally long service life."
 modern_tank_equipment_3: "T-72"
 modern_tank_equipment_3_short: "T-72"
 modern_tank_equipment_3_desc: "The T-72 is a mass-produced main battle tank with a 125 mm smoothbore gun, an autoloader and composite armor. Its compact design combines strong firepower, good mobility and comparatively low production cost."
 modern_tank_equipment_4: "T-80"
 modern_tank_equipment_4_short: "T-80"
 modern_tank_equipment_4_desc: "The T-80 is a main battle tank powered by a gas-turbine engine, offering high mobility and a 125 mm gun with an autoloader. Improved fire-control systems and armor protection made it one of the most advanced Soviet tanks of its generation."
 modern_tank_equipment_5: "T-90"
 modern_tank_equipment_5_short: "T-90"
 modern_tank_equipment_5_desc: "The T-90 is a further development of the T-72 family, combining improved composite and reactive armor, a modernized 125 mm gun and updated fire-control systems. It blends a proven platform with greater survivability and combat effectiveness."