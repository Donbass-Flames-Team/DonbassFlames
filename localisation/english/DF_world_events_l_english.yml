l_english:
world_events.1.t: "Scottish Independence Referendum"
world_events.1.d: "The Scottish independence referendum was held on 18 September 2014. Voters were asked: “Should Scotland be an independent country?” with “Yes” and “No” as the possible answers. Residents of Scotland were eligible to vote, including EU and Commonwealth citizens permanently living in the region. For the first time in a nationwide vote in the United Kingdom, 16- and 17-year-olds were also allowed to participate. Turnout reached 84.6%, one of the highest levels in modern British history. A total of 55.3% (2,001,926) voted “No” to independence, while 44.7% (1,617,989) voted “Yes.” Following the defeat of the independence campaign, Scotland’s First Minister Alex Salmond announced his resignation. After the referendum, the British government began expanding the powers of the Scottish Parliament through subsequent legislation."
world_events.1.a: "Understood"
world_events.1.b: "Why couldn’t we do the same?"

world_events.2.t: "Ebola Outbreak in West Africa"
world_events.2.d: "The Ebola outbreak in West Africa began in southeastern Guinea in late 2013 and was officially declared by the World Health Organization on 23 March 2014. The disease later spread primarily across Guinea, Liberia, and Sierra Leone, which became the main centers of the epidemic. On 8 August 2014, the WHO declared the outbreak a Public Health Emergency of International Concern. As part of the international response, the United Nations established UNMEER on 19 September 2014, the first emergency health mission in UN history. According to the WHO, more than 28,600 infections and 11,325 deaths were recorded in total. In June 2016, the WHO declared the outbreak over."
world_events.2.a: "Worrying"

world_events.3.t: "ISIS"
world_events.3.d: "In June 2014, the radical Islamist organization known as the Islamic State, or ISIS, launched a rapid offensive across Iraq and Syria. On 10 June 2014, its militants captured Mosul, Iraq’s second-largest city. On 29 June, the group’s leader, Abu Bakr al-Baghdadi, announced the creation of a “caliphate” and proclaimed himself caliph. The organization declared the border between Iraq and Syria abolished and claimed authority over all Muslims. At the height of its power in 2014–2015, ISIS controlled large territories inhabited by several million people. The international community formed a US-led coalition against the group, beginning airstrikes in August 2014. By March 2019, ISIS had lost its final populated stronghold in Syria, although individual cells continued to operate underground."
world_events.3.a: "Dangerous"
world_events.3.b: "We will destroy them"

world_events.4.t: "Paris Terror Attacks"
world_events.4.d: "On 13 November 2015, a series of coordinated terrorist attacks took place in Paris and the suburb of Saint-Denis. The attacks included explosions near the Stade de France, shootings and a bombing at cafés and restaurants in Paris’s 10th and 11th arrondissements, and a hostage-taking followed by a mass killing at the Bataclan concert hall. According to Europol, 130 people were killed and 368 were injured. The Islamic State claimed responsibility for the attacks. French President François Hollande described them as an “act of war.” A state of emergency was introduced in France immediately afterward and formalized by a decree on 14 November 2015. The attacks became the deadliest terrorist incident in modern French history and one of the deadliest in the European Union since the 2004 Madrid bombings."
world_events.4.a: "Horrific"

world_events.5.t: "Paris Climate Agreement"
world_events.5.d: "The United Nations Climate Change Conference, COP21, was held in Paris from 30 November to 11 December 2015 and concluded with the adoption of the Paris Agreement through Decision 1/CP.21. The agreement established the long-term goal of keeping the increase in global average temperature well below 2°C above pre-industrial levels while pursuing efforts to limit warming to 1.5°C. It introduced a system of nationally determined contributions, or NDCs, through which countries submit and update their plans for reducing emissions and adapting to climate change. The agreement also established a regular cycle for raising ambition, conducting global assessments of progress, and strengthening transparency and reporting requirements for both action and support. The Paris Agreement entered into force on 4 November 2016 after reaching the ratification threshold of at least 55 parties representing at least 55% of global emissions."
world_events.5.a: "Noted"

world_events.6.t: "European Migrant Crisis"
world_events.6.d: "The European migrant crisis was marked by a sharp increase in the number of refugees and migrants arriving in European Union countries in 2015–2016 through the Mediterranean and the Balkan route. Most arrivals came from Syria, Iraq, Afghanistan, and several African countries, fleeing armed conflicts and humanitarian crises. In 2015, more than one million people reached Europe by sea. Greece and Italy became the main countries of first entry. The crisis resulted in numerous deaths during attempts to cross the Mediterranean. It also caused serious political disagreements within the EU over the distribution of refugees and the strengthening of border controls. In March 2016, the EU and Turkey reached an agreement aimed at reducing irregular migration."
world_events.6.a: "Understood"
world_events.6.b: "We can do this"

world_events.7.t: "Brexit"
world_events.7.d: "On 23 June 2016, the United Kingdom held a referendum in which 51.9% of voters supported leaving the European Union, while 48.1% voted to remain. Prime Minister David Cameron announced his resignation following the result. On 29 March 2017, the government formally notified the EU of its intention to leave, triggering the procedure under Article 50 of the Treaty on European Union. Negotiations continued for more than three years and were accompanied by a political crisis in the British Parliament. On 31 January 2020, the United Kingdom formally left the EU and entered a transition period. On 24 December 2020, the United Kingdom and the EU signed the Trade and Cooperation Agreement. The transition period ended on 31 December 2020, after which their relations were governed by the new agreement. Brexit became the first withdrawal of a member state from the European Union."
world_events.7.a: "Well, that happened"
world_events.7.b: "The well-fed will never understand the hungry"

world_events.8.t: "Attempted Coup in Turkey"
world_events.8.d: "On the night of 15–16 July 2016, an attempted military coup took place in Turkey. A group of military personnel tried to seize key sites in Ankara and Istanbul, including bridges, airports, and the parliament building. More than 250 people were killed and over two thousand were injured in the ensuing clashes. Turkish President Recep Tayyip Erdoğan called on citizens to take to the streets and resist the plotters. The coup attempt was suppressed within a day, and the authorities accused the movement of Fethullah Gülen of organizing it. A state of emergency remained in force for two years. In the months that followed, large-scale purges took place in the military, judiciary, police, educational institutions, and media. The events of 2016 strengthened presidential power and contributed to Turkey’s transition to a presidential system following the 2017 constitutional referendum."
world_events.8.a: "Not good"
world_events.8.b: "That could never happen in Russia"

world_events.9.t: "Battle of Aleppo"
world_events.9.d: "The Battle of Aleppo was a series of major clashes during the Syrian Civil War that lasted from 2012 to 2016. Aleppo was the country’s largest economic center and held major strategic importance. In 2012, the city was divided between government forces and various opposition groups. The decisive phase came in 2016, when the Syrian army, supported by Russia and allied formations, launched an offensive against the eastern districts. Airstrikes and artillery were heavily used during the operation, causing widespread destruction of infrastructure. In December 2016, government forces took full control of the city after opposition fighters and civilians were evacuated. The loss of Aleppo was a major strategic defeat for the armed opposition. The battle is widely regarded as a turning point in the war that strengthened the position of the Syrian government."
world_events.9.a: "Understood"
world_events.9.b: "Jumbo"

world_events.10.t: "North Korean Missile and Nuclear Tests"
world_events.10.d: "In 2016–2017, the Democratic People’s Republic of Korea carried out a series of missile and nuclear tests. Nuclear tests were conducted in January and September 2016, while testing continued at an intensified pace in 2017. In July 2017, North Korea announced the successful launch of an intercontinental ballistic missile capable of reaching the United States. On 3 September 2017, it conducted its sixth and most powerful nuclear test. In response, the United Nations Security Council adopted several resolutions that significantly tightened international sanctions against the country. The restrictions affected exports of coal, textiles, and seafood, as well as supplies of petroleum products. The United States, South Korea, and Japan strengthened military cooperation and expanded their missile defense systems."
world_events.10.a: "Unhinged!"
world_events.10.b: "Tremble, West!"

world_events.11.t: "Constitutional Crisis in Spain"
world_events.11.d: "The 2017 constitutional crisis in Spain was triggered by Catalonia’s attempt to achieve independence. On 1 October 2017, the regional authorities held an independence referendum that Spain’s Constitutional Court had declared illegal. The vote was accompanied by police intervention and mass protests. On 27 October 2017, the Parliament of Catalonia adopted a declaration of independence. That same day, the Spanish government invoked Article 155 of the Constitution, temporarily suspending the region’s autonomy and dissolving the Catalan Parliament. Some leaders of the independence movement were arrested, while others left the country. Snap regional elections were held in Catalonia in December 2017."
world_events.11.a: "What, again?"

world_events.12.t: "Yellow Vest Protests"
world_events.12.d: "Mass protests by the Yellow Vest movement began in France in November 2018. They were initially sparked by a planned increase in fuel taxes and rising petrol and diesel prices. The demonstrations quickly developed into a broader social movement against the rising cost of living and the government’s economic policies. The protests included road blockades, mass demonstrations, and clashes with police, particularly in Paris. Some incidents involved vandalism and arson. The authorities deployed substantial security forces to maintain order. The French president announced several socioeconomic concessions, including an increase in the minimum wage and the cancellation of some tax measures. The movement became one of the largest protest campaigns in twenty-first-century France."
world_events.12.a: "Protests again"

world_events.13.t: "2018 FIFA World Cup"
world_events.13.d: "The 2018 FIFA World Cup was held in Russia from 14 June to 15 July 2018. It was the first World Cup hosted by the Russian Federation and the first to take place in Eastern Europe. Thirty-two national teams participated in the tournament. Matches were held at twelve stadiums across eleven cities. The final took place at Luzhniki Stadium in Moscow. France won the tournament by defeating Croatia 4–2 in the final, while Belgium claimed the bronze medal. More than three million spectators attended the tournament, and its television audience reached billions of people worldwide. It was the largest sporting event of the year."
world_events.13.a: "Football!"

world_events.14.t: "A New Virus!"
world_events.14.d: "In December 2019, Chinese authorities reported cases of an unknown form of pneumonia in Wuhan, Hubei Province. The first patients were linked to a local seafood market, which was soon closed for public health measures. On 31 December 2019, China officially notified the World Health Organization of the cases. During January, infections were reported outside China. On 30 January 2020, the WHO declared the situation a Public Health Emergency of International Concern."
world_events.14.a: "We’re watching"

world_events.15.t: "COVID-19"
world_events.15.d: "In early 2020, COVID-19 began spreading rapidly beyond China. By February, cases had been recorded in countries across Asia, Europe, North America, and the Middle East. On 11 March 2020, the World Health Organization declared a pandemic. Governments introduced quarantine measures, travel restrictions, border closures, and temporary shutdowns of businesses and educational institutions. Healthcare systems in many countries came under severe strain."
world_events.15.a: "This is bad"

world_events.16.t: "Black Lives Matter"
world_events.16.d: "Black Lives Matter is a social movement opposing racial discrimination and violence against African Americans in the United States. It emerged in 2013 following the acquittal of George Zimmerman in the killing of Trayvon Martin. Large-scale protests under the slogan began in May and June 2020 after George Floyd died during a police arrest in Minneapolis. Demonstrations took place in hundreds of US cities and in several other countries. The protests included both peaceful demonstrations and isolated incidents of unrest. The movement drew attention to police violence, systemic racism, and law-enforcement reform. Several states introduced legislative changes and reviewed policing practices. Black Lives Matter became one of the largest social movements in modern US history."
world_events.16.a: "Understood"

world_events.17.t: "Beirut Port Explosion"
world_events.17.d: "On 4 August 2020, a massive explosion struck the Port of Beirut, becoming one of the largest non-nuclear man-made disasters in history. It was caused by a fire and the detonation of approximately 2,750 tonnes of ammonium nitrate that had been stored in a warehouse since 2013. More than 200 people were killed and over 6,000 were injured. A significant portion of the port’s infrastructure was destroyed, and tens of thousands of buildings were damaged. The blast was felt hundreds of kilometers away. The country’s government resigned several days later."
world_events.17.a: "Horrific"

world_events.18.t: "Nagorno-Karabakh War"
world_events.18.d: "The 2020 Nagorno-Karabakh War was an armed conflict between Azerbaijan and Armenia that began on 27 September 2020. Fighting took place around Nagorno-Karabakh and the surrounding districts, which had been controlled by Armenian forces since the 1990s. Drones, artillery, and missile systems were used extensively during the conflict. Azerbaijani forces regained control of a significant amount of previously lost territory, including the city of Shusha. On 9 November 2020, a ceasefire agreement was signed with Russian mediation. Under its terms, several districts came under Azerbaijani control, while Russian peacekeeping forces were deployed to the region. The conflict caused thousands of deaths and widespread destruction. The region remained unstable even after the end of major combat operations."
world_events.18.a: "Worrying"

world_events.19.t: "Mass Vaccination Begins"
world_events.19.d: "Mass vaccination against COVID-19 began in December 2020 following the emergency approval of the first vaccines. The first vaccines authorized for use included the mRNA-based products developed by Pfizer/BioNTech and Moderna. Vaccination initially focused on healthcare workers, elderly people, and high-risk groups. In 2021, immunization campaigns expanded to the wider population in most countries around the world. Large vaccination centers were established, and mobile vaccination units were organized. Billions of doses were produced and distributed throughout the year through national programs and international mechanisms. Mass vaccination helped reduce severe illness and mortality. The campaign became one of the largest in the history of global public health."
world_events.19.a: "Finally"

world_events.20.t: "Australian Bushfires"
world_events.20.d: "The 2019–2020 Australian bushfire season, known as the “Black Summer,” became one of the most severe in the country’s history. The fires began in mid-2019 and peaked in late 2019 and early 2020. More than 18 million hectares of land were burned. Dozens of people were killed, and thousands of homes were destroyed. Environmental estimates suggested that billions of animals were affected or killed. Major cities, including Sydney and Melbourne, remained covered by dense smoke for extended periods. The fires were driven by a combination of drought, extreme heat, and strong winds."
world_events.20.a: "Poor kangaroos…"

world_events.21.t: "Storming of the US Capitol"
world_events.21.d: "On 6 January 2021, supporters of then-President Donald Trump stormed the United States Capitol in Washington, D.C. Congress was meeting that day to certify the results of the 2020 presidential election. Following a rally near the White House, some protesters broke through security barriers and entered the Capitol, forcing lawmakers to evacuate temporarily and suspending the session. Several people died during or in connection with the events, and dozens were injured, including police officers. Federal forces and the National Guard restored order within several hours. Large-scale investigations and criminal proceedings against participants followed. The House of Representatives impeached Donald Trump on a charge of incitement of insurrection."
world_events.21.a: "Shocking"

world_events.22.t: "The Taliban Returns"
world_events.22.d: "In 2021, following the US decision to end its military mission, American and NATO forces began a phased withdrawal from Afghanistan. The Taliban intensified its offensive during the spring and summer of 2021, rapidly capturing provincial capitals. On 15 August 2021, Taliban forces entered Kabul, and President Ashraf Ghani left the country. Government forces largely ceased resistance, and power passed to the Taliban. A major evacuation of foreign citizens and Afghans who had worked with international organizations took place at Kabul airport. On 31 August 2021, the United States officially ended its military presence in the country. The restoration of the Islamic Emirate of Afghanistan was proclaimed. After the change of power, the international community imposed restrictions and froze part of Afghanistan’s assets, worsening the country’s economic crisis."
world_events.22.a: "Understood"

world_events.23.t: "A New Wave of COVID-19"
world_events.23.d: "A new wave of COVID-19 was recorded in many countries in late 2021 and early 2022. The rise in infections was linked to the spread of new variants, including Omicron. It was highly contagious and spread rapidly. Many governments once again introduced restrictions on public gatherings and travel. Healthcare systems faced an increase in hospital admissions. At the same time, mortality rates in some countries were lower than during previous waves due to vaccination and growing population immunity. Authorities expanded booster vaccination campaigns. The new wave demonstrated the virus’s continuing evolution and the need to adapt public health measures."
world_events.23.a: "Not again…"

world_events.24.t: "Suez Canal Blocked"
world_events.24.d: "On 23 March 2021, the container ship Ever Given ran aground in the southern section of the Suez Canal, completely blocking traffic through one of the world’s most important trade routes. The approximately 400-meter-long vessel was sailing from China to the Netherlands. The canal remained blocked for six days, creating a queue of hundreds of ships. The Suez Canal carries a significant share of global maritime trade and serves as a crucial link between Europe and Asia. The incident delayed shipments of oil, gas, and manufactured goods. Tugboats and dredgers were used in the effort to free the ship, along with extensive dredging operations. On 29 March 2021, the vessel was successfully refloated and traffic resumed."
world_events.24.a: "Where’s my package?"

world_events.25.t: "Pegasus"
world_events.25.d: "Pegasus is covert surveillance software developed by the Israeli company NSO Group. It can secretly infiltrate smartphones and gain access to messages, microphones, cameras, and other device data. In 2021, an international journalistic investigation known as the Pegasus Project reported that the software may have been used to monitor journalists, politicians, and human rights activists in various countries. The investigation caused widespread international concern and diplomatic disputes. Several governments launched inquiries and legal proceedings. The developer stated that it sold the software exclusively to government agencies for fighting terrorism and crime. The scandal intensified debate over the regulation of cyber-surveillance and the protection of digital rights."
world_events.25.a: "Time to clear my browsing history"

world_events.26.t: "Death of Elizabeth II"
world_events.26.d: "Elizabeth II, Queen of the United Kingdom, died at Balmoral Castle in Scotland on 8 September 2022 at the age of 96. She had reigned since 1952 and was the longest-serving monarch in British history. Upon her death, the throne automatically passed to her son, who was proclaimed King Charles III. The country entered a ten-day period of national mourning. Her lying-in-state took place at the Palace of Westminster, where hundreds of thousands of people came to pay their respects. The state funeral was held in London on 19 September 2022 and was attended by representatives of dozens of countries. The death of Elizabeth II marked the end of an era after her seventy-year reign."
world_events.26.a: "An era has ended"

world_events.27.t: "2022 FIFA World Cup in Qatar"
world_events.27.d: "The 2022 FIFA World Cup was held in Qatar from 20 November to 18 December 2022. It was the first World Cup hosted in the Middle East and the first to take place during the winter. Thirty-two national teams participated in the tournament. Matches were played at eight stadiums across five cities. The final took place at Lusail Stadium. Argentina won the title by defeating France on penalties after a 3–3 draw. The tournament was accompanied by heightened security measures and intense international attention. It became one of the most-watched sporting events in the world."
world_events.27.a: "Football!"

world_events.28.t: "Israel–Hamas War"
world_events.28.d: "The armed conflict between Israel and Hamas escalated dramatically on 7 October 2023 after Hamas militants launched a large-scale attack on southern Israel. Hundreds of people were killed or taken hostage during the assault. Israel declared a state of war and launched a major military operation in the Gaza Strip. Intensive airstrikes and ground operations followed. The fighting caused heavy casualties and extensive damage to infrastructure. The conflict created a humanitarian crisis in Gaza and prompted international diplomatic efforts to achieve a ceasefire. It also contributed to rising tensions across the Middle East."
world_events.28.a: "Horrific"

world_events.29.t: "Earthquakes in Turkey and Syria"
world_events.29.d: "On 6 February 2023, powerful earthquakes of magnitude 7.8 and 7.5 struck southeastern Turkey and northern Syria. The epicenter was located in Kahramanmaraş Province. The disaster caused widespread destruction across dozens of cities, including Gaziantep, Antakya, and Aleppo. More than 50,000 people were killed, and hundreds of thousands were left homeless. Residential buildings, hospitals, roads, and infrastructure were destroyed. The earthquakes were among the most devastating in modern Turkish history. The disaster further worsened the humanitarian situation in Syria, which had already been severely affected by years of armed conflict."
world_events.29.a: "Our condolences"

world_events.30.t: "AI Boom"
world_events.30.d: "From 2022–2023 onward, generative artificial intelligence models became widely adopted in business, education, and the creative industries. Technologies based on large language and multimodal models began to be used for automating text processing, generating images, programming, and data analysis. Companies started integrating AI tools into their workflows, accelerating digital transformation and changing the structure of employment. Educational institutions faced the need to reconsider their approaches to teaching and assessment. Labor markets began adapting to the emergence of new professions and the transformation of existing ones. Growing competition among technology companies accelerated investment in AI infrastructure. This text was created using artificial intelligence technologies."
world_events.30.a: "A new era"

world_events.31.t: "United States: 2016 Presidential Election Results"
world_events.31.d: "The United States presidential election was held on 8 November 2016. Donald Trump represented the Republican Party, while Hillary Clinton represented the Democratic Party. Trump received 304 electoral votes, compared with Clinton’s 227. Clinton won more votes nationwide, but the presidency is decided by the Electoral College. Turnout was approximately 55% of registered voters. The election featured an intense campaign and attracted widespread public attention. Donald Trump officially took office as the 45th president of the United States in January 2017."
world_events.31.a: "Understood"

world_events.32.t: "United States: 2020 Presidential Election Results"
world_events.32.d: "The United States presidential election was held on 3 November 2020. Joe Biden represented the Democratic Party, while incumbent President Donald Trump represented the Republican Party. Biden received 306 electoral votes, compared with Trump’s 232. Biden won more than 81 million votes nationwide, a record at the time. Turnout was among the highest in several decades. The election took place during the COVID-19 pandemic, leading to extensive use of early and mail-in voting. On 6 January 2021, Congress certified the Electoral College results. Joe Biden took office as the 46th president of the United States on 20 January 2021."
world_events.32.a: "Understood"
world_events.32.b: "Old men have no place in politics"

world_events.33.t: "United States: 2024 Presidential Election Results"
world_events.33.d: "The United States presidential election was held on 5 November 2024. Republican nominee Donald Trump defeated Democratic nominee Kamala Harris, winning 312 electoral votes, well above the 270 required for victory. Trump also won the national popular vote, becoming the first Republican since 2004 to do so after his defeat in 2020. Kamala Harris received 226 electoral votes and conceded the election. Congress officially certified the results in January 2025, and Trump took office as the 47th president of the United States on 20 January 2025. His victory was historic: he became only the second US president to win two nonconsecutive terms."
world_events.33.a: "Understood"
world_events.33.b: "Bye, Biden!"
