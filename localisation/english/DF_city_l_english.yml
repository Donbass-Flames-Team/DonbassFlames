l_english:

city.201.t: "People's Militia takes [307.GetName]"
city.201.d: "When the People's Militia entered [307.GetName], the heights and crossings over the Siverskyi Donets became the deciding factors. Ukrainian units were still holding separate districts and old industrial sites, but moving supplies through damaged routes was becoming harder by the hour. By evening, the fighting had shifted toward the outskirts, while the first patrols of the new forces were already appearing in the center."
city.201.ukr: "The Lysychansk heights may still change hands."
city.201.rus: "The western bank is almost open."
city.201.world: "The fighting moves away from the Siverskyi Donets."

city.202.t: "Russian tanks enter [307.GetName]"
city.202.d: "Russian tanks took [307.GetName] after strikes on crossings, depots and withdrawal routes. The old industrial district, the soda plant and the slopes above the river remained among the last points of resistance for several days. After losing them, Ukrainian units had to pull back west before they could be encircled."
city.202.ukr: "Withdrawing does not mean forgetting."
city.202.rus: "The heights above the river are taken."
city.202.world: "Luhansk loses its last major line."

city.203.t: "Ukrainian troops return to the heights of [307.GetName]"
city.203.d: "The UAF retook [307.GetName] not in a single push, but through a series of battles for the outskirts, the slopes and the industrial districts. Russian troops left behind several prepared positions, but could no longer hold the heights. Ukrainian observation posts are once again appearing on the western bank of the Siverskyi Donets."
city.203.ukr: "We are back on the heights."
city.203.rus: "The river bank could not be held."
city.203.world: "Ukraine once again looks down on the Siverskyi Donets."

city.204.t: "Rebels enter [304.GetName]"
city.204.d: "Rebels entered [304.GetName] through the districts around the chemical plants. The Azot plant area became one of the slowest parts of the advance: concrete buildings, basements, pipes and railway spurs made it difficult to clear the territory quickly. Ukrainian units withdrew in groups, covering those who still remained inside the industrial zone."
city.204.ukr: "Azot will be remembered for a long time."
city.204.rus: "The industrial zone is taken."
city.204.world: "Sievierodonetsk loses its former role."

city.205.t: "Russian units take [304.GetName]"
city.205.d: "Russian troops took [304.GetName] after battles for bridges, city blocks and factory grounds. Since 2014, this city had effectively replaced Luhansk as the Ukrainian administrative center of the region, so the news struck beyond the military reports. On the left bank remain destroyed crossings, empty offices and the industrial zone through which the retreat had only recently passed."
city.205.ukr: "Sievierodonetsk is not crossed out."
city.205.rus: "One of Luhansk's main cities is taken."
city.205.world: "After 2014, this sounds especially loud."

city.206.t: "[304.GetName] returns to Ukrainian control"
city.206.d: "Ukrainian units returned to [304.GetName] through the districts where the heaviest battles had taken place earlier. First they checked basements and factory buildings, then administrative offices and bridge approaches. For Ukraine, this is the return of a place that for years served as the political center of the government-held part of Luhansk."
city.206.ukr: "The flag is back over the administration."
city.206.rus: "The Luhansk direction has weakened."
city.206.world: "Ukraine regains its old center of control."

city.207.t: "Militants secure [370.GetName]"
city.207.d: "Local armed formations secured [370.GetName]. Here everything revolves around metallurgy, access roads and workers' settlements, so the fighting quickly moved toward warehouses, junctions and factory outskirts. Several Ukrainian groups pulled out in advance, while the rest abandoned their positions only after the railway approaches were lost."
city.207.ukr: "The factories may still work against them."
city.207.rus: "The Alchevsk belt is held."
city.207.world: "The metallurgical Donbas is back in the reports."

city.208.t: "Russian troops enter [370.GetName]"
city.208.d: "Russian units entered [370.GetName]. For them, the value of this place lies not in its name, but in its factory grounds, depots and the link between Luhansk, Perevalsk and the Donetsk direction. Engineering groups immediately began inspecting the metallurgical plant and the access routes."
city.208.ukr: "Alchevsk does not disappear from the war map."
city.208.rus: "The rear has become denser."
city.208.world: "Factory cities once again matter more than capitals."

city.209.t: "The Ukrainian army retakes [370.GetName]"
city.209.d: "The UAF entered [370.GetName] after a short but tense Russian defense on the factory outskirts. Several depots were abandoned almost intact, while part of the equipment moved toward nearby settlements. The return of this area strikes at the link between the industrial cities of Luhansk."
city.209.ukr: "The Alchevsk junction is ours again."
city.209.rus: "The factory rear has been torn open."
city.209.world: "Ukraine moves deeper into the old industrial belt."

city.210.t: "Militiamen capture [347.GetName]"
city.210.d: "Militiamen entered [347.GetName] after long battles for the private sector and the western districts. Several streets changed hands two or three times, while artillery shattered the area around the old roads to the salt mines and Chasiv Yar. By the time assault groups entered, the center barely resembled the pre-war city."
city.210.ukr: "Bakhmut held too long to become just a point."
city.210.rus: "They took ruins, not a parade."
city.210.world: "Bakhmut became a chapter of its own in the war."

city.211.t: "Russian troops take [347.GetName]"
city.211.d: "Russian troops took [347.GetName] after months of assaults, artillery and block-by-block fighting. Before the war it was remembered for its sparkling wine plant and the nearby salt mines; now it is remembered for ruined streets and enormous losses. Chasiv Yar and new Ukrainian lines still lie ahead, so the victory does not turn into an easy advance."
city.211.ukr: "This story is not over."
city.211.rus: "The road ahead will not be easier."
city.211.world: "Months of assaults ended in an empty city."

city.212.t: "[347.GetName] is returned to Ukraine"
city.212.d: "Ukrainian troops retook [347.GetName]. The first groups entered through areas where Russian fortifications had stood only recently, and almost immediately began searching for surviving basements, depots and passages between ruined blocks. For Russia, this is the loss of a trophy that had cost far too much."
city.212.ukr: "Bakhmut is under our flag again."
city.212.rus: "The main trophy is gone."
city.212.world: "The ruins of Bakhmut have changed sides again."

city.213.t: "Republican forces seize [359.GetName]"
city.213.d: "Republican forces took [359.GetName]. Here, the junctions toward Bakhmut, Druzhkivka and Kramatorsk mattered more than any loud statements. After losing several exits, Ukrainian units had to move vehicles by detours and shift part of the rear farther away from the railway."
city.213.ukr: "Kostiantynivka covered more than it seemed."
city.213.rus: "Kramatorsk is closer now."
city.213.world: "A quiet city suddenly became important."

city.214.t: "Russian army digs into [359.GetName]"
city.214.d: "Russian troops secured [359.GetName] and immediately began deploying equipment near the exits toward neighboring directions. For the Ukrainian side, the main problem was not the city blocks themselves, but the loss of a convenient crossing point for routes. Reserves now have to travel farther, which means more time under strikes."
city.214.ukr: "The new line will be farther west."
city.214.rus: "The route to Kramatorsk is open."
city.214.world: "In northern Donbas, the roads are contested again."

city.215.t: "The Ukrainian flag flies over [359.GetName] again"
city.215.d: "The UAF retook [359.GetName] and quickly occupied the railway station, exits and several blocks near the main roads. Russian troops had to move depots and repair groups closer to the rear. For Ukraine, this is the return of a place through which neighboring sections of the front can be linked again."
city.215.ukr: "The station works for us again."
city.215.rus: "The advance toward Kramatorsk has failed."
city.215.world: "Kostiantynivka blocks the passage again."

city.216.t: "People's Militia captures [398.GetName]"
city.216.d: "The People's Militia took [398.GetName]. Mining settlements, metallurgical sites and roads toward Horlivka made the defense dense but uneven: in some districts Ukrainian units left quickly, while in others small groups held out longer. The new forces immediately began checking access roads and depots near the industrial zones."
city.216.ukr: "Yenakiieve will appear in Ukrainian reports again."
city.216.rus: "The old mining district is held."
city.216.world: "The workers' districts of Donbas are military ground again."

city.217.t: "Russian forces take [398.GetName]"
city.217.d: "Russian units secured [398.GetName]. Its position between Donetsk and Horlivka provides a useful sector for moving men, fuel and equipment. The city immediately reinforced security around factory outskirts and roads to nearby settlements, because those are the places where Ukrainian groups most often probe the defense."
city.217.ukr: "The industrial zone is not forever."
city.217.rus: "The link with Horlivka is stronger."
city.217.world: "Yenakiieve strengthens the Donetsk agglomeration."

city.218.t: "Ukrainian units reclaim [398.GetName]"
city.218.d: "Ukrainian troops retook [398.GetName]. The mining districts, factory approaches and roads used by Russian units between Donetsk and Horlivka are back under their control. In several places, abandoned ammunition and unfinished fortifications were found."
city.218.ukr: "The mining districts are ours again."
city.218.rus: "The Horlivka support point is lost."
city.218.world: "Ukraine retakes part of the industrial ring."

city.219.t: "Militiamen take [318.GetName]"
city.219.d: "Militiamen entered [318.GetName], immediately bringing back memories of 2014. Back then, this was where checkpoints, seized buildings and the first major reports from Donbas appeared. Now a similar picture repeats itself: quick statements, checks at the entrances, anxiety toward Kramatorsk and the question of where the next line will stop."
city.219.ukr: "We have already retaken Sloviansk."
city.219.rus: "The symbol of 2014 is taken again."
city.219.world: "Sloviansk once again sounds like a beginning."

city.220.t: "Russian troops occupy [318.GetName]"
city.220.d: "Russian troops took [318.GetName]. For them, it is not only a route toward Kramatorsk and northern Donetsk, but also a powerful image: the place where the larger Donbas story began in 2014. Ukrainian units are pulling back toward nearby lines, trying not to lose the link between Kramatorsk and Druzhkivka."
city.220.ukr: "Sloviansk has lived through this before."
city.220.rus: "The return to the beginning has happened."
city.220.world: "The city of 2014 is back in the news."

city.221.t: "[318.GetName] is back under Ukrainian control"
city.221.d: "Ukrainian troops liberated [318.GetName]. The city had already returned to Ukrainian control in 2014, and the new operation immediately gained political weight. The first units entered through the approaches where checkpoints had stood only recently, then began clearing administrative buildings and the roads toward Kramatorsk."
city.221.ukr: "Sloviansk has proved itself again."
city.221.rus: "The symbolic blow is too visible."
city.221.world: "Ukraine repeats the story of 2014."

city.222.t: "Republican forces take [327.GetName]"
city.222.d: "Republican forces entered [327.GetName]. Since 2014, this was where the Ukrainian administration of northern Donetsk held its ground: headquarters, services, the railway station, enterprises and depots. During the withdrawal, some documents and equipment were evacuated, but the loss of such a center immediately hit the management of nearby districts."
city.222.ukr: "Kramatorsk was the heart of this sector."
city.222.rus: "The administrative center is taken."
city.222.world: "Northern Donetsk loses its headquarters."

city.223.t: "Russian Armed Forces capture [327.GetName]"
city.223.d: "Russian troops took [327.GetName]. Its machine-building plants, railway junction and administrative buildings made it one of the main targets in northern Donetsk. Now Russian units must not only hold the blocks, but also cover the long approaches along which fuel, repair teams and new formations will have to move."
city.223.ukr: "Kramatorsk is not the final point."
city.223.rus: "The largest target in the north is taken."
city.223.world: "Kramatorsk sharply changes the weight of the campaign."

city.224.t: "Ukraine takes back [327.GetName]"
city.224.d: "The UAF retook [327.GetName]. With it, Ukraine regains the railway station, the administrative center and a place from which northern Donetsk can be held. Russian troops are withdrawing from a city that could have served as a base for pressure on Sloviansk, Druzhkivka and Kostiantynivka."
city.224.ukr: "Northern Donbas holds again."
city.224.rus: "Holding the region has become harder."
city.224.world: "Kramatorsk returns under the Ukrainian flag."

city.225.t: "Separatists take [381.GetName]"
city.225.d: "Local formations took [381.GetName]. Mines, factory districts and the Stirol chemical plant make it difficult to storm quickly: there are too many industrial fences, yards and access routes. After the new forces entered, the northern edge of the Donetsk agglomeration became calmer for the republics, although clearing individual districts continued for several more days."
city.225.ukr: "Horlivka is too close to Donetsk."
city.225.rus: "The northern shield is held."
city.225.world: "The Horlivka industrial zone is back in play."

city.226.t: "Russian troops take [381.GetName]"
city.226.d: "Russian troops took [381.GetName]. Headquarters value it for its mining settlements, roads to Donetsk and the ability to hold the northern edge of the agglomeration. Dense urban terrain helps defense, but it requires a large garrison: without constant patrols, entire blocks quickly become open passages for sabotage groups."
city.226.ukr: "The agglomeration is not sealed yet."
city.226.rus: "The Donetsk flank is stronger."
city.226.world: "Horlivka strengthens the defense of Donetsk."

city.227.t: "The Ukrainian army enters [381.GetName]"
city.227.d: "Ukrainian troops retook [381.GetName]. With it, the mining settlements, industrial zones and roads that previously covered northern Donetsk come under UAF control. Russian troops are forced to reinforce neighboring sectors and pull part of the rear deeper into the agglomeration."
city.227.ukr: "Donetsk is closer now."
city.227.rus: "The northern flank is open."
city.227.world: "Ukraine breaks through the industrial ring."

city.228.t: "Republican forces enter [526.GetName]"
city.228.d: "Republican forces entered [526.GetName] after fighting near the coast and the factory districts. The port, metallurgical plants and wide avenues quickly turned into separate defensive sectors. The new forces gained access to the Azov Sea, but with it came ruined infrastructure that still has to be restored."
city.228.ukr: "Azov is not lost yet."
city.228.rus: "The port is under control."
city.228.world: "Mariupol once again became a southern symbol."

city.229.t: "Russian troops capture [526.GetName]"
city.229.d: "Russian troops established control over [526.GetName] after a long siege. The fighting took place around the port, residential districts, the Illich plant and positions near Azovstal. When the defenders' resources ran out, further defense became impossible. Russia gained access to the Azov Sea; Ukraine suffered one of the most painful losses of the entire campaign."
city.229.ukr: "Mariupol remembers the siege."
city.229.rus: "The Azov port is finally taken."
city.229.world: "The fall of Mariupol was heard far beyond the front."

city.230.t: "[526.GetName] returns to Ukraine"
city.230.d: "Ukrainian troops retook [526.GetName]. The first reports came from the port area and the factory districts, then from the coast. Russia loses a place that connected its southern grouping with the Azov Sea, while Ukraine regains a political and military symbol in the south."
city.230.ukr: "Azov is closer again."
city.230.rus: "The southern support point has collapsed."
city.230.world: "Mariupol changes the whole southern map again."
