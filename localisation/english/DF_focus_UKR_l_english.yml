 UKR_yanukovychs_results: "Regime Under Threat"
 UKR_yanukovychs_results_desc: "The political crisis is reaching its peak. Maidan protests are evolving into a massive popular uprising. Students, the opposition, and ordinary citizens are standing against the regime. The government is bursting at the seams—the loyalty of the elites is in question, and international pressure is mounting. If decisive action is not taken, Yanukovych's days in power are numbered."
