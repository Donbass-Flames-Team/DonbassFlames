UKR_oleg_lyashko_victory: "Lyashko"
UKR_oleg_lyashko_victory_desc: "Lyashko wins the 2014 election and becomes the new President of Ukraine. No one expected his victory, but as if by magic, he achieved it."
UKR_patriotic_war: "Patriotic War"
UKR_patriotic_war_desc: "The war with the separatists in the Donbas felt like a war against some weak 'rebellion'. However, now it is clearly visible that the war in the Donbas is Russia's attempt to destabilize our country, and we must take our territory back. Every resident of our country must be drawn into this war. We must not just hand over our territory."
UKR_national_economy: "People's Economy"
UKR_national_economy_desc: "The country's economy should work not for oligarchs and transnational corporations, but for the common people. Years of plundering national wealth and indulging big capital have brought our state to the brink of an abyss. We will bring order to the financial sector, return key resources under public control, and direct state capacities to the benefit of every citizen. A people's economy is a solid foundation upon which we will build a strong and self-sufficient Ukraine!"
UKR_full_economic_independent_from_russia: "Full Independence from Russia"
UKR_full_economic_independent_from_russia_desc: "The RF is our main enemy at the moment. We will not allow our economy to depend on an enemy state, and even better — stopping the funding of the enemy's economy is the best thing we can do right now."
UKR_encouraging_small_businesses: "Support for Small Businesses"
UKR_encouraging_small_businesses_desc: "Our state is obliged to get rid of the oligarchic state system. To fight the dominance of giant enterprises, we will organize support for small businesses with subsequent financing of small business."
UKR_erasure_of_moscals: "Hang the Muscovites!"
UKR_erasure_of_moscals_desc: "He who doesn't jump is a Muscovite! We will carry out operations to actively purge our officials who suspiciously often 'visit' the Russian Federation. We will carry out a major campaign to purge Russian elements in our country to stabilize the situation and cleanse our structures of Russian agency."
UKR_stabilization_of_donbass: "Stabilization of the Donbas"
UKR_stabilization_of_donbass_desc: "We will stabilize the Donetsk and Luhansk regions to complicate future potential operations of separatists on our territories. We will also expand police and SBU units for complete control over the Donbas to prevent a strike to the rear of our troops. Likewise, our government is obliged to organize expanded humanitarian assistance and aid to residents who lost their property in the first war with separatism."
UKR_operations_of_sbu: "SBU Operations"
UKR_operations_of_sbu_desc: "We will fund the work of the SBU on the grounds of the LDPR; our intelligence services will be able to pinpoint the residences of key figures in the separatists' plans, which will help us disable key strongpoints and temporarily destabilize the Donetsk command."
UKR_form_people_militia: "Full Mobilization"
UKR_form_people_militia_desc: "To fight the separatists, we must gather everything we have. There is no time to delay, we are obliged to be ready here and now; such a huge country as Ukraine is capable of defeating a handful of separatists. It is either now or never."
UKR_wipe_ot_minsk_agreements: "Wipe Our Asses with the Minsk Agreements"
UKR_wipe_ot_minsk_agreements_desc: "We carried out rapid preparations and weakened the separatist states; we are obliged to defeat these 'pseudo-entities'. Talking is useless; it seems obvious that the Russians are not ready to surrender the Donbas just like that. We will reclaim our territories and our citizens to preserve our territorial integrity. Down with the Russki!"
UKR_if_there_no_village_there_will_be_no_ukraine: "Without a Village, There Will Be No Ukraine!"
UKR_if_there_no_village_there_will_be_no_ukraine_desc: "Agriculture is one of Ukraine's main advantages and a vital part of our economy. We must utilize our fertile lands and support Ukrainian farmers, rather than trying to compete with other European countries in sectors where Ukraine is at a disadvantage. The development of agriculture and support for the countryside will help strengthen our economy and make Ukraine stronger and more independent."
UKR_search_for_new_partners: "Search for Partners"
UKR_search_for_new_partners_desc: "Our EU partners will only be glad about our desire for a tied Ukrainian economy. Thanks to this step, we have not only secured better conditions, but also stopped funding the enemy, which is very important given our situation."
UKR_social_independent_economy: "Independent Social Economy"
UKR_social_independent_economy_desc: "We have made an incredible leap thanks to our reforms; we built a solid economy with elements of support for the population, an economy independent of enemies, and with the potential for our state to bloom like flowers. Strong Ukraine — Strong Economy."
