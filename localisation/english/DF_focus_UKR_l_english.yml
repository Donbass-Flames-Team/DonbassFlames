 UKR_prevent_civil_war: "Preventing Civil War"
 UKR_prevent_civil_war_desc: "The situation in the country has heated up to the limit and threatens to escalate into a full scale armed confrontation. To avoid widespread bloodshed and total disaster, the government must take emergency steps and establish a peaceful dialogue with all parties."
 UKR_restoring_the_image_in_the_west: "Restoring Image in the West"
 UKR_restoring_the_image_in_the_west_desc: "Western partners and international organizations are extremely concerned about what is happening on the streets of Kyiv. We need to restore close contact with European diplomats and clearly demonstrate that the official leadership keeps the situation under control."
 UKR_a_step_towards_the_protesters: "A Step Towards Protesters"
 UKR_a_step_towards_the_protesters_desc: "The street continues to demand fundamental changes and ignoring these demands any longer is simply dangerous. The authorities are forced to make direct concessions to citizens in order to reduce the critical level of tension in society."
 UKR_declaration_of_a_political_thaw: "Declaration of Political Thaw"
 UKR_declaration_of_a_political_thaw_desc: "To significantly reduce the risk of further escalation of violence, the government officially declares a course toward political easing. This includes readiness to compromise with systemic opposition and search for new ways of interaction."
 UKR_return_to_the_2004_constitution: "Return to 2004 Constitution"
 UKR_return_to_the_2004_constitution_desc: "Returning to the parliamentary presidential system becomes a key compromise in negotiations. The redistribution of powers between branches of government will help relieve acute political crisis and satisfy opponents."
 UKR_returning_to_the_eurointegration: "Return to European Integration"
 UKR_returning_to_the_eurointegration_desc: "A sudden pause in preparing to sign the agreement with the EU put the government in a bad light and caused a storm. Official resumption of negotiations with Brussels will help partially regain trust from the population."
 UKR_relax_repressive_laws: "Relaxing Repressive Laws"
 UKR_relax_repressive_laws_desc: "Regulations adopted in mid January caused a massive wave of indignation among citizens. Quick repeal of the most strict articles will show real readiness of authorities for dialogue and smooth out the edges."
 UKR_reform_of_berkut: "Reform of Berkut"
 UKR_reform_of_berkut_desc: "The special unit faces severe criticism for its actions during dispersals. Conducting deep reform and introducing strict working regulations will allow preserving trained special forces but completely changing their approach."
 UKR_liqudation_of_berkut: "Liquidation of Berkut"
 UKR_liqudation_of_berkut_desc: "Complete disbandment of the unit will be the main symbolic step by the state. This is precisely the decision that protesters still fundamentally demand for final reconciliation."
 UKR_severance_of_economic_ties_with_russia: "Severing Economic Ties with Russia"
 UKR_severance_of_economic_ties_with_russia_desc: "A decisive turn toward Europe inevitably requires revising old economic agreements with the East. This will lead to noticeable financial risks for our industry but fixes a new vector."
 UKR_sign_an_association_agreement_with_the_eu: "Signing EU Association Agreement"
 UKR_sign_an_association_agreement_with_the_eu_desc: "Logical end to a prolonged political confrontation inside the country. Signing the historic document with European Union finally solidifies international status of the state for years to come."
