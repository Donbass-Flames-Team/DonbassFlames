l_english:
 # ===== russia.36 - Yarovaya Package =====
 russia.36.t: "Yarovaya Package Signed"
 russia.36.d: "The State Duma has passed the so-called Yarovaya Package. Telecom operators are now required to store citizens' messages and calls for up to six months, and security services gain access to encrypted communications. Critics call it mass surveillance. The authorities call it security. It's up to us to decide how to use this tool."
 russia.36.a: "Full control. The state must know everything."
 russia.36.b: "Let the law work, but within reasonable limits."

 # ===== russia.37 - Rosgvardiya =====
 russia.37.t: "The National Guard is Created"
 russia.37.d: "By presidential decree, the Federal Service of the National Guard has been established. The new security force has been removed from the Interior Ministry and placed directly under the commander-in-chief. Two hundred thousand soldiers who will stand wherever the Kremlin orders."
 russia.37.a: "The National Guard under direct presidential control."
 russia.37.b: "Let it stay within the Interior Ministry structure. Less bureaucracy."

 # ===== russia.38 - Pension Reform =====
 russia.38.t: "Pension Reform"
 russia.38.d: "The government has raised the retirement age. Men will retire at 65, women at 63. Ministers talk about economic necessity; people are already gathering on the streets in protest. This decision will cost political points, but it may open serious financial opportunities."
 russia.38.a: "Carry out the reform in full."
 russia.38.b: "Soften the conditions to reduce the social backlash."

 # ===== russia.39 - Pension backlash =====
 russia.39.t: "Society Responds to Pension Reform"
 russia.39.d: "Months have passed since the reform was adopted, but public anger has not faded. Protests have swept the country, ratings have dropped. People do not forgive when something they counted on their whole lives is taken away."
 russia.39.a: "We have to take this hit."

 # ===== russia.40 - Digital Economy =====
 russia.40.t: "Digital Economy Programme"
 russia.40.d: "The government is launching a large-scale digitization programme. IT infrastructure, e-government services, artificial intelligence. The funding is enormous. The question is how quickly it will work and whether it will drown in bureaucratic hands."
 russia.40.a: "Go all in. The digital future starts now."
 russia.40.b: "Act carefully. Pilot regions first."

 # ===== russia.41 - Crimean Tatar Resistance =====
 russia.41.t: "Crimean Tatar Resistance"
 russia.41.d: "The Crimean Tatars openly refuse to recognize Russian authority on the peninsula. Mejlis activists are blocking cooperation, and cases of disobedience are being recorded in villages. This is a small but stubborn force that is interfering with the full integration of Crimea."
 russia.41.a: "Firm measures. The Mejlis is banned, activists are under investigation."
 russia.41.b: "Let's try to negotiate. Concessions and integration programmes."

 # ===== russia.42 - Crackdown outcome =====
 russia.42.t: "Resistance Suppressed"
 russia.42.d: "After firm measures, Crimean Tatar resistance has effectively ceased. Leaders have been detained or left the peninsula. Crimea has become calmer, though some resentment remains in society."
 russia.42.a: "Order has been restored."

 # ===== russia.43 - Integration outcome =====
 russia.43.t: "Tatars Integrated"
 russia.43.d: "Long-term work with the Crimean Tatar community has paid off. Cultural rights have been recognized, investments in Tatar villages have begun, and tension has eased. It was a long road, but Crimea is genuinely calmer now."
 russia.43.a: "Good work. Integration over confrontation."

 # ===== russia.44 - Sovereign Internet =====
 russia.44.t: "Sovereign Internet Act"
 russia.44.d: "A law on creating a sovereign Russian internet has been passed. The Runet gains its own traffic management system and can be isolated from the global network. The tech community is skeptical, the security forces are satisfied. This is a big bet on digital sovereignty."
 russia.44.a: "Full isolation when necessary. Sovereignty above all."
 russia.44.b: "Soft version. The infrastructure exists, but we won't flip the switch."

 # ===== russia.45 - Cabinet Renewal =====
 russia.45.t: "Cabinet of Ministers Renewed"
 russia.45.d: "The president has signed a decree forming a new government. Medvedev is out, Mishustin is in. New faces, new promises. Ministries have been reshuffled, tasks updated. This is a good moment to reset the domestic agenda."
 russia.45.a: "Forward, with a new team."

 # ===== russia.46 - Constitutional Amendments =====
 russia.46.t: "Constitutional Amendments"
 russia.46.d: "In a nationwide vote, citizens approved amendments to the Constitution. Among them: resetting presidential term limits, enshrining traditional values, and asserting sovereignty over international norms. The authorities have received a mandate for years to come."
 russia.46.a: "The Constitution is adopted. Full steam ahead."
 russia.46.b: "Let's hold off for now. The timing isn't ideal."

 # ===== russia.47 - Crimea Integration =====
 russia.47.t: "Investments in Crimea"
 russia.47.d: "Crimea receives a large investment package. Roads, energy, housing, tourism. Federal money is flowing to the peninsula. Moscow is showing that Crimea is not just a political project, but a real part of Russia."
 russia.47.a: "We're investing. Crimea must prosper."

 # ===== russia.48 - National Projects =====
 russia.48.t: "National Projects"
 russia.48.d: "The president has announced the launch of national projects. Twelve directions: healthcare, education, housing, roads, ecology. Total funding in the trillions of rubles. The country must see results by 2024."
 russia.48.a: "Launch across all fronts."

 # ===== russia.49 - Etatism =====
 russia.49.t: "The State as the Main Owner"
 russia.49.d: "We face the question of the relationship between power and business. Oligarchs and corporations must understand who is in charge in this country. The state can take control of key industries and bring to heel those who think money matters more than the Kremlin."
 russia.49.a: "Full nationalization of the elites. The state always rules."
 russia.49.b: "We negotiate with the elites. Cooperation is more profitable than pressure."

 # ===== news_events.59-70 =====
 news_events.59.t: "Russia: Yarovaya Package Signed by President"
 news_events.59.d: "The Russian president has signed the so-called Yarovaya Package, a bundle of laws strengthening control over the internet and communications. Critics call it an attack on privacy; the government insists it is necessary to combat terrorism."
 news_events.59.a: "Security comes first. The right decision."
 news_events.59.b: "Another step toward authoritarianism."
 news_events.59.c: "Russia's internal affairs."

 news_events.60.t: "Russia Creates the National Guard"
 news_events.60.d: "Russia has established the Federal Service of the National Guard by presidential decree. The new structure reports directly to the commander-in-chief and numbers hundreds of thousands of troops. Analysts see this as strengthening the president's personal control over the security apparatus."
 news_events.60.a: "We could use similar structures ourselves."
 news_events.60.b: "Another tool for suppressing dissent."

 news_events.61.t: "Russia Raises Pension Age"
 news_events.61.d: "The Russian government has announced an increase in the retirement age. Protests have swept the country and the president's ratings have fallen. The reform provoked a sharp reaction from a society unaccustomed to seeing pension promises change mid-course."
 news_events.61.a: "Economically understandable, though painful."
 news_events.61.b: "People took to the streets. That says something."

 news_events.62.t: "Russia Launches Digital Economy Programme"
 news_events.62.d: "Moscow has announced a large-scale Digital Economy programme. The state is investing trillions in IT, artificial intelligence and e-government. An ambitious plan, though skeptics doubt the bureaucracy's ability to implement it without losses."
 news_events.62.a: "Interesting. We'll see how it goes."
 news_events.62.b: "We have our own digital priorities."

 news_events.63.t: "Crimean Tatars Refuse to Recognize Russian Authority"
 news_events.63.d: "The Crimean Tatar Mejlis has been declared an extremist organization and banned in Russia. Thousands of Tatars are refusing to obtain Russian passports. Tension between the Russian-speaking majority and the indigenous people on the peninsula is growing."
 news_events.63.a: "Crimea is ours and we will maintain order there."
 news_events.63.b: "This is a violation of indigenous peoples' rights."
 news_events.63.c: "A distant problem."

 news_events.64.t: "Russia and Crimean Tatars Reach Agreement"
 news_events.64.d: "After lengthy negotiations, the Russian authorities announced an integration programme for the Crimean Tatars. Cultural rights have been recognized and schools with Crimean Tatar instruction have opened. Tension on the peninsula is beginning to ease."
 news_events.64.a: "A smart move. Fewer problems at home."
 news_events.64.b: "Diplomacy over repression. We'll see how sincere it is."

 news_events.65.t: "Russia Adopts Sovereign Internet Law"
 news_events.65.d: "The State Duma has passed a law on the so-called sovereign internet. The Runet gains the technical ability to disconnect from the global network. Western governments condemned the law, calling it an instrument of censorship."
 news_events.65.a: "Each country decides how to manage its own internet."
 news_events.65.b: "This is a direct threat to freedom of speech."
 news_events.65.c: "None of our business."

 news_events.66.t: "Russia Changes Its Prime Minister"
 news_events.66.d: "Dmitry Medvedev has stepped down as Russia's Prime Minister. Mikhail Mishustin has been appointed as the new head of government. Experts link the cabinet change to upcoming constitutional amendments and a redistribution of power within the country."
 news_events.66.a: "An internal reshuffle. We'll watch how things develop."
 news_events.66.b: "A significant shift in Russian politics."

 news_events.67.t: "Russia Has Changed Its Constitution"
 news_events.67.d: "Following a nationwide vote, amendments have been made to the Russian Constitution. The key change: presidential term limits are reset, allowing the current leader to remain in power until 2036. The West sees this as the entrenchment of authoritarianism."
 news_events.67.a: "The situation in Russia directly affects us."
 news_events.67.b: "Locking in power for decades. A troubling signal."
 news_events.67.c: "Russia's internal affairs."

 news_events.68.t: "Crimea Is Being Actively Integrated into Russia"
 news_events.68.d: "Russian authorities report progress in the integration of Crimea. New roads, gas pipelines, and the Crimean Bridge near completion. Moscow is demonstrating that investment in the peninsula is long-term."
 news_events.68.a: "They took what was theirs and are developing it. Makes sense."
 news_events.68.b: "Illegal annexation continues to be entrenched."

 news_events.69.t: "Russia Launches National Projects"
 news_events.69.d: "The Kremlin has announced twelve national projects with total funding of 25 trillion rubles through 2024. Healthcare, education, roads, housing. Ambitious goals set against the backdrop of sanctions and economic difficulties."
 news_events.69.a: "We'll wait and see the results."
 news_events.69.b: "The money is there. Whether it's spent well is another question."

 news_events.70.t: "Russia Tightens State Control Over Economy"
 news_events.70.d: "The Kremlin is steadily expanding state presence in key sectors of the economy. Big business is forced to align decisions with Moscow. Independent oligarchs are a thing of the past. The state is becoming the main owner."
 news_events.70.a: "The state should control strategic industries."
 news_events.70.b: "The free market is suffocating under state pressure."
 news_events.70.c: "We have our own economic models."

