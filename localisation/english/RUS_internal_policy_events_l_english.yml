 RUS_digital_economy_dynamic_modifier_tt: "The digitization level provides bonuses to research, construction and political power."
 RUS_bureaucracy_dynamic_modifier_tt: "Bureaucracy reform reduces consumer goods and boosts construction. Without reform the opposite applies."
 RUS_crimea_integration_dynamic_modifier_tt: "Successful Crimea integration provides stability, construction speed and reduces consumer goods strain."
 RUS_tatar_resistance_dynamic_modifier_tt: "While Tatar resistance is unresolved, stability and Crimean compliance drop."
 RUS_sovereign_internet_dynamic_modifier_tt: "Sovereign internet adds stability and political power but cuts research speed."
 RUS_rosgvardia_dynamic_modifier_tt: "The National Guard keeps internal order: reduces resistance and adds stability."
 RUS_pension_reform_dynamic_modifier_tt: "Pension reform frees up industrial capacity but hits stability and public support."
 RUS_yarovaya_dynamic_modifier_tt: "The Yarovaya Package adds some stability but restricts information exchange and slows research."
