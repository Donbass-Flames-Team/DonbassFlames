l_english:
 LPR_capture_SBU: "Seizure of the SBU Building"
 LPR_capture_sbu_desc: "The point of no return has been passed. The crowd at the gates is no longer going to just chant slogans; the time has come to act. Seizing the SBU building and the armories inside will turn a spontaneous protest into an organized resistance. We will secure not only assault rifles, but also personnel rosters, operational archives, and maps. From this moment on, we are no longer just protesters. We are a force to be reckoned with."
 LPR_create_coordination_center: "Establish the Coordination Center"
 LPR_create_coordination_center_desc: "The spontaneous protest has served its purpose, but now we need structure. Without unified command and communication, our detachments will remain nothing more than scattered groups of bandits. We desperately need a headquarters to handle logistics, distribute captured weapons, and establish coordination between the barricades. Only by uniting our efforts under a single leadership can we endure the coming clash."
 LPR_distribute_weapons: "Arm the Militia"
 LPR_distribute_weapons_desc: "Due to the looming threat from Ukraine, we are forced to postpone rigorous military training and wage an asymmetric war aimed at successful attrition and exhausting our enemy. We will arm the militia, who will defend their homeland in Luhansk, Alchevsk, and other cities of the future Luhansk People's Republic."
 LPR_set_checkpoints: "Organize Checkpoints"
 LPR_set_checkpoints_desc: "The Kyiv junta is already massing troops and unleashing its punitive battalions upon us. We will not let them catch us by surprise and enter our cities. Concrete blocks, sandbags, and anti-tank hedgehogs must rise across all key roads, crossroads, and regional entrances. Every defense line will become an insurmountable obstacle for the Ukrainian punishers. From this day forward, no enemy convoy shall pass through our land with impunity."
 LPR_peoples_druzhina: "Form the People's Druzhina"
 LPR_peoples_druzhina_desc: "While our fighters hold the front lines at checkpoints, Ukrainian intelligence services and infiltrated saboteurs are attempting to blow up our rear from within. Kyiv agents and radical junta-sympathizers hope to sow panic in our cities, but we will not allow it. The People's Druzhina takes strict control over the streets, strategic sites, and infrastructure. From now on, any spy, provocateur, or collaborator of the Kyiv regime will be immediately exposed and neutralized. There will be no mercy for the enemy in our rear."
 LPR_luhansk_castle: "Luhansk Castle"
 LPR_luhansk_castle_desc: "Our main fortified area is ready for a major war. We have turned the former SBU citadel and surrounding quarters into an impregnable bastion against which any enemy offensive will shatter. Every building here will become a firing point, every street a deadly trap for the Ukrainian punishers. Our fighters know there is nowhere to retreat and will stand to the death for every meter of our native land. Let the Kyiv generals wash themselves in blood trying to storm our positions."
 LPR_vehicle_confiscation: "Confiscation of Vehicles for Frontline Needs"
 LPR_vehicle_confiscation_desc: "To achieve victory, we need high mobility, yet army trucks are catastrophically scarce. We have no time to wait for supplies, so we will seize vehicles from anyone trying to sit out the conflict or flee to Kyiv-controlled territory. All heavy trucks, SUVs, and buses belonging to local enterprises are hereby transferred to the militia. We will weld armor onto them, mount machine guns, and throw them into battle. Right now, everything must serve the front."
 LPR_act_on_sovereignty: "Proclamation of the Act of Sovereignty"
 LPR_act_on_sovereignty_desc: "Our people's patience has come to an end. We no longer intend to obey the criminal orders of the Kyiv junta, which seized power in a violent coup and unleashed terror against its own citizens. By proclaiming the Act of Sovereignty, we sever all ties with the neo-Nazi regime in Kyiv forever. From now on, only the decisions of the people's authorities are lawful on our land. We take our destiny into our own hands, and we stand ready to defend our freedom from any encroachment with weapons in hand."
 LPR_resource_mobilization: "Resource Mobilization"
 LPR_resource_mobilization_desc: "Right now, the front needs everything immediately; we must exert strict control over all available stockpiles of weapons, equipment, and armored vehicles. Local factories and repair workshops must work around the clock, assembling makeshift armored cars and restoring damaged weaponry. We face a regular Ukrainian army that surpasses us in supply lines, so every gram of raw material extracted and every work shift must bring our victory closer. Everything for the front, everything for defense."
 LPR_republic_of_bolotov: "Republic of Bolotov"
 LPR_republic_of_bolotov_desc: "In conditions of war and chaos, collegial management leads to destruction. We need a single will and an iron fist capable of uniting the region and repelling the Kyiv forces. Valery Bolotov assumes full power and responsibility for the fate of the Republic. Any attempts to challenge the leadership's orders, sabotage, or political bickering within our movement will be deemed treason and ruthlessly suppressed. Only strict discipline, centralization, and absolute obedience to the leader will allow us to endure and build a strong state."
 LPR_Introduction_of_a_state_emergency: "Introduction of a State of Emergency"
 LPR_Introduction_of_a_state_emergency_desc: "War has arrived at our doorsteps, and peacetime laws no longer apply. We declare a state of emergency across the entire territory of the Republic. A strict curfew is introduced on the streets, strategic locations are placed under round-the-clock guard, and all rallies or strikes are banned. The Kyiv regime hopes to destabilize our rear using its saboteurs and alarmists, but we will respond with iron order. Anyone who violates the new rules will be immediately detained under the laws of wartime."
 LPR_preparing_for_may_11: "Preparation for the Referendum"
 LPR_preparing_for_may_11_desc: "In the coming days and weeks, our people must make their ultimate historical choice. Ukrainian troops and radicals are already massing at our borders, threatening to drench our cities in blood for a mere attempt to vote. We must accomplish a colossal amount of work in the shortest possible time: print ballots, organize polling stations, and, most importantly, provide them with reliable armed security. Every activist counts, every checkpoint is reinforced. We will let the people voice their will, no matter the cost."
 LPR_full_mobilization: "Declaration of Full Mobilization"
 LPR_full_mobilization_desc: "The Kyiv regime has thrown its entire military machine against us: aviation, artillery, and heavy armor. This war cannot be won with half-measures; the very existence of our Republic is at stake. We declare a full mobilization of all forces and resources. Everyone capable of holding an assault rifle must step into the ranks — miners, laborers, and yesterday's students. We are draining our last reserves for a single purpose. No one will be able to sit this out, because if the Ukrainian punishers break through the front, they will spare no one. Our only alternative to victory is total annihilation."
 LPR_negotiations_with_mozgovoy: "Negotiations with Mozgovoy"
 LPR_negotiations_with_mozgovoy_desc: "In the north of the Republic, in Severodonetsk and Lysychansk, a powerful uprising has ignited under the leadership of Aleksey Mozgovoy. His detachments are strong and fiercely loyal to their commander, but they operate independently from Luhansk. With Ukrainian troops attempting to trap us in a pincer movement, such a division of forces is fatal. We must sit down at the negotiating table and convince Mozgovoy to join a unified command structure. The Severodonetsk Republic must become an integral part of the LPR. Only by uniting our resources and fronts can we stem the onslaught of our common enemy."
 LPR_peoples_court_of_novorossiya: "Establishment of the People's Court of Novorossiya"
 LPR_peoples_court_of_novorossiya_desc: "In conditions of total war, the old judicial system is dead, and liberal red tape leads only to chaos and impunity. The enemy is at the gates, Ukrainian spotters are operating in the rear, and marauders and rapists are undermining the people's faith in our cause. The time for people's justice has come. We are introducing field courts-martial, where verdicts will be delivered swiftly and openly before the citizens. Treason, espionage for Kyiv, and grave crimes against civilians will henceforth carry only one penalty — death by firing squad. Fear of the people's tribunal must purge any infection from our rear."
 LPR_referendum: "Holding the Nationwide Referendum"
 LPR_referendum_desc: "The day has arrived, despite all the threats from the Kyiv junta and the roar of artillery on our borders. The residents of the Luhansk region have formed massive lines at polling stations to decide their destiny once and for all. Neither the punitive operations of Kyiv nor the panic fanned by the Ukrainian media could break the will of our people. By voting for independence, we officially draw a line under the past. From this moment on, the Luhansk People's Republic is a sovereign state, and we will defend this choice at any cost."
