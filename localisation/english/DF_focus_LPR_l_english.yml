l_english:
 LPR_capture_SBU:0 "Seizure of the SBU Building"
 LPR_capture_sbu_desc:0 "The point of no return has been passed. The crowd at the gates is no longer going to just chant slogans; the time has come to act. Seizing the SBU building and the armories inside will turn a spontaneous protest into an organized resistance. We will secure not only assault rifles, but also personnel rosters, operational archives, and maps. From this moment on, we are no longer just protesters. We are a force to be reckoned with."
 LPR_create_coordination_center:0 "Establish the Coordination Center"
 LPR_create_coordination_center_desc:0 "The spontaneous protest has served its purpose, but now we need structure. Without unified command and communication, our detachments will remain nothing more than scattered groups of bandits. We desperately need a headquarters to handle logistics, distribute captured weapons, and establish coordination between the barricades. Only by uniting our efforts under a single leadership can we endure the coming clash."
 LPR_distribute_weapons:0 "Arm the Militia"
 LPR_distribute_weapons_desc:0 "Due to the looming threat from Ukraine, we are forced to postpone rigorous military training and wage an asymmetric war aimed at successful attrition and exhausting our enemy. We will arm the militia, who will defend their homeland in Luhansk, Alchevsk, and other cities of the future Luhansk People's Republic."
 LPR_set_checkpoints:0 "Organize Checkpoints"
 LPR_set_checkpoints_desc:0 "The Kyiv junta is already massing troops and unleashing its punitive battalions upon us. We will not let them catch us by surprise and enter our cities. Concrete blocks, sandbags, and anti-tank hedgehogs must rise across all key roads, crossroads, and regional entrances. Every defense line will become an insurmountable obstacle for the Ukrainian punishers. From this day forward, no enemy convoy shall pass through our land with impunity."
 LPR_peoples_druzhina:0 "Form the People's Druzhina"
 LPR_peoples_druzhina_desc:0 "While our fighters hold the front lines at checkpoints, Ukrainian intelligence services and infiltrated saboteurs are attempting to blow up our rear from within. Kyiv agents and radical junta-sympathizers hope to sow panic in our cities, but we will not allow it. The People's Druzhina takes strict control over the streets, strategic sites, and infrastructure. From now on, any spy, provocateur, or collaborator of the Kyiv regime will be immediately exposed and neutralized. There will be no mercy for the enemy in our rear."
 LPR_luhansk_castle:0 "Luhansk Castle"
 LPR_luhansk_castle_desc:0 "Our main fortified area is ready for a major war. We have turned the former SBU citadel and surrounding quarters into an impregnable bastion against which any enemy offensive will shatter. Every building here will become a firing point, every street a deadly trap for the Ukrainian punishers. Our fighters know there is nowhere to retreat and will stand to the death for every meter of our native land. Let the Kyiv generals wash themselves in blood trying to storm our positions."
 LPR_vehicle_confiscation:0 "Confiscation of Vehicles for Frontline Needs"
 LPR_vehicle_confiscation_desc:0 "To achieve victory, we need high mobility, yet army trucks are catastrophically scarce. We have no time to wait for supplies, so we will seize vehicles from anyone trying to sit out the conflict or flee to Kyiv-controlled territory. All heavy trucks, SUVs, and buses belonging to local enterprises are hereby transferred to the militia. We will weld armor onto them, mount machine guns, and throw them into battle. Right now, everything must serve the front."
 LPR_act_on_sovereignty:0 "Proclamation of the Act of Sovereignty"
 LPR_act_on_sovereignty_desc:0 "Our people's patience has come to an end. We no longer intend to obey the criminal orders of the Kyiv junta, which seized power in a violent coup and unleashed terror against its own citizens. By proclaiming the Act of Sovereignty, we sever all ties with the neo-Nazi regime in Kyiv forever. From now on, only the decisions of the people's authorities are lawful on our land. We take our destiny into our own hands, and we stand ready to defend our freedom from any encroachment with weapons in hand."
 LPR_resource_mobilization:0 "Resource Mobilization"
 LPR_resource_mobilization_desc:0 "Right now, the front needs everything immediately; we must exert strict control over all available stockpiles of weapons, equipment, and armored vehicles. Local factories and repair workshops must work around the clock, assembling makeshift armored cars and restoring damaged weaponry. We face a regular Ukrainian army that surpasses us in supply lines, so every gram of raw material extracted and every work shift must bring our victory closer. Everything for the front, everything for defense."
 LPR_republic_of_bolotov:0 "Republic of Bolotov"
 LPR_republic_of_bolotov_desc:0 "In conditions of war and chaos, collegial management leads to destruction. We need a single will and an iron fist capable of uniting the region and repelling the Kyiv forces. Valery Bolotov assumes full power and responsibility for the fate of the Republic. Any attempts to challenge the leadership's orders, sabotage, or political bickering within our movement will be deemed treason and ruthlessly suppressed. Only strict discipline, centralization, and absolute obedience to the leader will allow us to endure and build a strong state."
 LPR_Introduction_of_a_state_emergency:0 "Introduction of a State of Emergency"
 LPR_Introduction_of_a_state_emergency_desc:0 "War has arrived at our doorsteps, and peacetime laws no longer apply. We declare a state of emergency across the entire territory of the Republic. A strict curfew is introduced on the streets, strategic locations are placed under round-the-clock guard, and all rallies or strikes are banned. The Kyiv regime hopes to destabilize our rear using its saboteurs and alarmists, but we will respond with iron order. Anyone who violates the new rules will be immediately detained under the laws of wartime."
 LPR_preparing_for_may_11:0 "Preparation for the Referendum"
 LPR_preparing_for_may_11_desc:0 "In the coming days and weeks, our people must make their ultimate historical choice. Ukrainian troops and radicals are already massing at our borders, threatening to drench our cities in blood for a mere attempt to vote. We must accomplish a colossal amount of work in the shortest possible time: print ballots, organize polling stations, and, most importantly, provide them with reliable armed security. Every activist counts, every checkpoint is reinforced. We will let the people voice their will, no matter the cost."
 LPR_full_mobilization:0 "Declaration of Full Mobilization"
 LPR_full_mobilization_desc:0 "The Kyiv regime has thrown its entire military machine against us: aviation, artillery, and heavy armor. This war cannot be won with half-measures; the very existence of our Republic is at stake. We declare a full mobilization of all forces and resources. Everyone capable of holding an assault rifle must step into the ranks — miners, laborers, and yesterday's students. We are draining our last reserves for a single purpose. No one will be able to sit this out, because if the Ukrainian punishers break through the front, they will spare no one. Our only alternative to victory is total annihilation."
 LPR_negotiations_with_mozgovoy:0 "Negotiations with Mozgovoy"
 LPR_negotiations_with_mozgovoy_desc:0 "In the north of the Republic, in Severodonetsk and Lysychansk, a powerful uprising has ignited under the leadership of Aleksey Mozgovoy. His detachments are strong and fiercely loyal to their commander, but they operate independently from Luhansk. With Ukrainian troops attempting to trap us in a pincer movement, such a division of forces is fatal. We must sit down at the negotiating table and convince Mozgovoy to join a unified command structure. The Severodonetsk Republic must become an integral part of the LPR. Only by uniting our resources and fronts can we stem the onslaught of our common enemy."
 LPR_peoples_court_of_novorossiya:0 "Establishment of the People's Court of Novorossiya"
 LPR_peoples_court_of_novorossiya_desc:0 "In conditions of total war, the old judicial system is dead, and liberal red tape leads only to chaos and impunity. The enemy is at the gates, Ukrainian spotters are operating in the rear, and marauders and rapists are undermining the people's faith in our cause. The time for people's justice has come. We are introducing field courts-martial, where verdicts will be delivered swiftly and openly before the citizens. Treason, espionage for Kyiv, and grave crimes against civilians will henceforth carry only one penalty — death by firing squad. Fear of the people's tribunal must purge any infection from our rear."
 LPR_referendum:0 "Holding the Nationwide Referendum"
 LPR_referendum_desc:0 "The day has arrived, despite all the threats from the Kyiv junta and the roar of artillery on our borders. The residents of the Luhansk region have formed massive lines at polling stations to decide their destiny once and for all. Neither the punitive operations of Kyiv nor the panic fanned by the Ukrainian media could break the will of our people. By voting for independence, we officially draw a line under the past. From this moment on, the Luhansk People's Republic is a sovereign state, and we will defend this choice at any cost."
 LPR_experts_from_russia_in_government:0 "Russian Advisors in the Government"
 LPR_experts_from_russia_in_government_desc:0 "To build an effective state system and overcome the administrative crisis, we need the experience of our older brothers. Inviting Russian specialists will allow us to organize the work of ministries and stabilize the internal situation in the Republic under wartime conditions."
 LPR_seek_recognition:0 "Course Towards International Recognition"
 LPR_seek_recognition_desc:0 "Our declaration of independence must be backed by diplomatic steps. We must make ourselves known on the world stage, begin active negotiations with potential allies, and seek recognition of the LPR's sovereignty to ensure the safety of our citizens."
 LPR_strengthen_mobilization:0 "Strengthen Mobilization Measures"
 LPR_strengthen_mobilization_desc:0 "The onslaught from the Ukrainian armed forces is intensifying, and half-measures are no longer enough. We must streamline the conscription process, centralize resource distribution, and call everyone capable of holding a weapon to the banners of the Republic to halt the enemy's advance."
 LPR_republic_of_plotnicky:0 "Republic of Plotnitsky"
 LPR_republic_of_plotnicky_desc:0 "The period of dual power and spontaneous resistance has come to an end. The vertical of power led by Igor Plotnitsky is designed to establish strict order, unite scattered forces, and guide the Republic along the path of centralization and discipline."
 LPR_elections_2014:0 "2014 General Elections"
 LPR_elections_2014_desc:0 "The people of Lugansk region must determine their own destiny. Conducting legitimate elections for the Head and the People's Council will demonstrate our desire for democratic self-determination to the whole world and finally establish official authorities."
 LPR_disarm_illegal_formations:0 "Disarm Illegal Formations"
 LPR_disarm_illegal_formations_desc:0 "It is time to establish internal order. All paramilitary groups unwilling to submit to a unified command and swear allegiance to the Republic must lay down their arms. There can be no room for anarchy and lawlessness in the rear; weapons must only serve the defense of the LPR."
 LPR_fight_with_traitors:0 "Combat Traitors and Saboteurs"
 LPR_fight_with_traitors_desc:0 "Ukrainian intelligence services and their accomplices are trying to undermine the Republic from within. We will strengthen the work of state security agencies to identify spies, eliminate sabotage groups in the rear, and suppress any attempts at subversion."
 LPR_The_situation_has_stabilized:0 "The Situation Has Stabilized"
 LPR_The_situation_has_stabilized_desc:0 "Thanks to the resilience of our fighters and the coordinated actions of the command, we managed to hold the front. The first and most dangerous phase of the crisis is behind us — now we can take a breath and consolidate our gains."
 LPR_start_solving_the_republics_problems:0 "Addressing the Republic's Internal Problems"
 LPR_start_solving_the_republics_problems_desc:0 "The military threat has partially receded, and it is time to focus on the rear. We must rebuild damaged infrastructure, organize supplies to the cities, launch welfare payments, and restore civilian life to the liberated areas of the Lugansk region."
 LPR_social_tension:0 "Social Tension"
 LPR_social_tension_desc:0 "The war and the economic blockade imposed by Kyiv have disrupted the familiar way of life. Rising prices, food shortages, and general uncertainty create a dangerous ground for domestic unrest. We must respond immediately to prevent a social explosion."
 LPR_provide_assistance_to_those_in_need:0 "Assistance to the Needy"
 LPR_provide_assistance_to_those_in_need_desc:0 "In conditions of a humanitarian crisis, the Republic takes charge of caring for its citizens. Organizing the distribution of free meals, allocating humanitarian aid, and providing basic medicines will help people survive the hardest times."
 LPR_Support_for_vulnerable_populations:0 "Support for Vulnerable Populations"
 LPR_Support_for_vulnerable_populations_desc:0 "Large families, disabled individuals, and lonely elderly people found themselves in the most vulnerable position. The state is obliged to provide them with targeted material and social aid, protecting them from the hardships of wartime."
 LPR_start_paying_pensions:0 "Commencement of Pension Payments"
 LPR_start_paying_pensions_desc:0 "Ukraine has completely ceased fulfilling its social obligations to our pensioners. Despite the blockade, we are initiating our own regular pension payments to provide elderly people with their earned and stable support."
 LPR_establishing_new_workplaces:0 "Establishing New Workplaces"
 LPR_establishing_new_workplaces_desc:0 "Due to the shutdown of many enterprises, thousands of people were left without livelihoods. Launching public works programs, rebuilding infrastructure, and supporting small businesses will allow people to return to work and revive the economy."
 LPR_psychological_rehabilitation:0 "Psychological Rehabilitation"
 LPR_psychological_rehabilitation_desc:0 "Constant shelling and the horrors of war have left a deep mark on the souls of civilians and militia fighters. Opening centers for psychological aid and rehabilitation will help people cope with post-traumatic stress and return to civilian life."
 LPR_info_war_and_propa_ganda:0 "Information War and Propaganda"
 LPR_info_war_and_propa_ganda_desc:0 "The enemy is waging an aggressive disinformation campaign against us, attempting to break our spirit. We must deploy a powerful counter information front to convey the truth about the events in Donbass and maintain the high morale of our citizens."
 LPR_creating_own_media:0 "Creating Our Own Media"
 LPR_creating_own_media_desc:0 "To effectively counter falsehoods, we need independent communication channels. Launching Republican newspapers, radio stations, and TV channels will allow us to shape our own agenda and promptly inform the population."
 LPR_disconnect_from_ukrainian_media:0 "Disconnection from Ukrainian Media"
 LPR_disconnect_from_ukrainian_media_desc:0 "The broadcasting of Ukrainian TV channels and radio stations on the territory of the Republic is aimed at sowing panic and hostility. Ceasing the transmission of these resources will protect our information space from destructive influence."
 LPR_public_engagement:0 "Public Engagement"
 LPR_public_engagement_desc:0 "The government must be open to the people. Holding regular meetings with citizens, establishing public movements, and involving activists in managing the Republic will strengthen trust in state institutions."
 LPR_invite_international_reporters:0 "Inviting International Reporters"
 LPR_invite_international_reporters_desc:0 "Global media often broadcast only one point of view. By inviting independent foreign reporters and war correspondents, we give them the opportunity to see the consequences of the shelling of our cities firsthand and tell the truth to the world."
 LPR_humanitarian_catastrophe:0 "Humanitarian Catastrophe"
 LPR_humanitarian_catastrophe_desc:0 "Combat operations have pushed the region to the brink of survival. Destroyed homes, lack of medicines, and shortages of basic food items require urgent action from us. We are obliged to mobilize all resources to save the lives of our citizens."
 LPR_humanitarian_aid:0 "Humanitarian Aid"
 LPR_humanitarian_aid_desc:0 "To prevent widespread starvation and epidemics, the Republic is deploying a network of distribution points for food and essential goods. The organized collection and distribution of aid will be our primary task for the foreseeable future."
 LPR_fair_aid_distribution:0 "Fair Aid Distribution"
 LPR_fair_aid_distribution_desc:0 "Everyone in need must receive support, and any attempts to profit from other people's misfortune will be severely suppressed. We will establish a strict system of control and accounting to ensure that humanitarian shipments reach ordinary people directly."
 LPR_engaging_international_aid:0 "Engaging International Aid"
 LPR_engaging_international_aid_desc:0 "The scale of the crisis requires support from the outside. We are ready to cooperate with any international organizations and funds that sincerely want to help the civilian population of Donbass and ease the consequences of the blockade."
 LPR_accept_aid_from_private_funds:0 "Accept Aid from Private Funds"
 LPR_accept_aid_from_private_funds_desc:0 "Many caring patrons and public organizations are offering their support. We should establish official channels for working with private benefactors who are ready to supply medicines and clothing."
 LPR_restoration_of_social_infrastructure:0 "Restoration of Social Infrastructure"
 LPR_restoration_of_social_infrastructure_desc:0 "The shelling has caused immense damage to public facilities. We must promptly repair damaged hospitals, schools, and kindergartens to return basic conditions for normal life to the cities."
 LPR_supplying_social_facilities:0 "Supplying Social Facilities"
 LPR_supplying_social_facilities_desc:0 "It is not enough just to rebuild walls; we need to ensure the full operation of institutions. We will organize priority delivery of coal, generators, medicines, and educational materials to schools and hospitals."
 LPR_shattered_electric_power:0 "Shattered Electric Power"
 LPR_shattered_electric_power_desc:0 "Strikes on critical infrastructure have left entire districts without power. A complete blackout threatens to stop water utilities and enterprises, making the restoration of the power system a matter of survival for the Republic."
 LPR_start_restoring_power_supply:0 "Start Restoring Power Supply"
 LPR_start_restoring_power_supply_desc:0 "Our repair crews are ready to work under the most difficult frontline conditions. We will begin a phased repair of damaged substations and power lines to return light to the homes of citizens."
 LPR_restore_lugansk_tec:0 "Restoration of Lugansk TPP"
 LPR_restore_lugansk_tec_desc:0 "The Lugansk thermal power plant is a key hub of the region's entire energy system. Despite its proximity to the line of contact, we must make every effort to repair its capacities and stabilize the electricity supply."
 LPR_convert_lugansk_thermal_power_plant_to_gas:0 "Convert Lugansk TPP to Gas"
 LPR_convert_lugansk_thermal_power_plant_to_gas_desc:0 "Due to the coal blockade and logistical problems, we need an alternative fuel source. Modernizing and converting the TPP equipment to use natural gas will ensure the independence and stability of generation."
 LPR_connect_to_shchastynska_tec:0 "Connection to Shchastynska TPP"
 LPR_connect_to_shchastynska_tec_desc:0 "To integrate the remaining capacities and create backup supply routes, we need to restore the distribution hubs connecting us to the station in Shchastya and establish the flow of energy."
 LPR_energy_independence_from_ukr:0 "Energy Independence from Ukraine"
 LPR_energy_independence_from_ukr_desc:0 "Kyiv regularly uses the power switch as a tool of political pressure. Our only true path lies in a complete reconnection of the grids and achieving absolute energy independence from the Ukrainian side."
 LPR_restoring_other_tec:0 "Restoration of Other TPPs"
 LPR_restoring_other_tec_desc:0 "In addition to large hubs, there are also local thermal power plants in the Republic. Repairing small stations will distribute the load and guaranteed heat and light even to remote areas."
 LPR_economic_collapse:0 "Economic Collapse"
 LPR_economic_collapse_desc:0 "The severance of production chains, closure of mines, and the financial blockade imposed by Kyiv have pushed the economy of Donbass to the brink of a total standstill. Without urgent state intervention, the Republic risks running out of livelihoods."
 LPR_restore_trade_links:0 "Restoring Trade Links"
 LPR_restore_trade_links_desc:0 "Former markets are blocked, so we must urgently reorient our commerce. Establishing direct economic contacts with Russian regions will allow us to save our enterprises from isolation."
 LPR_financial_system_issue:0 "Financial System Issue"
 LPR_financial_system_issue_desc:0 "The shutdown of Ukrainian banks has left the Republic without cashless transactions and the ability to process payments normally. The absence of our own monetary and treasury system paralyzes the circulation of capital."
 LPR_creating_a_banking_system:0 "Creating a Banking System"
 LPR_creating_a_banking_system_desc:0 "We need our own financial tool. Establishing the State Bank of the LPR will allow us to streamline tax collection, initiate wage payments in the rear, and ensure a stable circulation of cash."
 LPR_reviving_idle_factories:0 "Reviving Idle Factories"
 LPR_reviving_idle_factories_desc:0 "The heavy industry of the Lugansk region must not turn into scrap metal. The state takes control of temporarily abandoned and idle factories to prepare them for a relaunch under new management."
 LPR_restore_supply_chains:0 "Restoring Supply Chains"
 LPR_restore_supply_chains_desc:0 "Factories require raw materials and components that previously came from other regions. We will restructure logistics within the controlled territories and find new suppliers to restore the production cycle."
 LPR_get_enterprises_back_online:0 "Getting Enterprises Back Online"
 LPR_get_enterprises_back_online_desc:0 "The first workshops are ready to launch. Returning workers to the factories and starting the production of finished goods will prove that the industrial potential of Donbass cannot be broken by any blockade."
 LPR_agricultural_development:0 "Agricultural Development"
 LPR_agricultural_development_desc:0 "The Republic's food security depends on our fields. Supporting local farmers, providing them with fuel for the sowing campaign, and organizing centralized grain procurement will save the cities from food shortages."
