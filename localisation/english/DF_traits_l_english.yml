 df_yanukovich: "A native of industrial Donbas who became the embodiment of the Donetsk political and economic group and the system of “strong managers.” His leadership depends on a fragile compromise among oligarchic clans and an attempt to balance between two geopolitical giants. Yanukovych’s domestic policy, built on a rigid chain of command and loyalty to the “Family,” has produced a critical level of corruption and social tension. He is now cornered: the economy demands loans, Moscow demands integration, and the street demands change. His inability to make a final choice has turned Ukraine into Europe’s powder keg, where any presidential mistake could trigger the collapse of statehood or the beginning of civil war. His fate now depends on whether he has the will to suppress the opposition or the skill to reach another agreement with everyone at once."

