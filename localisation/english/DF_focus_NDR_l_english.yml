l_english:
 NDR_capture_mvd: "Seizure of the Ministry of Internal Affairs"
 NDR_capture_mvd_desc: "The armories and archives of the local municipal police department must come under our control. This will provide the forming militia detachments with their first firearms."
 NDR_distribute_weapons: "Distributing Weapons to Militia"
 NDR_distribute_weapons_desc: "The city department's warehouses have been unsealed. All captured assault rifles, pistols, and special equipment must be immediately distributed among the volunteers ready to stand up for the defense of the city."
 NDR_fight_looting: "Combating Looting"
 NDR_fight_looting_desc: "Amidst chaos and a power vacuum, criminal elements have become active. We are obliged to introduce a strict patrol regime and suppress any looting to maintain order and the trust of local residents."
 NDR_military_tribunals: "Military Tribunals"
 NDR_military_tribunals_desc: "Peacetime laws are no longer functional. To maintain strict discipline on the front lines and combat desertion in the besieged city, summary field courts-martial are being introduced."
 NDR_arrest_ponomarev: "Arrest of Ponomarev"
 NDR_arrest_ponomarev_desc: "The actions of the self-proclaimed civil leadership have begun to harm coordinated defense. Due to abuse of power and destabilization of the situation, the former head of the administration must be isolated."
 NDR_escape_from_slavyansk: "Escape from Slavyansk"
 NDR_escape_from_slavyansk_desc: "A tight encirclement leaves no chance for resupply, and holding shattered positions loses its military purpose. We face a stealthy and risky night breakthrough along dirt roads toward Kramatorsk and Donetsk."
