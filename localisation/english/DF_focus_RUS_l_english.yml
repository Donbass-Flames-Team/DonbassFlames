l_english:
 RUS_sochi_olympics: "Olympics in Sochi"
 RUS_sochi_olympics_desc: "Long waited Olympics in Sochi are planned this year. It will be second time when Olympics and first time for Winter Olympics were held on Russian territory. More then 88 countries were invited, summary number of athletes is bigger then 2000! The Olympics start 7 of February and end 23 of February. Organizers promise that the Olympics will be a truly memorable event and a source of pride for the city of Sochi."
 RUS_conceal_internal_problems: "Conceal internal problems"
 RUS_conceal_internal_problems_desc: "Russia has undoubtedly survived the main difficult period it faced in the 1990s. The difficult times for our country are behind us, and by the early 2000s, we had resolved many problems. But some of these problems remain to this day, including at least a high level of corruption, oligarchy, nepotism, outdated social institutions, some economic problems, and, overall, a standard of living that is far from ideal. All of these factors tarnish our image both internationally and among our own people, and it would be better to conceal these problems or downplay their significance."
 RUS_law_from_roskomnadzor: "Law from Roskomnadzor"
 RUS_law_from_roskomnadzor_desc: "Roskomnadzor (Roskomnadzor) has proposed a bill requiring owners of websites and web pages with more than 3,000 daily visitors to register with Roskomnadzor and be held accountable for the information they post. This proposal has faced widespread criticism, with some considering it a restriction of citizens' rights intended to allow law enforcement agencies to control people online, while others see it as a necessary measure to achieve a safer internet."
 RUS_suppress_pro_ukrainian_citizens: "Suppress Pro-Ukrainian Sentiment"
 RUS_suppress_pro_ukrainian_citizens_desc: "In Russia there is quite a lot of people who express sympathy to Ukrainians, praise them for Maidan and wish to repeat same scenario here, on our land. Nemcov, Novodvorskaia, Yavlinskiy and a lot of others want to spil blood and raise disorganization on streets of Russia. This is undoubtedly an oppositional mood with the aim of undermining stability in our country, цe can't allow them to do so."
 RUS_coup_in_ukraine: "The Coup in Ukraine"
 RUS_transfer_of_contingent_to_sevastopol:0 "Send an Army Contingent to Sevastopol"
 RUS_transfer_of_contingent_to_sevastopol_desc:0 "More than two decades have passed since 1991, when the Soviet Union collapsed. We have not forgotten 1954, when Crimea was transferred to Ukraine. The current situation now allows us to reclaim our rightful lands. We will send a contingent to Sevastopol to assess the situation in Crimea."
 RUS_terminate_kharkov_accords:0 "Denounce the Kharkiv Accords"
 RUS_terminate_kharkov_accords_desc:0 "The Kharkiv Accords were signed in 2010 to regulate the presence of our fleet on Ukrainian territory. The current situation in Ukraine compels us to denounce the treaty because of the widening political divide and previous disputes with Poroshenko."
 RUS_return_to_home_port:0 "Crimea Returns to Its Native Harbor"
 RUS_return_to_home_port_desc:0 "At last, after the Crimean people suffered under Kyiv’s rule, we have brought the peninsula back—with honor and dignity. Our next goal is to liberate Odesa, Donetsk, Luhansk, and every land inhabited by a pro-Russian population. Crimea is now back in its native harbor."
 RUS_russian_spring_in_the_east:0 "Russian Spring in the West"
 RUS_russian_spring_in_the_east_desc:0 "The Russian Spring has arrived. We are ready to show the meaning of the Russian spirit, a spirit that can live even on the lands of another country. Get to work, comrades! We have many tasks ahead in the new year of 2014!"
 RUS_task_for_fsb:0 "Assign Tasks to the FSB"
 RUS_task_for_fsb_desc:0 "To achieve our objectives, we need cover and a reliable foundation to manage the situation inside the state. Our security services will take care of these goals. For now, we must assign the FSB the tasks needed to maintain control over the country."
 RUS_support_prorussians_protests:0 "Support Pro-Russian Protests"
 RUS_support_prorussians_protests_desc:0 "Across southeastern Ukraine—in Kharkiv, Donetsk, Luhansk, and other cities—Russian residents are rallying against the pro-Western government. We understand them completely and are prepared to provide whatever they need. Another move by our geopolitical strategists."
 RUS_help_to_new_republics:0 "Send Aid to the New Republics"
 RUS_help_to_new_republics_desc:0 "We will send aid to the newly formed pro-Russian republics—our compatriots who find themselves in a very difficult situation. Conditions inside Crimea are now favorable: we held a referendum there in which 96 percent chose our rule over Ukraine. Now it is our country’s turn to act."
 RUS_fight_with_proukranians_citizens:0 "Begin the Struggle Against Pro-Ukrainian Residents"
 RUS_fight_with_proukranians_citizens_desc:0 "The situation on the home front is currently stable, but we must root out the traitors from Ukraine who are disrupting the government in Sevastopol, Simferopol, Kerch, and other cities."
 RUS_task_for_strelkov:0 "Assign a Mission to the Riflemen in Donbas"
 RUS_task_for_strelkov_desc:0 "We maintain friendly relations with our republic in Donetsk, as well as the other people’s republics. We will give them objectives that help them concentrate on the external front against Ukraine. The fighters in Donetsk are showing impressive results, which inspires us. We will reveal the wonders of the Russian world to our people in Donbas who remain under Ukrainian rule and its right-wing nationalists."
 RUS_volunteers_on_donbass:0 "Volunteer Units in Donbas"
 RUS_volunteers_on_donbass_desc:0 "It is time to raise the stakes. The Kyiv junta has expanded its army to the limit, conducted partial mobilization, and sent volunteers against our republics to kill Russian civilians. We are ready to provide our units to the people’s republics, gain experience in modern warfare, and ultimately secure victory for them—and for us."
 RUS_ammunition_supply:0 "Supply Ammunition to the Republics"
 RUS_ammunition_supply_desc:0 "A simple and straightforward measure: supplying ammunition to our people's republics. By sending it, we will help their troops achieve victory."
 RUS_machinery_supply:0 "Supply Mechanized Equipment to the Republics"
 RUS_machinery_supply_desc:0 "A simple and straightforward measure: mechanized equipment will be delivered to our Russian allies and help bring them closer to victory."
 RUS_arms_supply:0 "Send Army Weapons to the Republics"
 RUS_arms_supply_desc:0 "A simple and straightforward measure: we will supply army weapons to our Russian comrades in Donbas—and beyond it. This assistance will bring them closer to victory."
 RUS_russian_regulars_on_donbass:0 "Send Regular Units to Donbas"
 RUS_russian_regulars_on_donbass_desc:0 "After witnessing several failures by our allies at the front, the General Staff has chosen a desperate form of assistance: not volunteers, but regular units. We will deploy them covertly and catch the enemy by surprise."
 RUS_show_kyivs_war_crimes:0 "Expose the Kyiv Junta's War Crimes"
 RUS_show_kyivs_war_crimes_desc:0 "We have already gathered extensive video and photographic evidence of soldiers of the Kyiv junta killing our comrades in Donbas. We will show the world what it means to be Nazis—and what awaits them. Glory to Russia!"
 RUS_open_invasion:0 "Operation Northern Wind"
 RUS_open_invasion_desc:0 "There is no time left; we must act. Our General Staff has decided that the moment has come to escalate and fully deploy troops into Donbas. The riflemen of the DPR will be very pleased. Glory to the heroes!"
 RUS_the_war_has_stalled:0 "The War Has Frozen"
 RUS_the_war_has_stalled_desc:0 "Neither side could achieve a decisive victory. Our republics in Donbas have signed the Minsk Protocol, under which Donetsk and the coastal territories pass to our people’s republics aligned with Russia. We can now develop in peace without fearing an immediate strike."
 RUS_victory_of_republics:0 "Victory of the People's Republics"
 RUS_victory_of_republics_desc:0 "At last! After a very long struggle, we have defeated the Kyiv junta and divided all of Novorossiya among the people’s republics. Glory to Russia!"
 RUS_defeat_of_the_republics:0 "Defeat of the People's Republics"
 RUS_defeat_of_the_republics_desc:0 "We doubted this could happen, but it has. We have lost. Our soldiers fought valiantly for the independence of Donbas, yet they were forced to retreat from Donetsk and the cities beyond it. This is the end."
 RUS_support_the_import_substitution_policy:0 "Support Import-Substitution Policies"
 RUS_introduction_of_anti_sanctions:0 "Introduce Counter-Sanctions"
 RUS_coup_in_ukraine_desc: "Bad news has come from Ukraine. We have learned of a successful coup d'état in Ukraine. The Maidan supporters have ultimately achieved their goal and overthrown Ukraine's legitimate president, Viktor Yanukovych. It is not yet clear how we will respond to this news or what steps we will take in the near future. Viktor Yanukovych is currently in a safe location in Rostov-on-Don, in contact with the Russian government. However, despite the fact that the protesters have achieved their goal, this does not mean that the political crisis in Ukraine has ended. In cities across the southeast, specifically in Donetsk, Sevastopol, Odessa, and Kharkov, rallies against the Maidan and in support of Yanukovych are gaining momentum, some of which are pro-Russian." #Russian spelling here used intentionally
 RUS_threat_to_the_regime_yanukovych: "Threat to the Yanukovich Regime"
 RUS_threat_to_the_regime_yanukovych_desc: "The political crisis in Ukraine continues, and the risk of Yanukovych's government falling is growing. It is by no means in our interest for a figure loyal to us to step down as president of Ukraine and be replaced by pro-Western politicians. Reports are emerging that the Ukrainian opposition and Yanukovych's government are preparing new negotiations to resolve the crisis, and at the very least, they will likely demand that Yanukovych make concessions, and at most, they will demand his resignation. We do not need a second Yushchenko in Ukraine, and if we do not take some measures, Ukraine may ultimately slip out of our sphere of influence."
 RUS_meeting_in_the_kremlin: "Meeting in the Kremlin"
 RUS_meeting_in_the_kremlin_desc: "Russian President Vladimir Putin has urgently convened a meeting of the Russian Security Council, where it appears the tense situation in Ukraine will be discussed, along with the possible adoption of necessary measures to protect Russia's national interests. We will likely have to deploy law enforcement agencies or even the armed forces to resolve the escalation, but in any case, the situation remains dangerous both for the Yanukovych government and for us in the future, and requires some immediate decisions before it is too late."
 RUS_assistance_in_organizing_anti_Maidan: "Organize the Anti-Maidan Movement"
 RUS_assistance_in_organizing_anti_Maidan_desc: "To prevent Maidan supporters from gaining full control in Ukraine, we need to help organize an Anti-Maidan movement. We should fund rallies in support of the Yanukovych government in all Ukrainian cities where the population is loyal to the Party of Regions. Perhaps such a move will stabilize the situation and provide Viktor Yanukovych with a base of supporters and public backing."
 RUS_convene_csto_council: "Convene the CSTO Council"
 RUS_convene_csto_council_desc: "We will convene a CSTO session to discuss issues related to collective security in the current complex international environment. A joint meeting of the foreign ministers, defence ministers, and secretaries of the security councils of CSTO member states will be held to address these important issues."
 RUS_coordination_of_ukrainian_security_with_ours: "Coordinate With Ukrainian Security"
 RUS_coordination_of_ukrainian_security_with_ours_desc: "We must help our friends in Ukraine during this difficult time, amid the ongoing street unrest. Unfortunately, Ukrainian security forces are unable to handle such widespread lawlessness on the streets of Kyiv on their own. Therefore, we must coordinate our efforts and make joint decisions to stabilize the situation in the capital. Perhaps then we will be able to calm the Maidan supporters and restore order."
 RUS_deploy_security_forces_to_ukraine: "Deploy Security Forces to Ukraine"
 RUS_deploy_security_forces_to_ukraine_desc: "It is clear that Ukraine's Ministry of Internal Affairs is unable to cope with all the chaos and violence in the streets of Kyiv caused by Maidan supporters. The protesters have crossed every line and gone too far with seizing government buildings, seizing weapons, erecting barricades, and killing people. We already know of casualties among the Berkut officers on Maidan; if we don't stop this, only God knows where it might lead, but in any case, we must intervene while there is still time. The Ukrainian government has officially asked us to help them; we have agreed to this proposal and are ready to lend a helping hand to our friends."
 RUS_import_titushki: "Import Titushki"
 RUS_import_titushki_desc: "In Ukraine, there is a group of people called Titushki. In short, these are marginalized individuals who, for a couple hundred hryvnias, are willing to act as the rowdy element at any protest, fighting with law enforcement and opponents, and shouting louder and sooner than anyone else in the front ranks of the demonstrators. It is precisely these so-called Titushki who are capable of driving pro-Russian rallies and ensuring their success. We can hire such people in Rostov-on-Don or in, say, Belgorod, and transport them to cities in southeastern Ukraine."
 RUS_support_our_regions: "Supporting Our Regions"
 RUS_support_our_regions_desc: "Kharkov, Donetsk, Odessa, Crimea, Lugansk - these are cities and regions where Russian culture is still very much alive; Russian is spoken on every street, Russian signs are displayed in stores, and Russian writers are taught in schools. Undoubtedly, many residents of southeastern Ukraine feel warmly toward Russia, and we must make it clear to them that Russia, too, feels warmly toward them. And that Russia, in particular, stands ready at any moment to extend a helping hand to the Russian-speaking population of Ukraine." #Russian spelling here used intentionally
 RUS_support_pro_kremlin_media_in_ukraine: "Support Ukrainian Pro-Kremlin Media"
 RUS_support_pro_kremlin_media_in_ukraine_desc: "In today's world, the phenomenon of information warfare, a war between media outlets, a war waged by propagandists, journalists, war correspondents, and bloggers is no less significant. People have no idea what is happening hundreds of kilometres away from them, whether in a conflict zone or behind closed doors in politicians' offices, and only the media can tell them about it. But everyone has their own version of the truth, including us. To win the loyalty of the Ukrainian people, we can secretly fund media outlets close to us, such as 112 Ukraine, NewsOne, ZIK, and other Ukrainian TV channels."
 RUS_support_the_party_of_regions: "Supporting the Party of Regions"
 RUS_support_the_party_of_regions_desc: "The Party of Regions is one of the few pro-Russian parties in Ukraine, and undoubtedly the largest among them. To maintain our influence in Ukraine, we need to support the Party of Regions and hope that it will remain at the top of the popularity polls among Ukrainians. Through the Party of Regions, we can influence Ukrainian politics, as if pulling the strings of politicians like puppets who will silently carry out our orders."
 RUS_PMC:0 "Create a PMC"
 sevastopol:0 "Capture Sevastopol"
 RUS_support_independent_crimea:0 "Support Crimean Independence"
 RUS_support_independent_crimea_desc:0 "The situation in Crimea has become a deadlock for Kyiv. After the coup against Yanukovych, pro-Russian supporters have taken to the streets across the peninsula. As a state that supports Crimea’s population, we will back their demonstrations. The time has come to reclaim our lost lands, and we will begin an operation in Crimea."
 RUS_referendum_in_crimea:0 "Hold a Referendum in Crimea"
 RUS_regain_global_influence: "Regain Global Influence"
 RUS_regain_global_influence_desc: "Restoring Russia's role as a key global power requires active diplomatic, economic, and military presence across strategic regions."
 RUS_influence_in_africa: "Influence in Africa"
 RUS_influence_in_africa_desc: "Expanding economic cooperation and security partnerships with African nations opens new markets and strengthens our geopolitical standing."
 RUS_influence_in_syria: "Influence in Syria"
 RUS_influence_in_syria_desc: "Direct involvement in the Syrian conflict allows us to protect state infrastructure, test combat doctrine, and project power in the Middle East."
 RUS_pmc_redut: "PMC Redut"
 RUS_pmc_redut_desc: "Utilizing private military companies provides operational flexibility and discreet force projection in strategic zones without direct state involvement."
 RUS_agricultural_subsidies: "Agricultural Subsidies"
 RUS_agricultural_subsidies_desc: "Investing heavily in domestic farming secures food independence and boosts rural economic production under trade pressures."
 RUS_information_war_with_europe: "Information War with Europe"
 RUS_information_war_with_europe_desc: "Countering Western narrative dominance requires active media broadcasting and targeted digital campaigns to protect national interests abroad."
 RUS_interfere_in_elections: "Interfere in Elections"
 RUS_interfere_in_elections_desc: "Conducting covert information operations aims to influence political processes in rival nations and weaken hostile alliances."
 RUS_north_pipeline_two: "Nord Stream 2"
 RUS_north_pipeline_two_desc: "Constructing a direct Baltic gas pipeline to Europe secures energy exports and bypasses unreliable transit corridors."
 RUS_turkish_pipeline: "TurkStream"
 RUS_turkish_pipeline_desc: "Building a southern gas infrastructure route creates reliable transit channels to Southern Europe and deepens economic ties."
 RUS_get_closer_to_china: "Get Closer to China"
 RUS_get_closer_to_china_desc: "Forging a comprehensive strategic partnership with Beijing opens vast Eastern markets and aligns geopolitical priorities."
 RUS_the_power_of_siberia_pipeline: "Power of Siberia Pipeline"
 RUS_the_power_of_siberia_pipeline_desc: "Connecting Siberian gas fields directly to the Chinese market diversifies energy exports and fosters regional development."
 RUS_ultimatum_to_the_west: "Ultimatum to the West"
 RUS_ultimatum_to_the_west_desc: "Demanding binding security guarantees and stopping military expansion on our borders forces Western nations to respect red lines."
 RUS_russia_of_putin: "Russia of Putin"
 RUS_russia_of_putin_desc: "Consolidating state power around the President ensures political continuity, internal stability, and a firm foreign policy."
 RUS_domestic_policy: "Domestic Policy"
 RUS_domestic_policy_desc: "Focusing on administrative efficiency and socio-economic governance strengthens domestic stability against external pressures."
 RUS_create_EAEU: "Create Eurasian Economic Union"
 RUS_create_EAEU_desc: "Establishing a single economic market with post Soviet allies facilitates free movement of goods, capital, and labor."
 RUS_development_of_the_digital_economy: "Development of Digital Economy"
 RUS_development_of_the_digital_economy_desc: "Digitizing financial, industrial, and administrative services modernizes national infrastructure and accelerates economic growth."
 RUS_Improve_internet_infrastructure: "Improve Internet Infrastructure"
 RUS_Improve_internet_infrastructure_desc: "Upgrading high speed communication networks across regions ensures secure data flow and connects remote populations."
 RUS_development_of_digital_government_services: "Development of Digital Government Services"
 RUS_development_of_digital_government_services_desc: "Expanding centralized online public portals reduces bureaucratic delay and improves civic administrative efficiency."
 RUS_fight_against_bureaucracy: "Fight Against Bureaucracy"
 RUS_fight_against_bureaucracy_desc: "Streamlining state regulations and cutting unnecessary administrative procedures lowers costs for domestic businesses."
 RUS_support_etatism: "Support Statism"
 RUS_support_etatism_desc: "Increasing the state's direct role in strategic industries ensures economic sovereignty and shields key assets from crises."
 RUS_nationalization_of_elites: "Nationalization of Elites"
 RUS_nationalization_of_elites_desc: "Prohibiting foreign bank accounts and assets for state officials guarantees national loyalty and prevents foreign influence."
 RUS_state_media_monopoly: "State Media Monopoly"
 RUS_state_media_monopoly_desc: "Consolidating major broadcasting assets under state control ensures coherent national messaging and guards against subversion."
 RUS_law_on_undesirable_organizations: "Law on Undesirable Organizations"
 RUS_law_on_undesirable_organizations_desc: "Restricting foreign non governmental entities protects internal politics from foreign interference and covert funding."
 RUS_yarovaya_package: "Yarovaya Package"
 RUS_yarovaya_package_desc: "Enacting strict counter terrorism legal measures enhances data retention mandates and surveillance over extremist networks."
 RUS_expand_the_law_on_foreign_agents: "Expand Foreign Agent Law"
 RUS_expand_the_law_on_foreign_agents_desc: "Tightening disclosure requirements for foreign funded entities ensures transparency and minimizes political sabotage."
 RUS_rosgvardia: "Form Rosgvardia"
 RUS_rosgvardia_desc: "Creating a dedicated National Guard secures internal public order, guards critical infrastructure, and counters domestic threats."
 RUS_propaganda_of_traditional_values: "Promotion of Traditional Values"
 RUS_propaganda_of_traditional_values_desc: "Fostering traditional moral and cultural principles strengthens social cohesion and counters foreign ideological shifts."
 RUS_family_values_protection: "Family Values Protection"
 RUS_family_values_protection_desc: "State support for families and demographic initiatives boosts population growth and preserves core social structures."
 RUS_yunarmy: "Yunarmy Movement"
 RUS_yunarmy_desc: "Establishing a national youth military patriotic organization fosters civic responsibility and prepares future service members."
 RUS_cultural_sovereignty: "Cultural Sovereignty"
 RUS_cultural_sovereignty_desc: "Protecting national history and heritage against foreign revisionism reinforces identity and historical continuity."
 RUS_investments_in_crimea: "Investments in Crimea"
 RUS_investments_in_crimea_desc: "Allocating substantial federal funds to Crimean infrastructure accelerates integration and revitalizes the peninsula."
 RUS_construction_of_the_crimean_bridge: "Construction of the Crimean Bridge"
 RUS_construction_of_the_crimean_bridge_desc: "Building a massive transport link across the Kerch Strait connects the peninsula directly to mainland logistics networks."
 RUS_send_settlers_to_crimea: "Send Settlers to Crimea"
 RUS_send_settlers_to_crimea_desc: "Encouraging skilled specialists and civil servants to relocate to the peninsula strengthens local administration and economic development."
 RUS_fight_with_crimean_tatar_separatism: "Counter Crimean Tatar Separatism"
 RUS_fight_with_crimean_tatar_separatism_desc: "Neutralizing extremist cells and integrating local populations secures stability and public safety on the peninsula."
 RUS_elections_2018: "2018 Presidential Elections"
 RUS_elections_2018_desc: "Conducting nationwide presidential elections confirms public mandate for the established political and strategic vector."
 RUS_national_projects: "National Projects"
 RUS_national_projects_desc: "Launching large scale federal programs across healthcare, education, and infrastructure drives long term national modernization."
 RUS_the_sovereign_internet_act: "Sovereign Internet Act"
 RUS_the_sovereign_internet_act_desc: "Creating independent domestic internet routing capabilities ensures network functionality during external cyber threats."
 RUS_raise_the_retirement_age: "Raise Pension Age"
 RUS_raise_the_retirement_age_desc: "Reforming pension parameters balances the state budget and addresses long term demographic shifts despite public debate."
 RUS_renew_the_cabinet_of_ministers: "Renew Cabinet of Ministers"
 RUS_renew_the_cabinet_of_ministers_desc: "Restructuring government leadership improves administrative efficiency and brings fresh momentum to economic goals."
 RUS_constitutional_amendments: "Constitutional Amendments"
 RUS_constitutional_amendments_desc: "Enacting comprehensive constitutional updates secures state sovereignty, resets presidential terms, and enshrines social guarantees."
 RUS_status_quo_on_the_peninsula: "Status Quo on the Peninsula"
 RUS_status_quo_on_the_peninsula_desc: "Maintaining current administrative arrangements in Crimea preserves existing border structures without immediate integration steps."
 RUS_republic_of_sailors: "Republic of Sailors"
 RUS_republic_of_sailors_desc: "Reinforcing the military and naval significance of Sevastopol secures Black Sea Fleet dominance and maritime defense."
 RUS_form_an_orchestra: "Form an Orchestra"
 RUS_form_an_orchestra_desc: "Establishing specialized Expeditionary Combat Formations provides efficient military assistance in foreign operational theatres."
 RUS_development_of_armed_forces: "Development of Armed Forces"
 RUS_development_of_armed_forces_desc: "Systematic modernization of equipment and command structures ensures our military remains capable against modern peer threats."
 RUS_establish_aerospace_forces: "Establish Aerospace Forces"
 RUS_establish_aerospace_forces_desc: "Merging air defense, space assets, and air combat arms into a unified command maximizes aerial dominance capabilities."
 RUS_expand_military_export: "Expand Military Arms Export"
 RUS_expand_military_export_desc: "Selling advanced weapons systems to global partners generates revenue and deepens defense industry partnerships."
 RUS_increase_contracts_in_army: "Increase Contract Service in Army"
 RUS_increase_contracts_in_army_desc: "Transitioning toward a professional contract soldier model elevates combat readiness and technical proficiency."
 RUS_aircraft_modernization: "Aircraft Fleet Modernization"
 RUS_aircraft_modernization_desc: "Upgrading airframes, radar systems, and avionics ensures local air superiority and effective strike capabilities."
 RUS_new_types_of_missiles: "New Missile Technologies"
 RUS_new_types_of_missiles_desc: "Developing hypersonic and precision strike missile platforms guarantees strategic deterrence against missile defense systems."
 RUS_modernization_of_tanks: "Modernization of Armored Vehicles"
 RUS_modernization_of_tanks_desc: "Upgrading armored fighting vehicles with modern protection and fire control systems maintains ground force superiority."
 RUS_establish_bars: "Establish BARS Reserve System"
 RUS_establish_bars_desc: "Creating an organized active military reserve system ensures rapid mobilization and troop reinforcement during crises."
 RUS_minsk_protocols: "Minsk Protocols"
 RUS_minsk_protocols_desc: "Signing the initial ceasefire framework establishing a contact line and a temporary diplomatic hold on active offensive operations."
 RUS_ukraine_is_violating_protocols: "Ukraine is Violating Protocols"
 RUS_ukraine_is_violating_protocols_desc: "Documenting persistent artillery breaches and frontline clashes by opponent forces to justify further diplomatic counteractions."
 RUS_sign_minsk_two: "Sign Minsk II"
 RUS_sign_minsk_two_desc: "Finalizing a updated peace package in Minsk following winter battles, establishing complex political and military settlement steps."
 RUS_cooperation_with_people_republics: "Cooperation with People's Republics"
 RUS_cooperation_with_people_republics_desc: "Deepening political, humanitarian, and administrative support for Donbass entities to solidify their domestic resilience."
 RUS_increase_unrest_in_ukraine: "Increase Unrest in Ukraine"
 RUS_increase_unrest_in_ukraine_desc: "Utilizing political levers and social friction in neighboring regions to undermine regional governance and tie down military focus."
 RUS_support_the_ukrainian_democratic_republic: "Support Alternative Opposition Forces"
 RUS_support_the_ukrainian_democratic_republic_desc: "Providing logistical and media backing to friendly political elements aimed at creating a alternative governance framework."
 RUS_recognize_peoples_passports: "Recognize DPR and LPR Passports"
 RUS_recognize_peoples_passports_desc: "Officially validating identity documents issued by the republics on domestic territory to streamline movement and civil rights."
 RUS_economic_cooperation_with_ldpr: "Economic Cooperation with DPR and LPR"
 RUS_economic_cooperation_with_ldpr_desc: "Integrating regional industrial output into domestic supply chains and establishing direct trade channels."
 RUS_distribute_russian_passports: "Distribute Russian Passports"
 RUS_distribute_russian_passports_desc: "Launching a simplified citizenship program for residents of the region to formally extend state legal protection."
 RUS_full_control_over_donbass: "Full Control Over Donbass"
 RUS_full_control_over_donbass_desc: "Establishing complete administrative and military dominance across the region to secure long term stability."
 RUS_prepare_for_special_millitary_operation:0 "Prepare the Military Operation"
 RUS_recognize_luhansk_and_donetsk:0 "Recognize the DPR and LPR"
 RUS_destroy_the_kiyv_junta:0 "Destroy the Junta"

