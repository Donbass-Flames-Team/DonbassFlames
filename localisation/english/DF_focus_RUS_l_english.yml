 russia.17.t: "Preparations for Victory Day"
 russia.17.d: "Preparations are beginning for the May 9 celebrations. Russia must decide whether to mark Victory Day on a grand scale, turning it into a major demonstration of strength, or to limit the celebrations to a more restrained format without excessive pomp."
 russia.17.a: "Hold Victory Day on a grand scale"
 russia.17.b: "Hold it without excessive pomp"
 russia.18.t: "Victory Parade in Moscow"
 russia.18.d: "On May 9, a large military parade was held on Red Square in Moscow, honoring the feat of the Soviet people and the victory over Nazism. Thousands of servicemen, modern military equipment and aircraft of the Russian Aerospace Forces took part in the event. Modern weapons systems, including the T-14 Armata tank, were presented to the public. Memorial events, Immortal Regiment marches and festive concerts were held in many cities across the country."
 russia.18.a: "An impressive spectacle"
 russia.19.t: "The Parade Was a Great Success"
 russia.19.d: "The Victory Day celebrations were a major success. The large parade caused a strong public response and boosted patriotic sentiment."
 russia.19.a: "An excellent result"
 RUS_victory_day_preparations: "Preparations for a Large Parade"
 RUS_victory_day_preparations_desc: "Part of the country’s industrial and organizational resources has been temporarily redirected toward preparations for a large-scale Victory Day celebration."
