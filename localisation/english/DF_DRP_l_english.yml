l_english:
 DRP_introduce_martial_law:0 "Introduce Martial Law"
 DRP_introduce_martial_law_desc:0 "The situation in the eastern regions has reached a boiling point. To contain the threat of administrative buildings being seized and to coordinate the actions of the security forces, we are granting the administration emergency powers. A formal ATO regime will allow us to deploy the army and special units to restore order in the region."
 DRP_mobilization_of_mvd:0 "Mobilize the Security Forces"
 DRP_mobilization_of_mvd_desc:0 "The old law enforcement system has been paralyzed by the political crisis. We must carry out a strict inspection of the Interior Ministry and Security Service personnel in the region to determine their loyalty to the oath. Those who remain with us will become the foundation of Prydniprovia's new security system."
 DRP_barricades:0 "Build Checkpoints"
 DRP_barricades_desc:0 "Dnipropetrovsk is the logistical key to southern and central Ukraine. We must turn the oblast into a fortress by blocking the main highways with concrete fortifications. Control over the roads will allow us to stop the movement of sabotage groups and the delivery of weapons from the unrest-ridden Donbas."
 DRP_mobilization_of_activists:0 "Call Up the Activists"
 DRP_mobilization_of_activists_desc:0 "The revolutionary energy of the streets must be brought under control. We are creating the National Defense Headquarters, which will include Maidan activists and volunteers. This will allow us to quickly form motivated self-defense detachments, ready to replace the demoralized militia at a critical moment."
 DRP_expand_the_company_10000:0 "Expand the $10,000 Campaign"
 DRP_expand_the_company_10000_desc:0 "Unconventional methods are needed to fight professional mercenaries. We are announcing substantial cash rewards for every detained saboteur and every surrendered weapon. Let financial gain become an additional incentive for neutralizing the enemy."
 DRP_liberate_the_dnieper_from_the_separatists:0 "Liberate Dnipropetrovsk from the Separatists"
 DRP_liberate_the_dnieper_from_the_separatists_desc:0 "Dual power in the region is unacceptable. The combined forces of the militia and newly formed volunteer units must finally eliminate the centers of pro-Russian protests. Dnipropetrovsk Oblast must remain a stable rear area and a base for further operations."
 DRP_future_of_dnieper:0 "What Next?"
 DRP_future_of_dnieper_desc:0 "What Next?"
 
 Dnieper_kolomoysky.1.t:0 "The Future of Dnipro"
 Dnieper_kolomoysky.1.d:0 "After the defeat of the separatists in Dnipropetrovsk Oblast, the need for our assistance disappeared, raising the question: what comes next? The most reasonable decision would be to end our campaign and hand everything over to Ukraine. But are we truly certain that the Ukrainian authorities can manage without us?"
 Dnieper_kolomoysky.1.a:0 "We Can Retire"
 Dnieper_kolomoysky.1.b:0 "These Fools Will Not Manage"
 Dnieper_kolomoysky.1.c:0 "Poroshenko Is an Educated Usurper"
 
 Dnieper_kolomoysky.2.t:0 "Rename Dnipropetrovsk"
 Dnieper_kolomoysky.2.d:0 "Throughout its history, Dnipropetrovsk has changed its name more than once. At first, the city was known as Yekaterinoslav from 1776. Then, from 1796 to 1802, it bore the name Novorossiysk. After that, the city was once again given the name Yekaterinoslav, and in 1926 it was renamed Dnipropetrovsk. Each time, its name was connected not with the city itself or its people, but with foreign rule — imperial rulers, colonial projects, and Soviet figures. The time has come to restore the city's dignity and give it a name ...."
 Dnieper_kolomoysky.2.a:0 "Sichoslav"
 Dnieper_kolomoysky.2.b:0 "Dnipro"
 Dnieper_kolomoysky.2.c:0 "Dniprokolomoysk"
