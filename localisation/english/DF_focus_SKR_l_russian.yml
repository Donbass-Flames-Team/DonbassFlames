l_russian:
 SKR_expand_kazak_squads: "Expand Cossack Squads"
 SKR_expand_kazak_squads_desc: "The flow of volunteers to our Cossack units requires rapid expansion of organizational structures to form new combat ready detachments."
 SKR_spirit_of_the_cossacks: "Spirit of the Cossacks"
 SKR_spirit_of_the_cossacks_desc: "Historical Cossack traditions and brotherhood raise the morale of our fighters preparing them for uncompromising defense of our native land."
 SKR_collect_tribute_from_local_residents: "Collect Tribute from Local Residents"
 SKR_collect_tribute_from_local_residents_desc: "Maintaining combat capability requires supplies so establishing local levies and requisitions helps fund our Cossack garrisons."
 SKR_catch_spies: "Catch Spies"
 SKR_catch_spies_desc: "Enemy agents and spotters pose a direct threat to our positions so strict counterintelligence measures must be enforced in controlled territories."
 SKR_fight_against_ukrainian_supporters: "Fight Against Ukrainian Supporters"
 SKR_fight_against_ukrainian_supporters_desc: "Suppression of pro Ukrainian underground groups is necessary to ensure complete safety in our rear areas and prevent sabotage."
 SKR_traitors_in_luhansk: "Traitors in Luhansk"
 SKR_traitors_in_luhansk_desc: "Tensions with official Luhansk authorities are growing so we must remain vigilant against political intrigue and betrayal in the capital."
 SKR_start_acting: "Start Acting"
 SKR_start_acting_desc: "The time for waiting is over and our Cossack forces are ready to take decisive initiative into their own hands to secure power and military control."