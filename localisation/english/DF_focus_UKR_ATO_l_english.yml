 # AFU Military Reforms
 UKR_military_reforms_afu: "Military Reforms of the AFU"
 UKR_military_reforms_afu_desc: "Combat experience has revealed serious shortcomings in the organization of the armed forces. An outdated command structure, lack of modern equipment, and coordination problems require comprehensive military reform to improve combat effectiveness."

 UKR_western_instructors: "Western Instructors"
 UKR_western_instructors_desc: "Bringing in experienced military specialists from NATO countries will allow rapid implementation of modern training standards. Knowledge exchange and new training methods will significantly improve the professionalism of officers and soldiers."

 UKR_cooperation_with_volunteers: "Cooperation with Volunteers"
 UKR_cooperation_with_volunteers_desc: "Volunteer formations have accumulated valuable combat experience in the conflict zone. Integrating their tactical developments into regular units and establishing coordination between volunteers and the army will strengthen overall defense effectiveness."

 UKR_ukranian_mic: "Domestic Defense Industry"
 UKR_ukranian_mic_desc: "Developing our own military industrial complex will reduce dependence on foreign supplies and allow faster provision of necessary weapons to the troops. Factory modernization and launching new production lines will strengthen the defense industry."

 UKR_new_communication_systems: "New Communication Systems"
 UKR_new_communication_systems_desc: "Modern communication systems are critical for coordinating actions on the battlefield. Implementing digital communication systems and secure data channels will ensure reliable troop command in any conditions."

 UKR_reliance_on_decentralized_command: "Decentralized Command"
 UKR_reliance_on_decentralized_command_desc: "Granting greater authority to local commanders will allow faster response to changing situations. Junior officer initiative and flexibility in decision making will improve tactical operation effectiveness."

 UKR_reliance_on_centralized_command: "Centralized Command"
 UKR_reliance_on_centralized_command_desc: "Strengthening the role of the general staff and establishing a clear chain of command will ensure unity of action across all units. Centralized planning and control will allow more effective coordination of large operations."

 UKR_mlrs_vilkha: "Vilkha MLRS"
 UKR_mlrs_vilkha_desc: "Developing and producing a modern multiple launch rocket system will significantly boost artillery firepower. Increased range and target accuracy will give the army a substantial advantage."

 UKR_investments_in_armored_vehicles: "Investments in Armored Vehicles"
 UKR_investments_in_armored_vehicles_desc: "Modernizing tanks and infantry fighting vehicles will improve crew protection and unit mobility. Purchasing new equipment models and repairing mothballed vehicles will replace losses and strengthen armored forces."

 UKR_new_infantry_equipment: "New Infantry Equipment"
 UKR_new_infantry_equipment_desc: "Providing soldiers with modern gear, body armor, and personal protective equipment will reduce casualties and boost morale. Quality equipment directly affects personnel survival in combat."

 UKR_missionary_command: "Mission Command"
 UKR_missionary_command_desc: "Implementing mission command principles emphasizes clear task setting while allowing freedom in choosing execution methods. This approach develops commander initiative and increases troop flexibility."

 UKR_deosovetization_of_army: "De-Sovietization of the Army"
 UKR_deosovetization_of_army_desc: "Abandoning outdated Soviet era management and organization methods will free the army from ineffective practices. Transitioning to modern standards will improve armed forces structure and functionality."

 UKR_expand_the_general_staff: "Expand the General Staff"
 UKR_expand_the_general_staff_desc: "Increasing planning staff and bringing in additional specialists will strengthen command analytical capabilities. Higher quality operation planning will improve chances of success in combat."

 UKR_creation_of_sso: "Establish Special Operations Forces"
 UKR_creation_of_sso_desc: "Forming special operations forces will give the army a tool for complex missions behind enemy lines. Elite units can conduct reconnaissance, sabotage, and precision strikes where conventional forces are ineffective."

 UKR_modernization_of_airfields: "Airfield Modernization"
 UKR_modernization_of_airfields_desc: "Repairing runways and upgrading ground infrastructure at military airfields will improve air force readiness. Modern maintenance systems will allow more effective use of the existing aircraft fleet."

 UKR_modernization_of_odessa_ports: "Odessa Port Modernization"
 UKR_modernization_of_odessa_ports_desc: "Improving port infrastructure will facilitate maritime delivery of military cargo and strengthen coastal defense. Port development will also support naval force basing."

 UKR_hur_operations: "GUR Operations"
 UKR_hur_operations_desc: "Activating Main Intelligence Directorate operations will provide important enemy intelligence and enable special operations. Developing intelligence capabilities is critical for military success."

 UKR_expansion_of_sso_training_centers: "Expand SOF Training Centers"
 UKR_expansion_of_sso_training_centers_desc: "Creating new bases for special forces training will increase the number of highly qualified fighters. Modern training grounds and programs will ensure a steady flow of elite units."

 UKR_joint_flight_exercises_with_the_west: "Joint Flight Exercises with the West"
 UKR_joint_flight_exercises_with_the_west_desc: "Regular training with NATO country pilots will improve aircrew skills and practice air coordination. Experience exchange and studying allied tactics will strengthen air capabilities."

 UKR_marine_infantry_reform: "Marine Infantry Reform"
 UKR_marine_infantry_reform_desc: "Modernizing the marine infantry will transform it into a mobile, well equipped formation for coastal operations. New weapons and improved training will expand amphibious operation capabilities."

 UKR_expand_ammunition_plants: "Expand Ammunition Plants"
 UKR_expand_ammunition_plants_desc: "Increasing production capacity at factories will ensure uninterrupted supply of shells and cartridges to the troops. Domestic production will reduce dependence on foreign supplies in critical moments."

 UKR_reform_of_the_sergeant_corps: "NCO Corps Reform"
 UKR_reform_of_the_sergeant_corps_desc: "Creating a professional NCO corps on the Western model will improve unit management at the lowest level. Experienced sergeants will become the foundation of discipline and combat training for enlisted personnel."

 UKR_creation_of_a_reserve_corps: "Establish Reserve Corps"
 UKR_creation_of_a_reserve_corps_desc: "Forming a strategic reserve will give command the ability to quickly respond to threats on any front sector. Mobile reserve units can strengthen defense or exploit offensive success."

 UKR_strengthen_general_staff_planning: "Strengthen General Staff Planning"
 UKR_strengthen_general_staff_planning_desc: "Improving operational planning methods and implementing modern analytical tools will enhance military operation development quality. Thorough planning reduces risks and increases chances of victory."

 UKR_expand_military_factories: "Expand Military Factories"
 UKR_expand_military_factories_desc: "Building new workshops and modernizing existing facilities will increase weapons production volumes. A developed defense industry will provide the army with everything necessary for prolonged combat operations."

 UKR_reform_of_dshv: "Air Assault Forces Reform"
 UKR_reform_of_dshv_desc: "Modernizing air assault forces will transform them into elite mobile formations capable of rapid deployment and rear operations. New equipment and enhanced training will expand airborne capabilities."

 UKR_reform_of_tro: "Territorial Defense Reform"
 UKR_reform_of_tro_desc: "Transforming territorial defense into an effective local protection system will create a reliable rear for regular forces. Trained reservists will be able to guard facilities and maintain order in liberated areas."

 UKR_command_of_the_logistics_forces_afu: "AFU Logistics Forces Command"
 UKR_command_of_the_logistics_forces_afu_desc: "Creating a unified supply management body will improve delivery of everything necessary to the front. Clear logistics organization will ensure troops do not experience shortages of fuel, ammunition, and food."

 UKR_increase_the_number_of_contract_soldiers: "Increase Contract Soldiers"
 UKR_increase_the_number_of_contract_soldiers_desc: "Transitioning to a professional army will improve personnel training quality and discipline. Experienced contract servicemen handle complex tasks more effectively than conscripts."

 UKR_nato_standard_army: "NATO Standard Army"
 UKR_nato_standard_army_desc: "Fully transitioning to North Atlantic Alliance standards will complete armed forces modernization. Compatibility with allied armies will open access to advanced technologies and ensure close cooperation in all operations."
 UKR_the_end_of_the_yanukovych_regime: "The End of the Yanukovych Regime"
 UKR_the_end_of_the_yanukovych_regime_desc: "The flight of Viktor Yanukovych has brought the old political order to an end. Ukraine must now dismantle the remnants of his system and begin building a new state."
 UKR_army_language_faith: "Army. Language. Faith."
 UKR_army_language_faith_desc: "A strong army, a protected state language, and an independent Ukrainian church will become the main pillars of our statehood and national unity."
 UKR_support_ukranian_language: "Support the Ukrainian Language"
 UKR_support_ukranian_language_desc: "The Ukrainian language must take its rightful place in every sphere of public life. State support will strengthen its position in education, culture, the media, and government institutions."
 UKR_healthcare_reform: "Healthcare Reform"
 UKR_healthcare_reform_desc: "The outdated healthcare system is burdened by bureaucracy, corruption, and chronic underfunding. Modern standards and patient-oriented financing will make medical care more accessible and efficient."
 UKR_police_reform: "Reform the Police"
 UKR_police_reform_desc: "The old Soviet-style militia no longer meets the needs of a democratic state. We will establish a professional National Police that serves the people and earns their trust."
 UKR_education_reform: "Education Reform"
 UKR_education_reform_desc: "Ukrainian education requires modern curricula, new teaching standards, and greater autonomy for educational institutions. These changes will prepare the younger generation for life in a modern European country."
 UKR_form_kord: "Form KORD"
 UKR_form_kord_desc: "Organized crime, terrorism, and armed resistance require a specially trained unit. KORD will become the elite rapid-response force of the National Police of Ukraine."
 UKR_groysman_govenrement: "The Groysman Government"
 UKR_groysman_govenrement_desc: "The new government led by Volodymyr Groysman must continue the transformation of the country, stabilize the economy, and accelerate the reforms required for Ukraine's European future."
 UKR_anti_raider_law: "Anti-Raider Law"
 UKR_anti_raider_law_desc: "Illegal seizures of businesses, land, and private property undermine confidence in the state and hinder economic development. New legislation will strengthen the protection of owners, state registries, and lawful property rights."
 UKR_ministry_of_information_policy_of_ukraine: "Ministry of Information Policy of Ukraine"
 UKR_ministry_of_information_policy_of_ukraine_desc: "Russian propaganda and disinformation threaten Ukraine's national security. The new ministry will coordinate government communications, protect the national information space, and counter hostile influence."
 UKR_independent_church: "Orthodox Church of Ukraine"
 UKR_independent_church_desc: "Ukraine's Orthodox communities must unite within a single local church independent of Moscow. The establishment of the Orthodox Church of Ukraine will strengthen the country's spiritual independence and national unity."
 UKR_take_tomos: "Obtain the Tomos"
 UKR_take_tomos_desc: "Receiving the Tomos from the Ecumenical Patriarchate will formally confirm the autocephaly of the Orthodox Church of Ukraine and recognize its independent status in the Orthodox world."
 UKR_nato_standard_army_desc: "A complete transition to NATO standards will finalize the transformation of the AFU. Weapon interoperability, unified procedures, and tactical coordination with the alliance will make the Ukrainian military a full-fledged partner to our Western allies."
 UKR_Zelensky: "Zelensky"
 UKR_information_war: "Information War"
 UKR_information_war_desc: "Modern confrontation unfolds not only on the battlefields, but also in the media space. Social networks and news outlets are flooded with coordinated networks of Russian bots and troll factories spreading fake news to destabilize the situation inside the country. Controlling information flows, suppressing enemy manipulation, and protecting digital infrastructure are becoming matters of survival. Large-scale counter-propaganda and blocking botnets will protect citizens' minds from panic, strengthen faith in state institutions, and secure a reliable rear for our troops."
 UKR_ban_russian_social_network: "Ban Russian Services"
 UKR_ban_russian_social_network_desc: "The use of popular platforms such as VKontakte, Odnoklassniki, and Yandex services causes direct damage to state security in a hybrid war. These resources are actively used by enemy intelligence agencies to collect personal data of citizens, coordinate subversive activities, and mass-distribute disinformation. A decisive ban on their operations within the national digital space will cut off key channels of hostile influence. By restricting access to these platforms, we will protect the country's information field and take an important step toward strengthening cybersecurity and internal stability."
 UKR_cor_tt: "Corruption level increases"
 ukraine.172.t:0 "§YAssassination of Pavel Sheremet§!"
 ukraine.172.d:0 "An explosion shook central Kyiv this morning. The car carrying prominent journalist Pavel Sheremet was blown up while he was on his way to work. His injuries proved fatal.\n\nThe murder of a journalist in the very heart of the capital has caused a major public outcry. Media representatives and civil society are demanding an immediate and transparent investigation, while the attack has once again raised questions about corruption, influence over law-enforcement agencies, and the state's ability to guarantee the safety of its citizens."
 ukraine.172.a:0 "The system must be cleansed"
 ukraine.172.b:0 "Commit every available resource to the investigation"
 ukraine.173.t:0 "§YThe Boeing 737 Belavia Incident§!"
 ukraine.173.d:0 "A Belavia Boeing 737 operating a flight from Kyiv to Minsk was ordered to return to Zhulyany Airport shortly after takeoff. Ukrainian security services had requested the detention of one of the passengers aboard the flight.\n\nThe Belarusian side has reacted sharply to Kyiv's actions, claiming that the crew was threatened with the deployment of military aircraft if it refused to turn back. The incident is rapidly developing into a diplomatic scandal, leaving the Ukrainian leadership with an uncomfortable choice."
 ukraine.173.a:0 "National security comes first"
 ukraine.173.b:0 "We must contain this diplomatic scandal"
 ukraine.174.t:0 "§YProtests Outside the Verkhovna Rada§!"
 ukraine.174.d:0 "Supporters of opposition political forces and civic organizations have gathered outside the Verkhovna Rada. The demonstrators are demanding the abolition of parliamentary immunity, the creation of an anti-corruption court, and changes to electoral legislation.\n\nFor now, the number of protesters remains relatively small and the police have the situation fully under control. The government expects the rally to lose momentum and disperse on its own."
 ukraine.174.a:0 "They will disperse in a few days"
 ukraine.175.t:0 "§YProtests Outside the Rada Gain Momentum§!"
 ukraine.175.d:0 "The protests outside the Verkhovna Rada continue. Attendance has grown noticeably, tents have appeared near the parliament building, and some demonstrators have declared that they intend to remain until their demands are met.\n\nWhat only recently appeared to be another short-lived opposition rally is gradually turning into a serious political problem. Pressure on parliament and the government is increasing, and continued inaction may lead to further escalation."
 ukraine.175.a:0 "Wait them out. Their resolve cannot last forever"
 ukraine.175.b:0 "We will have to make some concessions"
 ukraine.176.t:0 "§RPolitical Crisis Outside the Verkhovna Rada§!"
 ukraine.176.d:0 "The situation in Kyiv's government quarter is rapidly slipping out of control. Thousands of protesters have gathered outside the Verkhovna Rada, the tent camp continues to expand, and clashes between the most radical activists and law-enforcement officers are becoming increasingly likely.\n\nThe protesters no longer intend to limit themselves to a one-day demonstration. The opposition is trying to use the situation to increase pressure on the government, while every new confrontation only fuels public discontent. The government must decide how far it is prepared to go to restore control over the capital."
 ukraine.176.a:0 "We will not yield to pressure from the streets"
 ukraine.176.b:0 "We are forced to accept their demands"
 ukraine.176.c:0 "Clear the government quarter"
 UKR_2018_protests:0 "§YProlonged Protests Outside the Verkhovna Rada§!"
 UKR_2018_protests_desc:0 "The protest movement shows no sign of disappearing. The tent camp outside the Verkhovna Rada has become a permanent source of political pressure on the government, undermining stability and diverting the authorities' attention from other problems."
 UKR_mass_2018_protests:0 "§RMass Anti-Government Protests§!"
 UKR_mass_2018_protests_desc:0 "Mass demonstrations in central Kyiv have developed into a serious domestic political crisis. The opposition is increasing pressure on the government, while the constant presence of thousands of protesters outside parliament is contributing to further radicalization of society."
 UKR_2018_concessions_protesters:0 "§YConcessions to the Protest Movement§!"
 UKR_2018_concessions_protesters_desc:0 "To prevent further escalation, the government has agreed to meet some of the protesters' demands. This has helped reduce tensions, but the political price of the compromise has been considerable."
 UKR_2018_crackdown_on_protests:0 "§RCrackdown on the Protests§!"
 UKR_2018_crackdown_on_protests_desc:0 "The authorities have decided to restore control over the government quarter by force. The protest camp has been dismantled, but the harsh actions of law-enforcement agencies have triggered a new wave of criticism and public discontent."
 UKR_cor_tt:0 "Corruption level increases"