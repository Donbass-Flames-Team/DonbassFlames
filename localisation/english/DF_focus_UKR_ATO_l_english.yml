l_english:
 UKR_government_in_anarchy: "Anarchy in the Government"
 UKR_government_in_anarchy_desc: "The former president has fled the country, and the parliament is unable to assume leadership. Power is paralyzed, and institutions are not functioning. The state is plunging into political chaos, and lawlessness reigns on the streets of Kyiv. No one controls the situation, and everyone decides how to act on their own."
 UKR_start_of_ato: "Start of the Anti-Terrorist Operation"
 UKR_start_of_ato_desc: "We are facing an armed threat that challenges sovereignty and order. The government has decided to begin a large-scale Anti-Terrorist Operation. The operation will begin after a decree from the head of state and a decision of the National Security and Defense Council."
 UKR_new_parliament_composition: "New Composition of Parliament"
 UKR_new_parliament_composition_desc: "A new parliament has been formed after Yanukovych fled the country. A new stage in governing the country begins."
 UKR_mobilization_of_reservists: "Mobilization of Reservists"
 UKR_mobilization_of_reservists_desc: "The mobilization of reservists begins in order to strengthen defense capabilities and prepare for possible clashes."
 UKR_deal_with_prorussians_protests: "Deal with Pro-Russian Protesters"
 UKR_deal_with_prorussians_protests_desc: "An attempt to negotiate with pro-Russian activists and reduce tensions in the country."
 UKR_recapture_part_of_donetsk_region: "Recapture Part of the Donetsk Region"
 UKR_recapture_part_of_donetsk_region_desc: "Military operations aimed at regaining control over parts of the Donetsk region."
 UKR_recapture_part_of_luhansk_region: "Recapture Part of the Luhansk Region"
 UKR_recapture_part_of_luhansk_region_desc: "Military operations aimed at regaining control over parts of the Luhansk region."
 UKR_send_additional_forces_to_odessa: "Send Additional Forces to Odesa"
 UKR_send_additional_forces_to_odessa_desc: "Reinforcements are sent to Odesa to support local forces and stabilize the situation."
 UKR_block_the_crimea: "Blockade of Crimea"
 UKR_block_the_crimea_desc: "A blockade of Crimea begins in order to restrict movement and supplies."
 UKR_end_of_separatism: "Victory over Separatism"
 UKR_end_of_separatism_desc: "Separatist movements have been suppressed, and the country returns to unity."
 UKR_send_militties_to_kharkov: "Send Militias to Kharkiv"
 UKR_send_militties_to_kharkov_desc: "Local militias are sent to Kharkiv to support order and security."
 UKR_crush_kharkov_people_republic: "Crush the Kharkiv People's Republic"
 UKR_crush_kharkov_people_republic_desc: "Military actions aimed at eliminating the self-proclaimed Kharkiv People's Republic."
 UKR_humanitarion_help_to_people: "Humanitarian Aid to the Population"
 UKR_humanitarion_help_to_people_desc: "Organization of assistance for civilians in conflict zones."
 UKR_strengthen_slavyansk: "Fortify Sloviansk"
 UKR_strengthen_slavyansk_desc: "Strengthening defense and security in the city of Sloviansk."
 UKR_strengthen_kramatorsk: "Fortify Kramatorsk"
 UKR_strengthen_kramatorsk_desc: "Strengthening defense and security in the city of Kramatorsk."
 UKR_emergency_redeployment_of_troops: "Emergency Redeployment of Troops"
 UKR_emergency_redeployment_of_troops_desc: "Rapid redeployment of troops to respond to crisis situations."
 UKR_organize_frontline: "Organize the Frontline"
 UKR_organize_frontline_desc: "Measures to stabilize and establish a frontline in the ATO zone."
 UKR_organize_defense: "Organize the Defense"
 UKR_organize_defense_desc: "Measures to organize and strengthen the country's defense."
 UKR_prepare_the_defense_of_cities: "Prepare the Defense of Cities"
 UKR_prepare_the_defense_of_cities_desc: "Preparation and strengthening of defensive positions in key cities."
 UKR_launch_counterattacks: "Launch Counterattacks"
 UKR_launch_counterattacks_desc: "Conduct counteroffensive operations against the rebels."
 UKR_volunteer_battalions: "Volunteer Battalions"
 UKR_volunteer_battalions_desc: "Formation of volunteer battalions to support the army."
 UKR_volunteer_battalion_azov: "Azov Battalion"
 UKR_volunteer_battalion_azov_desc: "Creation and deployment of the Azov Battalion to fight separatists."
 UKR_volunteer_battalions_of_mvd: "Volunteer Battalions of the Ministry of Internal Affairs"
 UKR_volunteer_battalions_of_mvd_desc: "Formation of volunteer battalions under the Ministry of Internal Affairs."
 UKR_turn_to_the_west_for_help: "Turn to the West for Help"
 UKR_new_foreign_policy: "New Foreign Policy"
 UKR_new_foreign_policy_desc: "Old geopolitical vectors are officially behind us. We need to clearly set a new diplomatic direction for the nation."
 UKR_integration_with_nato: "Integration with NATO"
 UKR_integration_with_nato_desc: "To strengthen our defense, we must steadily transition our military to NATO standards."
 UKR_sign_the_association_agreement_with_eu: "Sign Association Agreement with EU"
 UKR_sign_the_association_agreement_with_eu_desc: "Signing this agreement will serve as a solid foundation for deep economic and political reforms."
 UKR_cooperation_with_turkey: "Cooperation with Turkey"
 UKR_cooperation_with_turkey_desc: "Procuring modern drones and expanding military-technical partnership with Ankara will significantly boost our capabilities."
 UKR_millitary_exercises_with_nato: "Military Exercises with NATO"
 UKR_millitary_exercises_with_nato_desc: "Regular joint exercises will allow our troops to share experience and practice seamless coordination with allies."
 UKR_visa_free_travel_with_the_eu: "Visa-Free Travel with EU"
 UKR_visa_free_travel_with_the_eu_desc: "Meeting all European Commission requirements will grant our citizens freedom of travel across Europe."
 UKR_trade_with_the_eu: "Trade with the EU"
 UKR_trade_with_the_eu_desc: "Launching a fully functional free trade area with the European Union will give a massive boost to our economy."
 UKR_join_to_the_nato: "Join NATO"
 UKR_join_to_the_nato_desc: "We have fulfilled key alliance requirements and are ready to submit an official application for full membership."
 UKR_macro_financial_assistance_from_the_eu: "Macro-Financial Assistance from EU"
 UKR_macro_financial_assistance_from_the_eu_desc: "Securing favorable loans and financial aid from Europe will help stabilize our economy."
 UKR_lublin_triangle: "Lublin Triangle"
 UKR_lublin_triangle_desc: "Creating a regional alliance with Poland and Lithuania will strengthen security and cooperation in Central-Eastern Europe."
 UKR_the_breadbasket_of_europe: "Breadbasket of Europe"
 UKR_the_breadbasket_of_europe_desc: "Modernizing the agricultural sector will position us as a primary food supplier to European markets."
 UKR_associated_trio: "Associated Trio"
 UKR_associated_trio_desc: "Coordinating efforts with Georgia and Moldova will allow us to jointly push for EU integration."
 UKR_join_to_the_eu: "Join the EU"
 UKR_join_to_the_eu_desc: "Having completed essential reforms, our nation permanently secures its trajectory within the European Union."
 UKR_turn_to_the_west_for_help_desc: "In conditions of a growing crisis and external threat, the country's national security directly depends on the support of international partners. Direct dialogue with Western leaders and the NATO leadership opens up opportunities for receiving critical financial, technical, and advisory support. Coordination of joint efforts will not only strengthen the state's defense capability, but also stabilize the internal situation, sending a clear signal that we are not alone in this fight. Having secured the guarantees of our allies, we will be able to resist challenges more effectively and confidently defend our sovereignty."
