 UKR_poroshenko_victory: "Poroshenko"
 UKR_poroshenko_victory_desc: "The successful conclusion of the 2014 election campaign lays the foundation for a new state policy. Poroshenko takes the oath of office as President of Ukraine at one of the most dramatic moments in the country's modern history. The new administration faces a colossal challenge: to halt the deepening economic crisis, launch large-scale public sector reforms, and stabilize the situation on the eastern borders. The struggle for sovereignty and a European path of development now become the key priorities of the national agenda."
