l_english:
 CRI_portests_are_going: "Protests Are Ongoing"
 CRI_portests_are_going_desc: "A wave of discontent is sweeping through the cities of Crimea. Thousands take to the squares, dissatisfied with the authorities in Kyiv. The protest movement is gaining momentum - the only question is who will channel it in the right direction."
 CRI_support_pro_russian: "Support Pro-Russian Forces"
 CRI_support_pro_russian_desc: "The Russian-speaking majority of the peninsula is increasingly demanding closer ties with Russia. By establishing contacts with pro-Russian activists and leveraging their support, we can turn spontaneous protests into an organized movement."
 CRI_self_defense_units: "Self-Defense Units"
 CRI_self_defense_units_desc: "Spontaneous pickets near administrative buildings are increasingly escalating into clashes. It is time to organize self-defense units from local residents and veterans - they will take control of the streets and key facilities of the peninsula."
 CRI_hold_a_referendum: "Hold a Referendum"
 CRI_hold_a_referendum_desc: "The question of Crimea's status must be decided by the people themselves. A referendum on independence and joining Russia will determine the fate of the peninsula - and the international community will be forced to reckon with the will of the Crimeans."
 CRI_support_pro_ukranian: "Support Pro-Ukrainian Forces"
 CRI_support_pro_ukranian_desc: "Crimea remains part of Ukraine. By rallying pro-Ukrainian organizations and supporters of territorial integrity, we will not allow the peninsula to be torn apart and will keep it within a single state."
