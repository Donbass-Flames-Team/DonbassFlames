sp_event_special_military_operation_title: "Special Military Operation"
sp_event_special_military_operation_quote: "“We continue to fight. We have no other choice but to continue fighting for our freedom.” \n- §YVolodymyr Zelenskyy§!"
sp_event_special_military_operation_remark: "The meat grinder begins..." sp_event_UKR_start_of_ato_title: "The Beginning of the ATO"
sp_event_UKR_start_of_ato_quote: "\"Ukraine's enemies are trying to replay the Crimean scenario, but we will not allow it. Anti-terrorist measures will be taken against those who take up arms.\" - §YAleksandr Turchynov§!"
sp_event_UKR_start_of_ato_remark: "Ukraine will be united!"

sp_event_separatist_victory_title: "Victory of the Separatists"
sp_event_separatist_victory_quote: "\"The time will come when one will say 'Glory to the DPR,' and millions will respond 'Glory to the Heroes!'\" - §YDenis Pushilin§!"
sp_event_separatist_victory_remark: "Freedom for Donbas!"

sp_event_ukraine_victory_against_separatists_title: "Defeat of the Separatists"
sp_event_ukraine_victory_against_separatists_quote: "\"Any attempts at destabilization within the country will be harshly suppressed.\" - §YRuslan Khomchak§!"
sp_event_ukraine_victory_against_separatists_remark: "Glory to Ukraine!"

sp_event_yanukovich_overthrow_title: "The Overthrow of Yanukovych"
sp_event_yanukovich_overthrow_quote: "\"A regime built on fear and corruption collapsed in a matter of days.\" \n- §YOleksandr Turchynov§!"
sp_event_yanukovich_overthrow_remark: "Ukraine is Europe!"
