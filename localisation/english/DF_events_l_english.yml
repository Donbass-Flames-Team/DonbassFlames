l_english:
russia.1.t: "Operation in Crimea"
russia.1.d: "Amidst the political chaos in Kyiv and the flight of President Yanukovych, the question of the security of the Black Sea Fleet and the Russian-speaking population of Crimea arises. We must take control of the situation using 'self-defense forces' and special units to prevent the destabilization of the peninsula and pave the way for its reunification withrussia."
russia.1.a: "Get to work!"
russia.2.t: "Crimea Has Returned to Its Native Harbor"
russia.2.d: "Following the referendum and the signing of the treaty on the admission of the Republic of Crimea into the Russian Federation, the peninsula has officially become part of our country. Sevastopol is once again a city of Russian glory withinrussia. The world's reaction is mixed, but historical justice has prevailed."
russia.2.a: "Returned to the native harbor!"
russia.3.t: "The War Drags On"
russia.3.d: "What was planned as a swift operation to stabilize the situation has devolved into a protracted armed conflict. The front lines have stabilized, and now both sides are digging in. The economy and diplomacy are shifting into a long-term confrontation mode."
russia.3.a: "I see."
russia.4.t: "Ukraine Accepts Agreements"
russia.4.d: "Diplomatic pressure and successes on the front have borne fruit. Kyiv has agreed to sign the settlement terms we proposed. This gives us time to consolidate our gains and de-escalate on our own terms."
russia.4.a: "Good."
russia.5.t: "Ukraine Rejects Agreements"
russia.5.d: "The Kyiv regime has rejected all our proposals for a peaceful settlement, choosing the path of further escalation and reliance on Western aid. This means the conflict will continue until a victorious end."
russia.5.a: "Bastards."  
russia.6.t: "Coup in Ukraine"
russia.6.d: "Events on the Maidan have reached a breaking point. Radicals have seized the government quarter, and the legitimate president, Viktor Yanukovych, has been forced into hiding. A coup d'état has effectively taken place in the country. The President's life is in danger."
russia.6.a: "We must urgently evacuate Yanukovych!"
russia.7.t: "Yanukovych Was Evacuated"
russia.7.d: "In a flawless operation by our special services, Viktor Yanukovych was extracted from Ukrainian territory and brought torussia. We now hold a trump card in the form of the legitimate, albeit exiled, head of state, who can testify to the illegality of the new Kyiv authorities."
russia.7.a: "Well done!"
russia.8.t: "Yanukovych Detained"
russia.8.d: "Despite all efforts, the evacuation failed. Viktor Yanukovych was detained by forces loyal to the new government in Kyiv. Now he faces trial, and we have lost a significant tool of diplomatic influence."
russia.8.a: "Shit."
russia.10.t: "Referendum in Crimea"
russia.10.d: "The residents of Crimea and Sevastopol have gone to the polls to determine their future. The overwhelming majority voted to join the Russian Federation. This day will go down in history as a symbol of the people's will."
russia.10.a: "Crimea returns to its native harbor!"
russia.11.t: "The Minsk Protocols"
russia.11.d: "The Minsk Protocols were signed to settle the conflict in eastern Ukraine between government forces and pro-Russian separatists. The document provides for a ceasefire, prisoner exchange, and constitutional reform in Ukraine to grant greater autonomy to the Donetsk and Luhansk regions. However, despite the signing, hostilities continued, with both sides accusing each other of violating the agreement."
russia.11.a: "Excellent."
russia.12.t: "Cutting Off Water to Crimea"
russia.12.d: "As a result of the cutoff of water supplies to Crimea through the North Crimean Canal, local residents and Russian military forces faced serious difficulties in ensuring the region's vital functions. Ukraine is using the water blockade as a tool of pressure, creating the threat of a humanitarian catastrophe."
russia.12.a: "Outrageous!"
russia.13.t: "The Second Minsk Agreement"
russia.13.d: "Due to the ongoing escalation, the parties signed an expanded agreement, including reinforced ceasefire measures, the withdrawal of troops and heavy weaponry, the restoration of Ukrainian control over the border, and constitutional reform with local elections in Donbas. Minsk II became the key international mechanism for de-escalation, although compliance remained problematic."
russia.13.a: "Excellent."
russia.14.a: "The Russian people have prevailed!"
russia.14.d: "Victory of the People's Republics"
russia.14.t: "Victory of the People's Republics"
russia.15.a: "Bastards!"
russia.15.d: "G8 Membership Suspended"
russia.15.t: "G8 Membership Suspended"
russia.29.t: "Armored Car for Donbas"
russia.29.d: "The transfer of Vladimir Zhirinovsky's personal 'Tigr' armored vehicle to the LPR militia has sparked a wide resonance in Russian society. The patriotic press actively covers this gesture, stating that the decisive actions of the LDPR leader demonstrate true solidarity with compatriots. This has led to an increase in the party's popularity among nationalist-minded citizens and reinforced overall war support."
russia.29.a: "Absolutely!"
 
russia.30.a: "Donbas will be free!"
russia.30.d: "As fighting continued in Donbas, training camps began operating in Rostov-on-Don for volunteers wishing to travel to the conflict zone. Training was organized by experienced officers from the security services and Ministry of Defense. Volunteers completed accelerated courses, after which some of them were sent to Donbas."
russia.30.t: "Training Camps in Rostov"

news_events.1.t: "Change of Power in Ukraine"
news_events.1.d: "After months of protests, street violence and political paralysis, power in Ukraine is passing to new forces. The current president has left the capital, while parliament has taken the initiative and announced the formation of a new political course. For some states this is a victory of popular protest and a chance for democratic reforms. For others it is an unconstitutional coup creating a dangerous precedent of changing power under pressure from the streets."
news_events.1.a: "The end of dictatorship!"
news_events.1.b: "Coup!"
news_events.1.c: "Understood"

news_events.2.t: "Creation of theDPR"
news_events.2.d: "Amid the change of power in Kyiv and the collapse of the governing vertical in the east of the country, the protest movement in Donetsk takes on a new form. Buildings of the regional administration and security services have been seized. New symbols of power are raised above them. Self-proclaimed leaders announce the creation of the Donetsk People's Republic. They declare a refusal to recognize the decisions of the central government of Ukraine and a course toward an independent political future. Temporary authorities, armed security units and their own administration are being formed."
news_events.2.a: "Separatists!"
news_events.2.b: "Russians forward!"
news_events.2.c: "Understood"

news_events.3.t: "Creation of the LPR"
news_events.3.d: "Amid the change of power in Kyiv and the collapse of the governing vertical in the east of the country, the protest movement in Luhansk takes on a new form. Buildings of the regional administration and security services have been seized. New symbols of power are raised above them. Self-proclaimed leaders announce the creation of the Luhansk People's Republic. They declare a refusal to recognize the decisions of the central government of Ukraine and a course toward an independent political future. Temporary authorities, armed security units and their own administration are being formed."
news_events.3.a: "Separatists!"
news_events.3.b: "Russians forward!"
news_events.3.c: "Understood"

news_events.4.t: "Creation of the HPR"
news_events.4.d: "Amid the change of power in Kyiv and the collapse of the governing vertical in the east of the country, the protest movement in Kharkiv takes on a new form. Buildings of the regional administration and security services have been seized. New symbols of power are raised above them. Self-proclaimed leaders announce the creation of the Kharkiv People's Republic. They declare a refusal to recognize the decisions of the central government of Ukraine and a course toward an independent political future. Temporary authorities, armed security units and their own administration are being formed."
news_events.4.a: "Separatists!"
news_events.4.b: "Russians forward!"
news_events.4.c: "Understood"

news_events.5.t: "Creation of the OPR"
news_events.5.d: "Amid the change of power in Kyiv and the collapse of the governing vertical in the east of the country, the protest movement in Odesa takes on a new form. Buildings of the regional administration and security services have been seized. New symbols of power are raised above them. Self-proclaimed leaders announce the creation of the Odesa People's Republic. They declare a refusal to recognize the decisions of the central government of Ukraine and a course toward an independent political future. Temporary authorities, armed security units and their own administration are being formed."
news_events.5.a: "Separatists!"
news_events.5.b: "Russians forward!"
news_events.5.c: "Understood"

news_events.6.t: "Little Green Men in Crimea"
news_events.6.d: "Unknown armed units without insignia have appeared on the territory of the Autonomous Republic of Crimea. Men in modern military uniforms equipped with the latest small arms and communications equipment began occupying key infrastructure facilities: the buildings of the Crimean parliament and government, airports, communication hubs and military bases. Their affiliation has not been officially confirmed. Representatives of the Russian Federation claim that these are 'local self-defense forces' acting to protect the Russian-speaking population and prevent chaos after the change of power in Kyiv. The Ukrainian leadership, in turn, calls what is happening an act of external aggression and a violation of the country's territorial integrity."
news_events.6.a: "Russian occupiers!"
news_events.6.b: "The beginning of the Crimean Spring"
news_events.6.c: "Horrible!"

news_events.7.t: "Annexation of Crimea"
news_events.7.d: "After the rapid events of February, a referendum on the status of the peninsula was held in Crimea. According to official data from the Crimean authorities, the majority of participants supported leaving Ukraine and joining the Russian Federation. The vote took place under the effective control of armed formations without insignia. Shortly afterward, the Russian Federation announced the acceptance of the Republic of Crimea and the city of Sevastopol into its territory. In Moscow the signing of the relevant documents was presented as a 'restoration of historical justice' and the realization of the right of peoples to self-determination. Ukraine and the overwhelming majority of the world's states refused to recognize the referendum results, calling it an illegal annexation and a gross violation of international law. In response to Russia's actions the first sanctions were introduced, marking the beginning of a long political and economic confrontation between Russia and the West."
news_events.7.a: "Russian occupiers!"
news_events.7.b: "The beginning of the Crimean Spring"
news_events.7.c: "Horrible!"

news_events.8.t: "Crimean Referendum"
news_events.8.d: "Amid the political crisis in Ukraine and the effective control of Crimea by armed formations without insignia, the authorities of the Autonomous Republic of Crimea announced an extraordinary referendum on the future status of the peninsula. Residents were asked to choose between leaving Ukraine and subsequently joining the Russian Federation or restoring the 1992 Constitution of Crimea. The option of maintaining the previous autonomous status within Ukraine was not included in the ballot. According to official data from the organizers, turnout exceeded 80%, and an overwhelming majority voted in favor of joiningrussia. The results were quickly approved by local authorities and supported by the leadership of the Russian Federation."
news_events.8.a: "Russian occupiers!"
news_events.8.b: "The Crimean people made their choice"
news_events.8.c: "Horrible!"

news_events.9.t: "Poroshenko Becomes President"
news_events.9.d: "After the events of Euromaidan and the flight of Viktor Yanukovych, Ukraine found itself in a state of political and economic crisis. In May 2014 early presidential elections were held, in which businessman and politician Petro Poroshenko won a decisive victory in the first round. He promised the nation a path toward Europe, an end to the war in the East and major reforms. However many doubted whether he would be able to fulfill these promises amid the fierce struggle with separatism, external pressure and a collapsing economy."
news_events.9.a: "A new hope"
news_events.9.b: "An illegitimate president"
news_events.9.c: "Interesting"

news_events.13.t: "Boeing 777 Disaster in Donetsk Region"
news_events.13.d: "A Malaysia Airlines Boeing 777-200ER operating flight MH17 from Amsterdam to Kuala Lumpur was struck by an anti-aircraft missile approximately two hours and forty-nine minutes after takeoff. The aircraft broke apart in midair and crashed near the villages of Hrabove, Rozsypne and Petropavlivka. All 298 people on board were killed. Ukraine claims the aircraft was shot down by pro-Russian forces using a system supplied byrussia. Russian officials reject these accusations and blame Ukraine for the catastrophe."
news_events.13.a: "HORRIBLE"
news_events.14.t: "Bus Shelled Near Volnovakha"
news_events.14.d: "A tragedy near Volnovakha shocked the international community when a passenger bus came under artillery fire near a checkpoint. Civilians traveling on their daily routes became victims of the attack. Both sides of the conflict quickly accused each other, but one fact remains clear: civilians continue to suffer the most in this war."
news_events.14.a: "Terrible"

news_events.15.t: "EU Imposes Sanctions"
news_events.15.d: "In response to Russia's actions in Ukraine and the annexation of Crimea, the European Union announced a package of economic and personal sanctions. These measures aim to restrict Russian companies' access to Western capital and technologies and freeze the assets of several officials."
news_events.15.a: "Understood"

news_events.16.t: "Minsk Protocols"
news_events.16.d: "After months of heavy fighting in eastern Ukraine and rising international pressure, agreements known as the Minsk Protocols were signed in the Belarusian capital. Representatives of Ukraine, Russia and the OSCE participated, along with delegates from the self-proclaimed Donetsk and Luhansk People's Republics. The goal of the protocols was an immediate ceasefire and a political solution to the conflict."
news_events.16.a: "Peace at last?"

news_events.17.t: "Minsk II Agreement"
news_events.17.d: "Following the escalation of fighting during the winter of 2014-2015 and the battle for Debaltseve, leaders of Germany, France, Ukraine and Russia met in Minsk in the so-called Normandy Format. After long negotiations they signed a document known as the 'Package of Measures for the Implementation of the Minsk Agreements', commonly called Minsk II."
news_events.17.a: "Peace at last?"

news_events.18.t: "Fighting Resumes"
news_events.18.d: "Despite the signing of the Minsk Protocols in September 2014, hostilities in eastern Ukraine did not fully stop. Within weeks both sides accused each other of repeated ceasefire violations. Skirmishes and artillery strikes gradually escalated into renewed large-scale clashes."
news_events.18.a: "Terrible!"

news_events.19.t: "Partial Mobilization in Ukraine"
news_events.19.d: "After Russia's intervention and the annexation of Crimea, the Ukrainian government announced a partial mobilization to defend the country's sovereignty. Reservists were called up and military units were placed on high alert while recruitment centers began gathering additional manpower."
news_events.19.a: "Glory to Ukraine!"
news_events.19.b: "Another Act of Aggression"
news_events.19.c: "Understood"

news_events.20.t: "Separatists Capture Debaltseve"
news_events.20.d: "In February separatist forces captured Debaltseve, a key railway and road junction in the Donbas. After intense fighting Ukrainian units withdrew from the city, suffering heavy losses. The fall of the city was widely seen as a significant shift in the balance of power in the region."
news_events.20.a: "Terrible!"
news_events.20.b: "Freedom for Donbas!"
news_events.20.c: "Understood"

news_events.21.t: "Bilateral Talks in Minsk"
news_events.21.d: "Talks were held in Minsk between Russian President Vladimir Putin and Ukrainian President Petro Poroshenko. EU foreign policy chief Catherine Ashton described the conversation as frank but constructive."
news_events.21.a: "Excellent!"
news_events.21.b: "Excellent!"
news_events.21.c: "Understood"

news_events.22.t: "Shelling of the Beach in Zugres"
news_events.22.d: "International media reported a tragic incident in the city of Zugres where an artillery strike hit a public beach filled with civilians. Women and children were among the victims, sparking outrage and mutual accusations between the sides of the conflict."
news_events.22.a: "Terrible!"
news_events.22.b: "Bandera Criminals!"
news_events.22.c: "Terrible!"

news_events.23.t: "Assassination of Alexander Zakharchenko"

news_events.24.t: "Victory of Yulia Tymoshenko"
news_events.24.d: "According to the results of the presidential election in Ukraine, Yulia Tymoshenko has won the vote. After counting the ballots the Central Election Commission announced her as the new President of the country. The elections were held amid a serious political crisis and the ongoing conflict in easternukraine."
news_events.24.a: "A New Hope!"
news_events.24.b: "We Recognize Only One President"
news_events.24.c: "Understood"

news_events.25.a: "We will destroy the separatists!"
news_events.25.b: "Aggression by the Kyiv Regime"
news_events.25.c: "Understood."
news_events.25.d: "The Ukrainian authorities have announced the beginning of an anti-terrorist operation in the east of the country. The decision was made after armed groups seized administrative buildings in several Donbas cities and proclaimed self-declared republics.\n\nUkrainian security forces have launched a military operation to restore control over the territories and disarm the armed formations. Army, National Guard, and security-service units have been deployed to the region."
news_events.25.t: "The Anti-Terrorist Operation Begins in Ukraine"

news_events.26.a: "Damn..."
news_events.26.b: "Victory over Nazism!"
news_events.26.c: "Understood."
news_events.26.d: "The conflict in eastern Ukraine has reached a turning point, as the forces of the self-proclaimed republics have established control over a significant part of Donbas. After prolonged fighting, Ukrainian troops were forced to retreat from several key directions, allowing the separatists to consolidate their positions."
news_events.26.t: "Separatist Victory in Donbas"

news_events.27.a: "Glory to Ukraine!"
news_events.27.b: "Damn!"
news_events.27.c: "Understood."
news_events.27.d: "Government forces have achieved major successes in easternukraine. The main separatist forces have been defeated and driven from key positions. Their organized resistance has been seriously weakened by the fighting, and control over a number of settlements has been restored. Despite these gains, the operation is not over. The anti-terrorist operation continues because individual groups remain active in the region and still pose a threat to stability. The Secretary of the National Security and Defense Council of Ukraine has declared an intention to bring the operation to a complete conclusion and finally eliminate the armed underground."
news_events.27.t: "Suppression of the Separatists"

news_events.28.a: "A New Strong President"
news_events.28.b: "Nazi!"
news_events.28.c: "Understood."
news_events.28.d: "The Central Election Commission has announced the results of the presidential election inukraine. In an unexpected outcome, Oleh Liashko won after overtaking his rivals through a vivid and radical election campaign.\n\nHis rise to power came as a surprise both to the political elite and to the international community. Liashko promised a hard line in domestic policy, a fight against corruption, and decisive action to settle the conflict in the east of the country."
news_events.28.t: "Liashko's Election Victory"

news_events.29.a: "Understood."
news_events.29.d: "Russia has hosted one of the world's largest sporting events, the Winter Olympic Games. Athletes from around the world gathered in Sochi to compete for medals and showcase their achievements in winter sports.\n\nThe Games were held under intense international attention. The organizers emphasized scale, infrastructure, and security, seeking to demonstrate a high standard of event management."
news_events.29.t: "Winter Olympic Games in Sochi"

news_events.30.a: "Understood."
news_events.30.d: "In response to growing tensions along the border with Ukraine, the leadership of Transnistria announced a general mobilization. Local residents and registered residents were called up for military training and guard duty at strategically important facilities. Officials stated that the mobilization was intended to protect the region's sovereignty and territorial integrity and to prevent a possible incursion or provocation by the neighboring state."
news_events.30.t: "Mobilization in Transnistria"

news_events.34.a: "Horrible."
news_events.34.b: "Justice will prevail!"
news_events.34.c: "The situation is escalating."
news_events.34.d: "Russia has officially announced its recognition of several self-proclaimed people's republics on the territory ofukraine. The statement followed emergency consultations by the country's leadership and the signing of documents on mutual cooperation and security. Russian authorities said the decision was made 'to protect the population and prevent a further humanitarian crisis.'"
news_events.34.t: "Recognition of the People's Republics"

news_events.35.a: "This is a disaster..."
news_events.35.b: "The beginning of the end for the Kyiv junta!"
news_events.35.c: "A new war."
news_events.35.d: "Russian President Vladimir Putin has announced the beginning of a special military operation on the territory ofukraine. In an address to the nation, he stated that the operation's goals were the 'demilitarization' and 'denazification' of Ukraine, as well as the protection of the population of Donbas.\n\nRussian troops began advancing along several axes at once: from Belgorod and Kursk toward Kharkiv, from Crimea into southern Ukraine, and through Belarus toward Kyiv. Missile strikes against Ukrainian military targets and infrastructure began simultaneously.\n\nFull mobilization was declared in theDPR and LPR, while the republics' forces launched attacks on Ukrainian positions in Donetsk and Luhansk Oblasts. The international community reacted sharply to the outbreak of the conflict: Western countries imposed sweeping sanctions on Russia and began supplying military aid toukraine."
news_events.35.t: "Russia Launches the Special Military Operation"

news_events.36.a: "The audacity."
news_events.36.b: "NATO threatens our security."
news_events.36.c: "Understood."
news_events.36.d: "At the end of 2021, Russia presented the United States and NATO with a package of demands concerning European security. Moscow declared that NATO's further eastward expansion posed a direct threat to its national interests.\n\nKey demands included a formal renunciation of Ukrainian and Georgian membership in the alliance, restrictions on NATO military activity in Eastern Europe, and the withdrawal of the bloc's military infrastructure to positions held in previous years.\n\nWestern states met the demands with caution and skepticism. While diplomats continue negotiations, Russian forces continue to mass near Ukraine's borders, alarming the international community."
news_events.36.t: "Russian Ultimatum to the West"

news_events.37.a: "Ukraine is Europe."
news_events.37.b: "This threatens our security!"
news_events.37.c: "Understood."
news_events.37.d: "Today, Ukraine took an important step toward European integration. The country's leadership officially signed the Association Agreement with the European Union, cementing a course toward political and economic rapprochement with Europe. The signing became one of the key events in the country's recent history. The agreement provides for the development of trade relations, reforms, harmonization of legislation, and expanded cooperation with European states."
news_events.37.t: "Ukraine Signs the EU Association Agreement"

news_events.38.a: "Ukraine is Europe."
news_events.38.b: "This threatens our security!"
news_events.38.c: "Understood."
news_events.38.d: "Ukraine, Poland, and Lithuania have announced a new format of regional cooperation—the Lublin Triangle. The initiative is intended to strengthen political, economic, and defense ties among the three states, as well as support Ukraine's European and Euro-Atlantic integration."
news_events.38.t: "Formation of the Lublin Triangle"

news_events.39.a: "Ukraine is Europe."
news_events.39.b: "This threatens our security!"
news_events.39.c: "Understood."
news_events.39.d: "Ukraine, Georgia, and Moldova have announced a new cooperation format—the Associated Trio. The initiative brings together three states that have signed association agreements with the European Union and seek further European integration. The new format provides for coordination in relations with the European Union, joint advancement of reforms, and closer cooperation on economic, security, and foreign-policy matters."
news_events.39.t: "Formation of the Associated Trio"

news_events.40.a: "They are already killing each other."
news_events.40.b: "What is going on?!"
news_events.40.c: "Understood."
news_events.40.d: "A military coup led by Igor Strelkov has taken place in the Donetsk People's Republic. Groups of armed men, supported by local activists, seized key administrative buildings and announced a change in the republic's leadership. The new leader accused the formerDPR leadership of sabotage and declared the need to strengthen defensive capabilities and continue the struggle for the region's independence from the Kyiv regime."
news_events.40.t: "Military Coup in theDPR"

news_events.41.a: "Alarming."
news_events.41.b: "From Luhansk to Odesa!"
news_events.41.c: "Understood."
news_events.41.d: "Following the defeat of Ukrainian forces in the country's southeast and the capture of key cities, the leaders of the self-proclaimed people's republics announced the creation of a new political entity—Novorossiya. The union is intended to coordinate defense, economic, and foreign policy and to strengthen independence from Ukraine's central government."
news_events.41.t: "Formation of Novorossiya"

news_events.42.a: "Damn separatists!"
news_events.42.b: "Donbas will be free!"
news_events.42.c: "Understood."
news_events.42.d: "A referendum on self-determination was held in Luhansk and Donetsk Oblasts. According to its organizers, 96.2% of participants in Luhansk Oblast voted for independence. On the basis of these results, the state sovereignty of the Luhansk People's Republic was proclaimed on May 12, 2014."
news_events.42.t: "Proclamation of LPR Independence"

news_events.43.a: "Damn separatists!"
news_events.43.b: "Putin, send in the troops!"
news_events.43.c: "Understood."
news_events.43.d: "Against the backdrop of a successful Ukrainian offensive against armed formations in Donbas, the situation changes abruptly. According to the Ukrainian side and several international observers, units, heavy equipment, and artillery begin crossing a section of the Russian-Ukrainian border. The arrival of fresh forces allows the separatists to halt the Ukrainian army's advance and launch counterattacks on several sectors of the front."
news_events.43.t: "Russia Sends in Troops"

news_events.44.a: "Understood."
news_events.44.b: "Understood."
news_events.44.c: "Understood."
news_events.44.d: "The Eurasian Economic Union has officially begun operating. The new economic association is intended to create a common space for the free movement of goods, services, capital, and labor among its member states. Russia, Belarus, and Kazakhstan joined the union. Armenia and Kyrgyzstan later joined as well."
news_events.44.t: "Formation of the EAEU"

news_events.45.a: "Glory to Ukraine!"
news_events.45.b: "Nazi victory cult..."
news_events.45.c: "Understood."
news_events.45.d: "After a break of several years, President of Ukraine [UKR.GetLeader] decided to revive the tradition of holding a military parade for Ukrainian Independence Day. On August 24, units of the Armed Forces of Ukraine, the National Guard, and other security services marched through the central streets of Kyiv. Military equipment was displayed at the parade, and thousands of service members took part in the ceremonial march."
news_events.45.t: "Ukrainian Independence Day Parade"

news_events.46.a: "Animals..."
news_events.46.b: "Every Nazi will pay!"
news_events.46.c: "This is a war crime!"
news_events.46.d: "On Ukrainian Independence Day, representatives of the self-proclaimedDPR marched a column of captured Ukrainian service members along Artem Street and Lenin Square in central Donetsk. Several dozen prisoners took part in the procession under armed guard. As the column passed, some members of the crowd shouted insults at the prisoners and threw various objects at them."
news_events.46.t: "Prisoner-of-War Parade in Donetsk"

news_events.47.a: "The bloodshed must end!"
news_events.47.b: "An attempt to dull our vigilance."
news_events.47.c: "Understood."
news_events.47.d: "The President of Ukraine has announced a temporary ceasefire in the area of the Anti-Terrorist Operation. The decision was made as part of the Ukrainian government’s peace plan and is intended to create conditions for negotiations, the release of hostages, and settlement of the conflict. According to the president, Ukrainian troops have been ordered to open fire only if attacked."
news_events.47.t: "Ceasefire in the ATO Zone"

news_events.48.a: "Lying propaganda!"
news_events.48.b: "Nazi scum!"
news_events.48.c: "Wait, is this real?"
news_events.48.d: "Russian television aired a report claiming that after Ukrainian forces took Sloviansk, Ukrainian soldiers publicly executed a child in the city square. The story spread rapidly through the information space and caused a strong public reaction. However, journalistic investigations and fact-checks found no evidence of the alleged events, while witnesses and local residents did not confirm the version presented in the report."
news_events.48.t: "The Crucified Boy in Sloviansk"

news_events.49.a: "The war must end!"
news_events.49.b: "The war must end!"
news_events.49.c: "Understood."
news_events.49.d: "The first meeting in this format took place on June 6, 2014, when Petro Poroshenko, Vladimir Putin, François Hollande, and Angela Merkel met. The format was named after Normandy, the region containing the town of Bénouville where the first such meeting took place. The leaders discussed the armed conflict in eastern Ukraine and its consequences, and declared their desire to end the war as soon as possible."
news_events.49.t: "Normandy Format Meeting"

news_events.50.a: "What the fuck?"
news_events.50.b: "United in one formation!"
news_events.50.c: "Understood."
news_events.50.d: "Representatives of the self-proclaimed people's republics signed a document creating the Union of People's Republics. The ceremony took place in Donetsk, and its initiators stated that the new association was intended to coordinate the political, economic, and military activity of the two republics. In the following days, participants announced plans to establish common governing bodies and eventually expand the union to include other regions of southeasternukraine."
news_events.50.t: "Formation of the Union of People's Republics"

ukraine.1.t: "Yanukovych Has Left Kyiv"
ukraine.1.d: "Immediately after signing the settlement agreement, President Viktor Yanukovych fled Kyiv in an unknown direction. No official statements are made, no decrees signed, and contact with the administration is severed. Government buildings are left without political leadership."
ukraine.1.a: "Where did he go?"
ukraine.2.t: "Loss of Control Over Donetsk"
ukraine.2.d: "The situation in the east of the country has spiraled out of control. Today, organized groups of armed men calling themselves 'people's militia,' supported by protesters, stormed the regional administration building in Donetsk. Ukrainian flags were torn down, replaced by the banners of the self-proclaimed 'republic.' The local police largely refused to resist or openly defected. The central government has effectively lost control over the key industrial center of Donbas."
ukraine.2.a: "This is only a temporary crisis."
ukraine.2.b: "We no longer obey Kyiv."
ukraine.3.t: "Uprising in Luhansk Region"
ukraine.3.d: "A wave of protests and seizures of government buildings has swept through Luhansk. Groups of activists, armed and supported by the local population, have declared their defiance of the Kyiv authorities. Militia units are being formed, and the flags of a new republic are being raised over the city."
ukraine.3.a: "Glory to Ukraine!"
ukraine.3.b: "Freedom for Donbas!"
ukraine.4.t: "Uprising in Kharkiv Region"
ukraine.4.d: "The situation in Kharkiv has reached a boiling point. Pro-Russian activists seized the Regional State Administration building and announced the creation of the Kharkiv People's Republic. Clashes between Maidan supporters and their opponents are occurring in the streets. The fate of the region hangs by a thread."
ukraine.4.a: "Glory to Ukraine!"
ukraine.4.b: "Freedom for Novorossiya!"
ukraine.5.t: "Uprising in Odesa Region"
ukraine.5.d: "Odesa has become an arena of fierce confrontation. Anti-Maidan activists have set up a tent camp on Kulikovo Pole, demanding federalization and the protection of the Russian language. Tension grows daily, threatening to erupt into open conflict."
ukraine.5.a: "Glory to Ukraine!"
ukraine.5.b: "Freedom for Novorossiya!"
ukraine.6.a: "We must resolve this temporary crisis."
ukraine.6.d: "Mass protests are beginning in the capital after the government’s decision to change the country’s foreign-policy course. Thousands of people—students, activists, and opposition supporters—are gathering in the central squares to demand that the authorities reverse their decisions and continue European integration. The situation remains tense. The protests are still peaceful, but their scale is growing rapidly. Regional administrations are watching developments closely, while the international community has already begun issuing statements. We must decide how to proceed: make concessions or attempt to restore full control over the streets."
ukraine.6.t: "What Should We Do Next?"
ukraine.7.t: "Pro-Russian Protests in Luhansk"
ukraine.7.d: "Thousands of Luhansk residents took to the streets demanding a referendum and closer ties withrussia. Protesters are outraged by the new government's policies and are ready to defend their interests by any means."
ukraine.7.a: "Protests are intensifying!"
ukraine.8.t: "Pro-Ukrainian Protests in Luhansk"
ukraine.8.d: "Despite the pressure, supporters of Ukrainian unity held a rally in Luhansk. They state that Donbas is Ukraine and oppose the interference of a neighboring state in their region's affairs."
ukraine.8.a: "Protests are intensifying!"
ukraine.9.t: "Pro-Russian Protests in Donetsk"
ukraine.9.d: "Donetsk is boiling. Lenin Square is filled with people carrying Russian tricolors. Slogans for Donbas independence sound louder, and local authorities seem paralyzed in the face of the massive crowd."
ukraine.9.a: "Protests are intensifying!"
ukraine.10.t: "Pro-Ukrainian Protests in Donetsk"
ukraine.10.d: "Activists for Ukrainian unity gathered in the center of Donetsk to show the city does not want to separate. The action takes place in a tense atmosphere, under the threat of attack from radical opponents."
ukraine.10.a: "Protests are intensifying!"
ukraine.11.t: "Pro-Russian Protests in Kharkiv"
ukraine.11.d: "Supporters of federalization gather at the Lenin monument in Kharkiv. They demand autonomy for the region and do not recognize the legitimacy of the Kyiv government, calling for a referendum."
ukraine.11.a: "Protests are intensifying!"
ukraine.12.t: "Pro-Ukrainian Protests in Kharkiv"
ukraine.12.d: "The Kharkiv EuroMaidan continues its actions. People demand the rule of law and the preservation of territorial integrity, fearing a 'Crimean scenario' in their city."
ukraine.12.a: "Protests are intensifying!"
ukraine.13.t: "Pro-Russian Protests in Odesa"
ukraine.13.d: "A march of Anti-Maidan supporters passed through the streets of Odesa. Participants advocate for maintaining ties with Russia and oppose the influence of radical nationalists on state policy."
ukraine.13.a: "Protests are intensifying!"
ukraine.14.t: "Pro-Ukrainian Protests in Odesa"
ukraine.14.d: "Odesans supporting the new government took to the streets for a unity march. They emphasize the city's multi-ethnic character and its unbreakable bond withukraine."
ukraine.14.a: "Protests are intensifying!"
ukraine.15.t: "Pro-Russian Protests in Crimea"
ukraine.15.d: "Mass rallies are held in Sevastopol and Simferopol. People demand protection from the 'fascist threat' from Kyiv and call on Russia to intervene."
ukraine.15.a: "Protests are intensifying!"
ukraine.16.t: "Pro-Ukrainian Protests in Crimea"
ukraine.16.d: "Crimean Tatars and Ukrainian activists gathered at the Supreme Council of Crimea to prevent the adoption of separatist decisions. The situation is extremely tense, and clashes are likely."
ukraine.16.a: "Protests are intensifying!"
ukraine.17.t: "2014 Elections"
ukraine.17.d: "The 2014 elections were successful. The government elected a new president and parliament. However, the situation in the country remains tense, and many regions demand greater autonomy. The government tries to find a compromise, but without success."
ukraine.17.a: "Understood."
ukraine.18.t: "Protests Intensify"
ukraine.18.d: "Protests are intensifying in Kyiv and acrossukraine. Protesters demand the government's resignation and new elections. The government tries to suppress the protests, but fails. Local authorities state they cannot control the situation."
ukraine.18.a: "We must restore order immediately!"
ukraine.19.t: "Nationalists Launch Riots"
ukraine.19.d: "Nationalists from 'Right Sector' and 'Svoboda' have organized riots in Donetsk and Luhansk, trashing administration buildings and attacking local officials. Police did not intervene, and local authorities claimed they could not control the situation."
ukraine.19.a: "We must restore order immediately!"
ukraine.20.a: "Something must be done!"
ukraine.20.d: "Following the overthrow of Viktor Yanukovych, the situation in Crimea escalated sharply. Mass rallies and demonstrations began in cities across the peninsula, with residents expressing opposing political views. Some supported the new government in Kyiv, while others demanded expanded autonomy or closer ties withrussia.\n\nClashes occurred between rival demonstrations in the largest cities, and government buildings were placed under increased guard. Local authorities found themselves in a difficult position as they attempted to retain control and prevent further escalation."
ukraine.20.t: "Unrest in Crimea"
ukraine.21.t: "2014 Elections"
ukraine.21.d: "The 2014 elections were successful. The government elected a new president and parliament. However, the situation remains tense, and many regions demand autonomy."
ukraine.21.a: "Understood."
ukraine.22.t: "Yanukovych in Donetsk"
ukraine.22.d: "Former President Viktor Yanukovych arrived in Donetsk, where he was met by local authorities and pro-Russian activists. Yanukovych stated he does not recognize the legitimacy of the current government and is ready to cooperate with the Donetsk People's Republic. His arrival sparked a wave of protests in Kyiv."
ukraine.22.a: "We must catch him!"
ukraine.22.b: "He poses no threat."
ukraine.23.t: "Release of 'Servant of the People'"
ukraine.23.d: "The satirical TV series 'Servant of the People' premieres, telling the story of an ordinary history teacher who unexpectedly becomes president. Intended as a comedy, the show quickly becomes a cultural phenomenon, highlighting the gap between the authorities and society. For many, it transforms into a public demand for renewal and justice."
ukraine.23.a: "Understood."
ukraine.24.t: "Fire at the Trade Unions House in Odesa"
ukraine.24.d: "Amidst sharp political confrontation in Odesa, clashes between pro-Ukrainian and pro-Russian groups escalated into mass riots. Protesters took refuge in the Trade Unions House on Kulikovo Pole. During the clashes, a fire broke out in the building. Smoke and flames quickly engulfed the premises, leading to numerous casualties. Dozens died, and many were injured."
ukraine.24.a: "Horrible."
ukraine.25.t: "Snap Elections to the Verkhovna Rada"
ukraine.25.d: "Following Yanukovych's flight and the start of the political crisis, the government decided to hold snap elections to the Verkhovna Rada to stabilize the country."
ukraine.25.a: "Understood."
ukraine.26.t: "The Capture of Sloviansk"
ukraine.26.d: "Armed men in camouflage without insignia seized administration buildings in Sloviansk, proclaiming the creation of the Donetsk People's Republic. This marked the beginning of the armed conflict in easternukraine."
ukraine.26.a: "To arms, brothers! Time to defend the Motherland!"
ukraine.27.t: "Russian Military Spotted in Crimea"
ukraine.27.d: "Russian military personnel without insignia have been spotted in Crimea, causing international concern and heightening regional tensions."
ukraine.27.a: "Occupiers!"
ukraine.28.t: "First Wave of Mobilization"
ukraine.28.d: "The Ukrainian government announced the first wave of mobilization in response to the growing threat of separatism and external intervention. Thousands were called to military service to protect Ukraine's territorial integrity."
ukraine.28.a: "For the Motherland!"
ukraine.29.t: "Second Wave of Mobilization"
ukraine.29.d: "The government announced a second wave of mobilization as the threat in the east continued to grow."
ukraine.29.a: "For the Motherland!"
ukraine.30.t: "Third Wave of Mobilization"
ukraine.30.d: "The government announced a third wave of mobilization to further bolster defenses in the east."
ukraine.30.a: "For the Motherland!"
ukraine.31.t: "Bloodshed in Kyiv"
ukraine.31.d: "A sharp escalation occurred, accompanied by mass bloodshed. Renewed clashes between protesters and police, involving unknown snipers, led to the deaths of dozens of participants and officers. At least 77 people were killed."
ukraine.31.a: "How terrible!"
ukraine.32.t: "Titushky from Russia"
ukraine.32.d: "Russia has sent groups of 'Titushky' to support pro-Russian forces in easternukraine. These men are well-prepared and equipped, significantly strengthening Anti-Maidan positions."
ukraine.32.a: "They will come in handy."
ukraine.33.t: "Volnovakha Bus Shelling"
ukraine.33.d: "On January 13, 2015, a passenger bus near Volnovakha was hit by shelling near a checkpoint. The incident led to many deaths and injuries. Both sides exchange blame, but the safety of civilians in the combat zone remains a primary concern."
ukraine.33.a: "We must take action!"
ukraine.34.t: "Our Il-76 Shot Down Near Luhansk"
ukraine.34.d: "A Ukrainian Il-76MD transport plane was shot down by separatists using an 'Igla' MANPADS while landing at Luhansk airport. 9 crew members and 40 paratroopers from the 25th Airborne Brigade perished in the crash."
ukraine.34.a: "A great loss..."
ukraine.35.t: "Ambush in Mariupol"
ukraine.35.d: "On June 14, 2014, a tragedy occurred in Mariupol. Pro-Russian militants under 'Mangust' ambushed a border guard column near the Azovstal plant. 5 servicemen were killed and 7 wounded. The Azov Battalion arrived to clear the area."
ukraine.35.a: "What the hell are they doing there?!"
ukraine.36.t: "Malaysian Boeing Shot Down"
ukraine.36.d: "Malaysia Airlines flight MH17 was struck by a missile over Donetsk region. All 298 people on board were killed."
ukraine.36.a: "Fucking Russians."
ukraine.37.t: "Expansion of the Right Sector"
ukraine.37.d: "The Right Sector has expanded by several battalions."
ukraine.37.a: "Glory to Ukraine!"
ukraine.38.a: "Foreign Aid"
ukraine.38.d: "France and the USA have sent military aid, including thousands of bulletproof vests, medical kits, and equipment to support the Ukrainian army."
ukraine.38.t: "It'll do..."
ukraine.39.t: "Scandal in the Verkhovna Rada"
ukraine.39.d: "NABU investigation revealed that some deputies' votes were bought."
ukraine.39.a: "Damn!"
ukraine.40.t: "Russia Sends Special Services"
ukraine.40.d: "In response to the instability, Russia has decided to send intelligence officers to provide organizational and advisory support to local anti-Maidan forces."
ukraine.40.a: "Excellent."
ukraine.41.t: "Russia Funds Anti-Maidan Media"
ukraine.41.d: "Russia is funding pro-Kremlin TV channels and social media troll farms to undermine trust in the protesters and boost pro-Russian sentiment."
ukraine.41.a: "Thanks to Mother Russia!"

ukraine.42.t: "People's Assembly in Kyiv"
ukraine.42.d: "The 'March of Millions' took place in Kyiv. Protesters demanded that Ukraine does not join the Customs Union. Barriers were erected, and the city center was effectively paralyzed. The statue of Lenin was toppled."
ukraine.42.a: "Horror!"

ukraine.43.t: "Attempt to Suppress Maidan"
ukraine.43.d: "Our security forces tried to push protesters out of the central square, but failed. Public disappointment in the authorities is growing."
ukraine.43.a: "Understood."
ukraine.44.t: "Resignation of Azarov"
ukraine.44.d: "To find a compromise, the government of Mykola Azarov has been dismissed."
ukraine.44.a: "We don't need a civil war."
ukraine.45.t: "Battle for Donetsk Airport"
ukraine.45.d: "Separatist forces are advancing on the airport."
ukraine.45.a: "This is a violation of the peace!"
ukraine.46.t: "We Held the Airport"
ukraine.46.d: "Ukrainian forces successfully repelled the separatist attack on the airport."
ukraine.46.a: "Excellent!"
ukraine.47.t: "We Lost the Airport"
ukraine.47.d: "Separatist forces have seized Donetsk airport after a fierce assault."
ukraine.47.a: "Horrible!"
ukraine.48.t: "Border Clarification in Kherson Region"
ukraine.48.d: "Russian units have withdrawn from positions on the Chongar peninsula back to the Crimean administrative line. While Crimea remains occupied, this is a diplomatic success."
ukraine.48.a: "A first victory."
ukraine.49.t: "Shooting on Rymarska Street"
ukraine.49.d: "In Kharkiv, a clash between pro-Russian activists and 'Prosvita' members led to gunfire and explosions. Two people were killed."
ukraine.49.a: "Oh my God!"
ukraine.50.t: "Battles on Hrushevskoho"
ukraine.50.d: "Protests turned violent following the 'dictatorship laws.' Clashes with Berkut police led to the first deaths among EuroMaidan participants."
ukraine.50.a: "This isn't our fault!"
ukraine.51.t: "Restoring Order in Kharkiv"
ukraine.51.d: "The government has successfully cleared administrative buildings and restored security in Kharkiv."
ukraine.51.a: "Excellent."
ukraine.52.t: "Separatists Advance on Avdiivka"
ukraine.52.d: "Following the fall of the airport, separatists are shelling and attacking Avdiivka, causing a humanitarian crisis."
ukraine.52.a: "Send reinforcements!"
ukraine.53.t: "Restoration of the NGU"
ukraine.53.d: "The National Guard of Ukraine was officially restored to combat terrorism and protect territorial integrity."
ukraine.53.a: "Excellent."
ukraine.54.t: "Resumption of Hostilities"
ukraine.54.d: "Following the Volnovakha tragedy, we must respond to separatist violations of the Minsk agreements."
ukraine.54.a: "For the Motherland!"
ukraine.55.t: "Crisis Settlement Agreement"
ukraine.55.d: "An agreement was signed between the President and the opposition to stop the bloodshed and return to the 2004 Constitution."
ukraine.55.a: "Excellent!"
ukraine.56.t: "Yulia Tymoshenko Released"
ukraine.56.d: "Former PM Yulia Tymoshenko has been released from prison following a court ruling. She immediately began her campaign."
ukraine.56.a: "Understood."
ukraine.57.t: "Formation of the Right Sector"
ukraine.57.d: "Radical nationalist organizations have united under the name 'Right Sector'."
ukraine.57.a: "What did our grandfathers fight for??"
ukraine.58.t: "March on the Verkhovna Rada"
ukraine.58.d: "A 'peaceful offensive' turned into street battles in Kyiv. Offices were burned, and the country entered a phase of open violence."
ukraine.58.a: "Stop this!"
ukraine.59.t: "SBU Statement"
ukraine.59.d: "The SBU announced the start of an Anti-Terrorist Operation (ATO) due to the use of firearms by extremists."
ukraine.59.a: "Suppress them!"
ukraine.60.t: "Shooting on the Maidan"
ukraine.60.d: "The most violent phase of the protests. Snipers opened fire on protesters, leading to a massive increase in casualties."
ukraine.60.a: "Horror!"
ukraine.61.t: "Anti-Maidan Actions in Donetsk"
ukraine.61.d: "A mass rally against EuroMaidan was held in Donetsk, showing regional support for the current government."
ukraine.61.a: "Our people!"
ukraine.62.t: "Torchlight Procession in Kyiv"
ukraine.62.d: "Activists held a torchlight march in honor of Stepan Bandera, causing controversy."
ukraine.62.a: "Fascists!"
ukraine.63.t: "Trial of Yanukovych"
ukraine.63.d: "A trial has begun in Kyiv regarding the treason charges against former President Viktor Yanukovych."
ukraine.63.a: "Justice will be served."
ukraine.64.t: "Geneva Talks"
ukraine.64.d: "Ukraine, Russia, the US, and the EU agreed on measures to de-escalate the crisis and disarm illegal groups."
ukraine.64.a: "The bloodshed must stop!"
ukraine.65.t: "Failure of the Geneva Agreements"
ukraine.65.d: "The discovery of tortured bodies in the Donets river led the government to resume the ATO, citing a total failure of the peace talks."
ukraine.65.a: "No mercy for terrorists!"
ukraine.66.t: "Rocket Attack Near Zelenopillya"
ukraine.66.d: "A massive rocket strike devastated Ukrainian positions near the border, causing heavy casualties."
ukraine.66.a: "We must regroup..."
ukraine.67.t: "Shelling of Eastern District in Mariupol"
ukraine.67.d: "Residential areas in Mariupol were hit by heavy rocket fire, killing dozens of civilians."
ukraine.67.a: "Terrorists!"
ukraine.68.t: "Rocket Strike on Kramatorsk"
ukraine.68.d: "Kramatorsk residential areas and the ATO headquarters were hit by 'Smerch' rockets."
ukraine.68.a: "Horror!"
ukraine.69.t: "Mass Border Crossing by RF Troops"
ukraine.69.d: "As Ukrainian forces neared total victory, regular Russian army units crossed the border to intervene."
ukraine.69.a: "Putin, do not send troops!!!"
ukraine.70.t: "Border Crossing in Novoazovsk"
ukraine.70.d: "Russian armored columns have crossed the border near Novoazovsk, opening a new front."
ukraine.70.a: "Shit."
ukraine.71.t: "Loss of Control in Kharkiv Region"
ukraine.71.d: "Uprisings have spread beyond Kharkiv city to surrounding towns like Izium and Kupiansk."
ukraine.71.a: "Send more forces!"

ukraine.72.t: "Eastern Partnership Summit"
ukraine.72.d: "The Eastern Partnership summit was held in Vilnius, where the Association Agreement between Ukraine and the European Union was not signed. This decision caused disappointment among supporters of European integration. On November 29 the Euromaidan organizing committee announced the end of the protest. Only around 200–400 people remained on Independence Square, deciding to spend the final night of the demonstration."
ukraine.72.a: "Why do we need Gayropa?"

ukraine.73.t: "Confrontation Between Maidan and Anti-Maidan"
ukraine.73.d: "On December 14 the Party of Regions began an indefinite 'Anti-Maidan' rally in support of the current government at European Square and Mariinsky Park. During December 14–15 the confrontation between supporters and opponents of the government reached its peak. For the first time Kyiv saw two simultaneous mass rallies: Maidan and Anti-Maidan. Another 'people’s assembly' gathered up to 200,000 participants according to various estimates. The focus of the protest shifted to preventing Ukraine from signing an agreement to join the Customs Union ahead of President Viktor Yanukovych's planned visit to Moscow."
ukraine.73.a: "The people support us!"

ukraine.74.t: "Creation of the 'Maidan' Association"
ukraine.74.d: "During another People's Assembly the creation of the public organization 'People’s Union Maidan' was announced. The co-chairs of the council included opposition leaders and public figures such as Oleh Tyahnybok, Vitali Klitschko, Arseniy Yatsenyuk, Yuriy Lutsenko, Yulia Tymoshenko, Ruslana Lyzhychko and Serhiy Kvit."
ukraine.74.a: "What do they even want?"

ukraine.75.t: "Attack on the Student Campus in Kharkiv"
ukraine.75.d: "Late in the evening on June 11, 2015, a violent attack occurred in Kharkiv on the territory of a student campus housing dormitories of several universities. Around forty attackers wearing masks stormed Otakara Yarosha Street and began a brutal rampage using knives, sticks and improvised weapons. The attack was chaotic but extremely violent. The main targets were foreign students living in the dormitories. Nine people were injured, six were hospitalized including four citizens of Jordan. Two people died during the attack."
ukraine.75.a: "This is unacceptable!"

ukraine.76.t: "Oleg Morgun Arrested"
ukraine.76.d: "Today outside Mariupol at one of the checkpoints acting police chief Oleg Morgun was detained by Member of Parliament Oleh Lyashko and fighters of the volunteer battalion 'Shakhtarsk'. Lyashko stated that the arrest was connected with suspected contacts with separatists after the events of May 2014."
ukraine.76.a: "Excellent"

ukraine.77.t: "Confrontation in Mariupol"
ukraine.77.d: "On the evening of May 3 the situation in Mariupol sharply deteriorated. Gunfire and arson attacks were reported in central districts of the city, causing panic among civilians. Residents perceived the events as the beginning of an active phase of the anti-terrorist operation. Unknown armed men wearing black uniforms and masks were reported in the city."
ukraine.77.a: "Terrible!"

ukraine.78.t: "Seizure of Mariupol City Council"
ukraine.78.d: "On April 13 a large pro-Russian rally took place in Mariupol which quickly escalated into a violent action. Around a thousand protesters broke through police lines and occupied the city administration building. Ukrainian flags were removed and replaced with the flags of the Donetsk region and the self-proclaimed Donetsk People's Republic."
ukraine.78.a: "Terrible!"

ukraine.79.t: "Night Attempt to Retake Mariupol City Hall"
ukraine.79.d: "On the night of April 24 around 30 pro-Ukrainian activists wearing masks attempted to driveDPR supporters out of the Mariupol city council building. Five people were injured in the clashes. Police later discovered Molotov cocktails and weapons inside the building."
ukraine.79.a: "Understood"

ukraine.80.t: "Growing Influence of theDPR in Mariupol"
ukraine.80.d: "At the end of April reports appeared thatDPR supporters were preparing to seize Mariupol. On April 30DPR flags were raised over several district administration buildings following local rallies."
ukraine.80.a: "What is happening??"

ukraine.81.t: "Events in Donetsk"
ukraine.81.d: "On March 1 pro-Russian activists seized the Donetsk regional administration building and raised a Russian flag. Clashes with Euromaidan supporters followed. The regional council supported the idea of holding a referendum and nominated Pavel Gubarev as the 'people's governor'."
ukraine.81.a: "Understood"

ukraine.82.t: "Clashes of Rallies in Donetsk"
ukraine.82.d: "On March 13 a large pro-Russian rally took place in Donetsk. Later in the evening a rally supporting the unity of Ukraine was attacked by a larger group of pro-Russian activists. Stones, fireworks and smoke grenades were used during the clashes."
ukraine.82.a: "Terrible!!"

ukraine.83.t: "Igor Strelkov Eliminated"
ukraine.83.d: "During heavy fighting in Sloviansk confirmed reports were received that Igor Strelkov had been killed in combat. His death became a serious blow to the forces defending the city."
ukraine.83.a: "Excellent!"

ukraine.84.t: "Strelkov's Column Leaves Sloviansk"
ukraine.84.d: "Under increasing pressure and lack of resources the column commanded by Igor Strelkov began an organized withdrawal from Sloviansk."
ukraine.84.a: "Excellent!"

ukraine.85.t: "Creation of Azov"
ukraine.85.d: "Amid the escalation of the conflict and a shortage of combat-ready units in southeastern Ukraine, a new volunteer battalion called 'Azov' is being formed."
ukraine.85.a: "Excellent!"
ukraine.85.b: "Glory to Azov!"

ukraine.86.t: "Encirclement and Abandonment of Checkpoint 32"
ukraine.86.d: "Since October Ukrainian checkpoint number 32 located on the Bakhmut highway was effectively surrounded by enemy forces. Supply lines were cut and the situation for the garrison deteriorated."
ukraine.86.a: "This violates the Minsk Protocols!"

ukraine.87.t: "Helicopter Shot Down Near Sloviansk"
ukraine.87.d: "A Ukrainian National Guard helicopter delivering supplies to positions near Sloviansk was shot down by a portable air defense missile."
ukraine.87.a: "Honor the heroes..."

ukraine.88.t: "Russia Proposes a Meeting in Minsk"
ukraine.88.d: "Russia proposed holding a meeting in Minsk with representatives of Ukraine, Russia, the OSCE and the leaders of the self-proclaimed republics."
ukraine.88.a: "We hope for peace!"

ukraine.89.t: "Telephone Call Between the Presidents of Ukraine and Russia"
ukraine.89.d: "The President of Ukraine held a phone call with the President of Russia in an attempt to achieve an immediate ceasefire in Donbas."
ukraine.89.a: "We hope for peace!"

ukraine.90.t: "Strike of National Guard Conscripts"
ukraine.90.d: "Conscripts of the National Guard organized a protest in Kyiv demanding demobilization after serving longer than expected."
ukraine.90.a: "Understood"

ukraine.91.t: "Formation of the Yatsenyuk Government"
ukraine.91.d: "After the change of power in Kyiv the Verkhovna Rada formed a new government headed by Arseniy Yatsenyuk."
ukraine.91.a: "Excellent!"

ukraine.92.t: "Collapse of the Parliamentary Coalition"
ukraine.92.d: "A political crisis erupted in the Verkhovna Rada as parties left the ruling coalition."
ukraine.92.a: "Parasites!"

ukraine.93.t: "Formation of the Second Yatsenyuk Government"
ukraine.93.d: "Following parliamentary elections a new coalition government was formed and Arseniy Yatsenyuk was once again appointed Prime Minister."
ukraine.93.a: "Good"

ukraine.94.t: "Dissolution of the Verkhovna Rada"
ukraine.94.d: "President Petro Poroshenko dissolved parliament early and called for new elections."
ukraine.94.a: "Understood"

ukraine.95.t: "Reorganization of Territorial Defense Units"
ukraine.95.d: "Several territorial defense battalions will be reorganized into full motorized infantry units to strengthen the army."
ukraine.95.a: "We will defend Ukraine!"

ukraine.96.t: "Battle of Debaltseve"
ukraine.96.d: "Heavy fighting has erupted around the strategic transport hub of Debaltseve between Ukrainian forces andDPR/LPR troops."
ukraine.96.a: "Destroy the enemy!"

ukraine.97.t: "Darth Alexeyevich Vader Submits His Candidacy"
ukraine.97.d: "A representative of the Internet Party submitted documents to participate in the election under the name Darth Alexeyevich Vader."
ukraine.97.a: "This is unacceptable!"
ukraine.97.b: "Let him participate"

ukraine.98.t: "Choosing the Favorite Candidate"
ukraine.98.d: "Political forces must choose their main candidate for the upcoming presidential election."
ukraine.98.a: "Petro Poroshenko"
ukraine.98.b: "Yulia Tymoshenko"
ukraine.98.c: "Oleh Lyashko"
ukraine.98.g: "Next list"

ukraine.99.t: "Choosing the Favorite Candidate"
ukraine.99.d: "Political forces must choose their main candidate for the upcoming presidential election."
ukraine.99.a: "Darth Alexeyevich Vader"
ukraine.99.g: "Back to list"

ukraine.100.t: "Yulia Tymoshenko Becomes President"
ukraine.100.d: "After counting the votes, the Central Election Commission announced the results of the presidential election. Yulia Tymoshenko won the vote, receiving the most voter support across the country."
ukraine.100.a: "Understood"
ukraine.101.t: "Mass Rallies"
ukraine.101.d: "A large opposition rally under the slogan 'For a European Ukraine' took place in Kyiv and other cities. According to various estimates, tens of thousands of people took to the streets, demanding the government's resignation and a return to the course of European integration. Organizers announced the start of indefinite protests and presented demands to the government, including the signing of an association agreement with the European Union. After the rally, some protesters attempted to blockade the government building in Kyiv, leading to clashes with Berkut special forces. Tear gas was used and arrests occurred during the unrest. A small rally of government supporters also took place in Kyiv."
ukraine.101.a: "Horrible!"
ukraine.102.t: "Amnesty for Euromaidan Participants"
ukraine.102.d: "The Verkhovna Rada adopted a law exempting Euromaidan protesters from criminal prosecution. The document was supported by a majority of parliament members, after which it was signed by President Viktor Yanukovych. The law provides for the dismissal of criminal cases against activists accused of participating in riots and opposing security forces during the protests. The news was met with applause on the Maidan, where many participants perceived it as an important concession from the government."
ukraine.102.a: "We're not cannibals!"
ukraine.103.t: "New Laws"
ukraine.103.d: "The Verkhovna Rada adopted a package of new laws aimed at tightening control over mass events and public activities. The documents were passed on an expedited basis and included significant restrictions on holding rallies, setting up tents, and participating in protests."
ukraine.103.a: "Safety First!"
ukraine.104.t: "Standoff on Maidan"
ukraine.104.d: "On the night of December 11, security forces attempted to disperse protesters on Maidan Nezalezhnosti in Kyiv. Berkut special forces and internal troops began pushing back the activists, dismantling barricades and attempting to clear the square. The protesters resisted, and thousands of people began to flock to their aid. Despite pressure from security forces, the protesters were able to hold their positions and prevent the camp from being completely dispersed. The standoff continued throughout the night, but by morning, the security forces retreated."
ukraine.104.a: "Understood."
 
ukraine.105.a: "Understood."
ukraine.105.d: "Our new leadership has decided to disband the Berkut special police unit. The decision followed the events of Euromaidan, during which its officers were accused of using force against protesters. The Ministry of Internal Affairs announced the dissolution of Berkut and the beginning of law-enforcement reform. Some personnel were dismissed, while others will have to undergo recertification and transfer to new structures."
ukraine.105.t: "Disbandment of Berkut"
ukraine.106.a: "We must save the economy!"
ukraine.106.d: "The Verkhovna Rada of Ukraine has adopted an anti-crisis law intended to stabilize the economy and prevent financial collapse. The document introduces sweeping changes to taxation, public spending, and social policy.\n\nKey measures include higher taxes, new levies, cuts to state expenditures, and reductions in the size of the security services. Social payments were also revised: some pensions were reduced, while increases in wages and the subsistence minimum were temporarily frozen."
ukraine.106.t: "Law on Preventing Financial Catastrophe"
ukraine.107.a: "Something must be done!"
ukraine.107.d: "Ukraine's economic situation is deteriorating rapidly. The state budget faces a severe deficit, foreign-exchange reserves are shrinking, and external debt continues to grow. Against the backdrop of political crisis and instability, investors are withdrawing capital, placing even greater pressure on the economy."
ukraine.107.t: "Threat of Default"
ukraine.108.a: "A forced measure..."
ukraine.108.d: "The Ukrainian command reports a serious deterioration of the situation in the east of the country. After prolonged fighting, Ukrainian units have suffered significant losses and face problems with supply and coordination. Several key positions have been lost, and the front line has begun shifting rapidly.\n\nUnder these conditions, the difficult decision was made to conduct an orderly withdrawal from part of Donbas in order to preserve personnel and regroup forces. This step is viewed as a temporary measure needed to stabilize the front and prepare for further action."
ukraine.108.t: "Defeat in Donbas"
ukraine.109.a: "Not all oligarchs are bad..."
ukraine.109.d: "Amid the humanitarian crisis in eastern Ukraine, Rinat Akhmetov's Humanitarian Center has been established. The initiative is intended to assist civilians affected by the fighting. The center has begun organizing deliveries of food, medicine, and essential supplies to the conflict zone."
ukraine.109.t: "Rinat Akhmetov's Humanitarian Center"
ukraine.110.a: "Good work!"
ukraine.110.b: "We should support his activities!"
ukraine.110.c: "Additional powers would not hurt."
ukraine.110.d: "In Dnipropetrovsk Oblast, recently appointed governor Ihor Kolomoisky has announced an unusual initiative to combat armed formations. Deputy head of the administration Borys Filatov reported the introduction of cash rewards for surrendering weapons and handing over so-called “little green men.”"
ukraine.110.t: "Kolomoisky's Initiative"
ukraine.111.a: "Understood."
ukraine.111.d: "The Central Election Commission of Ukraine has declared Oleh Liashko the winner of the presidential election. The new head of state promised to act firmly and decisively during the crisis. Liashko stated that the army must be strengthened, corruption fought, and order restored in the country. He placed particular emphasis on the situation in the east, stressing that the state must regain control over all its territories."
ukraine.111.t: "Liashko's Victory"
ukraine.112.a: "Understood."
ukraine.112.d: "Reports have arrived of a group of Chechen volunteers who declared their readiness to fight on the side of Ukrainian forces. According to available information, some of them have combat experience and are already joining volunteer units."
ukraine.112.t: "Chechen Volunteers"
ukraine.113.a: "We will destroy the separatists!"
ukraine.113.d: "As the crisis in Ukraine intensifies, Acting President Oleksandr Turchynov has delivered an emergency televised address to the public. In his speech, he made several firm declarations:\n“We will not allow the country to be divided and will defend its territorial integrity.”\n“Any attempts at destabilization will be suppressed decisively.”\n“The state is obligated to protect its citizens and restore order.”\n“Ukraine faces serious trials, but we will overcome them.”\nTurchynov called on citizens to remain calm, support state institutions, and resist provocations. He emphasized that the authorities were prepared to act decisively to stabilize the situation."
ukraine.113.t: "Oleksandr Turchynov's Address"
ukraine.114.a: "Horrible!"
ukraine.114.d: "Attempts to organize so-called “people’s militias” have been recorded in the cities of Zaporizhzhia and Kherson. Groups of activists have taken to the streets, holding rallies and advancing political demands amid the general instability in the country.\nIn several districts, participants seized administrative buildings and established checkpoints. Reports indicate the proclamation of the so-called “Zaporizhzhia People’s Republic” and “Kherson People’s Republic.”"
ukraine.114.t: "Unrest in the South"
ukraine.115.a: "Horrible!"
ukraine.115.d: "The situation in Dnipro has escalated sharply, with serious unrest beginning in the city. Rallies are taking place in the streets, aggressive pro-Russian groups are appearing, and calls for a change of government can be heard. Clashes and seizures of administrative buildings are occurring in some districts, while the situation is increasingly slipping out of control."
ukraine.115.t: "Unrest in Dnipro"
ukraine.116.a: "Understood."
ukraine.116.b: "We will defend Dnipro!"
ukraine.116.d: "After unrest and attempted rebellion began in Dnipro, the situation in the city became critical. Clashes broke out in the streets, armed groups appeared, and several administrative buildings faced the threat of seizure. Amid the chaos, Ihor Kolomoisky effectively takes power in the region into his own hands. Using his own resources and the support of loyal forces, he begins rapidly restoring control over the city."
ukraine.116.t: "Kolomoisky Takes Power in Dnipro"
ukraine.117.a: "They are insane."
ukraine.117.d: "Mass unrest has begun in southern Ukraine, in the historic region of Bessarabia. Groups of armed activists and pro-Russian organizations announced the creation of the so-called “Bessarabian People’s Republic,” declaring that they no longer recognize the government in Kyiv. New flags have been raised in several settlements, and barricades and armed patrols have appeared."
ukraine.117.t: "BPR Uprising"
ukraine.118.a: "Horrible."
ukraine.118.d: "Mass unrest and clashes have begun in Mykolaiv between supporters of the Ukrainian government and pro-Russian activists. Rallies numbering in the thousands are gathering in the central streets, while barricades and groups of armed men appear. Some protesters have announced the creation of a “people’s militia” and demanded a referendum on the status of the region. Several administrative buildings are under threat of seizure, and the situation in the city is rapidly slipping out of control."
ukraine.118.t: "Unrest in Mykolaiv"
ukraine.119.a: "Horrible!"
ukraine.119.d: "Tensions are rising in Zakarpattia amid the political crisis in the country. Mass rallies and protests are taking place across the region, with participants demanding greater autonomy, protection of local interests, and more independence from Kyiv. In several cities, protesters are blocking roads, gathering outside administrative buildings, and accusing the central government of ignoring the region’s problems."
ukraine.119.t: "Unrest in Zakarpattia"
ukraine.120.a: "Let them leave..."
ukraine.120.b: "We must send in the troops!"
ukraine.120.c: "Freedom for Zakarpattia!"
ukraine.120.d: "Zakarpattia"
ukraine.120.t: "Zakarpattia Secedes"
ukraine.121.a: "Horrible."
ukraine.121.d: "Following a devastating defeat in the war, far-right movements have gained strength sharply. Public disappointment, distrust of the government, and a sense of national humiliation have increased the popularity of organizations advocating a hard revanchist course and radical methods. Marches by veterans and nationalist organizations are taking place in many cities, accompanied by demands for a complete change of government, a stronger army, and the “cleansing” of the state of those blamed for the defeat."
ukraine.121.t: "Rise of Far-Right Ideas"
ukraine.122.a: "Horrible."
ukraine.122.d: "In the western regions of Ukraine, armed nationalist groups are beginning to form on a mass scale amid defeat and political crisis. Training camps for volunteers are being established in Lviv, Ivano-Frankivsk, and other cities, while patrols are organized and former soldiers and radical activists assemble. The leaders of these new formations claim that politicians have “betrayed” the country and that the people must now defend Ukraine themselves."
ukraine.122.t: "Formation of Armed Gangs"
ukraine.123.a: "Horrible!"
ukraine.123.d: "Amid defeat in the war, the collapse of central authority, and growing chaos, radical nationalist organizations in western Ukraine have announced the creation of the so-called “United Ukrainian State.” An emergency gathering of nationalist movement leaders, veterans, and volunteer formations was held in Lviv. The new entity declared that it was assuming responsibility for “preserving Ukrainian statehood” and continuing the struggle for the country’s independence."
ukraine.123.t: "Formation of Armed Gangs"
ukraine.124.a: "Horrible!"
ukraine.124.d: "Mass anti-government demonstrations have begun in several cities of centralukraine. Thousands of people have taken to the streets demanding political reforms, a change in the country’s course, and early elections. Particularly large rallies have taken place in Poltava, Kremenchuk, and Kropyvnytskyi. Protesters in these cities are blocking central streets, gathering outside administrative buildings, and organizing permanent campaigns of pressure on local authorities."
ukraine.124.t: "Anti-Government Protests in Central Cities"
ukraine.125.a: "Horrible!"
ukraine.125.d: "Against the backdrop of a deep political crisis, protests in the central regions have developed into large-scale unrest. In Poltava, Kremenchuk, and Kropyvnytskyi, protesters are occupying administrative buildings, establishing checkpoints, and forming local “self-defense” units. The situation is rapidly escaping the control of local authorities. Some city administrations have announced a “transition to autonomous government,” while protest coordination committees are beginning to function as parallel authorities. Soon, one of the centers of the movement announces the creation of a new political entity, the “Ukrainian Democratic Republic.”"
ukraine.125.t: "Anti-Government Protests in Central Cities"
ukraine.126.a: "Understood."
ukraine.126.d: "Amid the continuing political crisis, the Verkhovna Rada held an emergency vote on removing the president from office. Members of parliament stated that the head of state was unable to govern the country amid internal protests, political crisis, and armed conflict. After heated debate, parliament supported the impeachment procedure and voted for his removal. Presidential duties will temporarily pass to the parliamentary leadership until new elections are held and a new legitimate government is formed."
ukraine.126.t: "Impeachment of the President"
ukraine.127.a: "Understood."
ukraine.127.d: "Amid the continuing political crisis, the Verkhovna Rada held an emergency vote on removing the president from office. Members of parliament stated that the head of state was unable to govern the country amid internal protests, political crisis, and armed conflict. After heated debate, parliament supported the impeachment procedure and voted for his removal. Presidential duties will temporarily pass to the parliamentary leadership until new elections are held and a new legitimate government is formed."
ukraine.127.t: "Impeachment of the President"
ukraine.128.a: "Traitors!"
ukraine.128.d: "After wartime laws were introduced in Ukraine, the political split in the Verkhovna Rada deepened. Some opposition deputies and regional leaders declared that the new measures effectively deprived the country of its democratic system. A group of opposition figures, together with the former president, left Kyiv and moved to Rivne, where they announced the creation of an alternative political entity called the “Fifth Ukrainian Republic.” The new structure claims legitimacy, opposes the emergency regime, and calls for restoration of the previous constitutional order."
ukraine.128.t: "Proclamation of the “Fifth Ukrainian Republic”"
ukraine.129.a: "Welcome!"
ukraine.129.d: "The first groups of foreign experts and civilian advisers have arrived in Kyiv to assist with reforming the public sector. Their missions focus primarily on auditing the security services, introducing anti-corruption standards, and reforming the civil-security system. The European Union Advisory Mission (EUAM) assumed a key role in this process and began providing strategic advice to the Ministry of Internal Affairs and the prosecutor’s office. At the same time, teams of experts from the United States and NATO countries started assessing the logistical and medical needs of the defense sector. The presence of foreign specialists in the government quarter became a clear sign that Ukraine was beginning a deep integration into Western institutional structures."
ukraine.129.t: "Western Specialists"
ukraine.130.a: "Hooray!"
ukraine.130.d: "After the votes were counted, the Central Election Commission of Ukraine announced the unexpected winner of the presidential election: Darth Oleksiiovych Vader. The candidate, who ran an unusual and satirical campaign, managed to attract the attention of millions of voters amid widespread fatigue with old politicians and constant crises."
ukraine.130.t: "Darth Oleksiiovych Vader Wins"
ukraine.131.a: "Hooray!"
ukraine.131.d: "Mykhailo Dobkin has won the presidential election. His support was particularly strong in the southeastern regions of the country, where many voters favored closer ties with Russia and opposed radical changes following Euromaidan. Dobkin declared his intention to stabilize the country, reduce confrontation, and begin negotiations with the regions affected by the conflict."
ukraine.131.t: "Mykhailo Dobkin Wins"
ukraine.132.a: ""
ukraine.133.a: "A necessary measure."
ukraine.133.d: "Amid a sharp escalation of the crisis and the threat of losing control of the state, the Verkhovna Rada of Ukraine has adopted an emergency package of wartime laws. The legislation expands the powers of the executive branch, introduces tighter control over key regions, restricts mass gatherings, establishes military censorship, and accelerates mobilization procedures. Special coordinating bodies are also being created to manage defense and internal security. Officially, the measures are justified by the need to “preserve the state and ensure stability in wartime.”"
ukraine.133.t: "Introduction of Wartime Laws"
ukraine.134.a: "The separatists must be punished!"
ukraine.134.d: "Despite the recently signed Minsk agreements, the situation in Donbas remains extremely tense. Today it became known that a civilian convoy attempting to leave the combat zone came under fire from separatist forces. According to preliminary reports, civilians have been killed and wounded."
ukraine.134.t: "Attack on a Civilian Convoy"
ukraine.135.a: "Understood."
ukraine.135.d: "After President Viktor Yanukovych left the country, parliament decided to transfer power to Oleksandr Turchynov and appoint him acting president. The Verkhovna Rada adopted the decision in haste amid protests, instability in the regions, and the effective collapse of the previous governing system."
ukraine.135.t: "Appointment of the Acting President"
ukraine.136.a: "Understood."
ukraine.136.d: "The Verkhovna Rada of Ukraine has adopted the law “On Securing the Rights and Freedoms of Citizens and the Legal Regime in the Temporarily Occupied Territory ofukraine.” Under the new law, Crimea and Sevastopol are officially recognized as temporarily occupied territories ofukraine. The document establishes border-crossing procedures, protects the rights of Ukrainian citizens on the peninsula, and emphasizes that Kyiv does not recognize the change in the region’s status."
ukraine.136.t: "Law on Citizens’ Rights in the Occupied Territory"
ukraine.137.a: "Discipline must be maintained!"
ukraine.137.d: "The Ukrainian Ministry of Internal Affairs has decided to disband the Shakhtarsk volunteer police battalion. The decision followed numerous complaints and reports of disciplinary violations and looting by individual members of the unit. Ministry officials stated that volunteer formations must operate in strict accordance with the law and military regulations. Some personnel were given the opportunity to continue serving in other units, while the battalion’s activity was officially terminated. The Tornado Battalion will also be formed on the basis of Shakhtarsk."
ukraine.137.t: "The Fate of Shakhtarsk"
ukraine.138.a: "A new hope."
ukraine.138.d: "Following his victory in the presidential election, Petro Poroshenko has officially taken office as President ofukraine. The inauguration ceremony was held in Kyiv in the presence of members of parliament, government representatives, and foreign delegations."
ukraine.138.t: "Inauguration of Petro Poroshenko"
ukraine.139.a: "We must calm Kolomoisky down!"
ukraine.139.d: "The Verkhovna Rada of Ukraine adopted a law reducing the quorum for shareholder meetings from 60 percent to 50 percent plus one share. The reform strengthened state control over strategic companies, including the energy sector, where decisions had often been blocked by private shareholders. Almost simultaneously, a serious conflict erupted around Ukrtransnafta. The new supervisory board removed company chairman Oleksandr Lazorko and appointed Yurii Miroshnyk as the new head, but the former chairman refused to leave his office and blocked the company’s work. The situation quickly moved beyond a corporate dispute. Political and armed groups became involved, while Ihor Kolomoisky arrived at the Ukrtransnafta office together with his deputy Hennadii Korban, Odesa Oblast governor Ihor Palytsia, and members of parliament Vitalii Khomutynnik and Oleksandr Shevchenko, accompanied by armed men. Outside the building, Kolomoisky swore at a journalist."
ukraine.139.t: "Conflict Around Ukrtransnafta"
ukraine.140.a: "Kolomoisky is going too far!"
ukraine.140.d: "At PrivatBank, owned by Ihor Kolomoisky, the accounts of companies linked to President Petro Poroshenko’s circle were blocked. Officially, the incident was explained as a “technical failure.” The next day, Kolomoisky appeared outside the Ukrnafta building and declared that the company had to be protected from a “raider takeover,” increasing tensions and attracting the attention of the security services. The conflict became political: the Security Service of Ukraine accused representatives of the Dnipropetrovsk regional administration of links to armed groups, while Kyiv was accused in return of launching a political campaign against the region. Several deputies left the parliamentary coalition, and a public assembly was called in Dnipropetrovsk."
ukraine.140.t: "Escalation of the Conflict"
ukraine.141.a: "He brought it on himself!"
ukraine.141.d: "President Petro Poroshenko has signed a decree dismissing Ihor Kolomoisky as head of the Dnipropetrovsk Regional State Administration. After leaving the post, Kolomoisky announced his withdrawal from politics."
ukraine.141.t: "Kolomoisky's Resignation"
ukraine.142.a: "Excellent."
ukraine.142.d: "Ihor Kolomoisky has announced the termination of the Dnipro administration’s activities. Having fulfilled its purpose, the structure created to defend the region during the period of instability no longer retains its former significance. Control over the territories, security forces, and civilian administration is being transferred to us."
ukraine.142.t: "Kolomoisky Retires"
ukraine.143.a: "Money!"
ukraine.143.d: "The IMF has granted a loan to support our economy. The loan is intended to restore macroeconomic stability, strengthen economic governance, improve transparency, and achieve strong and sustainable economic growth while protecting the most vulnerable groups in society."
ukraine.143.t: "IMF Loan"
ukraine.144.a: "Horrible!"
ukraine.144.d: "A powerful explosion occurred in the Cabinet of Ministers building during a regular government meeting. The president, ministers, and administrative staff were in the chamber at the time. President Viktor Yanukovych died on the way to the hospital. Several ministers seated nearby were seriously wounded, as was Viktor Yanukovych’s wife, who suffered a severe eye injury. State services immediately cordoned off the area, while the circumstances remain unknown. The country has been placed on emergency alert, and law-enforcement agencies have launched a large-scale investigation. Far-right terrorists are preliminarily blamed for the incident."
ukraine.144.t: "Explosion in the Cabinet of Ministers"
ukraine.145.a: "Understood."
ukraine.145.d: "Following the death of Viktor Yanukovych and the sharp escalation of the political crisis, the country stands on the brink of division. Parliament is split into hostile factions, the security services no longer answer to a single center, and several regions are declaring their refusal to obey Kyiv.\n\nWith the government effectively paralyzed, representatives of the Verkhovna Rada, the security agencies, and parts of the former government convene an emergency meeting. No side can install its own candidate without risking an immediate escalation of the conflict.\n\nLiudmyla Yanukovych is proposed as a compromise figure: a temporary, neutral, and symbolic candidate capable of preventing an immediate political collapse.\n\nAfter tense negotiations, she is approved as acting president for a transitional period until the situation stabilizes and new elections can be held."
ukraine.145.t: "Liudmyla Yanukovych Becomes Acting President"
ukraine.146.a: "Horrible!"
ukraine.146.d: "In Luhansk, supporters of the pro-Russian movement stormed the regional headquarters of the Security Service ofukraine. After several hours of confrontation, the protesters occupied the building, erected barricades, and fortified its approaches. Contemporary reports indicate that a large quantity of small arms and ammunition was seized from the SBU armory, significantly strengthening the armed formations in the city."
ukraine.146.t: "Seizure of the SBU Building in Luhansk"
ukraine.147.t: "The Luhansk Airstrike Aftermath"
ukraine.147.d: "The recent airstrike on the regional administration building in Luhansk has sparked severe domestic controversy and international scrutiny. While official reports originally blamed a 'malfunctioning air conditioner' for the blast, the public reaction has exposed deep divisions and skepticism regarding military methods in urban areas. Political stability wavers as the conflict reaches a point of no return."
ukraine.147.a: "An unfortunate turn of events."
ukraine.148.a: "The parade should be held."
ukraine.148.b: "The current situation does not allow it."
ukraine.148.d: "The war in the east of the country continues, and Ukrainian troops are engaged in heavy fighting. A public debate has erupted over whether a military parade should be held in Kyiv while a significant part of the army is at the front, or whether the parade should be canceled this year."
ukraine.148.t: "The Question of Holding the Parade"
ukraine.149.a: "Horrible!"
ukraine.149.d: ""
ukraine.149.t: "Capture of Antratsyt"
ukraine.150.a: "Horrible!"
ukraine.150.d: "Cossack armed formations have begun breaking through the border from the Russian Federation."
ukraine.150.t: "Fighting at the Novoshakhtinsk Border Crossing"
ukraine.151.a: "Horrible!"
ukraine.151.d: "In June 2015, a major scandal erupted around the Interior Ministry’s Tornado Battalion. The unit was first accused of arbitrarily blocking railway traffic in Luhansk Oblast under the pretext of fighting smuggling. On June 17, battalion commander Ruslan Onyshchenko and several of his fighters were detained. During the investigation, the Prosecutor General’s Office of Ukraine reported evidence of serious crimes, including unlawful imprisonment, torture, violence, and other offenses against civilians. Investigators alleged that an improvised torture chamber had been established at the unit’s base in a school in Lysychansk. After the evidence was made public, Interior Minister Arsen Avakov signed an order disbanding the battalion. Some fighters refused to comply, fortified their base, and declared that they would not surrender their weapons. Negotiations prevented an armed clash, and the unit was withdrawn from Luhansk Oblast for subsequent disbandment."
ukraine.151.t: "Scandal Around the Tornado Battalion"
ukraine.152.a: "Understood."
ukraine.152.d: "The President of Ukraine has announced a temporary ceasefire in the area of the Anti-Terrorist Operation. The decision was made as part of the Ukrainian government’s peace plan and is intended to create conditions for negotiations, the release of hostages, and settlement of the conflict."
ukraine.152.t: "Ceasefire"
ukraine.153.a: "We will defend the homeland!"
ukraine.153.d: "Following the annexation of Crimea and the outbreak of unrest in the east, thousands of Ukrainian citizens began reporting to military enlistment offices and volunteer formations. Many declared their readiness to defend the country despite having no combat experience.\n\nFormer service members, Maidan self-defense participants, veterans, and ordinary citizens answered the call. Volunteer battalions began forming throughout the country, while the Armed Forces received a significant influx of personnel."
ukraine.153.t: "Wave of Volunteers"
ukraine.154.a: "The bloodshed must end!"
ukraine.154.d: "After five hours of negotiations between opposition leaders and President Yanukovych, the opposition announced that it had reached an agreement with the authorities to release those arrested for participating in the protests, on the condition that the government quarter be vacated and Hrushevskoho Street unblocked. The protesters rejected the agreement, after which Arsenii Yatseniuk announced the expansion of the Maidan onto Hrushevskoho Street. Opposition leaders asked demonstrators not to violate the truce with the security forces until the following morning."
ukraine.154.t: "Truce with the Protesters"
ukraine.155.a: "Understood."
ukraine.155.d: "During negotiations with opposition leaders, Viktor Yanukovych offered Batkivshchyna faction leader Arsenii Yatseniuk the post of prime minister and UDAR leader Vitali Klitschko the post of deputy prime minister for humanitarian affairs.\n\nYatseniuk stated that the opposition was ready to take responsibility for the country and lead it toward the European Union. At the Euromaidan rally, Klitschko announced that the opposition demanded an early presidential election that same year."
ukraine.155.t: "Truce with the Protesters"
ukraine.156.a: "Horrible!"
ukraine.156.d: "During the night of February 19 and throughout the following day in Lviv, protesters seized the regional administration building, as well as the regional offices of the Security Service, prosecutor’s office, tax administration, traffic police, regional and city Interior Ministry departments, and the Halytskyi, Frankivskyi, Shevchenkivskyi, and Lychakivskyi district police departments. The seizures were accompanied by the destruction of office equipment and documents and the capture of more than 1,170 firearms."
ukraine.156.t: "Seizure of Government Buildings in Western Ukraine"





DPR.1.t: "Russia Deploys Troops"
DPR.1.d: "The Russian Federation has decided to officially deploy its units to the territory of the republics in order to ensure peace and security. Columns of military equipment are moving toward the line of contact under the joyful cheers of local residents."
DPR.1.a: "Hooray!! Glory to Russia!"

DPR.2.t: "Donetsk Airport is Ours!"
DPR.2.d: "After many months of bloody battles, the 'cyborgs' were driven out of the ruins of the terminals. Donetsk Airport has fully come under the control ofDPR forces. This is both a symbolic and strategic victory for our republic."
DPR.2.a: "Hooray!! Glory to Novorossiya!"

DPR.3.t: "Fiasco at Donetsk Airport"
DPR.3.d: "The offensive on the airport ended in catastrophe. Our forces suffered heavy losses under Ukrainian artillery fire and were forced to retreat. The airport remains under the control of the Ukrainian Armed Forces."
DPR.3.a: "They attacked first!"

DPR.4.t: "Girkin in Sloviansk"
DPR.4.d: "A group of armed volunteers led by Igor Girkin (Strelkov) has taken control of Sloviansk. This event became the spark that ignited armed resistance across the entire Donbas. The city is turning into an impregnable fortress."
DPR.4.a: "Excellent"

DPR.5.t: "Formation of Oplot"
DPR.5.d: "A powerful combat unit has been formed based on the 'Oplot' organization. The fighters of Oplot have already proven themselves in street clashes and are now ready for full-scale combat operations."
DPR.5.a: "Working, brothers!"

DPR.6.t: "Formation of Diesel"
DPR.6.d: "A separate tank battalion called 'Diesel' has been created. This unit will become the steel fist of the republic, providing the necessary firepower in the most difficult sectors of the front."
DPR.6.a: "Working, brothers!"

DPR.7.t: "Formation of Sparta"
DPR.7.d: "Arsen Pavlov, known by the callsign 'Motorola', announced the creation of the 'Sparta' battalion. The unit will specialize in reconnaissance and assault operations in urban environments."
DPR.7.a: "Working, brothers!"

DPR.8.t: "Formation of Somali"
DPR.8.d: "Mikhail Tolstykh, callsign 'Givi', has taken command of a new assault battalion called 'Somali'. Fighters of this unit are known for their bravery and high discipline in battle."
DPR.8.a: "Working, brothers!"

DPR.12.t: "Arrival of DShRG 'Rusich'"
DPR.12.d: "Volunteers from the DShRG Rusich group have arrived, ready to fight for the interests of the Russian world. These experienced fighters will significantly strengthen our potential in conducting sabotage and reconnaissance operations."
DPR.12.a: "Arrival of DShRG 'Rusich'"

DPR.13.t: "Arrival of DShRG 'Rusich'"
DPR.13.d: "Volunteers from the DShRG Rusich group have arrived, ready to fight for the interests of the Russian world. These experienced fighters will significantly strengthen our potential in conducting sabotage and reconnaissance operations."
DPR.13.a: "Arrival of DShRG 'Rusich'"

DPR.14.t: "Arrival of DShRG 'Rusich'"
DPR.14.d: "Volunteers from the DShRG Rusich group have arrived, ready to fight for the interests of the Russian world. These experienced fighters will significantly strengthen our potential in conducting sabotage and reconnaissance operations."
DPR.14.a: "Arrival of DShRG 'Rusich'"

DPR.15.t: "Girkin's Column Left Sloviansk"
DPR.15.d: "Girkin's column has left Sloviansk."
DPR.15.a: "Understood"

DPR.16.t: "Igor Strelkov Girkin Killed"
DPR.16.d: "Confirmed reports have been received about the death of Igor Strelkov during fierce fighting for Sloviansk. According to available information, he died directly during combat in the city while being in an active combat zone. Strelkov's death became a serious blow to the forces defending Sloviansk. His loss led to disorganization of command, a drop in morale, and increased disagreements among commanders. The battles for the city continue, but the situation for the opposing side has noticeably worsened."
DPR.16.a: "Terrible!"

DPR.18.t: "Shelling of the Beach in Zuhres"
DPR.18.d: "Reports have been received in theDPR about a tragic shelling of the city beach in Zuhres. At the moment of the strike, civilians were on the shore, many had come to relax by the water. An artillery shell exploded directly in the recreation area, causing numerous casualties and injuries among the civilian population. This strike became evidence of the threat to peaceful cities of Donbas and emphasized the need to protect our citizens from the aggression of the Kyiv junta."
DPR.18.a: "Bandera beasts!"

DPR.26.a: "Let him keep hauling booze for them. I do not give a damn about him."
DPR.26.b: "Ask him why he is here."
DPR.26.d: "At one of the checkpoints on the road from Makiivka toward Khartsyzk, a young man in military uniform was spotted delivering provisions to our men. Many people have already noticed the young helper and reported him to our press service, yet no one has approached him personally to ask why he is here."
DPR.26.t: "A Young Helper Spotted at a Makiivka Checkpoint"

DPR.27.a: "We need to rein him in."
DPR.27.b: "He has proven himself well!"
DPR.27.d: "The name of Zheka Vasilyev is being heard increasingly often at the positions around Makiivka. He previously fought in the Vostok Battalion and began his path by simply helping at a checkpoint. Over time, he proved himself to be a reliable and enterprising assistant. The checkpoint fighters note his discipline, readiness to carry out tasks, and willingness to take responsibility. Zheka has begun receiving more serious assignments and has earned the trust of the men. Rumor has it that he speaks more and more often about his future and does not hide his ambition to rise to a higher position, perhaps even to take part in governing the republic."
DPR.27.t: "Young Makiivka Checkpoint Helper Yevgeny Vasilyev Could Lead the Republic"

DPR.28.a: "No! We need to remove him from the public eye."
DPR.28.b: "Offer him a command position."
DPR.28.d: "Journalists visited the checkpoint in Makiivka where the young helper had been staying for some time. He said that he was 21 and had previously taken part in combat operations, after which he decided to transfer to the checkpoint to help with provisions and other everyday tasks. In his words, it is a simple way to be useful: “I do whatever I can to help.” The journalists noted that despite his young age, he demonstrates responsibility and discipline. The checkpoint fighters confirm that he appears at the position regularly and has become one of their own, while his assistance genuinely makes their work easier."
DPR.28.t: "Interview with the Young Helper from the Makiivka Checkpoint"

DPR.30.a: "Understood."
DPR.30.d: "Strelkov has carried out a coup."
DPR.30.t: "Strelkov's Coup"

DPR.31.a: "All right."
DPR.31.d: "Yuri Safonenko, ataman of the Cossack Union 'Don Host Oblast', demands broader autonomy for his unit."
DPR.31.t: "Safonenko Demands Autonomy"

DPR.32.a: "Bastards!"
DPR.32.d: "The Cossacks have taken over part of Makiivka, where they are looting, running protection rackets, and intimidating local residents. This goes far beyond anything tolerable, and something must be done before it leads to more serious consequences."
DPR.32.t: "Cossacks Take Over Part of Makiivka"

DPR.33.a: "Bastards!"
DPR.33.d: "The Cossacks have taken over the Mekhovsky district, where they are looting, running protection rackets, and intimidating local residents. This goes far beyond anything tolerable, and something must be done before it leads to more serious consequences."
DPR.33.t: "Cossacks Take Over the Mekhovsky District"

DPR.34.a: "Bastards!"
DPR.34.d: "The Cossacks have seized Khartsyzk, where they are looting, running protection rackets, and intimidating local residents. This goes far beyond anything tolerable, and something must be done before it leads to more serious consequences."
DPR.34.t: "Cossacks Seize Khartsyzk"

DPR.35.a: "Finally!"
DPR.35.d: "The security forces of theDPR conducted an operation in which the Cossack bandit formations responsible for robbery, looting, and the intimidation of local residents were disarmed and arrested."
DPR.35.t: "Disarming Safonenko's Cossacks"

DPR.36.a: "Understood."
DPR.36.d: "Presidential candidate Yulia Tymoshenko has arrived in Donetsk and met with our representatives and those of Oplot. The discussions covered a political settlement and a possible compromise between the central government and the eastern regions. Our representatives say that they are prepared to consider any negotiating initiative, but emphasize their lack of trust in the Kyiv authorities and doubt that any potential agreement—the kind we sought throughout the previous month—would actually be implemented. She also proposed holding a large round table in Donetsk in the coming days, immediately after the holidays, with virtually all of Ukraine represented. For the first time, representatives of every group currently occupying administrative buildings in the east would sit down together at one table."
DPR.36.t: "Negotiations with Yulia Tymoshenko"
 
DPR.37.t: "Social Unrest in Stakhanov"
DPR.37.d: "On September 21, around 10,000 residents gathered in the central square of Stakhanov (Kadiivka). The protesters demanded the payment of overdue pensions and salaries, as well as an end to local terror and looting. In response, the newly established local administration offered the rally participants to work for free, suggesting they travel to government-controlled territories of Ukraine if they wished to receive social benefits. The refusal to meet demands has severely heightened local tensions."
DPR.37.a: "They must work for the cause."

DPR.38.t: "The Antratsit Rallies"
DPR.38.d: "On September 23, a public protest erupted in the city of Antratsit. Citizens blocked roads, demanding immediate wage and pension payouts, alongside a complete halt to widespread looting. The local authorities explicitly stated that no social payments would begin until after the New Year. Furthermore, a new decree was announced allowing the confiscation of foreign-made civilian vehicles for wartime needs, further alienating the local populace."
DPR.38.a: "Everything for the front line."

DPR.39.t: "Makiivka Roadblock Protest"
DPR.39.d: "On November 3, several dozen residents in Makiivka took to the streets and blocked a major road near the executive committee building. The demonstrators protested against the lack of resources and demanded the immediate distribution of humanitarian aid vouchers. The situation escalated rapidly as armed detachment units arrived at the scene to restore order and clear the streets by force."
DPR.39.a: "Suppress the dissidents."

 SDR.1.t: "Centralization of Military Groups in theDPR"

 NDR.3.t: "Centralization of Military Groups in theDPR"
 
 LPR.1.t: "Bolotov Recovered"
 LPR.1.d: "Valery Bolotov has successfully recovered from his wound and is ready to resume his duties as head of the Republic. His return should strengthen discipline and end temporary hesitation in the power structures."
 LPR.1.a: "Welcome back the Head of State"
 LPR.2.t: "Republic of Bolotov"
 LPR.2.d: "With Valery Bolotov returning to the helm of state administration, the Republic takes a clear course toward centralization. Power is concentrated in the hands of a proven leader ready to pursue a tough defensive policy."
 LPR.2.a: "For stability and order"
 LPR.3.t: "Introduction of Martial Law"
 LPR.3.d: "In view of the growing military threat and the activation of sabotage groups, a state of emergency is introduced on the territory of the LPR. This imposes certain restrictions on civilian life but is necessary to protect sovereignty."
 LPR.3.a: "Mobilize all internal forces"
 LPR.4.t: "People's Courts of Novorossiya"
 LPR.4.d: "Under wartime conditions, the ordinary judicial system fails to handle the chaos. It is replaced by the People's Courts, which dispense swift justice according to the laws of conscience and the laws of war. Their decisions are harsh, brutal, and cannot be appealed, but this is the only way to eradicate looting and treason."
 LPR.4.a: "Wartime law is harsh"
 LPR.5.t: "LPR Referendum"
 LPR.5.d: "A historic day for the entire Lugansk region. The overwhelming majority of residents voted in a referendum for the independence of the Lugansk People's Republic. This step forever separates us from the Kyiv regime and gives a legitimate mandate to build our own state."
 LPR.5.a: "The will of the people is sacred"
 LPR.6.t: "Social Crisis"
 LPR.6.d: "Humanitarian issues in the Republic are reaching a critical point. Delays in payments, shortages of medicines in hospitals, and general domestic disorder damage the population's trust. The government must urgently find resources to stabilize the rear."
 LPR.6.a: "Urgent measures must be taken"
 LPR.7.t: "Economic Impasse"
 LPR.7.d: "The shutdown of major enterprises and the transport blockade paralyze the budget system of the LPR. The Republic receives no tax revenues, and raw material stocks are melting away. The economy requires immediate anti-crisis decisions."
 LPR.7.a: "Seek new economic ways"
 LPR.8.t: "Energy Failure"
 LPR.8.d: "Constant damage to power grids and dependence on external supplies lead to rolling blackouts. Without a stable power supply, the operation of hospitals and defense facilities is at risk."
 LPR.8.a: "Dispatch repair crews"
 LPR.9.t: "Healthcare Crisis"
 LPR.9.d: "Hospitals are overcrowded with wounded fighters and civilians, and stocks of basic medicines are running out. We urgently require deliveries of humanitarian medical aid to save lives."
 LPR.9.a: "Provide hospitals with everything needed"
 LPR.10.t: "Cessation of Gas Supplies"
 LPR.10.d: "The Ukrainian company Ukrnafta has completely stopped the supply of natural gas to the LPR. Kyiv is using energy resources as a weapon against the civilian population, forcing us to urgently restructure the gas supply system."
 LPR.10.a: "We will find alternative sources"
 LPR.11.t: "Introduction of US Sanctions"
 LPR.11.d: "The United States of America officially announced the introduction of economic sanctions against our Republic. The West predictably took Kyiv's side, but this step only confirms that we have become a real political force."
 LPR.11.a: "This will not stop us"
 LPR.12.t: "Recognition by South Ossetia"
 LPR.12.d: "The Republic of South Ossetia officially recognized the independence and sovereignty of the Lugansk People's Republic. This is our first major diplomatic breakthrough on the international stage, opening the way for official cooperation."
 LPR.12.a: "A brotherly step forward"
 LPR.13.t: "Establishment of the Lugansk Economic Union"
 LPR.13.d: "The founding meeting of the public organization Lugansk Economic Union took place. This association is designed to unite industrialists, entrepreneurs, and farmers to restore the destroyed economy of the Republic."
 LPR.13.a: "Together we will revive the economy"
 LPR.14.t: "Information Pressure"
 LPR.14.d: "The enemy's propaganda machine is intensifying its onslaught, spreading rumors about the imminent fall of the Republic. Our media must step up their work and respond more harshly to the fabrications of the hostile press."
 LPR.14.a: "Strengthen counter-propaganda"
 LPR.15.t: "Tsypkalov Heads Council of Ministers"
 LPR.15.d: "Internal shifts in the leadership of the LPR have resulted in Gennady Tsypkalov taking a key role in managing the Republic. His task is to restore order in the economy and prepare for the return of Bolotov."
 LPR.15.a: "Approve the appointment"
 LPR.16.t: "A Gift from Moscow"
 LPR.16.d: "A 'Tigr' armored vehicle has arrived in Luhansk — a personal gift from the leader of the LDPR, Vladimir Zhirinovsky. Known for his loud and uncompromising support, the politician handed over the SUV to the militia forces for combat missions. This gesture will not only reinforce our modest motor pool but also clearly demonstrate that we have powerful allies in Moscow, ready to help not just with words, but with actions."
 LPR.16.a: "Absolutely, thank you russian friends!"
 LPR.17.t: "Plotnitsky Becomes the Republic's Leader"
 LPR.17.d: "The era of the initial militia is over. Igor Plotnitsky officially assumes full power in the state as the new leader. Under his leadership, the Republic transitions to building a regular army and a strict executive vertical."
 LPR.17.a: "Swear allegiance to the new Head"
 LPR.18.t: "Demarche of Cossack Formations"
 LPR.18.d: "Disagreements between the central leadership of the LPR and Cossack detachments have escalated into open confrontation. The Cossacks declare their withdrawal from submission to Lugansk, which undermines the unity of the front and hits stability in the rear."
 LPR.18.a: "A difficult situation"
 LPR.19.t: "Airstrike on the Luhansk Regional Administration"
 LPR.19.d: "On June 2, a Ukrainian military aircraft launched a missile strike on the LPR headquarters in the center of Luhansk. The attack resulted in the tragic deaths of 8 civilians, with many more wounded. Among the victims were Natalya Arkhipova, the LPR Minister of Health, and Aleksandr Gizay, a renowned veteran search historian and head of the 'Kaskad' patriotic organization. This strike has shocked the local population, turning hesitation into absolute resolve. There is no turning back now."
 LPR.19.a: "We will never forget this."
 LPR.20.t: "Death of Aleksey Mozgovoy"
 LPR.20.d: "Tragic news has arrived about the death of the commander of the Prizrak Brigade, Aleksey Mozgovoy, in an assassination. The Republic has lost one of its most charismatic and ideological leaders of the first hour militia."
 LPR.20.a: "Eternal memory to the commander"
 LPR.21.t: "Death of Pavel Dremov"
 LPR.21.d: "As a result of a car bombing, the legendary Cossack ataman Pavel Dremov was killed. His death was a heavy blow to all Cossacks and defenders of Donbass, who lost a brave commander."
 LPR.21.a: "We mourn the loss"
 LPR.22.t: "Agreement with Mozgovoy"
 LPR.22.d: "During intense negotiations, the leadership of the Republic managed to reach a compromise with Aleksey Mozgovoy. His detachments agree to coordinate their actions with the general command, which significantly strengthens our defense."
 LPR.22.a: "Unity above all"
 
 NAT.1.t: "Montenegro Joins NATO"
 NAT.1.d: "Montenegro officially became the 29th member state of NATO on June 5, 2017. The accession process began after the country received an invitation at the Alliance summit in December 2015 and ended after the accession protocol was ratified by all member states. Montenegro's accession completed NATO's expansion along the Adriatic coast. After the procedure was completed, Montenegro received all the rights and obligations of an Alliance member state. Shortly before accession, relations between Podgorica and Moscow deteriorated significantly amid accusations of an attempted coup in 2016. Serbia also opposed the country's accession to NATO, viewing the move as a threat to its security. Notably, less than two decades earlier, Montenegro had been subjected to NATO airstrikes during the operation against the Federal Republic of Yugoslavia."
 NAT.1.a: "The Balkans are changing"
 NAT.1.b: "Traitors"
 NAT.2.t: "North Macedonia Joins NATO"
 NAT.2.d: "North Macedonia officially became the 30th member state of NATO on March 27, 2020. Accession became possible after the name dispute with Greece was resolved and the Prespa Agreement was signed, under which the state changed its name from Macedonia to North Macedonia. The accession protocol was signed in 2019 and then ratified by all Alliance member states. For the government in Skopje, membership was seen as a security guarantee and a step toward further Euro-Atlantic integration. Russia criticized NATO enlargement, viewing it as an expansion of Western influence in the region."
 NAT.2.a: "The Alliance expands"
 NAT.2.b: "Sold honor"
 NAT.3.t: "Finland Joins NATO"
 NAT.3.d: "Finland officially became a member of NATO. The accession process accelerated significantly as a result of the full-scale war inukraine. The war in Ukraine led to a reassessment of Finland's policy of military neutrality, which had been maintained for decades. The decision to join received broad support among the population and most of the country's political parties. After the procedure was completed, Finland became a full member of the North Atlantic Alliance. Finland's accession increased the total length of NATO's land border with Russia from 1,215 km to 2,555 km."
 NAT.3.a: "Not NATO expansion..."
 NAT.3.b: "They should have finished you off in 1945"
 NAT.4.t: "Sweden Joins NATO"
 NAT.4.d: "Sweden officially became a member of NATO, marking one of the most significant turns in its foreign policy over the last two centuries. The state, which had maintained military neutrality for more than 200 years, decided to join the Alliance against the backdrop of the war in Ukraine and Finland's accession shortly before it. Following Sweden’s accession to NATO, the share of the Baltic Sea coastline controlled by NATO increased from 53.5% to 93.7%, while the share of its territorial waters rose from 75% to 94%."
 NAT.4.a: "NATO grows stronger"
 NAT.4.b: "Have they forgotten about Poltava"
 
SKR.2.a: "Ukrainian spies!"
SKR.2.d: "In early June 2014, a group of OSCE observers was detained by armed men in Luhansk Oblast. The observers are accused of espionage and of working for the Ukrainian armed forces."
SKR.2.t: "Capture of OSCE Observers"
SKR.3.a: "What happened to Cossack discipline?"
SKR.3.d: "Reports from the field describe a sharp rise in looting among Cossack armed formations. Individual detachments acting without coordination with their command are carrying out requisitions, arbitrarily confiscating property, and “supplying themselves” at the expense of the local population."
SKR.3.t: "Widespread Looting"