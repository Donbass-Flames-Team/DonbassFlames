 NAT.1.t:0 "Montenegro Joins NATO"
 NAT.1.d:0 "Montenegro officially became the 29th member state of NATO on June 5, 2017. The accession process began after the country received an invitation at the Alliance summit in December 2015 and ended after the accession protocol was ratified by all member states. Montenegro's accession completed NATO's expansion along the Adriatic coast. After the procedure was completed, Montenegro received all the rights and obligations of an Alliance member state. Shortly before accession, relations between Podgorica and Moscow deteriorated significantly amid accusations of an attempted coup in 2016. Serbia also opposed the country's accession to NATO, viewing the move as a threat to its security. Notably, less than two decades earlier, Montenegro had been subjected to NATO airstrikes during the operation against the Federal Republic of Yugoslavia."
 NAT.1.a:0 "The Balkans are changing"

 NAT.2.t:0 "North Macedonia Joins NATO"
 NAT.2.d:0 "North Macedonia officially became the 30th member state of NATO on March 27, 2020. Accession became possible after the name dispute with Greece was resolved and the Prespa Agreement was signed, under which the state changed its name from Macedonia to North Macedonia. The accession protocol was signed in 2019 and then ratified by all Alliance member states. For the government in Skopje, membership was seen as a security guarantee and a step toward further Euro-Atlantic integration. Russia criticized NATO enlargement, viewing it as an expansion of Western influence in the region."
 NAT.2.a:0 "The Alliance expands"

 NAT.3.t:0 "Finland Joins NATO"
 NAT.3.d:0 "Finland officially became a member of NATO. The accession process accelerated significantly as a result of the full-scale war in Ukraine. The war in Ukraine led to a reassessment of Finland's policy of military neutrality, which had been maintained for decades. The decision to join received broad support among the population and most of the country's political parties. After the procedure was completed, Finland became a full member of the North Atlantic Alliance. Finland's accession increased the total length of NATO's land border with Russia from 1,215 km to 2,555 km. Finland's accession became one of the most significant consequences of the shift in European security after the outbreak of the war in Ukraine."
 NAT.3.a:0 "Not NATO expansion..."

 NAT.4.t:0 "Sweden Joins NATO"
 NAT.4.d:0 "Sweden officially became a member of NATO, marking one of the most significant turns in its foreign policy over the last two centuries. The state, which had maintained military neutrality for more than 200 years, decided to join the Alliance against the backdrop of the war in Ukraine and Finland's accession shortly before it. Sweden's accession significantly strengthened NATO's position in the Baltic region."
 NAT.4.a:0 "NATO grows stronger"