l_english:
 AZV_form_first_batalion: "Form the First Battalion"
 AZV_form_first_batalion_desc: "Volunteers are rallying to the banner of a new battalion. From scattered groups of patriots ready to defend Ukraine with arms in hand, we will forge a disciplined military unit capable of standing against the militias in the southeast."
 AZV_liberate_mariupol: "Liberate Mariupol"
 AZV_liberate_mariupol_desc: "Mariupol, the key port of the Azov coast, has fallen into the hands of separatists. Liberating the city will be the battalion's first serious trial and will demonstrate to the world that the Ukrainian army can regain control over seized territories."
