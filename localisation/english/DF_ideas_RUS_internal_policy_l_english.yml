l_english:
 # RUS Internal Policy Ideas

 RUS_yunarmy_spirit_idea: "Yunarmiya"
 RUS_yunarmy_spirit_idea_desc: "The state launched a nationwide youth movement. Schoolchildren learn to shoot, march, and respect the military. Patriotic education is spreading across the country, and it's working."

 RUS_etatism_spirit_idea: "The State as Master"
 RUS_etatism_spirit_idea_desc: "Big business and the elites are increasingly tied to the state. Private interests give way to state priorities. Industry works more reliably, but initiative from below has almost disappeared."

 RUS_rosgvardia_spirit_idea: "Rosgvardiya"
 RUS_rosgvardia_spirit_idea_desc: "A new security force directly subordinate to the president has been created. Internal order is under control; any unrest will be suppressed quickly and firmly."

 RUS_yarovaya_package_spirit_idea: "Yarovaya Package"
 RUS_yarovaya_package_spirit_idea_desc: "New laws require the storage of citizens' communications and calls, and expand the powers of the security services. The state now knows more about its citizens than ever before."

 RUS_foreign_agents_spirit_idea: "Foreign Agents Law"
 RUS_foreign_agents_spirit_idea_desc: "NGOs receiving money from abroad are required to register as foreign agents. Western influence inside the country is placed under strict control."

 RUS_digital_economy_spirit_idea: "Digital Economy"
 RUS_digital_economy_spirit_idea_desc: "The state has invested in IT, digital services, and e-government. Technology is moving forward, but it costs a lot and not everything pays off quickly."

 RUS_national_projects_spirit_idea: "National Projects"
 RUS_national_projects_spirit_idea_desc: "Trillions of rubles are directed toward roads, hospitals, schools, and housing. Construction is underway across the country, but the costs put a noticeable strain on the budget."

 RUS_sovereign_internet_spirit_idea: "Sovereign Internet"
 RUS_sovereign_internet_spirit_idea_desc: "Russia is building its own infrastructure to disconnect from the global network. The Runet is under state control, but technological exchange with the world has become noticeably more complicated."

 RUS_pension_reform_spirit_idea: "Pension Reform"
 RUS_pension_reform_spirit_idea_desc: "The retirement age has been raised. The state gained financial resources and was able to invest them in production, but people on the streets are very unhappy about it."

 RUS_cabinet_renewal_spirit_idea: "Cabinet Renewal"
 RUS_cabinet_renewal_spirit_idea_desc: "The government has been updated. New faces with new approaches have arrived, and political decisions are being made a little faster and more confidently."

 RUS_constitutional_amendments_spirit_idea: "Constitutional Amendments"
 RUS_constitutional_amendments_spirit_idea_desc: "The Constitution has been changed. New values are enshrined, the powers of the executive branch are expanded. Society voted yes, and the authorities have consolidated their position."

 RUS_crimea_development_spirit_idea: "Development of Crimea"
 RUS_crimea_development_spirit_idea_desc: "The peninsula is receiving large-scale investment: roads, a bridge, housing, tourism. Crimea is gradually becoming part of Russia not just on paper, but in real life."

 RUS_tatar_resistance_spirit_idea: "Crimean Tatar Resistance"
 RUS_tatar_resistance_spirit_idea_desc: "The Crimean Tatars did not accept the annexation to Russia. Activists have been detained, the Mejlis is banned, and tensions have not subsided. It's hard to call the peninsula calm."

 # Temporary Ideas
 RUS_active_propaganda_idea: "Active Propaganda"
 RUS_active_propaganda_idea_desc: "State media is operating in an intensified mode. Russia speaks with one voice, and that voice is heard everywhere."

 RUS_vertical_of_power_idea: "Power Vertical"
 RUS_vertical_of_power_idea_desc: "Management is structured from top to bottom. Regions follow the center's decisions; initiative from below is not encouraged, but there is order."

 RUS_fears_of_protests_idea: "Fear of Protests"
 RUS_fears_of_protests_idea_desc: "Public discontent is spilling onto the streets. The authorities are nervous and forced to keep an eye on public sentiment."

 RUS_corruption_and_oligarchy_idea: "Corruption and Oligarchs"
 RUS_corruption_and_oligarchy_idea_desc: "Those close to power use their position for personal enrichment. Money flows away from the country's real needs."

 # Event Tooltips
 RUS_strict_control_tt: "Strict control over information has been introduced. Security forces have been granted broad surveillance powers."
 RUS_soft_control_tt: "Control has been introduced in a limited scope. The situation is manageable, but there is pressure on civil society."
 RUS_pension_hard_tt: "The retirement age has been raised in full. The budget has received funds, but society is angry."
 RUS_pension_soft_tt: "The reform has been softened. Society has calmed down, but the financial benefit is smaller."
 RUS_national_projects_tt: "Construction projects and development programs have been launched across the country. Money is going to the regions."
