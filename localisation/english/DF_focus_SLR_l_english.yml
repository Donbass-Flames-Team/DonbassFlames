l_english:
 SLR_go_to_lisichansk: "Move to Lisichansk"
 SLR_go_to_lisichansk_desc: "Under heavy pressure from enemy forces in the Severodonetsk sector, our units must complete an organized maneuver toward Lisichansk to strengthen defense on the high ground and secure key positions."
 SLR_retreat_to_alchevsk: "Retreat to Alchevsk"
 SLR_retreat_to_alchevsk_desc: "The threat of encirclement in the Lisichansk bridgehead forces our units to withdraw to Alchevsk to preserve manpower and establish a solid defense line in the rear."