 patch_notes_text:0 "New historical and alternate-history content.\nNew focus trees for the LPR and DPR.\nCivil war in Ukraine.\nContent for the Dnipropetrovsk Administration, Dnipropetrovsk People’s Republic, Sievierodonetsk Grouping, and Autonomous Republic of Crimea.\nNew focuses for Ukraine.\nTechnology trees for Ukraine, the Russian Federation, and the People’s Republics.\nNew countries: NATO, Wagner PMC, Zaporizhzhia People’s Republic, Kherson People’s Republic, Mykolaiv People’s Republic, Bessarabian People’s Republic, Dnipropetrovsk People’s Republic, Dnipropetrovsk Administration, Cossack National Guard of the Great Don Host, Sievierodonetsk Militia, Ukrainian Military State, Ukrainian Democratic Republic, United Ukrainian State, Fifth Ukrainian Republic, and Subcarpathian Rus.\nComplete redraw of provinces in Luhansk Oblast. Redraw of Dnipro, Kharkiv, Odesa, Mykolaiv, and surrounding territories.\nImproved Crimea-capture mechanics.\nExpanded Ukrainian election mechanics for Petro Poroshenko, Yulia Tymoshenko, Oleh Liashko, Mykhailo Dobkin, and Darth Oleksiiovych Vader.\nImproved uprisings.\nImproved balance.\nLPR leaders from March 2014 through 2026.\nPortraits for every leader.\nNew country colors on the map.\nNew generals for the People’s Republics, with portraits.\nFocus icons for Ukraine, the DPR, LPR, and Dnipropetrovsk Administration.\nA more polished interface.\nStreamer mode in game settings.\nOptimized mod files.\n44 new loading screens."
